<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="stock-api-base" content="http://127.0.0.1:8090">
<title>战绩</title>
<style>
body{margin:0;background:#EEF0F3}
a{color:inherit}
button,input{font:inherit}
.seg{display:flex;border:1px solid #DDE1E7;border-radius:8px;overflow:hidden}
.seg button{height:28px;padding:0 10px;border:none;border-right:1px solid #DDE1E7;background:#FFFFFF;color:#3A4250;font-family:inherit;font-size:12px;cursor:pointer}
.seg button:last-child{border-right:none}
.seg button[aria-pressed="true"]{background:#14171F;color:#FFFFFF}
.pill{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;background:#EEF0F3;color:#4A5260;font-size:11px;white-space:nowrap}
.nav-a{width:48px;min-height:48px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#5B6372;text-decoration:none;font-size:11px}
.nav-a.on{color:#2457D6;background:#EAF0FD;font-weight:500}
.empty{padding:36px 20px;text-align:center;color:#5B6372;display:flex;flex-direction:column;align-items:center;gap:12px}
.skeleton{color:#8A919E;padding:24px 0}
.toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);z-index:60;padding:9px 16px;border-radius:8px;background:#14171F;color:#FFFFFF;font-size:13px;max-width:80vw}
.toast.err{background:#B42318}
.modal{position:fixed;inset:0;z-index:30;background:rgba(20,23,31,.32);display:flex;align-items:center;justify-content:center}
.modal>div{width:560px;max-width:calc(100% - 32px);max-height:80vh;overflow:auto;background:#FFFFFF;border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;font-size:13px;line-height:1.7}
.xbtn{border:none;background:transparent;color:#8A919E;cursor:pointer;font-size:12px;padding:0 4px}
.xbtn:hover{color:#B42318}
.qmark{flex:none;width:16px;height:16px;padding:0;border:1px solid #C9CED6;border-radius:50%;background:#FFFFFF;color:#5B6372;font-size:11px;font-weight:700;line-height:14px;cursor:pointer}
.qmark:hover{border-color:#2457D6;color:#2457D6}
a.row:hover,div.row:hover{background:#F7F8FA}
</style>
</head>
<body>
<div style="height: 100vh; overflow: hidden; display: flex; flex-direction: column; background: #EEF0F3; font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; color: #14171F; font-size: 13px; line-height: 1.55">

<header style="flex: none; display: flex; align-items: center; height: 44px; background: #FFFFFF; border-bottom: 1px solid #DDE1E7">
<div style="flex: 0 0 64px; display: flex; align-items: center; justify-content: center; border-right: 1px solid #EEF0F3; height: 44px">
<div style="width: 28px; height: 28px; border-radius: 8px; background: #2457D6; display: flex; align-items: center; justify-content: center">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l5-5 4 4 8-8"></path><path d="M15 8h5v5"></path></svg>
</div>
</div>
<span style="padding: 0 16px; font-weight: 700; font-size: 14px">战绩</span>
<div style="margin-left: auto; display: flex; align-items: center; gap: 14px; padding-right: 16px"><span id="session" style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #5B6372"></span><button type="button" id="bell" data-act="notif" aria-label="通知" title="通知" style="position: relative; width: 32px; height: 32px; border: none; border-radius: 8px; background: transparent; color: #3A4250; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg><span id="bellDot" hidden style="position: absolute; top: 2px; right: 1px; min-width: 16px; height: 16px; padding: 0 4px; box-sizing: border-box; border-radius: 999px; background: #D9483F; color: #FFFFFF; font-size: 10px; font-weight: 600; line-height: 16px; text-align: center"></span></button></div>
</header>

<div style="flex: 1 1 auto; display: flex; flex-wrap: nowrap; align-items: stretch; min-width: 0; min-height: 0; overflow: hidden">

<nav aria-label="主导航" style="flex: 0 0 64px; overflow: hidden; background: #FFFFFF; border-right: 1px solid #DDE1E7; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 0">
<a class="nav-a" href="/market.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20h18"></path><path d="M5 16l4-5 4 3 6-7"></path></svg>市场</a>
<a class="nav-a on" href="/scan.html" aria-current="page"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"></rect><path d="M8 10h8M8 14h5"></path></svg>战绩</a>
<a class="nav-a" href="/tasks.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M12 8v4l3 2"></path></svg>任务</a>
<a class="nav-a" href="/"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-4.5-4.5"></path></svg>诊断</a>
<a class="nav-a" href="/holdings.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16v12H4z"></path><path d="M8 7V5h8v2"></path></svg>持仓</a>
<a class="nav-a" href="#"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg>问问</a>
<a class="nav-a" href="/settings.html" style="margin-top: auto"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>设置</a>
</nav>

<main style="flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column; overflow: hidden">
<div style="flex: none; padding: 12px 28px 0; background: #FFFFFF; border-bottom: 1px solid #DDE1E7"><div style="max-width: 1240px"><div id="head" style="display: flex; align-items: center; gap: 22px; flex-wrap: wrap"></div><div id="tabs" role="tablist" aria-label="战绩" style="display: flex; align-items: center; gap: 24px; margin-top: 6px"></div></div></div>
<div id="scroll" style="flex: 1; min-height: 0; overflow-y: auto; padding: 16px 28px 24px; box-sizing: border-box"><div id="body" style="max-width: 1240px"><div class="skeleton">正在读取预测记录…</div></div></div>
</main>

<aside id="aside" aria-label="今天结算" hidden style="flex: 0 0 380px; width: 380px; align-self: stretch; overflow-y: auto; background: #FFFFFF; border-left: 1px solid #DDE1E7"></aside>
<aside id="notifAside" aria-label="通知" hidden style="flex: 0 0 400px; width: 400px; align-self: stretch; overflow-y: auto; background: #FFFFFF; border-left: 1px solid #DDE1E7; box-sizing: border-box; flex-direction: column; font-size: 13px"></aside>
</div>

<footer style="position: relative; flex: none; height: 26px; display: flex; align-items: center; gap: 18px; padding: 0 12px; border-top: 1px solid #DDE1E7; background: #F7F8FA; font-size: 11px; color: #5B6372; white-space: nowrap; overflow: hidden"><span style="display: flex; align-items: center; gap: 6px"><span id="dot" style="width: 7px; height: 7px; border-radius: 50%; background: #A1A7B2"></span><span id="status">正在连接</span></span><span id="footIndexes" style="display: flex; gap: 18px"></span><span style="position: absolute; left: 50%; transform: translateX(-50%); color: #8A919E">研究分析，不构成投资建议</span><span style="margin-left: auto">数据源：行情 · 资金流 · 公告</span><span>v0.1</span></footer>
</div>
<div id="modal"></div>
<script>
const MONO_F = "font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace";
const DEMO = new URLSearchParams(location.search).get('demo') === '1';
const API = (new URLSearchParams(location.search).get('stockApi') || (document.querySelector('meta[name="stock-api-base"]') || {}).content || 'http://127.0.0.1:8090').replace(/\/$/, '');
const S = { tab: 'today', rec: 'acc', sum: null, panel: null, data: {}, notif: false, nData: null, nTab: 'all', open: {}, openG: {}, shown: { today: 10, track: 15, done: 4 },
  f: { today: 'all', track: { due: 'all', who: 'all' }, done: { src: 'all', h: 5, wrong: false, range: 'month', q: '' }, acc: 5 } };
const TABS = [['today', '今天'], ['track', '进行中'], ['record', '已结算']];
const cur = () => S.tab === 'record' ? S.rec : S.tab;

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (id) => document.getElementById(id);
const sign = (v) => v > 0 ? '+' : v < 0 ? '−' : '';
const pct = (v, d) => v == null || v !== v ? '—' : sign(v) + Math.abs(v * 100).toFixed(d == null ? 1 : d) + '%';
const rate = (v) => v == null || v < 0 ? '—' : (v * 100).toFixed(1) + '%';
const day5 = (d) => (d || '').slice(5);
const diagnoseHref = (code) => '/?stock=' + encodeURIComponent(code);
const num = (n) => Number(n || 0).toLocaleString('en-US');

/* ---------- 设计稿里的样式积木 ---------- */
const CARD = 'display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 14px; overflow: hidden';
const LINKBTN = 'display: inline-flex; align-items: center; height: 28px; padding: 0 10px; border: 1px solid #DDE1E7; border-radius: 8px; background: #FFFFFF; font: inherit; font-size: 12px; color: #2457D6; text-decoration: none; white-space: nowrap; cursor: pointer; box-sizing: border-box';
const pl = (bg, fg, text) => '<span style="display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 6px; background: ' + bg + '; color: ' + fg + '; font-size: 12px; font-weight: 600; white-space: nowrap">' + esc(text) + '</span>';
const dirPill = (r) => r.direction === 'bullish' ? pl('#FDF0EF', '#B42318', r.verdict || '偏多') : r.direction === 'bearish' ? pl('#EDF7F1', '#1E6B44', r.verdict || '偏空') : pl('#F1F2F4', '#5B6372', r.verdict || '不明');
const srcPill = (r, short) => r.source === 'diagnose' ? pl('#EAF0FD', '#2457D6', '你诊断') : pl('#F1F2F4', '#5B6372', short ? '扫描' : '定时扫描');
const OUT = { hit: ['#EDF7F1', '#1E6B44', '✓ 对'], miss: ['#FDF0EF', '#B42318', '✗ 错'], flat: ['#F1F2F4', '#5B6372', '＝ 持平'] };
const NOW = { hit: ['#EDF7F1', '#1E6B44', '目前算对'], miss: ['#FDF0EF', '#B42318', '目前算错'], flat: ['#F1F2F4', '#5B6372', '目前持平'] };
const box = (label, value, sub, o) => { o = o || {}; return '<div style="display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-radius: 10px; background: ' + (o.bg || '#F7F8FA') + '"><span style="font-size: 11px; color: #5B6372">' + label + '</span><b style="' + MONO_F + '; font-size: ' + (o.size || 18) + 'px; color: ' + (o.color || '#14171F') + '">' + value + '</b><span style="font-size: 11px; color: #8A919E">' + sub + '</span></div>'; };
const bigBox = (label, value, sub, color) => '<div style="display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E3E6EB"><span style="font-size: 12px; color: #5B6372">' + label + '</span><b style="' + MONO_F + '; font-size: 20px; color: ' + (color || '#14171F') + '">' + value + '</b><span style="font-size: 11px; color: #8A919E">' + sub + '</span></div>';
const segs = (items, cur, act) => '<span class="seg">' + items.map(([k, n]) => '<button type="button" style="white-space: nowrap" data-act="' + act + '" data-k="' + k + '" aria-pressed="' + (String(cur) === String(k)) + '">' + n + '</button>').join('') + '</span>';

// 本股 / 板块 两根条：以这一行里较大的那个为满格（一半），颜色深浅区分
function retBar(v, m, color) {
  const w = m > 0 ? Math.min(Math.abs(v) / m, 1) * 50 : 0, left = v >= 0 ? 50 : 50 - w;
  return '<span style="position: relative; display: block; height: 6px; border-radius: 3px; background: #F1F2F4"><span style="position: absolute; left: 50%; top: -2px; width: 1px; height: 10px; background: #C9CED6"></span><span style="position: absolute; left: ' + left.toFixed(1) + '%; width: ' + w.toFixed(1) + '%; height: 100%; border-radius: 3px; background: ' + color + '"></span></span>';
}
function versus(r, right) {
  if (!r.have && r.have !== undefined) return '<span style="font-size: 11px; color: #8A919E">等发出后的第一根日线</span>';
  const m = Math.max(Math.abs(r.stock_ret), Math.abs(r.sector_ret));
  const good = right == null ? (r.direction === 'bullish' ? r.excess > 0 : r.excess < 0) : right;
  return '<span style="display: flex; flex-direction: column; gap: 4px"><span style="display: grid; grid-template-columns: 30px 80px 52px; gap: 2px 6px; align-items: center; font-size: 11px"><span style="color: #5B6372">本股</span>' + retBar(r.stock_ret, m, '#3A4250') +
    '<b style="' + MONO_F + '; text-align: right">' + pct(r.stock_ret) + '</b><span style="color: #8A919E">板块</span>' + retBar(r.sector_ret, m, '#A1A7B2') + '<span style="' + MONO_F + '; text-align: right; color: #8A919E">' + pct(r.sector_ret) + '</span></span>' +
    '<span style="font-size: 12px; color: ' + (good ? '#14171F' : '#5B6372') + '">' + (r.excess >= 0 ? '跑赢' : '跑输') + ' <b style="' + MONO_F + '">' + Math.abs(r.excess * 100).toFixed(1) + '</b> 个点</span></span>';
}
// 设计稿里没有「你持有」这类小标签；只在 AI 偏空、而你持有或想买的时候提一句，这是要紧的冲突
function mineTags(r) {
  const m = r.mine || {};
  if (r.direction !== 'bearish' || !(m.held || m.wish)) return '';
  return '<span style="font-size: 11px; color: #7A4A00">你' + (m.held ? '持有' : '想买') + '，AI 偏空，和你的打算不一致</span>';
}

/* ---------- 请求（?demo=1 时读示例数据） ---------- */
async function api(path) {
  if (DEMO) return demoApi(path);
  const res = await fetch('/api/scan' + path);
  let json = {};
  try { json = await res.json(); } catch (e) { /* 没有正文 */ }
  if (!res.ok) throw new Error(json.error || '请求失败（' + res.status + '）');
  return json;
}
function toast(text, bad) {
  const el = document.createElement('div');
  el.className = 'toast' + (bad ? ' err' : '');
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), bad ? 4500 : 2200);
}
function setStatus(ok, text) { $('dot').style.background = ok ? '#2E8B57' : '#B42318'; $('status').textContent = text; }

/* ---------- 头部、页签 ---------- */
function renderHead() {
  const s = S.sum, m = s && s.market;
  $('head').innerHTML = '<h1 style="margin: 0; font-size: 20px; font-weight: 700">战绩</h1>' +
    '<span style="font-size: 13px; color: #5B6372">' + (s ? esc(s.next_run) : '') + '</span>' +
    (m ? '<span style="font-size: 13px; color: #5B6372">市场环境 <b style="color: #7A4A00">' + esc(m.level) + (m.tilt ? ' · ' + esc(m.tilt) : '') + '</b></span>' : '') +
    '<span style="margin-left: auto; display: flex; gap: 8px; align-items: center">' + (DEMO ? '<span class="pill" style="background: #F1F2F4; color: #5B6372">示意数据</span>' : '') +
    '<button type="button" data-act="rules" style="height: 32px; padding: 0 12px; border: 1px solid #DDE1E7; border-radius: 8px; background: #FFFFFF; font: inherit; font-size: 13px; cursor: pointer">统计口径</button></span>';
}
function renderTabs() {
  const s = S.sum;
  const on = (k) => S.tab === k ? 'color: #2457D6; font-weight: 600; box-shadow: inset 0 -2px 0 #2457D6' : '';
  const num12 = (t) => '<span style="' + MONO_F + '; font-size: 12px; color: #8A919E">' + t + '</span>';
  const chip = (bg, fg, t) => '<span style="height: 18px; padding: 0 6px; border-radius: 999px; background: ' + bg + '; color: ' + fg + '; font-size: 11px; font-weight: 600; line-height: 18px">' + t + '</span>';
  const badge = {
    today: s ? num12(s.made) : '',
    track: s ? num12(s.tracking) : '',
    record: s ? (s.settled_today.n ? chip('#EDF7F1', '#1E6B44', '今天 ' + s.settled_today.hit + '/' + s.settled_today.n) : '') + (s.accuracy != null ? chip('#EAF0FD', '#2457D6', rate(s.accuracy)) : '') : '',
  };
  $('tabs').innerHTML = TABS.map(([k, n]) => '<button type="button" role="tab" data-act="tab" data-k="' + k + '" aria-selected="' + (S.tab === k) + '" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 2px; border: none; background: transparent; font: inherit; font-size: 14px; color: #5B6372; cursor: pointer; ' + on(k) + '">' + n + badge[k] + '</button>').join('');
}

/* ---------- 今日扫描 ---------- */
function emptyCard() {
  return '<div style="' + CARD + '"><div class="empty"><b style="font-size: 15px">还没有预测</b><span style="max-width: 520px; line-height: 1.7">扫描记的是你自己的自选、持仓和想买：夜间任务（20:30 起）每跑完一只就记一条，不用你操作；在「诊断」页点「重新分析」也会记一条。第一批要等夜间任务跑完才有，之后每天一批，到期后在这里对账。</span>' +
    '<span style="display: flex; gap: 8px"><a href="/" style="' + LINKBTN + '">去诊断页</a><a href="/scan.html?demo=1" style="' + LINKBTN + '">看示例数据</a></span></div></div>';
}
const TCOL = 'grid-template-columns: 140px 128px minmax(0, 1fr) 124px 84px 96px';
const tierPill = (m) => m.held ? pl('#EAF0FD', '#1F3F8A', '持有') : m.wish ? pl('#F1E9FB', '#5B3A8C', '想买') : pl('#F1F2F4', '#5B6372', '自选');
const analysing = (code) => ((S.sum && S.sum.running) || []).indexOf(code) >= 0;
// 一行的操作：去诊断，其余收进「⋯」
function rowActions(r, kind) {
  return '<span style="display: flex; gap: 6px; align-items: center; justify-content: flex-end"><a href="' + diagnoseHref(r.ts_code) + '" style="' + LINKBTN + '">诊断</a>' +
    '<button type="button" data-act="menu" data-kind="' + kind + '" data-code="' + esc(r.ts_code) + '" data-name="' + esc(r.name || r.ts_code) + '" aria-label="更多操作" title="更多" style="width: 28px; height: 28px; padding: 0; border: 1px solid #DDE1E7; border-radius: 8px; background: #FFFFFF; color: #5B6372; font-size: 16px; line-height: 1; cursor: pointer">⋯</button></span>';
}
// 先看和你的打算冲突的，再是持有、想买，最后自选；方向不明的排在同类后面
function todayRank(r) {
  const m = r.mine || {};
  return (r.direction === 'bearish' && (m.held || m.wish) ? 0 : m.held ? 1 : m.wish ? 2 : 3) * 2 + (r.direction === 'unclear' ? 1 : 0);
}
function todayRow(r) {
  const unclear = r.direction === 'unclear', m = r.mine || {};
  const conflict = r.direction === 'bearish' && (m.held || m.wish);
  return '<div class="row" style="display: grid; ' + TCOL + '; gap: 12px; align-items: center; padding: 10px 16px; border-top: 1px solid #F1F2F4">' +
