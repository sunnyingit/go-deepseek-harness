<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="stock-api-base" content="http://127.0.0.1:8090">
<title>持仓</title>
<style>
body{margin:0;background:#EEF0F3}
a{color:inherit}
button,input,textarea{font:inherit}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
.up{color:#B42318}.dn{color:#1E6B44}
.seg{display:flex;border:1px solid #DDE1E7;border-radius:8px;overflow:hidden}
.seg button{height:28px;padding:0 12px;white-space:nowrap;border:none;border-right:1px solid #DDE1E7;background:#FFFFFF;color:#3A4250;font-size:12px;cursor:pointer}
.seg button:last-child{border-right:none}
.seg button[aria-pressed="true"]{background:#14171F;color:#FFFFFF}
.mini{height:28px;padding:0 10px;border:1px solid #DDE1E7;border-radius:8px;background:#FFFFFF;color:#2457D6;font-size:12px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;text-decoration:none;box-sizing:border-box}
.mini:hover{border-color:#2457D6}
.btn{height:32px;padding:0 12px;border:1px solid #DDE1E7;border-radius:8px;background:#FFFFFF;font-size:13px;cursor:pointer;white-space:nowrap}
.btn.pri{border:none;background:#2457D6;color:#FFFFFF}
.btn:disabled{opacity:.5;cursor:default}
.pl{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;font-size:12px;font-weight:600;white-space:nowrap}
.tag{display:inline-flex;align-items:center;align-self:flex-start;height:18px;padding:0 6px;border-radius:4px;font-size:11px;font-weight:600;line-height:18px;white-space:nowrap}
.nav-a{width:48px;min-height:48px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#5B6372;text-decoration:none;font-size:11px}
.nav-a.on{color:#2457D6;background:#EAF0FD;font-weight:500}
.card{display:flex;flex-direction:column;gap:10px;padding:14px 16px;background:#FFFFFF;border:1px solid #E3E6EB;border-radius:14px}
.card h3{margin:0;font-size:15px;font-weight:700}
.sub{font-size:12px;color:#8A919E}
.lbl{font-size:11px;color:#8A919E}
.tab{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 2px;border:none;background:transparent;font-size:14px;color:#5B6372;cursor:pointer}
.tab[aria-selected="true"]{color:#2457D6;font-weight:600;box-shadow:inset 0 -2px 0 #2457D6}
.tab .n{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:12px;color:#8A919E}
.grid-h{display:grid;grid-template-columns:132px 150px 80px minmax(0,1fr) minmax(0,1fr) 96px 64px;gap:14px;align-items:center}
.hrow{padding:12px 16px;border-top:1px solid #EEF0F3;cursor:pointer;color:#14171F}
.hrow:hover{background:#F7F8FA}
.hrow.sel{background:#F1F5FE}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-top:1px solid #F4F5F7;font-size:13px}
.kv span{color:#5B6372}
.note{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-radius:10px;background:#F7F8FA}
.warnbox{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:8px;background:#FFF8EC;font-size:12px;color:#3A4250}
.inp{width:100%;min-height:34px;padding:7px 10px;border:1px solid #DDE1E7;border-radius:8px;box-sizing:border-box;font-size:13px;color:#14171F;line-height:1.5;background:#FFFFFF}
.inp:focus{outline:none;border-color:#2457D6}
.chip{height:26px;padding:0 10px;border-radius:999px;border:1px solid #DDE1E7;background:#FFFFFF;color:#3A4250;font-size:12px;cursor:pointer;box-sizing:border-box}
.chip.on{border-color:#2457D6;background:#EAF0FD;color:#2457D6}
.flag{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.6}
.bar{height:10px;border-radius:5px;background:#F1F2F4;overflow:hidden}
.bar>i{display:block;height:100%}
.empty{padding:36px 20px;text-align:center;color:#5B6372;display:flex;flex-direction:column;align-items:center;gap:12px}
.skeleton{color:#8A919E;padding:24px 0}
.x{border:none;background:transparent;color:#8A919E;cursor:pointer;font-size:14px;padding:0 4px}
.x:hover{color:#B42318}
table.tb{width:100%;border-collapse:collapse}
table.tb th{padding:6px 4px;font-size:11px;font-weight:500;color:#8A919E;text-align:left;white-space:nowrap}
table.tb td{padding:8px 4px;border-top:1px solid #F1F2F4;font-size:12px;vertical-align:top}
#aside{overflow-x:hidden}
.dw{flex:0 0 384px;width:384px}
@media (min-width:1400px){.dw{flex-basis:422px;width:422px}}
.toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);z-index:60;padding:9px 16px;border-radius:8px;background:#14171F;color:#FFFFFF;font-size:13px;max-width:80vw}
.toast.err{background:#B42318}
</style>
</head>
<body>
<div style="height:100vh;overflow:hidden;display:flex;flex-direction:column;background:#EEF0F3;font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif;color:#14171F;font-size:13px;line-height:1.55">
<header style="flex:none;display:flex;align-items:center;height:44px;background:#FFFFFF;border-bottom:1px solid #DDE1E7">
<div style="flex:0 0 64px;display:flex;align-items:center;justify-content:center;border-right:1px solid #EEF0F3;height:44px">
<div style="width:28px;height:28px;border-radius:8px;background:#2457D6;display:flex;align-items:center;justify-content:center">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l5-5 4 4 8-8"></path><path d="M15 8h5v5"></path></svg>
</div>
</div>
<span style="padding:0 16px;font-weight:700;font-size:14px">持仓</span>
<div style="margin-left:auto;display:flex;align-items:center;gap:14px;padding-right:16px">
<span id="session" style="display:flex;align-items:center;gap:6px;font-size:12px;color:#5B6372"></span>
<button type="button" id="bell" data-act="notif" aria-label="通知" title="通知" style="position:relative;width:32px;height:32px;border:none;border-radius:8px;background:transparent;color:#3A4250;cursor:pointer;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg><span id="bellDot" hidden style="position:absolute;top:2px;right:1px;min-width:16px;height:16px;padding:0 4px;box-sizing:border-box;border-radius:999px;background:#D9483F;color:#FFFFFF;font-size:10px;font-weight:600;line-height:16px;text-align:center"></span></button>
</div>
</header>
<div style="flex:1 1 auto;display:flex;flex-wrap:nowrap;align-items:stretch;min-width:0;min-height:0;overflow:hidden">
<nav aria-label="主导航" style="flex:0 0 64px;overflow:hidden;background:#FFFFFF;border-right:1px solid #DDE1E7;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 0">
<a class="nav-a" href="/market.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20h18"></path><path d="M5 16l4-5 4 3 6-7"></path></svg>市场</a>
<a class="nav-a" href="/scan.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"></rect><path d="M8 9h8M8 13h8M8 17h5"></path></svg>扫描</a>
<a class="nav-a" href="/"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-4.5-4.5"></path></svg>诊断</a>
<a class="nav-a on" href="/holdings.html" aria-current="page"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16v12H4z"></path><path d="M8 7V5h8v2"></path></svg>持仓</a>
<a class="nav-a" href="#"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg>问问</a>
</nav>
<main style="flex:999 1 640px;min-width:0;display:flex;flex-direction:column;overflow:hidden;position:relative">
<div style="flex:none;padding:12px 28px 0;background:#FFFFFF;border-bottom:1px solid #DDE1E7">
<div style="max-width:1240px">
<div id="head" style="display:flex;align-items:center;gap:22px;flex-wrap:wrap"></div>
<div id="tabs" role="tablist" aria-label="持仓" style="display:flex;align-items:center;gap:24px;margin-top:6px"></div>
</div>
</div>
<div id="scroll" style="flex:1;min-height:0;overflow-y:auto;padding:16px 28px 24px;box-sizing:border-box">
<div id="body" style="max-width:1240px;display:flex;flex-direction:column;gap:14px"><div class="skeleton">正在取现价、AI 判断和板块…第一次会稍久，之后很快。</div></div>
</div>
</main>
<aside id="aside" class="dw" aria-label="详情" style="align-self:stretch;overflow-y:auto;background:#FFFFFF;border-left:1px solid #DDE1E7;box-sizing:border-box;font-size:13px"></aside>
</div>
<footer style="position:relative;flex:none;height:26px;display:flex;align-items:center;gap:18px;padding:0 12px;border-top:1px solid #DDE1E7;background:#F7F8FA;font-size:11px;color:#5B6372;white-space:nowrap;overflow:hidden">
<span style="display:flex;align-items:center;gap:6px"><span id="dot" style="width:7px;height:7px;border-radius:50%;background:#A1A7B2"></span><span id="status">正在连接</span></span>
<span id="footIndexes" style="display:flex;gap:18px"></span>
<span style="margin-left:auto">研究分析，不构成投资建议</span>
</footer>
</div>
<div id="modal"></div>
<script>
const API = (new URLSearchParams(location.search).get('stockApi') || (document.querySelector('meta[name="stock-api-base"]') || {}).content || 'http://127.0.0.1:8090').replace(/\/$/, '');
const S = { tab: 'now', summary: null, tabs: {}, sel: null, detail: {}, notif: false, nData: null, nTab: 'all', rec: null, add: null, busy: {} };
const TAB_NAMES = [['buy', '想买'], ['now', '持有'], ['chk', '体检'], ['rev', '复盘']];

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (id) => document.getElementById(id);
const MONO = 'class="mono"';
const cls = (v) => v > 0 ? 'up' : v < 0 ? 'dn' : '';
const sign = (v) => v > 0 ? '+' : v < 0 ? '−' : '';
const money = (v, signed) => v == null || v !== v ? '—' : (signed ? sign(v) : v < 0 ? '−' : '') + Math.abs(Math.round(v)).toLocaleString('en-US');
const pct = (v, d, signed) => v == null || v !== v ? '—' : (signed === false ? '' : sign(v)) + Math.abs(v * 100).toFixed(d == null ? 1 : d) + '%';
const px = (v) => v == null ? '—' : Number(v).toFixed(2);
const day5 = (d) => (d || '').slice(5);
const codeOnly = (c) => (c || '').split('.')[0];
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };

const LEAN_STYLE = { bullish: ['#FDF0EF', '#B42318'], bearish: ['#EDF7F1', '#1E6B44'], unclear: ['#F1F2F4', '#3A4250'] };
const VERDICT_STYLE = { '三层同向': ['#FDF0EF', '#B42318'], '有钱没热度': ['#EAF0FD', '#2457D6'], '只热不增': ['#FFF1D6', '#7A4A00'], '在流出': ['#EDF7F1', '#1E6B44'] };
const REASON_STYLE = { ok: ['#EDF7F1', '#1E6B44', '✓ 还成立'], doubt: ['#FFF1D6', '#7A4A00', '? 存疑'], broken: ['#FFE0B2', '#8A3B00', '✕ 不成立'], none: ['#F1F2F4', '#5B6372', '没写理由'] };
const TONE_STYLE = { good: ['#FDF0EF', '#B42318'], bad: ['#EDF7F1', '#1E6B44'], warn: ['#FFF1D6', '#7A4A00'], flat: ['#F1F2F4', '#5B6372'], blue: ['#EAF0FD', '#2457D6'] };
const LEVEL_STYLE = { '注意': ['#FFF1D6', '#7A4A00'], '正常': ['#EDF7F1', '#1E6B44'], '提示': ['#F1F2F4', '#5B6372'] };

const pill = (text, style) => '<span class="pl" style="background:' + style[0] + ';color:' + style[1] + '">' + esc(text) + '</span>';
const aiPill = (ai) => ai ? pill(ai.label, LEAN_STYLE[ai.lean] || LEAN_STYLE.unclear) : pill('还没有判断', LEAN_STYLE.unclear);
const verdictPill = (sector) => sector && sector.verdict ? pill(sector.verdict, VERDICT_STYLE[sector.verdict] || TONE_STYLE.flat) : '';
const reasonPill = (status) => pill(REASON_STYLE[status || 'none'][2], REASON_STYLE[status || 'none']);
const diagnoseHref = (code) => '/?stock=' + encodeURIComponent(code);

/* ---------- 请求 ---------- */
async function api(path, method, body) {
  const res = await fetch('/api/v1/holdings' + path, { method: method || 'GET', headers: body ? { 'Content-Type': 'application/json' } : undefined, body: body ? JSON.stringify(body) : undefined });
  let json = {};
  try { json = await res.json(); } catch (e) { /* 没有正文 */ }
  if (!res.ok) throw new Error(json.error || '请求失败（' + res.status + '）');
  return json;
}
function toast(text, bad) {
  const el = document.createElement('div');
  el.className = 'toast' + (bad ? ' err' : '');
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), bad ? 4500 : 2200);
}
function setStatus(ok, text) { $('dot').style.background = ok ? '#2E8B57' : '#B42318'; $('status').textContent = text; }

/* ---------- 头部、页签 ---------- */
function renderHead() {
  const s = S.summary, h = s ? s.header : null;
  const stat = (label, body) => '<span style="display:flex;flex-direction:column"><span class="lbl">' + label + '</span>' + body + '</span>';
  const big = 'font-family:\'IBM Plex Mono\',monospace;font-weight:700;font-size:16px';
  $('head').innerHTML = '<h1 style="margin:0;font-size:20px;font-weight:700">持仓</h1>' +
    (h ? stat('持仓市值', '<b style="' + big.replace('font-weight:700', 'font-weight:600') + '">' + money(h.mv) + '</b>') +
      stat('今天', '<span class="' + cls(h.day_pnl) + '" style="' + big + '">' + money(h.day_pnl, true) + ' <span style="font-size:11px">' + pct(h.day_pct) + '</span></span>') +
      stat('总盈亏', '<span class="' + cls(h.pnl) + '" style="' + big + '">' + money(h.pnl, true) + ' <span style="font-size:11px">' + pct(h.pnl_pct) + '</span></span>') : '') +
    '<span style="margin-left:auto;display:flex;gap:8px;align-items:center">' +
    '<button type="button" class="btn" data-act="import">导入券商持仓</button>' +
    '<button type="button" class="btn pri" data-act="rec">＋ 记一笔</button></span>';
}
function renderTabs() {
  const t = S.summary ? S.summary.tabs : null;
  const extra = {
    buy: t ? '<span class="n">' + t.buy + '</span>' : '',
    now: t ? '<span class="n">' + t.now + '</span>' : '',
    chk: t && t.chk ? '<span style="height:18px;padding:0 6px;border-radius:999px;background:#FFF1D6;color:#7A4A00;font-size:11px;font-weight:600;line-height:18px">' + t.chk + ' 个要注意</span>' : '',
    rev: t ? '<span class="n">近 ' + t.rev_days + ' 天 ' + t.rev + ' 笔</span>' : '',
  };
  $('tabs').innerHTML = TAB_NAMES.map(([k, n]) => '<button type="button" class="tab" role="tab" data-act="tab" data-k="' + k + '" aria-selected="' + (S.tab === k) + '">' + n + (extra[k] || '') + '</button>').join('');
}

/* ---------- 持有 ---------- */
function holdRow(r) {
  const sel = S.sel === r.ts_code ? ' sel' : '';
  const tag = r.tag ? '<span class="tag" style="background:#FFF1D6;color:#7A4A00">● ' + esc(r.tag.text) + '</span>' : '';
  const sector = r.sector && r.sector.name ? '<span style="font-size:12px;color:#5B6372" class="ell">' + esc(r.sector.name) + '</span>' + verdictPill(r.sector) : '<span style="font-size:12px;color:#8A919E">板块没取到</span>';
  return '<div class="grid-h hrow' + sel + '" role="button" tabindex="0" data-act="sel" data-code="' + esc(r.ts_code) + '">' +
    '<span style="display:flex;flex-direction:column;gap:3px">' + tag + '<b style="font-size:15px">' + esc(r.name) + '</b><span ' + MONO + ' style="font-size:11px;color:#8A919E">' + codeOnly(r.ts_code) + ' · ' + px(r.price) + (r.live ? '' : ' <span title="现价没取到，按成本算">?</span>') + '</span></span>' +
    '<span style="display:flex;flex-direction:column;gap:3px;white-space:nowrap">' +
    '<span style="display:flex;align-items:baseline;gap:6px"><span class="lbl">今天</span><span ' + MONO + ' class="' + cls(r.day_pnl) + '" style="font-weight:700;font-size:13px">' + money(r.day_pnl, true) + ' <span style="font-size:11px">' + (r.change_pct == null ? '' : sign(r.change_pct) + Math.abs(r.change_pct).toFixed(1) + '%') + '</span></span></span>' +
    '<span style="display:flex;align-items:baseline;gap:6px"><span class="lbl">总计</span><span ' + MONO + ' class="' + cls(r.pnl) + '" style="font-weight:700;font-size:12px">' + money(r.pnl, true) + ' <span style="font-size:11px">' + pct(r.pnl_pct) + '</span></span></span></span>' +
    '<span style="display:flex;flex-direction:column;gap:4px"><b ' + MONO + ' style="font-size:13px">' + (r.weight * 100).toFixed(1) + '%</b><span style="height:4px;border-radius:2px;background:#EEF0F3;overflow:hidden"><span style="display:block;height:100%;width:' + Math.min(100, r.weight * 200).toFixed(0) + '%;background:' + (r.weight >= 0.3 ? '#E0B25C' : '#A1A7B2') + '"></span></span></span>' +
    '<span style="display:flex;align-items:center;gap:6px;min-width:0">' + reasonPill(r.reason.status) + '<span class="ell" style="font-size:12px;color:#5B6372" title="' + esc(r.reason.line) + '">' + esc(r.reason.line) + '</span></span>' +
    '<span style="display:flex;flex-direction:column;gap:3px;min-width:0"><span>' + aiPill(r.ai) + '</span><span class="ell" style="font-size:12px;color:#5B6372" title="' + esc(r.flip) + '">' + esc(r.flip) + '</span></span>' +
    '<span style="display:flex;flex-direction:column;gap:3px;align-items:flex-start;min-width:0">' + sector + '</span>' +
    '<a class="mini" href="' + diagnoseHref(r.ts_code) + '" style="justify-self:end" title="打开诊断">诊断 →</a></div>';
}
function marketLine(m) {
  if (!m) return '<span class="sub">大盘结论暂时没取到</span>';
  return '<span>大盘：<b>' + esc(m.text) + '</b>' + (m.stance ? '（' + esc(m.stance) + '）' : '') + '</span><a class="mini" href="/market.html">看市场 →</a>';
}
function emptyState() {
  return '<div class="card"><div class="empty"><b style="font-size:16px;color:#14171F">还没有持仓</b>' +
    '<span style="max-width:520px">记下每一笔买卖，或者导入券商导出的持仓。之后这里会告诉你：你买的理由还在不在、AI 现在怎么看、离改判还差什么，以及钱压在了哪里。</span>' +
    '<span style="display:flex;gap:8px"><button type="button" class="btn pri" data-act="rec">＋ 记一笔</button><button type="button" class="btn" data-act="import">导入券商持仓</button><button type="button" class="btn" data-act="addwish">＋ 加一只想买的</button></span></div></div>';
}
function renderNow() {
  const s = S.summary;
  if (s.empty) return emptyState();
  if (!s.rows.length) return '<div class="card"><div class="empty"><b>现在手里没有持仓</b><span>想买里有计划的话，条件到了会提醒你；买了就「记一笔」。</span><button type="button" class="btn pri" data-act="rec">＋ 记一笔</button></div></div>';
  return '<div style="display:flex;flex-direction:column;gap:12px"><div style="background:#FFFFFF;border:1px solid #E3E6EB;border-radius:14px;overflow:auto"><div style="min-width:900px">' +
    '<div class="grid-h" style="padding:10px 16px;font-size:11px;color:#8A919E;background:#F7F8FA"><span>股票 · 要处理的在前</span><span>盈亏</span><span>占持仓</span><span>你的理由</span><span>AI 现在怎么看</span><span>板块</span><span></span></div>' +
    s.rows.map(holdRow).join('') + '</div></div>' +
    '<div style="display:flex;align-items:center;gap:12px;font-size:13px;color:#3A4250;flex-wrap:wrap">' + marketLine(s.market) + '<span style="margin-left:auto;font-size:12px;color:#8A919E">这里只说 AI 怎么看、离改判还差什么，不给买卖指令</span></div></div>';
}

/* ---------- 想买 ---------- */
function condRow(c) {
  const mark = c.met === true ? '<span style="color:#1E6B44">✓</span>' : c.met === false ? '<span style="color:#A1A7B2">○</span>' : '<span style="color:#A1A7B2">·</span>';
  const color = c.met === true ? '#1E6B44' : '#5B6372';
  return '<span style="display:flex;align-items:center;gap:6px;font-size:12px">' + mark + '<span>' + esc(c.label) + '</span><span ' + MONO + ' style="margin-left:auto;font-size:11px;color:' + color + '">' + esc(c.detail) + '</span></span>';
}
function impactText(im) {
  if (!im || !im.lines.length) return '';
  const lines = im.lines.map((l) => esc(l.sector) + ' ' + (l.before * 100).toFixed(0) + '% → ' + (l.buying ? '' : '<b>') + (l.after * 100).toFixed(1).replace(/\.0$/, '') + '%' + (l.buying ? '' : '</b>')).join('；');
  return '买入后：' + lines + (im.notes.length ? '；' + im.notes.map(esc).join('；') : '');
}
function wishCard(w) {
  const st = TONE_STYLE[{ good: 'blue', warn: 'blue', bad: 'warn', flat: 'flat' }[w.status.tone] || 'flat'];
  const sector = w.sector && w.sector.name ? '<span class="pl" style="background:' + (VERDICT_STYLE[w.sector.verdict] || TONE_STYLE.flat)[0] + ';color:' + (VERDICT_STYLE[w.sector.verdict] || TONE_STYLE.flat)[1] + '">' + esc(w.sector.name) + (w.sector.verdict ? ' · ' + esc(w.sector.verdict) : '') + '</span>' : '';
  const note = impactText(w.impact);
  return '<div class="card" role="button" tabindex="0" data-act="sel" data-code="' + esc(w.ts_code) + '" style="cursor:pointer"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><b style="font-size:15px">' + esc(w.name) + '</b><span ' + MONO + ' style="font-size:11px;color:#8A919E">' + codeOnly(w.ts_code) + ' · ' + px(w.price) + '</span>' + sector +
    '<span class="sub">' + esc(w.source) + '</span><span style="margin-left:auto">' + pill(w.status.text, st) + '</span></div>' +
    '<div style="display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1fr);gap:16px">' +
    '<span style="display:flex;flex-direction:column;gap:4px"><span class="lbl">为什么想买</span><span style="font-size:13px;line-height:1.5">「' + esc(w.reason) + '」</span></span>' +
    '<span style="display:flex;flex-direction:column;gap:5px"><span class="lbl">什么时候买' + (w.conditions.length > 1 ? ' · ' + (w.match === 'all' ? '全部满足' : '任一满足') : '') + '</span>' + (w.conditions.length ? w.conditions.map(condRow).join('') : '<span class="sub">没有设条件，自己盯</span>') + '</span>' +
    '<span style="display:flex;flex-direction:column;gap:4px"><span class="lbl">AI 现在怎么看 · 打算买多少</span><span style="display:flex;align-items:center;gap:6px">' + aiPill(w.ai) + '<span ' + MONO + ' style="font-size:12px">' + (w.plan_pct ? '计划 ' + w.plan_pct + '%' : '没写仓位') + '</span></span></span></div>' +
    '<div style="display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;background:#F7F8FA;font-size:12px;color:#3A4250"><span>' + (note || '这只票还没有可比的持仓占比') + '</span>' +
    '<span style="margin-left:auto;display:flex;gap:6px"><a class="mini" href="' + diagnoseHref(w.ts_code) + '">诊断 →</a><button type="button" class="mini" data-act="rec" data-wish="' + w.id + '">记一笔</button><button type="button" class="mini" style="color:#5B6372" data-act="wishdrop" data-id="' + w.id + '">不想买了</button></span></div></div>';
}
function renderBuy(d) {
  const head = '<div style="display:flex;align-items:center;gap:10px;font-size:13px;color:#5B6372"><span>先写好理由、条件和仓位，条件到了提醒你；买入时这些会自动变成逻辑卡。</span><button type="button" class="btn pri" data-act="addwish" style="margin-left:auto">＋ 加一只想买的</button></div>';
  const m = d.market ? '<div style="padding:10px 14px;border-radius:10px;background:#FFF8EC;font-size:13px;color:#3A4250">大盘现在 <b style="color:#7A4A00">' + esc(d.market.text) + '</b>：条件到了也会先提醒你这一点，买不买你定。</div>' : '';
  const body = d.items.length ? d.items.map(wishCard).join('') : '<div class="card"><div class="empty"><b>还没有想买的票</b><span>想买的票可以从诊断页「加入想买」、判断偏多的列表、或者体检里的热点板块加进来。</span></div></div>';
  return '<div style="display:flex;flex-direction:column;gap:12px">' + head + m + body + '</div>';
}

/* ---------- 体检 ---------- */
function flagLine(f) { return '<span class="flag">' + pill(f.level, LEVEL_STYLE[f.level] || LEVEL_STYLE['提示']) + '<span><b>' + esc(f.title) + '</b>：' + esc(f.text) + '</span></span>'; }
function sectorBar(s) {
  const bg = s.weight >= 0.4 ? '#E0B25C' : '#C9CED6';
  return '<div style="display:grid;grid-template-columns:96px 1fr 60px 92px;gap:10px;align-items:center;min-height:30px"><span style="font-size:13px" class="ell" title="' + esc(s.stocks.join('、')) + '">' + esc(s.name) + '</span><span class="bar"><i style="width:' + (s.weight * 100).toFixed(1) + '%;background:' + bg + '"></i></span><b ' + MONO + ' style="font-size:13px;text-align:right">' + (s.weight * 100).toFixed(1) + '%</b><span style="text-align:right">' + (s.verdict ? pill(s.verdict, VERDICT_STYLE[s.verdict] || TONE_STYLE.flat) : '') + '</span></div>';
}
function renderCheck(d) {

  const s1 = card('① 结构：钱压在哪', '按市值', d.structure.sectors.map(sectorBar).join('') + '<div style="display:flex;flex-direction:column;gap:6px;padding-top:4px">' + d.structure.flags.map(flagLine).join('') + '</div>');
  const s2 = card('② 每只拿着的理由还在不在', '对照你买入时写的理由；不读原文，只核对价格、板块、大资金、AI 方向', d.reasons.map((r) => '<div style="display:grid;grid-template-columns:88px minmax(0,1fr) 78px;gap:10px;align-items:start;padding:8px 0;border-top:1px solid #F4F5F7"><b style="font-size:13px">' + esc(r.name) + '</b><span style="display:flex;flex-direction:column;gap:2px"><span style="font-size:12px;color:#5B6372">' + (r.text ? '「' + esc(r.text) + '」' : '没有写理由') + '</span><span style="font-size:12px">' + esc(r.line) + '</span></span><span style="text-align:right">' + reasonPill(r.status) + '</span></div>').join('') + '<span class="sub">这里只说理由还在不在，不说该不该卖。</span>');
  const s3 = card('③ 最坏会怎样', '按近一年各只和大盘的联动程度估算', d.stress.map((x) => '<div style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:8px 0;border-top:1px solid #F4F5F7"><span style="display:flex;flex-direction:column;gap:2px"><b style="font-size:13px">' + esc(x.title) + '</b><span style="font-size:12px;color:#5B6372">' + esc(x.text) + '</span></span><span style="text-align:right"><b ' + MONO + ' class="dn" style="font-size:14px">' + (x.loss ? '−' + money(Math.abs(x.loss)) : '0') + '</b><br><span class="sub">占持仓 ' + (x.pct ? '−' + (Math.abs(x.pct) * 100).toFixed(1) : '0') + '%</span></span></div>').join('') + '<span class="sub">不是预测，只是告诉你：如果这些情况发生，大概会亏多少、亏在哪几只。</span>');
  const s4 = card('④ 跟大盘合不合拍', d.fit.known ? '大盘 ' + esc(day5(d.fit.since)) + ' 起是「' + esc(d.fit.market) + '」' : '大盘结论没取到', d.fit.lines.map(flagLine).join(''));
  const hot = d.hot.length ? d.hot.map((g) => '<div style="display:flex;flex-direction:column;gap:2px"><b style="font-size:12px;color:#5B6372;padding-top:4px">' + esc(g.title) + '</b>' + g.rows.map((r) => '<div style="display:grid;grid-template-columns:78px 78px 52px 78px minmax(0,1fr);gap:8px;align-items:center;padding:5px 0;border-top:1px solid #F4F5F7;font-size:12px"><span class="ell">' + esc(r.name) + '</span><span ' + MONO + ' class="' + (r.flow == null ? '' : cls(r.flow)) + '" title="' + esc(r.source) + '">' + (r.flow == null ? '—' : sign(r.flow) + Math.abs(r.flow).toFixed(1) + ' 亿') + '</span><span ' + MONO + '>' + (r.heat == null ? '—' : r.heat.toFixed(1) + '×') + '</span>' + pill(r.verdict, VERDICT_STYLE[r.verdict] || TONE_STYLE.flat) + '<span class="ell" style="color:#5B6372">' + (r.mine.length ? esc(r.mine.map((m) => m.name + ' ' + (m.weight * 100).toFixed(1) + '%').join('、')) : '没有') + '</span></div>').join('') + '</div>').join('') : '<span class="sub">没有取到板块数据</span>';
  const s5 = card('⑤ 现在的热点', '按「有没有新钱 + 热不热」排 · 和你的持仓对照', '<div style="display:grid;grid-template-columns:78px 78px 52px 78px minmax(0,1fr);gap:8px;font-size:11px;color:#8A919E"><span>板块</span><span>新钱</span><span>热度</span><span>状态</span><span>你的持仓</span></div>' + hot + '<span class="sub">热点只到板块，不推荐具体股票；新钱：有代表 ETF 的按近 5 日份额净增，其余按行业主力资金近 10 日。</span>');
  const s6 = card('⑥ 可以考虑的方向', '给条件，不给票；选哪只由你决定', d.suggestions.length ? d.suggestions.map((x) => '<div style="display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid #F4F5F7"><span style="display:flex;flex-direction:column;gap:2px;min-width:0"><b style="font-size:13px">' + esc(x.title) + '</b><span style="font-size:12px;color:#5B6372">' + esc(x.text) + '</span></span><span style="margin-left:auto">' + suggestAction(x) + '</span></div>').join('') + '<span class="sub">体检按规则生成，只指出问题和方向，不构成投资建议，也不代你做买卖决定。</span>' : '<span class="sub">现在没有需要特别提醒的方向。</span>');
  const cmp = d.compare ? card('和上次体检比', d.compare_day + ' 那次', d.compare.lines.map((l) => '<div style="display:flex;gap:10px;padding:6px 0;border-top:1px solid #F4F5F7;font-size:12px"><span style="flex:0 0 120px;color:#5B6372">' + esc(l.title) + '</span><span><b ' + MONO + '>' + esc(l.text) + '</b>' + (l.note ? ' <span class="sub">' + esc(l.note) + '</span>' : '') + '</span></div>').join('')) : '';
  return '<div style="display:flex;flex-direction:column;gap:12px"><div style="display:flex;align-items:center;gap:8px;font-size:12px;color:#8A919E">' + esc(d.generated_at) + ' 体检 · 打开页面时按现有数据现算，点「重新体检」存一份快照用于对比<button type="button" class="mini" data-act="recheck" style="margin-left:auto">重新体检</button></div>' +
    '<div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start"><div style="display:flex;flex-direction:column;gap:12px">' + s1 + s2 + s3 + '</div><div style="display:flex;flex-direction:column;gap:12px">' + s4 + s5 + s6 + cmp + '</div></div></div>';
}
function suggestAction(x) {
  if (x.action === 'diagnose') return '<a class="mini" href="' + diagnoseHref(x.ts_code) + '">去诊断 →</a>';
  if (x.action === 'alert') return '<button type="button" class="mini" data-act="sel" data-code="' + esc((S.summary.rows.find((r) => x.codes.includes(r.name)) || {}).ts_code || '') + '">去设提醒</button>';
  if (x.action === 'market') return '<a class="mini" href="/market.html">看市场 →</a>';
  return '';
}

/* ---------- 复盘 ---------- */
function renderReview(d) {
  if (d.empty) return '<div class="card"><div class="empty"><b>还没有买卖记录</b><span>' + esc(d.text) + '</span></div></div>';
  const big = (label, value, sub) => '<div class="card" style="flex:1;min-width:200px"><span class="sub">' + label + '</span><b ' + MONO + ' style="font-size:24px">' + value + '</b><span style="font-size:12px;color:#5B6372">' + sub + '</span></div>';

    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px"><span style="display:flex;flex-direction:column;gap:3px"><span class="lbl">你买的理由 · 买时 AI 怎么说</span><span style="font-size:13px">' + (x.reason ? '「' + esc(x.reason) + '」' : '<span class="sub">没写理由</span>') + '</span><span style="display:flex;gap:6px;align-items:center">' + (x.ai_label ? '<span style="font-size:12px;color:#5B6372">AI：' + esc(x.ai_label) + '</span>' : '') + (x.relation ? pill(x.relation, x.relation === '跟 AI 一致' ? TONE_STYLE.blue : TONE_STYLE.warn) : '') + '</span></span>' +
    '<span style="display:flex;flex-direction:column;gap:3px"><span class="lbl">复盘</span><span style="font-size:13px">' + esc(x.verdict) + '</span>' + (x.note ? '<span style="font-size:12px;background:#F7F8FA;border-radius:6px;padding:6px 8px">' + esc(x.note) + '</span>' : '') + '<button type="button" class="mini" style="align-self:flex-start" data-act="note" data-id="' + x.id + '" data-note="' + esc(x.note) + '">' + (x.note ? '改复盘笔记' : '写一句复盘笔记') + '</button></span></div></div>').join('') : '<div class="card"><span class="sub">近 ' + d.days + ' 天没有卖出的记录。卖出之后，这里会补上卖后 20 个交易日的走势。</span></div>';
  const habits = '<div class="card"><div style="display:flex;align-items:baseline;gap:8px"><h3>你的操作习惯</h3><span class="sub">近 ' + d.days + ' 天 · 次数 · 之后 20 天平均</span></div>' +
    d.habits.map((h) => '<div style="display:grid;grid-template-columns:minmax(0,1fr) 56px 76px;gap:10px;align-items:start;padding:8px 0;border-top:1px solid #F4F5F7"><span style="display:flex;flex-direction:column;gap:2px"><b style="font-size:13px">' + esc(h.title) + '</b>' + (h.detail ? '<span style="font-size:12px;color:#5B6372">' + esc(h.detail) + '</span>' : '') + '</span><b ' + MONO + ' style="text-align:right">' + h.count + ' 次</b><span ' + MONO + ' style="text-align:right;color:#5B6372">' + esc(h.after) + '</span></div>').join('') +

}

/* ---------- 右侧：详情 / 通知 ---------- */

  const n = S.nData ? S.nData.unread : 0;
  $('bellDot').hidden = !n; $('bellDot').textContent = n > 99 ? '99+' : n;
  $('bell').style.background = S.notif ? '#EAF0FD' : 'transparent';
}
function tickClock() {
  const d = new Date(), t = d.getHours() * 60 + d.getMinutes(), wk = d.getDay() > 0 && d.getDay() < 6;
  const live = wk && ((t >= 570 && t <= 690) || (t >= 780 && t <= 900));
  $('session').innerHTML = '<span style="width:7px;height:7px;border-radius:50%;background:' + (live ? '#2E8B57' : '#A1A7B2') + '"></span>' + (live ? '交易中' : wk ? '已休市' : '休市日') + ' · <span ' + MONO + '>' + [d.getHours(), d.getMinutes(), d.getSeconds()].map((n) => String(n).padStart(2, '0')).join(':') + '</span>';
}
setInterval(tickClock, 1000); tickClock();
async function loadIndexes() {
  try {
    const j = await (await fetch(API + '/api/v1/market/summary')).json();
    $('footIndexes').innerHTML = (j.indexes || []).map((r) => '<span>' + esc(r.name) + ' <span ' + MONO + ' class="' + cls(r.pct) + '">' + Number(r.close).toFixed(2) + ' ' + (r.pct == null ? '' : sign(r.pct) + Math.abs(r.pct).toFixed(2) + '%') + '</span></span>').join('');
  } catch (e) { /* 指数取不到不影响持仓 */ }
}
// 每 20 秒刷新一次现价（只在交易时间、窗口可见、没有弹窗时）
setInterval(() => { const d = new Date(), t = d.getHours() * 60 + d.getMinutes(), wk = d.getDay() > 0 && d.getDay() < 6; if (wk && ((t >= 570 && t <= 690) || (t >= 780 && t <= 900)) && !document.hidden && !$('modal').innerHTML && S.tab === 'now') { api('/summary').then((s) => { S.summary = s; renderHead(); renderTabs(); renderBody(); }).catch(() => {}); } }, 20000);
refreshAll().then(loadIndexes);
</script>
</body>
