<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="stock-api-base" content="http://127.0.0.1:8090">
<title>持仓</title>
<style>
body{margin:0;background:#EEF0F3}
a{color:inherit}
button,input,textarea{font:inherit}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
.up{color:#B42318}.dn{color:#1E6B44}
.seg{display:flex;border:1px solid #DDE1E7;border-radius:8px;overflow:hidden}
.seg button{height:28px;padding:0 12px;white-space:nowrap;border:none;border-right:1px solid #DDE1E7;background:#FFFFFF;color:#3A4250;font-size:12px;cursor:pointer}
.seg button:last-child{border-right:none}
.seg button[aria-pressed="true"]{background:#14171F;color:#FFFFFF}
.mini{height:28px;padding:0 10px;border:1px solid #DDE1E7;border-radius:8px;background:#FFFFFF;color:#2457D6;font-size:12px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;text-decoration:none;box-sizing:border-box}
.mini:hover{border-color:#2457D6}
.btn{height:32px;padding:0 12px;border:1px solid #DDE1E7;border-radius:8px;background:#FFFFFF;font-size:13px;cursor:pointer;white-space:nowrap}
.btn.pri{border:none;background:#2457D6;color:#FFFFFF}
.btn:disabled{opacity:.5;cursor:default}
.pl{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;font-size:12px;font-weight:600;white-space:nowrap}
.tag{display:inline-flex;align-items:center;align-self:flex-start;height:18px;padding:0 6px;border-radius:4px;font-size:11px;font-weight:600;line-height:18px;white-space:nowrap}
.nav-a{width:48px;min-height:48px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#5B6372;text-decoration:none;font-size:13px}
.nav-a.on{color:#2457D6;background:#EAF0FD;font-weight:500}
.card{display:flex;flex-direction:column;gap:10px;padding:14px 16px;background:#FFFFFF;border:1px solid #E3E6EB;border-radius:14px}
.card h3{margin:0;font-size:15px;font-weight:700}
.sub{font-size:12px;color:#8A919E}
.lbl{font-size:11px;color:#8A919E}
.tab{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 2px;border:none;background:transparent;font-size:14px;color:#5B6372;cursor:pointer}
.tab[aria-selected="true"]{color:#2457D6;font-weight:600;box-shadow:inset 0 -2px 0 #2457D6}
.tab .n{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:12px;color:#8A919E}
.grid-h{display:grid;grid-template-columns:132px 150px 80px minmax(0,1fr) minmax(0,1fr) 96px 64px;gap:14px;align-items:center}
.hrow{padding:12px 16px;border-top:1px solid #EEF0F3;cursor:pointer;color:#14171F}
.hrow:hover{background:#F7F8FA}
.hrow.sel{background:#F1F5FE}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-top:1px solid #F4F5F7;font-size:13px}
.kv span{color:#5B6372}
.note{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-radius:10px;background:#F7F8FA}
.warnbox{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:8px;background:#FFF8EC;font-size:12px;color:#3A4250}
.inp{width:100%;min-height:34px;padding:7px 10px;border:1px solid #DDE1E7;border-radius:8px;box-sizing:border-box;font-size:13px;color:#14171F;line-height:1.5;background:#FFFFFF}
.inp:focus{outline:none;border-color:#2457D6}
.chip{height:26px;padding:0 10px;border-radius:999px;border:1px solid #DDE1E7;background:#FFFFFF;color:#3A4250;font-size:12px;cursor:pointer;box-sizing:border-box}
.chip.on{border-color:#2457D6;background:#EAF0FD;color:#2457D6}
.flag{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.6}
.bar{height:10px;border-radius:5px;background:#F1F2F4;overflow:hidden}
.bar>i{display:block;height:100%}
.empty{padding:36px 20px;text-align:center;color:#5B6372;display:flex;flex-direction:column;align-items:center;gap:12px}
.skeleton{color:#8A919E;padding:24px 0}
.x{border:none;background:transparent;color:#8A919E;cursor:pointer;font-size:14px;padding:0 4px}
.x:hover{color:#B42318}
table.tb{width:100%;border-collapse:collapse}
table.tb th{padding:6px 4px;font-size:11px;font-weight:500;color:#8A919E;text-align:left;white-space:nowrap}
table.tb td{padding:8px 4px;border-top:1px solid #F1F2F4;font-size:12px;vertical-align:top}
#aside{overflow-x:hidden}
.pf-item{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid #F1F2F4}
.pf-item summary{cursor:pointer;list-style:none;font-size:12px;color:#8A919E}
.pf-item summary::-webkit-details-marker{display:none}
.chk-det{padding:0}
.chk-det>summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:10px;padding:13px 16px}
.chk-det>summary::-webkit-details-marker{display:none}
.chk-det>summary::after{content:'›';margin-left:auto;color:#8A919E;font-size:16px;transition:transform .15s}
.chk-det[open]>summary::after{transform:rotate(90deg)}
.chk-det>.in{display:flex;flex-direction:column;gap:8px;padding:0 16px 14px}
.todo{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-top:1px solid #F1F2F4}
.todo .n{flex:none;width:22px;height:22px;border-radius:50%;background:#14171F;color:#FFFFFF;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.dw{flex:0 0 384px;width:384px}
@media (min-width:1400px){.dw{flex-basis:422px;width:422px}}
.toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);z-index:60;padding:9px 16px;border-radius:8px;background:#14171F;color:#FFFFFF;font-size:13px;max-width:80vw}
.toast.err{background:#B42318}
</style>
</head>
<body>
<div style="height:100vh;overflow:hidden;display:flex;flex-direction:column;background:#EEF0F3;font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif;color:#14171F;font-size:13px;line-height:1.55">
<header style="flex:none;display:flex;align-items:center;height:44px;background:#FFFFFF;border-bottom:1px solid #DDE1E7">
<div style="flex:0 0 64px;display:flex;align-items:center;justify-content:center;border-right:1px solid #EEF0F3;height:44px">
<div style="width:28px;height:28px;border-radius:8px;background:#2457D6;display:flex;align-items:center;justify-content:center">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l5-5 4 4 8-8"></path><path d="M15 8h5v5"></path></svg>
</div>
</div>
<span style="padding:0 16px;font-weight:700;font-size:14px">持仓</span>
<div style="margin-left:auto;display:flex;align-items:center;gap:14px;padding-right:16px">
<span id="session" style="display:flex;align-items:center;gap:6px;font-size:14px;color:#5B6372"></span>
<button type="button" id="bell" data-act="notif" aria-label="通知" title="通知" style="position:relative;width:32px;height:32px;border:none;border-radius:8px;background:transparent;color:#3A4250;cursor:pointer;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg><span id="bellDot" hidden style="position:absolute;top:2px;right:1px;min-width:16px;height:16px;padding:0 4px;box-sizing:border-box;border-radius:999px;background:#D9483F;color:#FFFFFF;font-size:10px;font-weight:600;line-height:16px;text-align:center"></span></button>
</div>
</header>
<div style="flex:1 1 auto;display:flex;flex-wrap:nowrap;align-items:stretch;min-width:0;min-height:0;overflow:hidden;position:relative">
<nav aria-label="主导航" style="flex:0 0 64px;overflow:hidden;background:#FFFFFF;border-right:1px solid #DDE1E7;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 0">
<a class="nav-a" href="/market.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20h18"></path><path d="M5 16l4-5 4 3 6-7"></path></svg>市场</a>
<a class="nav-a" href="/"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-4.5-4.5"></path></svg>诊断</a>
<a class="nav-a on" href="/holdings.html" aria-current="page"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16v12H4z"></path><path d="M8 7V5h8v2"></path></svg>持仓</a>
<a class="nav-a" href="/scan.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"></rect><path d="M8 10h8M8 14h5"></path></svg>战绩</a>
<a class="nav-a" href="/tasks.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M12 8v4l3 2"></path></svg>任务</a>
<a class="nav-a" href="/dialog.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg>问问</a>
<a class="nav-a" href="/settings.html" style="margin-top:auto"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>设置</a>
</nav>
<main style="flex:999 1 640px;min-width:0;display:flex;flex-direction:column;overflow:hidden;position:relative">
<div style="flex:none;padding:12px 28px 0;background:#FFFFFF;border-bottom:1px solid #DDE1E7">
<div style="max-width:1240px">
<div id="head" style="display:flex;align-items:center;gap:22px;flex-wrap:wrap"></div>
<div id="tabs" role="tablist" aria-label="持仓" style="display:flex;align-items:center;gap:24px;margin-top:6px"></div>
</div>
</div>
<div id="scroll" style="flex:1;min-height:0;overflow-y:auto;padding:16px 28px 24px;box-sizing:border-box">
<div id="body" style="max-width:1240px;display:flex;flex-direction:column;gap:14px"><div class="skeleton">正在取现价、AI 判断和板块…第一次会稍久，之后很快。</div></div>
</div>
</main>
<aside id="aside" class="dw" aria-label="详情" style="align-self:stretch;overflow-y:auto;background:#FFFFFF;border-left:1px solid #DDE1E7;box-sizing:border-box;font-size:13px"></aside>
</div>
<footer style="flex:none;height:26px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:18px;padding:0 12px;border-top:1px solid #DDE1E7;background:#FFFFFF;font-size:13px;color:#5B6372;white-space:nowrap;overflow:hidden">
<div style="display:flex;align-items:center;gap:18px;min-width:0;overflow:hidden"><span style="display:flex;align-items:center;gap:6px"><span id="dot" style="width:7px;height:7px;border-radius:50%;background:#A1A7B2"></span><span id="status">正在连接</span></span><span id="footIndexes" style="display:flex;gap:18px"></span></div>
<span role="note" style="text-align:center">研究分析，不构成投资建议</span>
<div style="display:flex;align-items:center;justify-content:flex-end;gap:18px;min-width:0;overflow:hidden"><span>数据源：行情 · 资金流 · 公告</span><span>v0.1</span></div>
</footer>
</div>
<div id="modal"></div>
<div id="sectorPop" role="dialog" aria-label="板块详情" hidden style="position:fixed;z-index:40;width:400px;max-width:calc(100vw - 24px);max-height:min(70vh,560px);overflow:auto;padding:14px 16px;background:#FFFFFF;border:1px solid #C9CED6;border-radius:12px;box-shadow:0 12px 32px rgba(20,23,31,0.16);flex-direction:column;gap:12px;display:none"></div>
<script>
const API = (new URLSearchParams(location.search).get('stockApi') || (document.querySelector('meta[name="stock-api-base"]') || {}).content || 'http://127.0.0.1:8090').replace(/\/$/, '');
const S = { tab: 'now', summary: null, tabs: {}, sel: null, detail: {}, notif: false, nData: null, nTab: 'all', rec: null, add: null, busy: {} };
const TAB_NAMES = [['buy', '想买'], ['now', '持有'], ['chk', '体检'], ['rev', '复盘']];

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (id) => document.getElementById(id);
const MONO = 'class="mono"';
const cls = (v) => v > 0 ? 'up' : v < 0 ? 'dn' : '';
const sign = (v) => v > 0 ? '+' : v < 0 ? '−' : '';
const money = (v, signed) => v == null || v !== v ? '—' : (signed ? sign(v) : v < 0 ? '−' : '') + Math.abs(Math.round(v)).toLocaleString('en-US');
const pct = (v, d, signed) => v == null || v !== v ? '—' : (signed === false ? '' : sign(v)) + Math.abs(v * 100).toFixed(d == null ? 1 : d) + '%';
const px = (v) => v == null ? '—' : Number(v).toFixed(2);
const day5 = (d) => (d || '').slice(5);
const codeOnly = (c) => (c || '').split('.')[0];
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };

const LEAN_STYLE = { bullish: ['#FDF0EF', '#B42318'], bearish: ['#EDF7F1', '#1E6B44'], unclear: ['#F1F2F4', '#3A4250'] };
const VERDICT_STYLE = { '三层同向': ['#FDF0EF', '#B42318'], '有钱没热度': ['#EAF0FD', '#2457D6'], '只热不增': ['#FFF1D6', '#7A4A00'], '在流出': ['#EDF7F1', '#1E6B44'] };
const REASON_STYLE = { ok: ['#EDF7F1', '#1E6B44', '✓ 还成立'], doubt: ['#FFF1D6', '#7A4A00', '? 存疑'], broken: ['#FFE0B2', '#8A3B00', '✕ 不成立'], none: ['#F1F2F4', '#5B6372', '没写理由'] };
const TONE_STYLE = { good: ['#FDF0EF', '#B42318'], bad: ['#EDF7F1', '#1E6B44'], warn: ['#FFF1D6', '#7A4A00'], flat: ['#F1F2F4', '#5B6372'], blue: ['#EAF0FD', '#2457D6'] };
const LEVEL_STYLE = { '注意': ['#FFF1D6', '#7A4A00'], '正常': ['#EDF7F1', '#1E6B44'], '提示': ['#F1F2F4', '#5B6372'] };

const pill = (text, style) => '<span class="pl" style="background:' + style[0] + ';color:' + style[1] + '">' + esc(text) + '</span>';
const yi = (v, signed) => {
  if (v == null || v !== v) return '—';
  const a = Math.abs(v), body = a >= 10000 ? (a / 10000).toFixed(2) + ' 万亿' : a.toFixed(a >= 100 ? 0 : 1) + ' 亿';
  return signed ? (v > 0 ? '+' : v < 0 ? '−' : '') + body : body;
};
const num = (v, d, signed) => { if (v == null || v !== v) return '—'; return (signed && v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(d); };
const mzNum = (v) => {
  if (v == null || v !== v) return '—';
  if (typeof v === 'number') { const a = Math.abs(v); return (v > 0 ? '+' : v < 0 ? '−' : '') + a.toFixed(a >= 10 ? 0 : 1); }
  const s = String(v).trim();
  if (!s || s.indexOf('基线不足') >= 0 || s === '没有') return '—';
  return s.replace(/^Mz\s*/, '');
};
const srate = (v, d) => v == null ? '—' : (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v * 100).toFixed(d == null ? 1 : d) + '%';
function sectorBtn(name, style) {
  if (!name) return '';
  return '<button type="button" data-act="secpop" data-name="' + esc(name) + '" title="看板块详情" style="border:none;background:transparent;padding:0;font:inherit;color:#2457D6;cursor:pointer;' + (style || 'font-size:12px;font-weight:600') + '">' + esc(name) + '</button>';
}
const aiPill = (ai) => ai ? pill(ai.label, LEAN_STYLE[ai.lean] || LEAN_STYLE.unclear) : pill('还没有判断', LEAN_STYLE.unclear);
const aiAnalystChips = (ai) => {
  const list = ai && Array.isArray(ai.analysts) ? ai.analysts : [];
  if (!list.length) return '';
  return '<span style="display:flex;flex-wrap:wrap;gap:4px">' + list.map((a) => {
    const style = LEAN_STYLE[a.lean] || LEAN_STYLE.unclear;
    const tip = (a.short || a.name || '') + ' · ' + (a.label || '—');
    return '<span class="pl" title="' + esc(tip) + '" style="background:' + style[0] + ';color:' + style[1] + '">' + esc(a.short || a.name || a.id || '') + '</span>';
  }).join('') + '</span>';
};
const verdictPill = (sector) => sector && sector.verdict ? pill(sector.verdict, VERDICT_STYLE[sector.verdict] || TONE_STYLE.flat) : '';
const reasonPill = (status) => pill(REASON_STYLE[status || 'none'][2], REASON_STYLE[status || 'none']);
const diagnoseHref = (code) => '/?stock=' + encodeURIComponent(code);

/* ---------- 请求 ---------- */
async function api(path, method, body) {
  const res = await fetch('/api/v1/holdings' + path, { method: method || 'GET', headers: body ? { 'Content-Type': 'application/json' } : undefined, body: body ? JSON.stringify(body) : undefined });
  let json = {};
  try { json = await res.json(); } catch (e) { /* 没有正文 */ }
  if (!res.ok) throw new Error(json.error || '请求失败（' + res.status + '）');
  return json;
}
function toast(text, bad) {
  const el = document.createElement('div');
  el.className = 'toast' + (bad ? ' err' : '');
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), bad ? 4500 : 2200);
}
function setStatus(ok, text) { $('dot').style.background = ok ? '#2E8B57' : '#B42318'; $('status').textContent = text; }

/* ---------- 头部、页签 ---------- */
// 总资金：你自己填的一个数；有了它，每只票占多少、总仓位多少才算得出来
function capitalStat(h) {
  const lbl = (t) => '<span class="lbl">' + t + '</span>';
  if (!h.capital) return '<span style="display:flex;flex-direction:column">' + lbl('总资金') + '<button type="button" class="mini" data-act="capital" title="填一个总资金，就能看到每只票占多少、总仓位多少">设置总资金</button></span>';
  const over = h.over ? ' <span style="color:#B42318;font-size:11px">超出总资金</span>' : '';
  return '<span style="display:flex;flex-direction:column">' + lbl('总资金 <button type="button" class="x" data-act="capital" title="改总资金" style="font-size:11px;color:#2457D6">编辑</button>') + '<b ' + MONO + ' style="font-size:16px;font-weight:600">' + money(h.capital) + '</b></span>' +
    '<span style="display:flex;flex-direction:column">' + lbl('仓位') + '<b ' + MONO + ' style="font-size:16px;font-weight:600">' + (h.invested_pct * 100).toFixed(1) + '%</b></span>' +
    '<span style="display:flex;flex-direction:column">' + lbl('现金') + '<b ' + MONO + ' style="font-size:16px;font-weight:600;color:' + (h.cash < 0 ? '#B42318' : '#14171F') + '">' + money(h.cash) + '</b>' + over + '</span>';
}
function renderHead() {
  const s = S.summary, h = s ? s.header : null;
  const stat = (label, body) => '<span style="display:flex;flex-direction:column"><span class="lbl">' + label + '</span>' + body + '</span>';
  const big = 'font-family:\'IBM Plex Mono\',monospace;font-weight:700;font-size:16px';
  $('head').innerHTML = '<h1 style="margin:0;font-size:20px;font-weight:700">持仓</h1>' +

function placePop(pop, btn) {
  const r = btn.getBoundingClientRect();
  const box = pop.getBoundingClientRect();
  let left = r.left, top = r.bottom + 8;
  if (left + box.width > window.innerWidth - 12) left = window.innerWidth - 12 - box.width;
  if (top + box.height > window.innerHeight - 12) top = Math.max(12, r.top - 8 - box.height);
  pop.style.left = Math.max(12, left) + 'px';
  pop.style.top = top + 'px';
}

  };
  const tab = (id, label, on) => '<button type="button" data-sectab="' + id + '" style="height:28px;padding:0 10px;border:none;border-radius:6px;font:inherit;font-size:12px;cursor:pointer;' + (on ? 'background:#EEF3FF;color:#2457D6;font-weight:600' : 'background:transparent;color:#5B6372') + '">' + label + '</button>';
  const stocks = '<div><div style="display:flex;align-items:center;gap:4px;padding-bottom:2px">' + tab('gainers', '领涨', true) + tab('leaders', '龙头', false) +
    '<span data-sectabhint style="margin-left:auto;font-size:11px;color:#8A919E">当日涨幅靠前</span></div>' +
    '<div data-sectabpanel="gainers">' + stockRows(d.gainers || [], 'gainers') + '</div>' +
    '<div data-sectabpanel="leaders" hidden>' + stockRows(d.leaders, 'leaders') + '</div></div>';
  return '<div style="display:flex;align-items:center;gap:8px"><b style="font-size:16px">' + esc(d.name) + '</b>' + (d.phase ? pill(d.phase, TONE_STYLE[d.tone] || TONE_STYLE.flat) : '') + '<button type="button" data-closesector="1" aria-label="关闭" style="margin-left:auto;width:28px;height:28px;border:none;border-radius:6px;background:transparent;color:#5B6372;font-size:18px;cursor:pointer">×</button></div>' +
    (d.why ? '<p style="margin:0;font-size:13px;line-height:1.6;color:#3A4250">' + esc(d.why) + '</p>' : '') +
    '<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">' +
      '<div style="padding:8px 10px;border-radius:8px;background:#F7F8FA"><span style="font-size:11px;color:#8A919E">钱 Mz</span><b ' + MONO + ' class="' + cls(d.money_z) + '" style="display:block;font-size:16px;margin-top:2px">' + mz + '</b></div>' +
      '<div style="padding:8px 10px;border-radius:8px;background:#F7F8FA"><span style="font-size:11px;color:#8A919E">超额 Mz</span><b ' + MONO + ' class="' + cls(d.price_z) + '" style="display:block;font-size:16px;margin-top:2px">' + price + '</b></div>' +
      '<div style="padding:8px 10px;border-radius:8px;background:#F7F8FA"><span style="font-size:11px;color:#8A919E">热度</span><b ' + MONO + ' style="display:block;font-size:16px;margin-top:2px">' + heat + '</b></div>' +
    '</div>' +
    (bits.length ? '<span style="font-size:12px;color:#5B6372">' + esc(bits.join(' · ')) + '</span>' : '') +
    '<div><div style="font-size:12px;font-weight:700;color:#5B6372;padding-bottom:2px">代表 ETF</div>' + etfs + '</div>' +
    stocks +
    (d.note ? '<span style="font-size:11px;color:#8A919E;line-height:1.5">' + esc(d.note) + '</span>' : '') +
    '<a class="mini" href="/market.html" style="align-self:flex-start">去市场页看板块 →</a>';
}
async function openSectorPop(btn) {
  const name = btn.dataset.name || btn.dataset.secpop;
  if (!name) return;
  const pop = $('sectorPop');
  pop.hidden = false;
  pop.style.display = 'flex';
  pop.innerHTML = '<div class="skeleton">正在取 ' + esc(name) + ' …</div>';
  placePop(pop, btn);
  try {
    const res = await fetch(API + '/api/v1/market/sector/' + encodeURIComponent(name));
    const body = await res.json();
    if (!res.ok || body.error) throw new Error(body.error || res.status);
    pop.innerHTML = sectorPopHtml(body);
    placePop(pop, btn);
  } catch (err) {
    pop.innerHTML = '<div style="display:flex;align-items:center"><b>没有取到</b><button type="button" data-closesector="1" style="margin-left:auto;border:none;background:transparent;font-size:18px;color:#5B6372;cursor:pointer">×</button></div><span style="font-size:13px;color:#5B6372">' + esc(err.message || '稍后重试') + '</span>';
  }
}
let nItemTimer = 0;
document.addEventListener('input', (e) => { const f = e.target && e.target.dataset && e.target.dataset.pf; if (f) S.pf[f] = e.target.value; });
document.addEventListener('keydown', (e) => { const f = e.target && e.target.dataset && e.target.dataset.pf; if (f === 'ask' && e.key === 'Enter' && !e.isComposing) { e.preventDefault(); ACT.pfask(); } });
document.addEventListener('click', (e) => {
  if (e.target.closest('#sectorPop')) {
    if (e.target.closest('[data-closesector]')) { closeSectorPop(); return; }
    const tab = e.target.closest('[data-sectab]');
    if (tab) {
      const id = tab.dataset.sectab;
      const pop = $('sectorPop');
      pop.querySelectorAll('[data-sectab]').forEach((el) => {
        const on = el.dataset.sectab === id;
        el.style.background = on ? '#EEF3FF' : 'transparent';
        el.style.color = on ? '#2457D6' : '#5B6372';
        el.style.fontWeight = on ? '600' : '400';
      });
      pop.querySelectorAll('[data-sectabpanel]').forEach((el) => { el.hidden = el.dataset.sectabpanel !== id; });
      const hint = pop.querySelector('[data-sectabhint]');
      if (hint) hint.textContent = id === 'leaders' ? '成分流通市值最大' : '当日涨幅靠前';
      return;
    }
    if (e.target.closest('a')) return;
    return;
  }
  if (!e.target.closest('[data-act="secpop"]')) closeSectorPop();
  const el = e.target.closest('[data-act]');
  if (!el || el.tagName === 'A' || e.target.closest('a')) return;
  if (el.tagName === 'INPUT' && el.type === 'checkbox') return;   // 复选框走 change
  const fn = ACT[el.dataset.act];
  if (fn) fn(el, e);
});
document.addEventListener('dblclick', (e) => {
  const el = e.target.closest('[data-act="nsel"]');
  if (!el || !S.notif) return;
  clearTimeout(nItemTimer);
  e.preventDefault();
  S.notif = false; updateBell(); renderAside();
});
document.addEventListener('change', (e) => { const el = e.target; if (el.tagName === 'INPUT' && el.type === 'checkbox' && el.dataset.act && ACT[el.dataset.act]) ACT[el.dataset.act](el, e); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (!$('sectorPop').hidden) { closeSectorPop(); return; }
    if ($('modal').innerHTML) closeModal();
    else if (S.notif) ACT.notif();
  }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.hrow')) { e.preventDefault(); ACT.sel(e.target); }
});

/* ---------- 加载与渲染 ---------- */
async function loadDetail(code) {
  try { S.detail[code] = await api('/stock/' + encodeURIComponent(code)); } catch (e) { S.detail[code] = null; if (S.sel === code) S.sel = null; toast(e.message, true); }
  if (!S.notif) renderAside();
}
function selectStock(code) {
  S.sel = code; S.notif = false; updateBell();
  if (S.tab === 'chk') { S.tab = 'now'; renderTabs(); renderBody(); }
  if (S.tab === 'now') $('body').innerHTML = renderNow();
  renderAside();
  if (!S.detail[code]) loadDetail(code);
}
function renderBody() {
  const t = S.tab;
  renderAside();
  if (t === 'now') $('body').innerHTML = S.summary ? renderNow() : '';
  else if (S.tabs[t]) $('body').innerHTML = t === 'buy' ? renderBuy(S.tabs[t]) : t === 'chk' ? renderCheck(S.tabs[t]) : renderReview(S.tabs[t]);
  else $('body').innerHTML = '<div class="skeleton">正在整理…</div>';
}
async function showTab(t, force) {
  if (t !== 'now' && (force || !S.tabs[t])) {
    renderBody();
    try { S.tabs[t] = await api('/tab/' + t); } catch (e) { $('body').innerHTML = '<div class="card"><span style="color:#B42318">' + esc(e.message) + '</span></div>'; return; }
  }
  if (S.tab === t) renderBody();
}
async function refreshAll() {
  try {
    S.summary = await api('/summary');
    setStatus(true, '已连接 · 现价约 10 秒缓存');
  } catch (e) { setStatus(false, '后端没连上：' + e.message); $('body').innerHTML = '<div class="card"><b>持仓接口没有响应</b><span class="sub">' + esc(e.message) + '。持仓在本机的 Go 服务里算，市场数据来自 ' + esc(API) + '（可以用 ?stockApi= 指定）。</span></div>'; return; }
  if (S.sel && !S.summary.rows.some((r) => r.ts_code === S.sel)) S.sel = null;
  if (!S.sel && S.summary.rows.length) S.sel = S.summary.rows[0].ts_code;
  renderHead(); renderTabs();
  await showTab(S.tab, S.tab !== 'now');
  if (S.sel) { if (!S.detail[S.sel]) loadDetail(S.sel); }
  renderAside();
  loadQuality();
  loadPortfolio();
  loadNotif().then(() => { updateBell(); if (S.notif) renderAside(); });
}
async function loadNotif() { try { S.nData = await api('/notifications'); } catch (e) { S.nData = S.nData || { items: [], unread: 0 }; } updateBell(); }
function updateBell() {
  const n = S.nData ? S.nData.unread : 0;
  $('bellDot').hidden = !n; $('bellDot').textContent = n > 99 ? '99+' : n;
  $('bell').style.background = S.notif ? '#EAF0FD' : 'transparent';
}
function tickClock() {
  const d = new Date(), t = d.getHours() * 60 + d.getMinutes(), wk = d.getDay() > 0 && d.getDay() < 6;
  const live = wk && ((t >= 570 && t <= 690) || (t >= 780 && t <= 900));
  $('session').innerHTML = '<span style="width:7px;height:7px;border-radius:50%;background:' + (live ? '#2E8B57' : '#A1A7B2') + '"></span>' + (live ? '交易中' : wk ? '已休市' : '休市日') + ' · 行情 <span ' + MONO + '>' + [d.getHours(), d.getMinutes(), d.getSeconds()].map((n) => String(n).padStart(2, '0')).join(':') + '</span>';
}
setInterval(tickClock, 1000); tickClock();
async function loadIndexes() {
  try {
    const j = await (await fetch(API + '/api/v1/market/summary')).json();
    $('footIndexes').innerHTML = (j.indexes || []).map((r) => '<span>' + esc(r.name) + ' <span ' + MONO + ' class="' + cls(r.pct) + '">' + Number(r.close).toFixed(2) + ' ' + (r.pct == null ? '' : sign(r.pct) + Math.abs(r.pct).toFixed(2) + '%') + '</span></span>').join('');
  } catch (e) { /* 指数取不到不影响持仓 */ }
}
// 每 20 秒刷新一次现价（只在交易时间、窗口可见、没有弹窗时）
setInterval(() => { const d = new Date(), t = d.getHours() * 60 + d.getMinutes(), wk = d.getDay() > 0 && d.getDay() < 6; if (wk && ((t >= 570 && t <= 690) || (t >= 780 && t <= 900)) && !document.hidden && !$('modal').innerHTML && S.tab === 'now') { api('/summary').then((s) => { S.summary = s; renderHead(); renderTabs(); renderBody(); }).catch(() => {}); } }, 20000);
refreshAll().then(loadIndexes);
</script>
