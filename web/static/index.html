    root.innerHTML = list.map((s) => {
      const sel = s.ts_code === state.stock, sub = s.subtitle || {}, diag = s.computing || rediag[s.ts_code];
      const ok = num(s.price) != null, pct = num(s.change_pct);
      return '<a role="button" tabindex="0" class="wl" data-click="pickStock" data-code="' + esc(s.ts_code) + '"' + (isAttention(s) ? '' : ' draggable="true" data-drop="1"') + (sel ? ' aria-current="true"' : '') +
        ' style="cursor:pointer;' + (sel ? 'background:' + SOFT : '') + '"><span>' + esc(s.name || s.ts_code) + '</span>' +
        '<span class="px">' + (ok ? s.price.toFixed(2) : '—') + '</span>' +
        '<span class="chg ' + (pct > 0 ? 'up' : pct < 0 ? 'dn' : '') + '">' + (pct != null ? fmtSigned(pct, 2) + '%' : '') + '</span>' +
        '<span class="sub' + (sub.tone === 'warn' && !diag ? ' warn' : '') + '">' + (diag ? '<span class="dc-spin" style="display:inline-block;margin-right:4px;color:#2457D6">⟳</span>诊断中…' : esc(sub.text || '')) + '</span>' +
        '<button type="button" class="wl-x" data-click="unwatch" data-code="' + esc(s.ts_code) + '" title="移出自选" aria-label="移出自选">×</button></a>';
    }).join('');
  }

  // ---- 当前股票 ----
  function renderHead() {
    const root = document.getElementById('stockHead');
    if (!root) return;
    const st = curStock(), q = quoteOf(st.code);
    // 首页上面的结论是主分析师的裁决（chief/stream 的主持卡），不是综合判断接口里的那句规则摘要。
    const ch = chats[st.code], res = ch && ch.results.chief;
    const card = res && res.msg;
    const verdict = card ? { label: card.verdict || '不明', text: card.text || '', color: DIRECTION_COLOR(card.verdict) } : null;
    const phase = !ch ? '' : card ? 'done' : res ? 'failed' : 'waiting';
    const we = wishCache[st.code], pe = planCache[st.code] && planCache[st.code].plan;
    if (verdict && (!we || !we.checked) && (!we || (we.status !== 'loading' && we.status !== 'adding'))) loadWishStatus(st.code);
    const key = [st.code, st.name, q && q.price, q && q.pct, phase, verdict && verdict.label, verdict && verdict.text, state.concl, we && we.status, pe && pe.wish, pe && pe.held].join('|');
    if (root.dataset.key === key) return;
    root.dataset.key = key;
    root.innerHTML = '<div style="display:flex;align-items:center;gap:12px;min-height:34px;padding:0 4px;white-space:nowrap">' +
      '<h1 style="margin:0;flex:none;font-size:20px;font-weight:700">' + esc(st.name || st.code) + '</h1>' +
      '<span style="' + MONO + ';flex:none;color:#5B6372;font-size:15px">' + esc(st.code) + '</span>' +
      '<span style="' + MONO + ';flex:none;font-size:20px;font-weight:600">' + (q ? q.price.toFixed(2) : '—') + '</span>' +
      (q && q.pct != null ? '<span style="' + MONO + ';flex:none;font-size:14px;color:' + moveColor(q.pct) + '">' + (q.chg != null ? fmtSigned(q.chg, 2) + ' ' : '') + fmtSigned(q.pct, 2) + '%</span>' : '') +
      (phase ? '<span style="flex:none;width:1px;height:22px;background:#DDE1E7;margin:0 2px"></span>' + avatarHTML('chief', 24) +
        (verdict ? '<span style="flex:none;font-size:17px;font-weight:700;color:' + verdict.color + '">' + esc(verdict.label) + '</span>' +
          '<span title="' + esc(verdict.text) + '" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:14px;font-weight:600">' + esc(verdict.text) + '</span>' +
          '<span style="flex:none;display:inline-flex;align-items:center;gap:6px">' + wishBtnHTML(st.code) +
          '<button type="button" class="mini" data-click="toggleConcl" style="height:28px;color:#2457D6">' + '结论详情 →' + '</button></span>'
          : phase === 'failed' ? '<span style="flex:1;min-width:0;font-size:15px;color:#8A919E">主分析师这次没有给出裁决，点“重新分析”再试一次</span>'
          : '<span style="flex:1;min-width:0;display:inline-flex;align-items:center;gap:8px;font-size:15px;color:#8A919E"><span class="typing" aria-hidden="true"><i></i><i></i><i></i></span>结论正在生成…</span>')
        : '<span style="flex:1"></span>') +
      '<button type="button" class="mini" data-click="reanalyze" style="flex:none;height:28px;color:#2457D6">重新分析</button>' +
      '<a href="/scan.html" title="在战绩中心查看这只股票的全部研判" style="flex:none;display:flex;align-items:baseline;gap:6px;font-size:15px;text-decoration:none;color:#5B6372">战绩<span style="color:#2457D6">→</span></a></div>';
  }

  // ---- 问问 ----
  function renderAsk() {
    if (!document.getElementById('askTag')) return;
    syncAskTarget();
  }

  // ---- 右侧 6 个方面的标签 / 折叠栏 ----
  const DIM5 = [['fund', 'Fund', '基本面', 'fundamental', '基'], ['fin', 'Fin', '财报', 'finance', '财'], ['flow', 'Flow', '资金流', 'volume_flow', '资'],
    ['news', 'News', '新闻', 'news', '新'], ['sector', 'Sector', '板块', 'sector', '板'], ['over', 'Over', '海外', null, '海']];
  const LEAN_DOT = { bullish: '#D9483F', bearish: '#2E8B57' };
  const HEAD_TONE_DOT = { support: LEAN_DOT.bullish, warn: LEAN_DOT.bearish, neutral: '#A1A7B2' };
  function dimState(code, key) {
    if (key === '__concl') {
      const c = chats[code], msg = c && c.results && c.results.chief && c.results.chief.msg, v = (msg && msg.verdict) || '';
      return v ? { color: /多/.test(v) ? LEAN_DOT.bullish : /空/.test(v) ? LEAN_DOT.bearish : '#A1A7B2', title: '主分析师：' + v } : { ring: true, title: '主分析师还在等各位发言' };
    }
    if (!key) return { ring: true, title: '海外映射暂未接入' };
    const D = synthInfo(code);
    if (!D) {
      const e = synthCache[code];
      return { ring: true, title: e && e.status === 'loading' ? '分析中' : e && e.status === 'error' ? '诊断失败' : '点开这只股票后开始分析' };
    }
    // 资金流、新闻、基本面、财报、板块的标签跟各自详情里的结论走：偏多红、偏空绿、不明灰；还在分析时先灰着。详情没加载前用综合诊断里的。
    const own = { volume_flow: 'flow', news: 'news', fundamental: 'fund', finance: 'fin', sector: 'sector' }[key];
    if (own) {
      const fe = dimCache[own + ':' + code];
      const cc = fe && fe.status === 'done' && fe.data ? analystConclusionOf(fe.data) : null;
      if (cc) return { color: cc.pending ? '#A1A7B2' : HEAD_TONE_DOT[cc.status] || '#A1A7B2', title: cc.pending ? '分析中' : cc.text };
    }
    const side = (D.sides || []).find((item) => item.key === key);
    if (!side) return { ring: true, title: '没有这个方面的结论' };
    return { color: HEAD_TONE_DOT[side.status] || '#A1A7B2', title: side.status_text || '' };
  }
  function renderTabs() {
    const code = curStock().code, tabs = document.getElementById('drawerTabs'), rail = document.getElementById('railDots');
    const states = DIM5.map((d) => dimState(code, d[3]));
    const key = [code, state.drawer, states.map((s) => s.color || 'ring' + s.title).join(',')].join('|');
    if (tabs && tabs.dataset.key !== key) {
      tabs.dataset.key = key;
      tabs.innerHTML = DIM5.map((d, i) => {
        const s = states[i], on = state.drawer === d[0];
        return '<button type="button" class="dtab" role="tab" aria-pressed="' + on + '" title="' + esc(s.title) + '" data-click="open' + d[1] + '"' +
          (on ? ' style="color:' + BR + ';font-weight:600;box-shadow:inset 0 -2px 0 ' + BR + '"' : '') + '>' + d[2] +
          '<span aria-hidden="true" style="display:inline-block;width:7px;height:7px;border-radius:2px;margin-left:5px;vertical-align:1px;' +
          (s.ring ? 'box-sizing:border-box;border:1.5px solid #C9CED6' : 'background:' + s.color) + '"></span></button>';
      }).join('');
    }
    if (rail && rail.dataset.key !== key) {
      rail.dataset.key = key;
      rail.innerHTML = DIM5.map((d, i) => {
        const s = states[i];
        return '<button type="button" title="' + esc(d[2] + (s.title ? ' · ' + s.title : '')) + '" data-click="open' + d[1] + '" style="display:flex;flex-direction:column;align-items:center;gap:3px;width:32px;padding:6px 0;border:none;border-radius:6px;background:transparent;font:inherit;font-size:13px;color:#5B6372;cursor:pointer">' +
          '<span style="width:10px;height:10px;border-radius:3px;' + (s.ring ? 'box-sizing:border-box;border:1.5px solid #C9CED6' : 'background:' + s.color) + '"></span>' + d[4] + '</button>';
      }).join('');
    }
  }

  function renderChrome() {
    if (watchState.status === 'done' && !watchItem(state.stock)) ensureQuote(state.stock);
    renderWatch(); renderHead(); renderAsk(); renderTabs(); renderSearch();
  }

  // ---- 搜索（GET /api/v1/stocks/search?q=）：名称包含或代码前缀 ----
  const srch = { q: '', hits: [], sel: 0, wasOpen: false, timer: null, seq: 0, loading: false, error: '' };
  const inWatch = (code) => !!watchItem(code);
  const watchHits = () => watchState.items.map((s) => ({ ts_code: s.ts_code, name: s.name, industry: '' }));
  function searchRemote(q) {
    const mine = ++srch.seq;
    srch.loading = true; srch.error = '';
    fetchStockJSON(API_BASE + '/api/v1/stocks/search?q=' + encodeURIComponent(q)).then((body) => {
      if (mine !== srch.seq) return;
      srch.hits = Array.isArray(body.items) ? body.items : [];
      srch.sel = 0;
    }).catch((err) => { if (mine === srch.seq) { srch.hits = []; srch.error = err.message || '搜索失败'; } })
      .finally(() => { if (mine === srch.seq) { srch.loading = false; renderSearch(); } });
  }
  function onSearchInput(q) {
    srch.q = q; srch.sel = 0;
    clearTimeout(srch.timer);
    srch.seq++;
    if (!q.trim()) { srch.hits = watchHits(); srch.loading = false; srch.error = ''; renderSearch(); return; }
    srch.loading = true;
    srch.timer = setTimeout(() => searchRemote(q.trim()), 250);
    renderSearch();
  }
  function renderSearch() {
    const root = document.getElementById('srchResults');
    if (!root || !state.srch) return;
    const key = [srch.sel, srch.q, srch.loading, srch.error].concat(srch.hits.map((h) => h.ts_code + ':' + inWatch(h.ts_code))).join('|');
    if (root.dataset.key === key) return;
    root.dataset.key = key;
    const note = (t) => '<div style="padding:18px 12px;color:#8A919E;font-size:15px">' + t + '</div>';
    if (srch.error) { root.innerHTML = note('搜索失败：' + esc(srch.error)); return; }
    if (!srch.hits.length) { root.innerHTML = note(srch.loading ? '搜索中…' : srch.q.trim() ? '没有找到“' + esc(srch.q.trim()) + '”。可以输入股票名称的一部分，或代码开头。' : '输入股票名称或代码'); return; }
    root.innerHTML = (srch.q.trim() ? '' : '<div style="padding:4px 12px 6px;font-size:13px;font-weight:600;color:#8A919E">我的自选</div>') + srch.hits.map((h, i) => {
      const added = inWatch(h.ts_code);
      return '<div style="display:flex;align-items:center;gap:8px;padding:4px 6px 4px 4px;border-radius:8px;' + (i === srch.sel ? 'background:#F4F5F7' : '') + '">' +
        '<button type="button" data-click="srchOpen" data-code="' + esc(h.ts_code) + '" data-name="' + esc(h.name || '') + '" title="打开诊断" style="flex:1;min-width:0;display:grid;grid-template-columns:auto auto 1fr;align-items:baseline;gap:2px 10px;padding:6px 8px;border:none;background:transparent;font:inherit;color:#14171F;text-align:left;cursor:pointer">' +
        '<span style="font-weight:500">' + esc(h.name || h.ts_code) + '</span><span style="' + MONO + ';font-size:14px;color:#8A919E">' + esc(h.ts_code) + '</span>' +
        '<span style="font-size:14px;color:#8A919E;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(h.industry || '') + '</span></button>' +
        (i === srch.sel ? '<span class="kbd">Enter 打开诊断</span>' : '') +
        (added ? '<span class="instar">✓ 已加入</span>' : '<button type="button" class="mini" data-click="srchAdd" data-code="' + esc(h.ts_code) + '" style="height:26px;min-width:76px;color:#2457D6">+ 自选</button>') + '</div>';
    }).join('');
  }
  function syncSearchOpen() {
    const open = !!state.srch;
    if (open && !srch.wasOpen) {
      srch.q = ''; srch.sel = 0; srch.seq++; srch.loading = false; srch.error = ''; srch.hits = watchHits();
      const input = document.getElementById('srchInput');
      if (input) { input.value = ''; setTimeout(() => input.focus(), 0); }
      const root = document.getElementById('srchResults');
      if (root) delete root.dataset.key;
    }
    srch.wasOpen = open;
  }

  document.addEventListener('input', (e) => { if (e.target.id === 'srchInput') onSearchInput(e.target.value); });
  document.addEventListener('keydown', (e) => {
    if (e.target.id === 'srchInput') {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        if (srch.hits.length) srch.sel = (srch.sel + (e.key === 'ArrowDown' ? 1 : srch.hits.length - 1)) % srch.hits.length;
        renderSearch();
      } else if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) {
        e.preventDefault();
        const hit = srch.hits[srch.sel];
        if (!hit) return;
        if (e.metaKey || e.ctrlKey) addWatch(hit.ts_code); else { openStock(hit.ts_code, hit.name); set({ srch: '' }); render(); }
      }
      return;
    }
    const row = e.target.closest && e.target.closest('.wl[data-code]');
    if (row && e.target === row && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); row.click(); }
  });
  actions.reanalyze = () => reanalyze(state.stock);
  actions.pickStock = (el) => openStock(el.dataset.code);
  actions.srchOpen = (el) => { openStock(el.dataset.code, el.dataset.name); set({ srch: '' }); };
  actions.srchAdd = (el) => { addWatch(el.dataset.code); };

  function tickClock() {
    const el = document.getElementById('session');
    if (!el) return;
    const d = new Date(), t = d.getHours() * 60 + d.getMinutes(), wk = d.getDay() > 0 && d.getDay() < 6;
    const live = wk && ((t >= 570 && t <= 690) || (t >= 780 && t <= 900));
    const clock = [d.getHours(), d.getMinutes(), d.getSeconds()].map((n) => String(n).padStart(2, '0')).join(':');
    el.innerHTML = '<span style="width:7px;height:7px;border-radius:50%;background:' + (live ? '#2E8B57' : '#A1A7B2') + '"></span>' +
      (live ? '交易中' : wk ? '已休市' : '休市日') + ' · 行情 <span style="' + MONO + '">' + clock + '</span>';
  }
  function footIndexColor(pct) {
    return pct > 0 ? '#B42318' : pct < 0 ? '#1E6B44' : '#5B6372';
  }
  function footIndexSign(pct) {
    return pct > 0 ? '+' : pct < 0 ? '−' : '';
  }
  async function loadIndexes() {
    const dot = document.getElementById('dot');
    const status = document.getElementById('status');
    const box = document.getElementById('footIndexes');
    if (!box) return;
    try {
      const j = await fetchStockJSON(API_BASE + '/api/v1/market/summary');
      const want = ['上证', '深成', '创业板'];
      const rows = j.indexes || [];
      const pick = want.map((w) => rows.find((r) => String(r.name).indexOf(w) >= 0)).filter(Boolean);
      box.innerHTML = (pick.length ? pick : rows.slice(0, 3)).map((r) => {
        const pct = r.pct;
        return '<span>' + esc(r.name) + ' <span style="' + MONO + ';color:' + footIndexColor(pct) + '">' +
          Number(r.close).toFixed(2) + ' ' + (pct == null ? '' : footIndexSign(pct) + Math.abs(pct).toFixed(2) + '%') + '</span></span>';
      }).join('');
      if (dot) dot.style.background = '#2E8B57';
      if (status) status.textContent = j.generated_at ? ('数据时间 ' + j.generated_at) : '已连接';
    } catch (e) {
      if (dot) dot.style.background = '#D9483F';
      if (status) status.textContent = '没有连上行情服务';
    }
  }
  setInterval(tickClock, 1000);
  tickClock();
  loadIndexes();
  setInterval(() => { if (!document.hidden) loadIndexes(); }, 60000);

  loadWatch();
  loadNotif();

  render();
})();

</script>
</body>
</html>
