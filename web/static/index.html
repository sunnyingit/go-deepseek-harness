body{margin:0;background:#ffffff}
a{color:inherit}
.wl{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:baseline;gap:4px 10px;padding:10px 12px;border-radius:6px;text-decoration:none;color:#14171F;font-size:15px}
.wl:hover{background:#F4F5F7}

.wl:hover::before,.wl:hover+.wl::before,.wl[aria-current]::before,.wl[aria-current]+.wl::before{background:transparent}

.wl .chg{min-width:52px}
.wl .up{color:#B42318}
.wl .dn{color:#1E6B44}
.wl .sub{grid-column:1/-1;font-size:14px;color:#8A919E}
.wl .sub.warn{color:#9A5B00}
.wl .wl-x{position:absolute;right:8px;bottom:7px;display:none;width:20px;height:20px;padding:0;border:none;border-radius:5px;background:#EEF0F3;color:#5B6372;font:inherit;font-size:14px;line-height:20px;cursor:pointer}
.wl:hover .wl-x,.wl:focus-within .wl-x{display:block}
.wl .wl-x:hover{background:#E3E6EB;color:#B42318}

.wl.drop-top{box-shadow:inset 0 2px 0 #2457D6}
.wl.drop-bot{box-shadow:inset 0 -2px 0 #2457D6}
#wlMenu{position:fixed;z-index:60;min-width:184px;padding:6px;background:#FFFFFF;border:1px solid #DDE1E7;border-radius:12px;box-shadow:0 10px 28px -8px rgba(20,23,31,.28),0 2px 6px rgba(20,23,31,.06);display:flex;flex-direction:column;animation:askpop .12s ease-out}
.wlm-it{display:flex;align-items:center;gap:20px;width:100%;height:30px;padding:0 10px;border:none;border-radius:8px;background:transparent;font:inherit;font-size:15px;color:#14171F;cursor:pointer;text-align:left}
.wlm-it.on{background:#EAF0FD}
.wlm-it.danger{color:#B42318}
.wlm-k{margin-left:auto;font-size:14px;color:#8A919E}
.wlm-sep{height:1px;margin:5px 6px;background:#E3E6EB}
#toast.has-act{pointer-events:auto}
.toast-act{padding:0;border:none;background:transparent;color:#9DB3E3;font:inherit;cursor:pointer;text-decoration:underline}
.seg{display:flex;border:1px solid #DDE1E7;border-radius:8px;overflow:hidden}
.seg button{height:28px;padding:0 10px;border:none;border-right:1px solid #DDE1E7;background:#FFFFFF;color:#3A4250;font-family:inherit;font-size:14px;cursor:pointer}
.seg button:last-child{border-right:none}
.seg button[aria-pressed="true"]{background:#14171F;color:#FFFFFF}
.mini{height:30px;padding:0 12px;border:1px solid #C9CED6;border-radius:6px;background:#FFFFFF;color:inherit;font-family:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;background:#EEF0F3;color:#4A5260;font-size:14px;white-space:nowrap}
.opt{display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid #DDE1E7;border-radius:999px;background:#FFFFFF;cursor:pointer;font-size:15px}
.dtab{flex:none;height:44px;padding:0 5px;border:none;background:transparent;color:#5B6372;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
.dtab:hover{color:#14171F}
.drow{display:grid;grid-template-columns:52px 112px minmax(0,1fr);align-items:center;gap:8px;width:100%;height:36px;padding:0 14px 0 20px;border:none;background:transparent;color:#14171F;font:inherit;font-size:15px;text-align:left;cursor:pointer}
.drow:hover{background:#F4F5F7}
.drow .tg{font-size:14px;color:#5B6372;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qchip{height:26px;padding:0 10px;border:1px solid #DDE1E7;border-radius:999px;background:#FFFFFF;color:#3A4250;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
.qchip:hover{border-color:#C9CED6;background:#F7F8FA}
.cp{border:none;background:transparent;color:#8A919E;font:inherit;font-size:12px;cursor:pointer;padding:2px 8px;border-radius:6px;white-space:nowrap}
.cp:hover{background:#EEF0F3;color:#3A4250}
.msg .cpm{opacity:0;transition:opacity .12s}
.msg:hover .cpm,.msg:focus-within .cpm{opacity:1}
.sq{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:6px 12px;border:1px solid #C9D7F5;border-radius:999px;background:#F5F8FF;color:#2457D6;font:inherit;font-size:14px;line-height:1.45;text-align:left;cursor:pointer}
.sq:hover{background:#EAF0FD;border-color:#2457D6}
.sq:disabled{opacity:.5;cursor:default}
.mdt th,.mdt td{transition:background .1s}
.mdt tbody tr:hover td{background:#FAFBFD}
.kbd{flex:none;font-size:13px;color:#8A919E;white-space:nowrap}
.instar{min-width:76px;text-align:center;font-size:14px;color:#8A919E}
.nav-a{width:48px;min-height:48px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#5B6372;text-decoration:none;font-size:13px}
.nav-a:hover{color:#14171F;background:#D8D8D8}
.nav-a.on{color:#2457D6;background:#EAF0FD;font-weight:500}
.dim{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:10px;font-family:inherit;text-align:left}
sc-if{display:contents}
sc-if[hidden]{display:none}
.ask2{position:relative;container-type:inline-size}
.ask-card{box-sizing:border-box;display:flex;align-items:center;gap:8px;min-height:40px;padding:4px 5px 4px 12px;border:1px solid #DDE1E7;border-radius:12px;background:#FFFFFF;
  box-shadow:0 1px 2px rgba(20,23,31,.04),0 4px 12px -8px rgba(20,23,31,.12);cursor:text;transition:border-color .15s,box-shadow .15s}
.ask-card:focus-within{border-color:#2457D6;box-shadow:0 0 0 3px rgba(36,87,214,.12),0 4px 12px -8px rgba(20,23,31,.14)}
.ask-card.locked{background:#F4F5F7;cursor:not-allowed;box-shadow:none}
.ask-card.locked:focus-within{border-color:#DDE1E7;box-shadow:none}
.ask-card.locked .ask-input{cursor:not-allowed}
.ask-tag{flex:none;background:#EAF0FD;color:#1F3F8A;font-size:14px;font-weight:600}
.ask-input{flex:1;min-width:0;border:none;outline:none;resize:none;background:transparent;font:inherit;font-size:15px;color:#14171F;
  box-sizing:border-box;height:28px;padding:3px 0;line-height:1.6;min-height:28px;max-height:120px;overflow-y:auto;scrollbar-width:thin}
.ask-input::placeholder{color:#9AA3B2}
.ask-kbd{flex:none;font-size:13px;color:#A1A7B2;white-space:nowrap;opacity:0;transition:opacity .15s}
.ask-card:focus-within .ask-kbd{opacity:1}
@container (max-width:420px){.ask-kbd{display:none}}
.ask-send{flex:none;width:28px;height:28px;border:none;border-radius:50%;background:#C9CED6;color:#FFFFFF;cursor:default;display:flex;align-items:center;justify-content:center;transition:background .15s,transform .1s}
.ask-send.ready{background:#2457D6;cursor:pointer}
.ask-send.ready:hover{background:#1D47B8}
.ask-send.ready:active{transform:scale(.93)}
.ask-pop{position:absolute;left:0;right:0;bottom:calc(100% + 8px);z-index:20;padding:6px;max-height:280px;overflow-y:auto;background:#FFFFFF;border:1px solid #DDE1E7;border-radius:12px;
  box-shadow:0 10px 28px -10px rgba(20,23,31,.28),0 2px 6px rgba(20,23,31,.06);animation:askpop .14s ease-out}
.ask-pop[hidden]{display:none}
@keyframes askpop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ask-pop-head{display:flex;align-items:baseline;gap:8px;padding:4px 8px 6px;font-size:13px;font-weight:600;color:#5B6372}
.ask-pop-head span{margin-left:auto;font-weight:400;color:#A1A7B2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ask-sug{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border:none;border-radius:8px;background:transparent;color:#3A4250;font:inherit;font-size:15px;text-align:left;cursor:pointer}
.ask-sug:hover,.ask-sug:focus{background:#F4F7FE;color:#1F3F8A;outline:none}
.ask-go{margin-left:auto;color:#9DB3E3;opacity:0;transition:opacity .12s}
.ask-sug:hover .ask-go,.ask-sug:focus .ask-go{opacity:1}
.ask-input::placeholder{color:#8A919E}
button[data-ask-send][disabled]{opacity:.55;cursor:progress}
#toast{position:fixed;left:50%;bottom:72px;transform:translateX(-50%) translateY(12px);opacity:0;
  pointer-events:none;transition:opacity .2s,transform .2s;background:#14171F;color:#fff;
  padding:8px 16px;border-radius:8px;font-size:15px;z-index:50}
#toast.show{opacity:1;transform:translateX(-50%)}
@keyframes dcspin{to{transform:rotate(360deg)}}
@keyframes skp{50%{opacity:.45}}
.sk{border-radius:6px;background:#E8EAEE;animation:skp 1.2s ease-in-out infinite}
.dc-spin{display:inline-block;animation:dcspin 1s linear infinite}
@media (prefers-reduced-motion:reduce){.dc-spin{animation:none}}
.nl{color:inherit;text-decoration:none}
.nl:hover{text-decoration:underline}
.mk{cursor:pointer;outline:none}
.mk:hover .dot,.mk:focus .dot{stroke:#14171F;stroke-width:2}
.chart-tip{position:absolute;z-index:5;width:max-content;max-width:250px;pointer-events:none;background:#14171F;color:#FFFFFF;font-size:14px;line-height:1.55;border-radius:6px;padding:7px 10px;box-shadow:0 4px 12px rgba(20,23,31,.25)}
.chart-tip[hidden]{display:none}
.dw{flex:0 0 384px;width:384px}
@media (min-width:1400px){.dw{flex-basis:422px;width:422px}}
.tip{position:relative;display:inline-block;cursor:help;outline:none}
.tip-pop{display:none;position:absolute;left:0;top:calc(100% + 8px);z-index:20;width:300px;max-width:84vw;padding:12px 14px;border-radius:8px;background:#14171F;color:#FFFFFF;font-size:14px;line-height:1.6;box-shadow:0 6px 18px rgba(20,23,31,.28)}
.tip:hover .tip-pop,.tip:focus .tip-pop,.tip:focus-within .tip-pop{display:block}
.facts>summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;background:#F4F5F7;color:#5B6372;font-size:14px;line-height:20px;white-space:nowrap;user-select:none}
.facts>summary::-webkit-details-marker{display:none}
.facts>summary:hover,.facts[open]>summary{background:#E9EBEF;color:#14171F}
.facts-pop{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:20;max-height:min(420px,60vh);overflow-y:auto;overflow-x:hidden;padding:12px 14px;border-radius:8px;background:#FFFFFF;border:1px solid #E4E6EA;box-shadow:0 6px 18px rgba(20,23,31,.14);font-size:14px;color:#5B6372}
.tools{align-self:flex-start;max-width:100%}
.tools>summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;background:#F7F8FA;color:#8A919E;font-size:12px;line-height:18px;white-space:nowrap;user-select:none}
.tools>summary::-webkit-details-marker{display:none}
.tools>summary:hover,.tools[open]>summary{background:#EEF0F3;color:#5B6372}
.tools-body{margin-top:6px;padding:8px 10px;border-radius:8px;background:#F7F8FA;border:1px solid #EEF0F3;display:flex;flex-direction:column;gap:4px;font-size:12px;color:#5B6372;line-height:1.45}
.acc{border-top:1px solid #F1F2F4}
.acc-list>.acc:first-child{border-top:none}
.acc>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:9px 0;user-select:none}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary::after{content:'›';flex:none;margin-left:auto;color:#A1A7B2;font-size:16px;line-height:1;transition:transform .15s}
.acc[open]>summary::after{transform:rotate(90deg)}
.acc-body{display:flex;flex-direction:column;gap:8px;padding:0 0 12px}
.av{position:relative;flex:none;display:block;border-radius:50%;overflow:hidden}
.av svg{display:block;width:100%;height:100%}
.ev{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border:1px solid #DDE1E7;border-radius:999px;background:#F7F8FA;color:#3A4250;font:inherit;font-size:14px;cursor:pointer}
.ev:hover{background:#EAF0FD;border-color:#9DB3E3;color:#1F3F8A}
.typing{display:inline-flex;gap:4px;padding:4px 2px}
.typing i{width:6px;height:6px;border-radius:50%;background:#A1A7B2;animation:blink 1.2s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.18s}
.typing i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.chart-tip div.tt{display:block;margin-right:0}
.chart-tip .tt{display:inline-block;margin-right:8px;color:#A1A7B2;font-family:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:13px}
</style>

<div style="position: sticky; top: 0; z-index: 2; background: #FFFFFF; border-bottom: 1px solid #E3E6EB; padding: 0 8px 0 12px; display: flex; align-items: center"><div role="tablist" id="drawerTabs" aria-label="6 个方面" style="display: flex; gap: 0; overflow-x: auto"></div><button type="button" aria-label="收起（⌘\）" title="收起（⌘\）" data-click="closeDrawer" style="margin-left: auto; flex: none; width: 28px; height: 28px; border: none; border-radius: 6px; background: transparent; color: #5B6372; font: inherit; font-size: 16px; cursor: pointer">⇥</button></div>
<div style="padding: 20px 28px 28px; display: flex; flex-direction: column; gap: 24px; flex: 1">
<sc-if data-if="conclOpen">
<div id="conclPanel" style="display: contents"></div>
</sc-if>
<sc-if data-if="flowOpen">
<div id="flowRoot" style="display: contents"></div>
</sc-if>
<sc-if data-if="newsOpen">
<div id="newsRoot" style="display: contents"></div>
</sc-if>
<sc-if data-if="sectorOpen">
<div id="sectorRoot" style="display: contents"></div>
</sc-if>
<sc-if data-if="finOpen">
<div id="finRoot" style="display: contents"></div>
</sc-if>
<sc-if data-if="fundOpen">
<div id="fundRoot" style="display: contents"></div>
</sc-if>
<sc-if data-if="overOpen">
<div style="display: flex; flex-direction: column; gap: 6px"><div style="display: flex; align-items: baseline; gap: 10px"><span style="font-size: 18px; font-weight: 700; color: #3A4250">开发中</span><span style="font-size: 14px; color: #8A919E">对标：[美股 / 韩股同行]</span></div><span style="font-size: 15px; color: #5B6372">完成后结论会自动更新，这里会显示详细依据</span></div>
<div style="display: flex; flex-direction: column"><span style="font-weight: 600; padding-bottom: 4px">海外映射会回答</span><div style="display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; padding: 9px 0; border-top: 1px solid #F1F2F4"><span style="color: #A1A7B2">1</span><span>海外同行昨夜涨跌了多少</span></div><div style="display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; padding: 9px 0; border-top: 1px solid #F1F2F4"><span style="color: #A1A7B2">2</span><span>这只股票平时跟它们跟得紧不紧</span></div><div style="display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; padding: 9px 0; border-top: 1px solid #F1F2F4"><span style="color: #A1A7B2">3</span><span>A 股是不是已经提前反应了</span></div></div>
</sc-if>
<span style="margin-top: auto; padding-top: 8px; font-size: 13px; color: #A1A7B2">按 1–7 切换 · ⌘\ 收起</span>
</div>
</aside>
</sc-if>
<sc-if data-if="railOpen">
<aside aria-label="6 个方面（已收起）" style="flex: 0 0 44px; width: 44px; align-self: stretch; background: #FFFFFF; border-left: 1px solid #DDE1E7; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0"><button type="button" aria-label="展开（⌘\）" title="展开（⌘\）" data-click="unfold" style="width: 28px; height: 28px; border: none; border-radius: 6px; background: transparent; color: #5B6372; font: inherit; font-size: 16px; cursor: pointer">⇤</button><span id="railDots" style="display: contents"></span></aside>
</sc-if>
</div>

<footer style="flex: none; height: 26px; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 18px; padding: 0 12px; border-top: 1px solid #DDE1E7; background: #FFFFFF; font-size: 13px; color: #5B6372; white-space: nowrap; overflow: hidden"><div style="display: flex; align-items: center; gap: 18px; min-width: 0; overflow: hidden"><span style="display: flex; align-items: center; gap: 6px"><span id="dot" style="width: 7px; height: 7px; border-radius: 50%; background: #A1A7B2"></span><span id="status">正在连接</span></span><span id="footIndexes" style="display: flex; gap: 18px"></span></div><span role="note" style="text-align: center">研究分析，不构成投资建议</span><div style="display: flex; align-items: center; justify-content: flex-end; gap: 18px; min-width: 0; overflow: hidden"><span>数据源：行情 · 资金流 · 公告</span><span>v0.1</span></div></footer>
<sc-if data-if="srchOpen">
<button type="button" aria-label="关闭" data-click="closeSearch" style="position: fixed; inset: 0; z-index: 20; border: none; padding: 0; background: rgba(20, 23, 31, 0.22); cursor: default"></button>
<div role="dialog" aria-label="搜索股票" style="position: fixed; top: 64px; left: 50%; transform: translateX(-50%); z-index: 21; width: 640px; max-width: calc(100% - 32px); background: #FFFFFF; border: 1px solid #C9CED6; border-radius: 12px; overflow: hidden; box-shadow: 0 12px 32px rgba(20, 23, 31, 0.18)">
<div style="display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid #EEF0F3"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#5B6372" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-4.5-4.5"></path></svg><input type="text" id="srchInput" autocomplete="off" aria-label="输入股票名称或代码" placeholder="输入股票名称或代码，如 三花 / 002050" style="flex: 1; border: none; outline: none; font: inherit; font-size: 15px; color: #14171F; background: transparent"><button type="button" aria-label="关闭" title="关闭" data-click="closeSearch" style="flex: none; width: 28px; height: 28px; border: none; border-radius: 6px; background: transparent; color: #5B6372; font: inherit; font-size: 18px; line-height: 1; cursor: pointer">×</button></div>
<div id="srchResults" style="padding: 6px; max-height: 360px; overflow-y: auto"></div>
<div style="display: flex; gap: 16px; padding: 9px 16px; border-top: 1px solid #EEF0F3; background: #F7F8FA; font-size: 14px; color: #5B6372"><span>↑↓ 选择</span><span>Enter 打开诊断</span><span>⌘Enter 加自选，可以连续加</span><span style="margin-left: auto">Esc 关闭</span></div>
</div>
</sc-if>


</div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(function () {
  'use strict';

  // State and derived values mirror the design component's renderVals()
  // (default "蓝色" theme). Everything except the ask box is presentational.
  const BR = '#2457D6';
  const SOFT = '#EAF0FD';
  const DRAWERS = [['concl', 'Concl'], ['fund', 'Fund'], ['fin', 'Fin'], ['flow', 'Flow'], ['news', 'News'], ['sector', 'Sector'], ['over', 'Over']];
  // ---- 自选股 ----
  // The list lives on the server (GET / POST / DELETE /api/v1/watchlist). Only the selected stock is remembered here.
  const keep = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* ignore */ } },
  };
  const watchState = { status: 'loading', items: [], error: null };
  const opened = {}; // stocks opened from search that are not on the list: code -> { name, code }
  const watchItem = (code) => watchState.items.find((s) => s.ts_code === code);
  // 从别的页面点「诊断 →」过来：地址里带 ?stock=代码，直接定位到这只票。读完就把参数从地址里去掉，
  // 以后在页面里换了股票、再刷新，不会又跳回这一只。
  const urlStock = (() => {
    try {
      const raw = new URLSearchParams(location.search).get('stock');
      const code = raw && raw.trim().toUpperCase();
      return code && /^([0-9]{6}\.(SH|SZ|BJ)|[0-9]{5}\.HK)$/.test(code) ? code : null;
    } catch (e) { return null; }
  })();
  let urlPending = !!urlStock;   // 自选读回来之后，这只票不在自选里就加进去
  if (urlStock) {
    keep.set('diag.stock', urlStock);
    try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) { /* ignore */ }
  }
  const state = {
    stock: urlStock || keep.get('diag.stock') || '002430.SZ', drawer: 'sector', fold: true, notif: false, nData: null, nTab: 'alert', srch: '', concl: false, replyTo: 'chief',
  };
  function curStock() {
    const code = state.stock, it = watchItem(code);
    if (it) return { name: it.name, code: code };
    if (opened[code]) return opened[code];
    const e = typeof synthCache !== 'undefined' ? synthCache[code] : null;
    return { name: (e && e.data && e.data.stock_name) || '', code: code };
  }
  function scrollMainToTop() {
    const root = document.getElementById('chatRoot');
    let p = root && root.parentElement;
    while (p && p.scrollHeight <= p.clientHeight + 2) p = p.parentElement;
    if (p) p.scrollTop = 0;
  }
  function openStock(code, name) {
    const switched = state.stock !== code;
    if (switched) abandonChat(state.stock);
    if (!watchItem(code) && (!opened[code] || name)) opened[code] = { name: name || (opened[code] || {}).name || '', code: code };
    if (switched) scrollMainToTop();
    state.stock = code;
    state.concl = false;
    keep.set('diag.stock', code);
    try {
      const nm = name || (curStock().name) || '';
      document.title = nm ? ('AI 研判 · ' + nm) : 'AI 研判';
    } catch (e) {}
    if (!switched) return;
    state.replyTo = 'chief';
    document.querySelectorAll('.ask-input').forEach((ta) => {
      ta.value = '';
      autosize(ta);
      syncReady(ta);
    });
    syncAskTarget();
    closePops();
  }

  function derive() {
    const d = state.drawer;
    const nt = state.notif;
    const tab = (k) => (d === k ? 'color:' + BR + ';font-weight:600;box-shadow:inset 0 -2px 0 ' + BR : '');
    const flags = {
      drawerOpen: !nt && !state.fold, railOpen: !nt && state.fold, notifOpen: nt,
      srchOpen: !!state.srch,
    };
    const dyn = {};
    const pressed = {};
    DRAWERS.forEach(([k, K]) => {
      dyn['t' + K] = tab(k);
      pressed['p' + K] = String(d === k);
    });
    flags.newsOpen = d === 'news';
    flags.conclOpen = d === 'concl';
    flags.flowOpen = d === 'flow';
    flags.fundOpen = d === 'fund';
    flags.finOpen = d === 'fin';
    flags.sectorOpen = d === 'sector';
    flags.overOpen = d === 'over';
    return { flags, dyn, pressed };
  }

  const set = (patch) => Object.assign(state, patch);
  const actions = {
    openSearch: () => set({ srch: 'go' }),
    closeSearch: () => set({ srch: '' }),
    toggleNotif: () => {
      const open = !state.notif;
      set({ notif: open });
      if (open) loadNotif();
    },
    closeDrawer: () => set({ fold: true }),
    unfold: () => set({ fold: false }),
  };
  DRAWERS.forEach(([k, K]) => {
    actions['open' + K] = () => set({ drawer: k, notif: false, fold: false });
  });
  // 大盘结论对齐市场页，不另开个股侧栏面板。
  actions.openMarket = () => {
    const c = chats[state.stock];
    if (c && c.liveDiag && !c.restored) { toast('诊断还在直播，先等这轮说完再去市场页'); return; }
    location.href = '/market.html';
  };

  const root = document.documentElement;
  document.querySelectorAll('[data-dyn]').forEach((el) => {
    el.dataset.base = el.getAttribute('style') || '';
  });

  function render() {
    const v = derive();
    document.querySelectorAll('sc-if').forEach((el) => {
      const name = el.dataset.if;
      if (!(name in v.flags)) console.warn('unknown sc-if flag:', name);
      el.hidden = !v.flags[name];
    });
    document.querySelectorAll('[data-dyn]').forEach((el) => {
      el.style.cssText = el.dataset.base + ';' + (v.dyn[el.dataset.dyn] || '');
    });
    document.querySelectorAll('[data-pressed]').forEach((el) => {
      el.setAttribute('aria-pressed', v.pressed[el.dataset.pressed]);
    });
    root.style.setProperty('--notif-bg', state.notif ? SOFT : 'transparent');
    if (state.notif) renderNotifDrawer();
    updateBell();
    renderDims();
    renderChat();
    renderConcl();
    renderConclPanel();
    renderChrome();
    syncSearchOpen();
    renderSearch();
  }

  const NOTIF_TABS = [['alert', '提醒'], ['change', '判断'], ['settle', '战绩'], ['system', '系统']];
  const NOTIF_ALERT_KINDS = { alert: 1, upcoming: 1, move: 1, ann: 1 };
  const NOTIF_ICON = { alert: ['🔔', '#FDECEA'], change: ['⇄', '#FFF4E0'], upcoming: ['📅', '#F1F2F4'], settle: ['★', '#EDF7F1'], ann: ['📢', '#F1F2F4'], move: ['📈', '#F1F2F4'], system: ['⚙', '#F1F2F4'] };
  function notifMatch(tab, kind) {
    if (tab === 'alert') return !!NOTIF_ALERT_KINDS[kind];
    return kind === tab;
  }
  function updateBell() {
    const el = document.getElementById('bellDot');
    if (!el) return;
    const n = state.nData ? (state.nData.unread || 0) : 0;
    el.hidden = !n;
    el.textContent = n > 99 ? '99+' : (n || '');
  }
  async function loadNotif() {
    try {
      const res = await fetch('/api/v1/holdings/notifications');
      state.nData = await res.json();
    } catch (e) {
      state.nData = state.nData || { items: [], unread: 0 };
    }
    updateBell();
    if (state.notif) renderNotifDrawer();
  }
  async function markNotifRead(ids) {
    const body = ids && ids.length ? JSON.stringify({ ids }) : '{}';
    try {
      await fetch('/api/v1/holdings/notifications/read', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body });
      if (state.nData) {
        const set = ids && ids.length ? new Set(ids) : null;
        let unread = 0;
        (state.nData.items || []).forEach((i) => {
          if (!set || set.has(i.id)) i.unread = false;
          if (i.unread) unread++;
        });
        state.nData.unread = unread;
      }
    } catch (e) { /* ignore */ }
    updateBell();
    if (state.notif) renderNotifDrawer();
  }
  function renderNotifDrawer() {
    const el = document.getElementById('notifDrawer');
    if (!el) return;
    const d = state.nData, tab = state.nTab;
    const items = d ? (d.items || []).filter((i) => notifMatch(tab, i.kind)) : [];
    const groups = ['今天', '即将发生', '昨天', '更早'].map((g) => [g, items.filter((i) => i.group === g)]).filter((x) => x[1].length);
    const body = !d
      ? '<div class="skeleton" style="padding:20px">正在取通知…</div>'
      : groups.length
        ? groups.map(([g, list]) => '<span style="padding:10px 16px 2px 32px;font-size:13px;font-weight:600;color:#8A919E">' + g + '</span>' + list.map((i) => {
            const ic = NOTIF_ICON[i.kind] || ['•', '#F1F2F4'];
            return '<button type="button" data-nsel="1" data-id="' + esc(i.id || '') + '" data-code="' + esc(i.code || '') + '" style="display:grid;grid-template-columns:6px 28px minmax(0,1fr) auto;align-items:start;gap:10px;width:100%;padding:10px 16px;border:none;background:transparent;text-align:left;font:inherit;color:#14171F;cursor:pointer">' +
              (i.unread ? '<span style="width:6px;height:6px;border-radius:50%;background:#D9483F;margin-top:7px"></span>' : '<span style="width:6px"></span>') +
              '<span style="width:28px;height:28px;border-radius:8px;background:' + ic[1] + ';display:flex;align-items:center;justify-content:center;font-size:15px">' + ic[0] + '</span>' +
              '<span style="display:flex;flex-direction:column;gap:2px;min-width:0"><span style="font-size:13px;color:#8A919E">' + esc(i.title) + '</span><span style="font-weight:600">' + esc(i.text) + '</span>' + (i.sub ? '<span style="font-size:14px;color:#5B6372;white-space:pre-line">' + esc(i.sub) + '</span>' : '') + '</span>' +
              '<span style="' + MONO + ';font-size:13px;color:#8A919E">' + esc(i.when || '') + '</span></button>';
          }).join('')).join('')
        : '<div style="padding:28px 20px;color:#8A919E">现在没有通知。到价、AI 改判、披露和解禁这些事会出现在这里。</div>';
    el.innerHTML = '<div style="display:flex;align-items:center;gap:12px;padding:14px 12px 0 20px"><span style="font-size:16px;font-weight:700">通知</span><button type="button" data-nread="1" style="margin-left:auto;font-size:14px;color:#2457D6;border:none;background:transparent;cursor:pointer">全部已读</button><button type="button" aria-label="关闭（Esc）" data-click="toggleNotif" style="width:28px;height:28px;border:none;border-radius:6px;background:transparent;color:#5B6372;font:inherit;font-size:18px;cursor:pointer">×</button></div>' +
      '<div style="display:flex;padding:0 10px;border-bottom:1px solid #EEF0F3">' + NOTIF_TABS.map(([k, n]) => '<button type="button" data-ntab="' + k + '" style="padding:0 10px;height:36px;display:inline-flex;align-items:center;font-size:15px;border:none;background:transparent;cursor:pointer;' + (tab === k ? 'color:#2457D6;font-weight:600;box-shadow:inset 0 -2px 0 #2457D6' : 'color:#5B6372') + '">' + n + '</button>').join('') + '</div>' +
      body +
      '<div style="display:flex;align-items:center;gap:12px;margin-top:auto;padding:12px 20px;border-top:1px solid #EEF0F3;background:#F7F8FA;font-size:14px;color:#5B6372"><span>系统通知 · 仅交易时间提醒</span><a href="/settings.html" style="margin-left:auto;color:#2457D6;text-decoration:none">通知设置</a></div>';
  }

  // ---- toast ----
  const toastEl = document.getElementById('toast');
  let toastTimer = null;
  function toast(msg, act) {
    toastEl.textContent = msg;
    toastEl.classList.toggle('has-act', !!act);
    if (act) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'toast-act'; b.textContent = act.label;
      b.addEventListener('click', () => { toastEl.classList.remove('show'); act.run(); });
      toastEl.appendChild(document.createTextNode('　·　'));
      toastEl.appendChild(b);
    }
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), act ? 6000 : 2400);
  }

  // ---- 问研判群：输入框在页面底部，发出去的话进研判群 ----
  const activeAsk = () => [...document.querySelectorAll('.ask-input')].find((t) => !t.closest('sc-if[hidden]'));

  function autosize(ta) {
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 120) + 'px';
  }

  function syncReady(ta) {
    const card = ta.closest('.ask-card');
    const btn = card && card.querySelector('[data-ask-send]');
    if (btn) btn.classList.toggle('ready', !!ta.value.trim());
  }

  const popOf = (el) => { const w = el && el.closest('.ask2'); return w && w.querySelector('.ask-pop'); };
  // 主分析师裁决回到 results.chief 之后才允许输入。点输入框只在打出 @ 时列分析师。
  function askUnlocked(code) {
    const c = chats[code || state.stock];
    return !!(c && c.results && c.results.chief);
  }
  function syncAskGate() {
    const ready = askUnlocked();
    document.querySelectorAll('.ask-input').forEach((ta) => {
      ta.disabled = !ready;
      ta.placeholder = ready ? '@ 翻起指定的设计师 # 翻起你关注的股票' : '专家团正在分析中';
      ta.setAttribute('aria-disabled', ready ? 'false' : 'true');
    });
    document.querySelectorAll('[data-ask-send]').forEach((btn) => { btn.disabled = !ready; });
    document.querySelectorAll('.ask-card').forEach((card) => { card.classList.toggle('locked', !ready); });
    if (!ready) closePops();
  }
  function mentionPopHTML(frag) {
    const list = MENTIONABLE.filter((k) => !frag || ROLE[k].name.indexOf(frag) >= 0 || ROLE[k].short.indexOf(frag) >= 0);
    return list.length ? '<div class="ask-pop-head">@ 选择分析师<span>↑↓ 选择 · 回车插入 · Esc 关闭</span></div>' + list.map((k) =>
      '<button type="button" class="ask-sug" data-ask-mention="' + esc(ROLE[k].name) + '"><span style="display:inline-flex">' + avatarHTML(k, 22) + '</span><span style="font-weight:600">' + esc(ROLE[k].name) +
      '</span><span class="ask-go" aria-hidden="true">↵</span></button>').join('') : '';
  }
  function stockPopHTML(frag) {
    const q = String(frag || '').trim().toLowerCase();
    const list = orderedWatch().filter((s) => {
      if (!q) return true;
      const name = String(s.name || '').toLowerCase();
      const code = String(s.ts_code || '').toLowerCase();
      return name.indexOf(q) >= 0 || code.indexOf(q) >= 0;
    });
    if (!list.length) {
      return '<div class="ask-pop-head"># 你关注的股票</div><div style="padding:12px 10px;font-size:13px;color:#8A919E">' +
        (watchState.items.length ? '没有匹配的自选' : '还没有自选股票') + '</div>';
    }
    return '<div class="ask-pop-head"># 你关注的股票<span>↑↓ 选择 · 回车切换 · Esc 关闭</span></div>' + list.map((s) =>
      '<button type="button" class="ask-sug" data-ask-stock="' + esc(s.ts_code) + '" data-ask-stock-name="' + esc(s.name || '') + '">' +
      '<span style="font-weight:600">' + esc(s.name || s.ts_code) + '</span>' +
      '<span style="margin-left:auto;font-size:12px;color:#8A919E;' + MONO + '">' + esc(s.ts_code) + '</span>' +
      '<span class="ask-go" aria-hidden="true">↵</span></button>').join('');
  }
  function togglePop(ta) {
    const pop = popOf(ta);
    if (!pop || ta.disabled || !askUnlocked()) { if (pop) pop.hidden = true; return; }
    const head = ta.value.slice(0, ta.selectionStart == null ? ta.value.length : ta.selectionStart);
    const m = /(^|\s)@([^\s@#]*)$/.exec(head);
    if (m) {
      const html = mentionPopHTML(m[2]);
      pop.dataset.mode = 'mention';
      pop.innerHTML = html;
      pop.hidden = !html;
      return;
    }

  function insertMention(ta, name) {
    const pos = ta.selectionStart == null ? ta.value.length : ta.selectionStart;
    const head = ta.value.slice(0, pos).replace(/@[^\s@#]*$/, '@' + name + ' ');

    ta.value = head + ta.value.slice(pos);

  const API_BASE = (

  const STEP_DONE_AT_MS = [1200, 3000, Infinity, Infinity];
  // One entry per drawer panel backed by the stock API.

  };
  const dimCache = {}; // 'dim:ts_code' -> { status: 'loading' | 'done' | 'error', startedAt, data, error }
  let dimTimer = null;

  const UP = '#D9483F', UP_TXT = '#B42318', DOWN = '#2E8B57', DOWN_TXT = '#1E6B44', FLAT = '#A1A7B2';
  const MONO = "font-family:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace";
  const ROW = 'border-top:1px solid #F1F2F4';

  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  // 分析师的回答可能带 markdown（标题、列表、表格、引用、分隔线、加粗、斜体、行内代码、链接）。
  // 先把整段文字转义再套标签，任何原始 HTML 都不会放行。
  const mdInline = (src) => String(src == null ? '' : src).split(/(`[^`\n]+`)/).map((seg, i) => {
    if (i % 2) return '<code style="font-family:\'IBM Plex Mono\',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:0.92em;padding:0 4px;border-radius:4px;background:#F1F2F4">' + esc(seg.slice(1, -1)) + '</code>';
    return esc(seg)
      .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a class="nl" href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
      .replace(/\*\*(.+?)\*\*|__(.+?)__/g, (m, a, b) => '<b>' + (a || b) + '</b>')
      .replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\*)/g, '$1<i>$2</i>');
  }).join('');
  // 表格：整体一个圆角框，只留横线；短列、数字列不换行，数字右对齐用等宽字，长文字列留出宽度；右下角能复制成表格数据。
  const isNumCell = (c) => /^[+\-−–]?\s*\d[\d,]*(\.\d+)?\s*(%|亿元|万元|亿|万|元|倍|个点|股|天|日)?$/.test(String(c).replace(/\*\*|`/g, '').trim());
  const mdTable = (rows) => {
    const cols = Math.max.apply(null, rows.map((r) => r.length));
    const info = Array.from({ length: cols }, (_, j) => {
      const cells = rows.slice(1).map((r) => String(r[j] || '').replace(/\*\*|`/g, ''));
      const maxLen = Math.max.apply(null, cells.concat([String(rows[0][j] || '')]).map((c) => c.length));
      const numeric = cells.length > 0 && cells.every((c) => c === '' || c === '—' || c === '-' || isNumCell(c));
      return { numeric: numeric, short: maxLen <= 10, long: maxLen > 28 };
    });
    const cell = (tag, c, j) => {
      const ci = info[j] || {};
      const st = 'padding:8px 12px;vertical-align:top;line-height:1.55;text-align:' + (ci.numeric ? 'right' : 'left') + ';' +
        (ci.short || ci.numeric ? 'white-space:nowrap;' : 'min-width:' + (ci.long ? 260 : 140) + 'px;overflow-wrap:anywhere;') +
        (tag === 'th' ? 'font-size:13px;font-weight:600;color:#5B6372;background:#F7F8FA;white-space:nowrap;' : 'font-size:14px;color:#14171F;border-top:1px solid #EEF0F3;' + (ci.numeric ? MONO + ';' : ''));
      return '<' + tag + ' style="' + st + '">' + mdInline(c == null ? '' : c) + '</' + tag + '>';
    };
    const fill = (r) => Array.from({ length: cols }, (_, j) => r[j] == null ? '' : r[j]);
    const tsv = rows.map((r) => fill(r).map((c) => String(c).replace(/\*\*|`/g, '').replace(/[\t\n]/g, ' ')).join('\t')).join('\n');
    return '<div style="display:flex;flex-direction:column;gap:4px;min-width:0;margin:4px 0">' +
      '<div style="border:1px solid #E3E6EB;border-radius:10px;overflow-x:auto;background:#FFFFFF"><table class="mdt" style="width:100%;border-collapse:collapse">' +
      '<thead><tr>' + fill(rows[0]).map((c, j) => cell('th', c, j)).join('') + '</tr></thead>' +
      '<tbody>' + rows.slice(1).map((r) => '<tr>' + fill(r).map((c, j) => cell('td', c, j)).join('') + '</tr>').join('') + '</tbody></table></div>' +
      '<span style="align-self:flex-end"><button type="button" class="cp" data-click="copyTable" data-tsv="' + esc(tsv) + '" title="复制成表格数据，可以直接贴进表格软件">复制表格</button></span></div>';
  };
  // 资金流等长文分区标题；新文案用中文，旧 Path/Level/Structure 仍识别以免历史气泡掉样式。
  const MD_SEC = /^(?:[*_]{1,2})?\s*(主信号|结论|资金动向|力度强弱|大单是否同向|价和资金是否同向|价资对照|是不是单日脉冲|是否单日脉冲|和板块比|相对板块|位置提示|中期对照|印证与风险|数据质量|Path|Level|Structure)(?:（[^）]*）|\([^)]*\))?\s*(?:[*_]{1,2})?\s*[：:]\s*(.*)$/i;
  const MD_PREAMBLE = /^(?:[*_]{1,2})?\s*(?:数据截至|东财金额分档|分析日期|时间窗口|口径)/;
  const mdSecBlock = (label, body, kind) => {
    const hero = kind === 'hero';
    const end = kind === 'end';
    const lab = hero
      ? 'font-size:13px;font-weight:600;letter-spacing:.02em;color:#1F3F8A'

    const wrap = hero
      ? 'padding:10px 12px;border-radius:10px;background:#F5F8FF;border:1px solid #DCE6FA'
      : end
        ? 'padding:10px 12px;border-radius:10px;background:#F7F8FA;border:1px solid #E8ECF2'
        : 'padding:8px 0 2px;border-top:1px solid #EEF0F3';
    const bodySt = hero
      ? 'margin:0;font-size:17px;font-weight:600;line-height:1.55;color:#14171F;overflow-wrap:anywhere'
      : end
        ? 'margin:0;font-size:16px;font-weight:600;line-height:1.65;color:#14171F;overflow-wrap:anywhere'
        : 'margin:0;font-size:16px;line-height:1.7;color:#14171F;overflow-wrap:anywhere';
    return '<div style="display:flex;flex-direction:column;gap:4px;' + wrap + '"><span style="' + lab + '">' + esc(label) + '</span><p style="' + bodySt + '">' + mdInline(body) + '</p></div>';
  };
  const mdHTML = (raw) => {
    const lines = String(raw == null ? '' : raw).replace(/\r\n?/g, '\n').split('\n');
    const out = [];
    let para = [], list = null, quote = [], table = null, preamble = [];
    const flushPreamble = () => {
      if (!preamble.length) return;
      out.push('<div style="font-size:14px;line-height:1.55;color:#8A919E;overflow-wrap:anywhere">' + preamble.map(mdInline).join('<br>') + '</div>');

    };
    const flush = () => {
      flushPreamble();
      if (para.length) { out.push('<p style="margin:0;overflow-wrap:anywhere">' + para.map(mdInline).join('<br>') + '</p>'); para = []; }

      }
      if (quote.length) { out.push('<div style="padding:6px 10px;border-left:3px solid #C9CED6;border-radius:4px;background:#F7F8FA;color:#5B6372;font-size:15px;overflow-wrap:anywhere">' + quote.map(mdInline).join('<br>') + '</div>'); quote = []; }
      if (table) { if (table.length) out.push(mdTable(table)); table = null; }
    };
    lines.forEach((rawLine, idx) => {
      const line = rawLine.replace(/\s+$/, '');
      let m;
      if (!line.trim()) { flush(); return; }
      // 开头几行元信息：数据截至 / 口径说明，弱化显示（允许前面只有文首标题）
      const onlyTitle = out.length === 1 && /font-weight:700/.test(out[0] || '');
      if (( !out.length || onlyTitle) && !para.length && !list && !quote.length && !table && MD_PREAMBLE.test(line.trim().replace(/\*\*/g, '')) && idx < 8) {
        flushPreamble();

        return;
      }
      if (preamble.length) flushPreamble();
      if ((m = /^\s{0,3}(#{1,6})\s+(.+?)\s*#*\s*$/.exec(line))) {
        flush();
        const rawTitle = m[2].trim();
        const plain = rawTitle.replace(/\*\*|__/g, '').trim();
        const secOnHead = MD_SEC.exec(plain) || /^(主信号|结论)$/i.exec(plain);
        if (secOnHead) {
          const label = secOnHead[1];
          const body = ((secOnHead[2] || '') + '').trim();
          const kind = /^(主信号)$/i.test(label) ? 'hero' : 'end';
          if (body) out.push(mdSecBlock(label, body, kind));
          else out.push('<div style="padding:8px 12px 2px;border-radius:10px 10px 0 0;background:' + (kind === 'hero' ? '#F5F8FF' : '#F7F8FA') + ';border:1px solid ' + (kind === 'hero' ? '#DCE6FA' : '#E8ECF2') + ';border-bottom:none"><span style="font-size:12px;font-weight:600;color:' + (kind === 'hero' ? '#1F3F8A' : '#5B6372') + '">' + esc(label) + '</span></div>');
          return;
        }
        const lv = Math.min(3, m[1].length);
        // 文首股票名标题：略大、无顶部分割线
        const topTitle = !out.length;
        out.push('<div style="font-weight:700;font-size:' + (lv === 1 || topTitle ? 17 : lv === 2 ? 15 : 14) + 'px;line-height:1.4;' + (topTitle ? '' : 'padding-top:8px;border-top:1px solid #EEF0F3;') + 'overflow-wrap:anywhere">' + mdInline(rawTitle) + '</div>');
        return;
      }
      if ((m = MD_SEC.exec(line.trim().replace(/^\*\*|\*\*$/g, '').replace(/\*\*/g, ''))) || (m = /^(主信号|结论|资金动向|力度强弱|大单是否同向|价和资金是否同向|价资对照|是不是单日脉冲|是否单日脉冲|和板块比|相对板块|位置提示|中期对照|印证与风险|数据质量|Path|Level|Structure)$/i.exec(line.trim().replace(/\*\*/g, '')))) {
        flush();
        const label = m[1];
        const body = ((m[2] || '') + '').trim();
        const kind = /^(主信号)$/i.test(label) ? 'hero' : /^(结论)$/i.test(label) ? 'end' : 'sec';
        if (body) out.push(mdSecBlock(label, body, kind));
        else {
          const labColor = kind === 'hero' ? '#1F3F8A' : kind === 'end' ? '#5B6372' : '#8A919E';
          out.push('<div style="padding-top:8px;border-top:1px solid #EEF0F3"><span style="font-size:12px;font-weight:600;color:' + labColor + '">' + esc(label) + '</span></div>');
        }
        return;
      }
      if (/^\s{0,3}([-*_])(\s*\1){2,}\s*$/.test(line)) { flush(); out.push('<hr style="border:none;border-top:1px solid #E3E6EB;margin:6px 0;width:100%">'); return; }

        if (!table) { flush(); table = []; }
        if (!/^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(line)) table.push(line.trim().replace(/^\||\|$/g, '').split('|').map((c) => c.trim()));
        return;
      }
      if ((m = /^\s*>\s?(.*)$/.exec(line))) { if (para.length || list || table) flush(); quote.push(m[1]); return; }
      if ((m = /^\s*([-*+•])\s+(.*)$/.exec(line))) {
        const item = m[2];
        const plainItem = item.replace(/\*\*|__/g, '');
        const sm = MD_SEC.exec(plainItem);
        if (sm) {
          flush();
          const label = sm[1];
          const body = (sm[2] || '').trim() || plainItem.replace(new RegExp('^' + label.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?:（[^）]*）|\\([^)]*\\))?\\s*[：:]\\s*'), '');

          return;
        }
        if (!(list && list.tag === 'ul')) { flush(); list = { tag: 'ul', items: [] }; }
        list.items.push(item);
        return;
      }
      if ((m = /^\s*\d+[.)、]\s+(.*)$/.exec(line))) {
        const item = m[1];
        const plainItem = item.replace(/\*\*|__/g, '');
        const sm = MD_SEC.exec(plainItem);
        if (sm) {
          flush();
          out.push(mdSecBlock(sm[1], (sm[2] || '').trim(), /^(结论)$/i.test(sm[1]) ? 'end' : /^(主信号)$/i.test(sm[1]) ? 'hero' : 'sec'));
          return;
        }
        if (!(list && list.tag === 'ol')) { flush(); list = { tag: 'ol', items: [] }; }
        list.items.push(item);
        return;
      }
      if (list && /^\s{2,}\S/.test(rawLine)) { list.items[list.items.length - 1] += ' ' + line.trim(); return; }
      if (table || quote.length || list) flush();
      para.push(line.trim());
    });
    flush();
    return out.join('');
  };
  // 一段 markdown 放进气泡：块与块之间留 8px。
  // 分析师常在回答末尾写「可以接着问：」加几条列表。把这一段拿出来，做成点一下就能问的小按钮。
  const SUGG_HEAD = /^\s*(?:#{1,6}\s*)?(?:[*_]{1,2})?\s*(?:可以接着问|可以继续问|可以再问|你还可以问|你可以继续问|你可以问|可继续追问|推荐问题?|接着问|追问建议|下一步可以问)\s*(?:[*_]{1,2})?\s*[：:．.：]?\s*(?:[*_]{1,2})?\s*(.*)$/;
  const SUGG_ITEM = /^\s*(?:[-*+•‧·]|\d+[.)、]|[（(]\d+[）)])\s*(.+?)\s*$/;
  const cleanSug = (s) => String(s || '').replace(/\*\*|`/g, '').replace(/^[「『"']|[」』"']$/g, '').trim();
  const sugList = (qs) => (qs || []).map((q) => typeof q === 'string' ? q : (q && (q.question || q.text || q.q || q.focus)) || '').map(cleanSug).filter(Boolean);
  const splitSuggestions = (text) => {
    const raw = String(text == null ? '' : text);
    const lines = raw.replace(/\r\n?/g, '\n').split('\n');
    let at = -1, same = '';
    for (let i = lines.length - 1; i >= 0; i--) {
      const hm = SUGG_HEAD.exec(lines[i]);
      if (!hm) continue;
      at = i;
      same = cleanSug(hm[1] || '');
      // 标题行若吃进了「问题：xxx」，去掉多余的「问题」前缀
      if (/^问题[：:]/.test(same)) same = cleanSug(same.replace(/^问题[：:]/, ''));
      break;
    }
    if (at < 0) return { body: raw, qs: [] };
    const qs = [];
    if (same && !/^(问题)?$/.test(same)) qs.push(same);
    let j = at + 1;
    for (; j < lines.length; j++) {
      const line = lines[j];
      const m = SUGG_ITEM.exec(line);
      if (m) { qs.push(cleanSug(m[1])); continue; }
      const t = cleanSug(line);
      if (!t) { if (qs.length) break; continue; }
      // 无列表符的短行也当推荐问（模型常直接换行写）
      if (t.length <= 48 && !/^#{1,6}\s/.test(t) && !/^依据|^结论|^倾向|^价格|^资金/.test(t)) { qs.push(t); continue; }
      break;
    }
    if (!qs.length) return { body: raw, qs: [] };
    return { body: lines.slice(0, at).concat(lines.slice(j)).join('\n'), qs: qs };
  };
  // 开场/追问没有 suggested_questions、正文也没有「可以接着问」时，给默认可点追问。
  // 新闻开场允许 suggested_questions=[]（无事不凑问），故不做 news 兜底。
  const FALLBACK_SQ = {
    volume_flow: ['大资金近几日逐日怎么走', '相对板块资金差在哪', '是不是单日脉冲主导'],
    market: ['市场资金怎么走', '国家队有没有动作', '市场板块谁在轮动', '今天好不好做'],
    sector: ['相对板块近60日差在哪', '成分里谁领涨谁垫底', '今天是不是主线题材'],
    news: ['这条后续有没有公告', '同主题最近还报了什么', '热搜情绪有没有延续'],
    finance: ['经营现金流和利润匹配吗', '扣非和归母差在哪', '披露后相对行业怎么走'],
    fundamental: ['业务构成怎么拆', '估值相对同行贵不贵', '在产业链哪一环'],
  };
  const suggestChips = (qs, who) => {
    const list = sugList(qs).slice(0, 4);
    if (!list.length) return '';
    const whoAttr = who && ROLE[who] ? ' data-who="' + esc(who) + '"' : '';
    return '<div style="display:flex;flex-wrap:wrap;gap:6px;padding-top:4px;margin-top:2px;border-top:1px solid #EEF0F3">' +
      list.map((q) => '<button type="button" class="sq" data-click="askSuggest" data-ask-chip data-q="' + esc(q) + '"' + whoAttr + ' title="点一下就问这个"><span style="overflow-wrap:anywhere">' + esc(q) + '</span><span aria-hidden="true">↗</span></button>').join('') + '</div>';
  };
  const mdBox = (text, who, hideSuggest) => {
    const sp = splitSuggestions(text);
    return '<div style="display:flex;flex-direction:column;gap:12px;min-width:0">' + mdHTML(sp.body) + (hideSuggest ? '' : suggestChips(sp.qs, who)) + '</div>';
  };
  // 流式文本的最后一对加粗可能还没写完，补上闭合再渲染，避免星号露在外面。
  const mdLive = (text, who) => {
    let src = String(text || '');
    const marks = src.match(/\*\*/g);
    if (marks && marks.length % 2) src += '**';
    return mdBox(src, who);
  };
  const chartFrame = (html) => html ? '<iframe sandbox="allow-scripts" title="图" style="width:100%;height:260px;border:0;border-radius:8px;background:#fff" srcdoc="' + esc(html) + '"></iframe>' : '';
  // The standing 研究分析，不构成投资建议 notice lives once in the page footer, so drop
  // that sentence from per-panel API text (data-source / method notes are kept).
  const noDisclaimer = (t) => String(t || '').split('。').filter((x) => x.trim() && !x.includes('不构成投资建议')).map((x) => x + '。').join('');
  const num = (v) => (typeof v === 'number' && isFinite(v) ? v : null);
  const pct = (v, digits) => { const n = num(v); if (n == null) return ''; const x = n * 100, t = Math.abs(x).toFixed(digits == null ? 2 : digits); return (Number(t) === 0 ? '' : x > 0 ? '+' : '−') + t + '%'; };
  const mmdd = (iso) => (iso || '').slice(5, 10);
  const hhmm = (iso) => (iso || '').slice(11, 16);
  const link = (url, text) => (/^https?:\/\//i.test(url || '')
    ? '<a class="nl" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(text) + '</a>'
    : esc(text));

  const IMPACT = {
    positive: { label: '利好', txt: UP, dot: UP },
    negative: { label: '利空', txt: DOWN, dot: DOWN },
  };
  const impactOf = (k) => IMPACT[k] || { label: '中性', txt: '#8A919E', dot: FLAT };
  const LEAN = {
    bullish: { label: '偏多', color: UP_TXT },
    bearish: { label: '偏空', color: DOWN_TXT },
    neutral: { label: '中性', color: '#5B6372' },
  };
  const CERTAINTY = { low: '把握低', medium: '把握一般', high: '把握高' };
  const CATEGORY = { earnings: '业绩', ops: '经营', operation: '经营', operations: '经营', capital: '资本', governance: '风险与治理', industry: '政策与行业', macro: '宏观与市场', opinion: '观点', rumor: '传闻与澄清' };
  const GRADE = { A: 'A 公告', B: 'B 官方数据', C: 'C 媒体', D: 'D 研报', E: 'E 自媒体' };
  // priced_in：mostly 基本反应了 / partly 部分反应 / not_yet 还没反应 / unknown 无法判断（不显示）。partial、priced_in 是旧值。
  const PRICED = {
    mostly: { label: '基本反应了', tone: 'neutral' },
    partly: { label: '部分反应', tone: 'warn' },
    not_yet: { label: '还没反应', tone: 'neutral' },
    priced_in: { label: '基本反应了', tone: 'neutral' },
    partial: { label: '部分反应', tone: 'warn' },
  };

  // Turn whatever went wrong into something a person can act on. `kind` is only
  // set by the code below, so a bug while drawing the result is never mistaken
  // for a network problem.
  function describeError(err, url, code, limitMs) {
    const secs = Math.round(limitMs / 1000);
    const info = {
      url: url, status: err.httpStatus || null, message: err.message || String(err),
      at: new Date().toLocaleTimeString('zh-CN', { hour12: false }), serverMsg: '',
    };
    if (err.name === 'AbortError') {
      return Object.assign(info, { title: '分析超时', message: '请求超过 ' + secs + ' 秒没有返回，已中止',
        hint: '接口 ' + secs + ' 秒内没有返回，可能后端还在计算。稍等片刻再试，通常会更快（后端有缓存）。' });
    }
    if (err.kind === 'network') {
      return Object.assign(info, { title: '连不上数据服务',
        hint: '请确认数据服务已经启动，并且这个地址能访问：' + API_BASE });
    }
    if (err.kind === 'parse') {
      return Object.assign(info, { title: '数据格式不对',
        hint: '服务返回的内容不是有效数据，可能是服务出了问题，或者接口地址配错了。' });
    }
    const st = err.httpStatus;
    if (st === 404) {
      return Object.assign(info, { title: '没有这只股票的数据', serverMsg: err.message,
        hint: '数据服务找不到 ' + code + '，可能还没有收录这只股票。' });
    }
    if (st >= 500) {
      return Object.assign(info, { title: '数据服务出错了', serverMsg: err.message,
        hint: '服务端处理这次请求时失败了。稍后重试；如果一直失败，请把下面的技术详情发给开发同学。' });
    }
    if (st) {
      return Object.assign(info, { title: '数据服务拒绝了请求', serverMsg: err.message,
        hint: '请求没有被接受（HTTP ' + st + '），请检查接口地址和参数。' });
    }
    return Object.assign(info, { title: '页面渲染出错',
      hint: '已经拿到数据，但显示时出错了。可以重试；如果一直这样，请把下面的技术详情发给开发同学。' });
  }

  // GET a stock-API URL and return the parsed JSON object; errors carry `kind` /
  // `httpStatus` for describeError.
  function fetchStockJSON(url, signal, init) {
    return fetch(url, Object.assign({}, init, signal ? { signal } : {}))
      .catch((err) => { if (err.name !== 'AbortError') err.kind = 'network'; throw err; })
      .then(async (res) => {
        const body = await res.json().catch(() => null);
        if (!res.ok) {
          const e = new Error((body && (body.error || body.message)) || res.statusText || 'HTTP ' + res.status);
          e.httpStatus = res.status;
          throw e;
        }
        if (!body || typeof body !== 'object') {
          const e = new Error('响应体不是有效的 JSON 对象');
          e.kind = 'parse';
          e.httpStatus = res.status;
          throw e;
        }
        return body;
      });
  }

  function startDim(dim, code) {
    const prev = dimCache[dim + ':' + code];
    if (prev && prev._inflight) return;
    const kept = prev && prev.data && prev.data._analystHeadline;
    const entry = (dimCache[dim + ':' + code] = {
      status: 'loading', startedAt: Date.now(), _inflight: true,
      data: kept ? { _analystHeadline: kept, headline: prev.data.headline, analyst_failed: false } : null,
      error: null,
    });
    const url = API_BASE + '/api/v1/stocks/' + encodeURIComponent(code) + '/dimensions/' + DIMS[dim].path;
    const ctrl = new AbortController();
    const limit = TIMEOUT_OVERRIDE_MS || DIMS[dim].timeoutMs || DEFAULT_TIMEOUT_MS;
    const timer = setTimeout(() => ctrl.abort(), limit);
    const paint = () => {
      const root = document.getElementById(DIMS[dim].rootId);
      if (root) root.dataset.key = '';
      renderDims();
    };
    // A failure that comes back instantly (refused connection...) would flash by
    // unnoticed — especially right after pressing 重试 — so hold the loading
    // state for a moment before showing it.
    const fail = (err) => {
      entry._inflight = false;
      const show = () => { entry.status = 'error'; entry.error = describeError(err, url, code, limit); paint(); };
      const wait = 700 - (Date.now() - entry.startedAt);
      if (wait > 0) setTimeout(show, wait); else show();
    };
    fetchStockJSON(url, ctrl.signal)
      .then((data) => {
        entry._inflight = false;
        // 新闻还在整理（接口先返回 computing）：继续显示“分析中”的步骤动画，整理好再出结果。
        if (dim === 'news' && (data.meta || {}).state === 'computing') { waitNews(code, entry, data, 0); return; }
        entry.status = 'done'; entry.data = keepAnalystHeadline(entry.data, data); paint(); watchPending(dim, code, entry, 0); renderTabs();
      })
      .catch(fail)
      .finally(() => clearTimeout(timer));
  }

  // 新闻整理好之前一直保持 loading（动画不断），每 6 秒再问一次；等了三分钟还没好就放弃，给出“整理得比较慢”的提示。
  function waitNews(code, entry, data, n) {
    const key = 'news:' + code;
    const settle = (d) => {
      entry.status = 'done'; entry.data = d;
      if (dimCache[key] === entry) { renderDims(); watchPending('news', code, entry, 0); renderTabs(); }
    };
    if (n >= 30) { data._stalled = true; settle(data); return; }
    setTimeout(() => {
      if (dimCache[key] !== entry) return;
      fetchStockJSON(API_BASE + '/api/v1/stocks/' + encodeURIComponent(code) + '/dimensions/' + DIMS.news.path)
        .then((fresh) => ((fresh.meta || {}).state === 'computing' ? waitNews(code, entry, fresh, n + 1) : settle(fresh)))
        .catch(() => waitNews(code, entry, data, n + 1));
    }, 6000);
  }

  // ---- loading: built once, then updated in place so the spinner keeps spinning ----
  function loadingHTML(steps) {
    const rows = steps.map((title, i) =>
      '<div style="display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;padding:8px 0">' +
      '<span data-step-icon="' + i + '" style="text-align:center"></span>' +
      '<span style="display:flex;flex-direction:column"><span style="color:#14171F">' + title + '</span>' +
      '<span data-step-detail="' + i + '" style="font-size:14px;color:#8A919E"></span></span></div>').join('');
    return '<span style="font-size:14px;color:#8A919E;margin-bottom:-12px">分析中，完成后自动更新判断</span>' +
      '<div style="display:flex;flex-direction:column">' +
      '<div style="height:4px;border-radius:2px;background:#EEF0F3;margin-bottom:10px">' +
      '<div data-news-bar style="width:6%;height:4px;border-radius:2px;background:#2457D6;transition:width .4s ease"></div></div>' +
      rows + '</div>';
  }

  function tickLoading(root, entry, steps) {
    const t = Date.now() - entry.startedAt;
    const done = STEP_DONE_AT_MS.map((ms) => t >= ms);
    const active = done.indexOf(false);
    steps.forEach((_, i) => {
      const state = done[i] ? 'done' : i === active ? 'active' : 'wait';
      const icon = root.querySelector('[data-step-icon="' + i + '"]');
      const detail = root.querySelector('[data-step-detail="' + i + '"]');
      if (!icon || !detail) return;
      if (icon.dataset.state !== state) {
        icon.dataset.state = state;
        if (state === 'done') { icon.textContent = '✓'; icon.style.color = DOWN_TXT; }
        else if (state === 'active') { icon.innerHTML = '<span class="dc-spin">⟳</span>'; icon.style.color = '#2457D6'; }
        else { icon.textContent = '○'; icon.style.color = FLAT; }
      }
      detail.textContent = state === 'done' ? '完成'
        : state === 'active' ? (i === 2 ? '进行中 · 已 ' + Math.floor(t / 1000) + ' 秒' : '进行中')
        : '等待中';
    });
    const bar = root.querySelector('[data-news-bar]');
    if (bar) bar.style.width = (8 + 82 * (1 - Math.exp(-t / 9000))).toFixed(1) + '%';
  }

  function errorHTML(e, label, stock) {
    const detail = [
      '请求：GET ' + e.url,
      e.status ? '状态：HTTP ' + e.status : '',
      '错误：' + e.message,
      '时间：' + e.at,
    ].filter(Boolean).map(esc).join('<br>');
    return '<div role="alert" style="display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:8px;background:#FDEEEC">' +
      '<div style="display:flex;align-items:center;gap:8px"><span aria-hidden="true" style="flex:none;width:18px;height:18px;border-radius:50%;background:#C8312B;color:#FFFFFF;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center">!</span>' +
      '<span style="font-weight:600;color:#9E2A22">' + esc(e.title) + '</span></div>' +
      '<span style="font-size:14px;color:#8A919E">' + esc(label) + ' · ' + esc(stock.name) + '（' + esc(stock.code) + '）</span>' +
      '<span style="color:#5B6372;line-height:1.7">' + esc(e.hint) + '</span>' +
      (e.serverMsg ? '<span style="font-size:14px;color:#5B6372;line-height:1.6">服务端提示：' + esc(e.serverMsg) + '</span>' : '') +
      '<details style="font-size:14px;color:#5B6372"><summary style="cursor:pointer;user-select:none">技术详情</summary>' +
      '<div style="margin-top:6px;line-height:1.7;word-break:break-all;' + MONO + '">' + detail + '</div></details>' +
      '<div><button type="button" class="mini" data-click="retryDim">重试</button></div></div>';
  }

  // ---- result ----
  function chartHTML(d) {
    const bars = ((d.timeline || {}).bars || []).filter((b) => num(b.close) != null);
    if (bars.length < 2) return '';
    const closes = bars.map((b) => b.close);
    const lo = Math.min.apply(null, closes), hi = Math.max.apply(null, closes);
    const x = (i) => 9.6 + i * (364.8 / (bars.length - 1));
    const y = (c) => (hi === lo ? 65 : 110 - ((c - lo) / (hi - lo)) * 90);
    const idx = {};
    bars.forEach((b, i) => { idx[b.date] = i; });
    const pts = bars.map((b, i) => x(i).toFixed(1) + ',' + y(b.close).toFixed(1)).join(' ');

    // Hover tooltip content: [time, title] per event the marker stands for.
    const byId = {};
    (d.key_events || []).concat((d.other_news || {}).items || []).forEach((e) => { if (e && e.event_id) byId[e.event_id] = e; });
    const tipLines = (ms) => ms.map((m) => {
      const e = byId[m.event_id] || {};
      return [e.published_at ? mmdd(e.published_at) + ' ' + hhmm(e.published_at) : mmdd(m.date), e.title || '未命名事件'];
    });

    const marks = ((d.timeline || {}).markers || []).filter((m) => idx[m.date] != null);
    const keys = marks.filter((m) => m.is_key).sort((a, b) => (a.rank || 99) - (b.rank || 99));
    const minorGroups = {}; // one dot per day+direction, standing for every event in it
    marks.filter((m) => !m.is_key).forEach((m) => { (minorGroups[m.date + '|' + m.impact] = minorGroups[m.date + '|' + m.impact] || []).push(m); });

    let svg = '<line x1="0" y1="128" x2="384" y2="128" stroke="#E3E6EB"></line>' +
      '<polyline points="' + pts + '" fill="none" stroke="#14171F" stroke-width="1.5" stroke-linejoin="round"></polyline>';
    // One invisible column per trading day: hovering reads off the real close.
    const step = 364.8 / (bars.length - 1);
    bars.forEach((b, i) => {
      const bx = Math.max(0, x(i) - step / 2), bw = Math.min(384, x(i) + step / 2) - bx;
      svg += '<rect class="bh" data-i="' + i + '" data-x="' + x(i).toFixed(1) + '" data-y="' + y(b.close).toFixed(1) + '" x="' + bx.toFixed(1) + '" y="0" width="' + bw.toFixed(1) + '" height="128" fill="transparent"></rect>';
    });
    const stem = (cx, cy, color) => '<line x1="' + cx + '" y1="' + cy + '" x2="' + cx + '" y2="128" stroke="' + color + '" stroke-width="1" stroke-dasharray="2 2" opacity="0.5"></line>';
    // 悬停在事件上也要看到当天的股价：收盘价、较前一天涨跌、相对板块。
    const dayLine = (date) => {
      const i = idx[date], b = bars[i];
      if (i == null || !b) return [];
      const prev = i > 0 ? bars[i - 1].close : null, ex = num(b.excess_vs_sector);
      return [['', mmdd(date) + (b.is_intraday ? ' 现价 ' : ' 收盘 ') + b.close.toFixed(2) + (prev ? ' · ' + pct((b.close - prev) / prev, 2) : '') + (ex != null ? ' · 相对板块 ' + pct(ex, 2) : ''), 1, 1]];
    };
    const marker = (cx, cy, r, color, ms, label, extra) => {
      const lines = dayLine(ms[0].date).concat(tipLines(ms), extra || []);
      return '<g class="mk" tabindex="0" data-tip="' + esc(JSON.stringify(lines)) + '" aria-label="' + esc(lines.map((l) => l.join(' ')).join('；')) + '">' +
        stem(cx, cy, color) +
        '<circle class="dot" cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + color + '" stroke="#FFFFFF" stroke-width="1.5"></circle>' +
        (label ? '<text x="' + cx + '" y="140" text-anchor="middle" font-size="10" font-weight="600" fill="' + color + '">' + esc(label) + '</text>' : '') +
        '<circle cx="' + cx + '" cy="' + cy + '" r="11" fill="transparent"></circle></g>';
    };
    Object.keys(minorGroups).forEach((k) => {
      const ms = minorGroups[k], m = ms[0];
      svg += marker(x(idx[m.date]).toFixed(1), y(bars[idx[m.date]].close).toFixed(1), 3, impactOf(m.impact).dot, ms, '');
    });
    const perDate = {};
    keys.forEach((m) => { perDate[m.date] = (perDate[m.date] || 0) + 1; });
    // A key dot sits exactly on top of that day's minor dot, so mention what it hides.
    const hiddenMinor = {};
    Object.keys(minorGroups).forEach((k) => { const ms = minorGroups[k]; hiddenMinor[ms[0].date] = (hiddenMinor[ms[0].date] || 0) + ms.length; });
    const seen = {};
    keys.forEach((m) => {
      const n = perDate[m.date], k = (seen[m.date] = (seen[m.date] || 0) + 1);
      const cx = (x(idx[m.date]) + (k - 1 - (n - 1) / 2) * 14).toFixed(1), cy = y(bars[idx[m.date]].close).toFixed(1);
      svg += marker(cx, cy, m.rank === 1 ? 7 : 5.5, impactOf(m.impact).dot, [m], m.rank,
        hiddenMinor[m.date] ? [['', '同日还有 ' + hiddenMinor[m.date] + ' 条次要新闻', 1]] : []);
    });
    const priceLabel = (i, above) => {
      const cx = x(i), anchor = cx < 40 ? 'start' : cx > 344 ? 'end' : 'middle';
      return '<text x="' + cx.toFixed(1) + '" y="' + (y(bars[i].close) + (above ? -8 : 15)).toFixed(1) + '" text-anchor="' + anchor + '" font-size="10" fill="#5B6372" stroke="#FFFFFF" stroke-width="3" paint-order="stroke" pointer-events="none" style="font-family:\'IBM Plex Mono\',ui-monospace,Menlo,monospace">' + bars[i].close.toFixed(2) + '</text>';
    };
    if (hi !== lo) svg += priceLabel(closes.indexOf(hi), true) + priceLabel(closes.indexOf(lo), false);
    svg += '<line class="xh-line" x1="0" y1="8" x2="0" y2="128" stroke="#14171F" stroke-width="1" opacity="0.35" pointer-events="none" style="display:none"></line>' +
      '<circle class="xh-dot" cx="0" cy="0" r="3.5" fill="#14171F" stroke="#FFFFFF" stroke-width="1.5" pointer-events="none" style="display:none"></circle>';
    svg += '<text x="0" y="157" font-size="10" fill="#8A919E">' + bars.length + ' 天前</text>' +
      '<text x="384" y="157" text-anchor="end" font-size="10" fill="#8A919E">今天</text>';

    const dot = (c, t) => '<span style="display:inline-flex;align-items:center;gap:4px"><span style="width:7px;height:7px;border-radius:50%;background:' + c + '"></span>' + t + '</span>';
    return '<div style="display:flex;flex-direction:column;gap:6px">' +
      '<div style="display:flex;align-items:baseline;gap:8px"><span style="font-weight:600">消息出来后，股价怎么走</span>' +
      '<span style="margin-left:auto;font-size:13px;color:#8A919E"><span style="display:inline-flex;gap:10px">' + dot(UP, '利好') + dot(DOWN, '利空') + dot(FLAT, '次要') + '</span></span></div>' +
      '<div class="chart-wrap" style="position:relative" data-bars="' + esc(JSON.stringify(bars.map((b) => [b.date, b.close, num(b.excess_vs_sector), !!b.is_intraday]))) + '">' +
      '<svg viewBox="0 0 384 160" role="img" aria-label="' + esc((d.timeline || {}).chart_alt_text || '') + '" style="width:100%;height:auto;display:block">' + svg + '</svg>' +
      '<div class="chart-tip" role="tooltip" hidden></div></div></div>';
  }

  // ---- marker hover/focus tooltip (delegated: the panel's DOM is rebuilt on each state change) ----
  function showTip(mk) {
    const wrap = mk.closest('.chart-wrap');
    const tip = wrap && wrap.querySelector('.chart-tip');
    let lines;
    try { lines = JSON.parse(mk.dataset.tip); } catch (e) { return; }
    if (!tip || !Array.isArray(lines)) return;
    tip.textContent = '';
    lines.slice(0, 5).forEach((l) => {
      const row = document.createElement('div');
      if (l[2]) {
        row.className = 'tt';
        row.textContent = l[1];
        if (l[3]) { row.style.fontWeight = '600'; row.style.color = '#FFFFFF'; row.style.marginBottom = '2px'; }
      } else {
        const time = document.createElement('span');
        time.className = 'tt';
        time.textContent = l[0];
        row.appendChild(time);
        row.appendChild(document.createTextNode(l[1]));
      }
      tip.appendChild(row);
    });
    if (lines.length > 5) {
      const more = document.createElement('div');
      more.className = 'tt';
      more.textContent = '还有 ' + (lines.length - 5) + ' 条';
      tip.appendChild(more);
    }
    tip.hidden = false;
    const w = wrap.getBoundingClientRect();
    const m = mk.querySelector('.dot').getBoundingClientRect();
    const left = Math.max(0, Math.min(m.left + m.width / 2 - w.left - tip.offsetWidth / 2, w.width - tip.offsetWidth));
    let top = m.top - w.top - tip.offsetHeight - 6;
    if (top < 0) top = m.bottom - w.top + 6;
    tip.style.left = left + 'px';
    tip.style.top = top + 'px';
  }
  function hideTip(mk) {
    const tip = mk.closest('.chart-wrap') && mk.closest('.chart-wrap').querySelector('.chart-tip');
    if (tip) tip.hidden = true;
  }
  const WEEK = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  function showPrice(bh) {
    const wrap = bh.closest('.chart-wrap');
    const tip = wrap.querySelector('.chart-tip');
    let bars;
    try { bars = JSON.parse(wrap.dataset.bars); } catch (e) { return; }
    const i = Number(bh.dataset.i), cur = bars[i];
    if (!cur) return;
    const prev = i > 0 ? bars[i - 1][1] : null;
    const line = wrap.querySelector('.xh-line'), dot = wrap.querySelector('.xh-dot');
    line.setAttribute('x1', bh.dataset.x); line.setAttribute('x2', bh.dataset.x);
    line.setAttribute('y2', wrap.dataset.xhBottom || '128');
    dot.setAttribute('cx', bh.dataset.x);
    if (bh.dataset.y) {
      dot.setAttribute('cy', bh.dataset.y);
      line.style.display = ''; dot.style.display = '';
    } else {
      line.style.display = 'none'; dot.style.display = 'none';
    }

    tip.textContent = '';
    const add = (cls, text) => { const r = document.createElement('div'); if (cls) r.className = cls; r.textContent = text; tip.appendChild(r); return r; };
    if (wrap.dataset.kind === 'valuation' || wrap.dataset.kind === 'fund-price') {
      add('tt', cur[0]);
      if (cur[1] == null || cur[1] !== cur[1]) {
        add('', '这一周没有读数');
      } else if (wrap.dataset.kind === 'valuation') {
        const nums = bars.map((b) => b[1]).filter((v) => v != null && v === v && v > 0);
        add('', (wrap.dataset.label || '估值') + ' ' + Number(cur[1]).toFixed(2)).style.fontWeight = '600';
        if (nums.length) add('tt', '在这段历史里 ' + Math.round((nums.filter((v) => v <= cur[1]).length / nums.length) * 100) + '% 分位');
      } else {
        const prev = i > 0 ? bars.slice(0, i).reverse().find((b) => b[1] != null && b[1] === b[1]) : null;
        add('', '收盘 ' + Number(cur[1]).toFixed(2)).style.fontWeight = '600';
        if (prev) add('tt', '较上一周 ' + pct((cur[1] - prev[1]) / prev[1]));
      }
    } else if (wrap.dataset.kind === 'synth') {
      const wd = WEEK[new Date(cur[0] + 'T00:00:00').getDay()] || '';
      add('tt', cur[0].slice(5) + ' ' + wd);
      add('', '收盘 ' + Number(cur[1]).toFixed(2)).style.fontWeight = '600';
      if (prev) add('tt', '较前一日 ' + pct((cur[1] - prev) / prev));
      add('tt', cur[5] ? '当日判断 ' + cur[5] : '当日没有判断记录');
    } else if (wrap.dataset.kind === 'lines') {
      add('tt', cur[0]);
      [['本股', cur[1]], ['板块', cur[2]], ['大盘', cur[3]]].forEach((r) => add('', r[0] + ' ' + pct(r[1], 1)));
    } else {
      const wd = WEEK[new Date(cur[0] + 'T00:00:00').getDay()] || '';
      add('tt', cur[0].slice(5) + ' ' + wd + (cur[3] ? ' · 盘中' : ''));
      add('', (cur[3] ? '现价 ' : '收盘 ') + Number(cur[1]).toFixed(2)).style.fontWeight = '600';
      if (cur[4] != null) add('tt', '成交量 ' + fmtVol(cur[4]));
      const parts = [];
      if (prev) parts.push('较前一日 ' + pct((cur[1] - prev) / prev));
      if (cur[2] != null) parts.push('相对板块 ' + pct(cur[2]));
      if (parts.length) add('tt', parts.join(' · '));
    }
    tip.hidden = false;
    const w = wrap.getBoundingClientRect(), m = dot.getBoundingClientRect();
    const left = Math.max(0, Math.min(m.left + m.width / 2 - w.left - tip.offsetWidth / 2, w.width - tip.offsetWidth));
    let top = m.top - w.top - tip.offsetHeight - 8;
    if (top < 0) top = m.bottom - w.top + 8;
    tip.style.left = left + 'px';
    tip.style.top = top + 'px';
  }
  function hidePrice(wrap) {
    wrap.querySelectorAll('.xh-line, .xh-dot').forEach((el) => { el.style.display = 'none'; });
    const tip = wrap.querySelector('.chart-tip');
    if (tip) tip.hidden = true;
  }
  const markerOf = (el) => (el && el.closest ? el.closest('.mk') : null);
  const columnOf = (el) => (el && el.closest ? el.closest('.bh') : null);
  document.addEventListener('mouseover', (e) => {
    const mk = markerOf(e.target), bh = columnOf(e.target);
    if (mk) { hidePrice(mk.closest('.chart-wrap')); showTip(mk); } else if (bh) showPrice(bh);
  });
  document.addEventListener('mouseout', (e) => {
    const from = markerOf(e.target) || columnOf(e.target);
    if (!from) return;
    const wrap = from.closest('.chart-wrap');
    const to = e.relatedTarget;
    // Moving between markers/columns of the same chart: the next mouseover repaints.
    if (to && wrap.contains(to) && (markerOf(to) || columnOf(to))) return;
    hidePrice(wrap);
  });
  document.addEventListener('focusin', (e) => { const mk = markerOf(e.target); if (mk) showTip(mk); });
  document.addEventListener('focusout', (e) => { const mk = markerOf(e.target); if (mk) hideTip(mk); });

  // ---- 新闻：和资金流同一套版式（状态行 → 方向 + 今日涨跌 → 结论 → 信号表 → 图 → 关键事件）----
  const NEWS_DROP = { duplicate: '重复', irrelevant: '无关', market_recap: '行情复盘' };
  const PERSIST = { lasting: '影响持续', one_off: '一次性' };

  function keyEventsHTML(d) {
    const evs = d.key_events || [];
    if (!evs.length) return '<div style="display:flex;flex-direction:column;gap:4px">' + secTitle('关键事件', '') + '<span style="font-size:14px;color:#8A919E">近 ' + esc((d.meta || {}).window_days || 3) + ' 天没有关键事件</span></div>';
    const rows = evs.map((e) => {
      const im = impactOf(e.impact);
      const r = e.reaction || {}, dx = num(r.day_excess);
      const react = dx != null ? '当日相对板块 ' + pct(dx) : r.text || '';
      const meta = [CATEGORY[e.category] || e.category, GRADE[e.source_grade] || (e.source_grade && e.source_grade + ' 级'), e.magnitude_text, PERSIST[e.persistence], num(e.sources_count) > 1 ? e.sources_count + ' 家报道' : ''].filter(Boolean).join(' · ');
      const quotes = (e.evidence || []).filter((x) => x && x.quote).slice(0, 2).map((x) => '<span style="font-size:14px;color:#8A919E;line-height:1.6">原文：' + esc(x.quote) + '</span>').join('');
      return accRow(
        '<span style="flex:none;width:18px;height:18px;border-radius:50%;background:' + im.dot + ';color:#FFFFFF;font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center">' + esc(e.rank) + '</span>' +
        '<span style="min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#14171F" title="' + esc(e.title) + '">' + esc(e.title) + '</span>' +
        '<span style="flex:none;font-size:14px;color:' + im.txt + '">' + im.label + (e.role && e.role !== 'main' ? ' · 另一边' : '') + '</span>',
        (e.summary ? '<span style="font-size:15px;color:#3A4250;line-height:1.7">' + esc(e.summary) + '</span>' : '') +
        '<span style="font-size:14px;color:#5B6372;line-height:1.6">' + esc(meta) + '</span>' +
        (react ? '<span style="font-size:14px;color:' + (dx != null ? (dx > 0 ? UP_TXT : dx < 0 ? DOWN_TXT : '#8A919E') : '#8A919E') + '">' + esc(react) + '</span>' : '') +
        quotes + (e.url ? '<span style="font-size:14px">' + link(e.url, '查看原文 ↗') + '</span>' : ''));
    }).join('');
    return '<div style="display:flex;flex-direction:column;gap:2px">' + secTitle('关键事件', evs.length + ' 条 · 点开看说明') + '<div class="acc-list">' + rows + '</div></div>';
  }

  // 其他新闻：没有关键事件时默认展开，有就收起。
  function otherNewsHTML(d) {
    const items = ((d.other_news || {}).items || []).slice(0, 20);
    if (!items.length) return '';
    const rows = items.map((n) => {
      const title = n.title + (n.is_rumor ? ' · 未经公司确认' : '');
      return '<div style="display:grid;grid-template-columns:8px 14px minmax(0,1fr) auto;align-items:center;gap:8px;padding:8px 0;' + ROW + (n.in_window === false ? ';opacity:.6' : '') + '">' +
        '<span style="width:7px;height:7px;border-radius:50%;background:' + impactOf(n.impact).dot + '"></span>' +
        '<span style="' + MONO + ';font-size:13px;color:#8A919E">' + esc(n.source_grade) + '</span>' +
        '<span style="color:#3A4250;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="' + esc(title) + '">' + link(n.url, title) + '</span>' +
        '<span style="font-size:14px;color:#8A919E">' + esc(mmdd(n.published_at)) + (n.in_window === false ? ' · 窗口外' : '') + '</span></div>';
    }).join('');
    const total = num((d.other_news || {}).total);
    const open = !(d.key_events || []).length;
    return '<details class="acc"' + (open ? ' open' : '') + ' style="border-top:none"><summary style="padding:0"><span style="font-weight:600">其他新闻</span><span style="font-size:13px;color:#8A919E">' + (total != null ? total : items.length) + ' 条</span></summary>' +
      '<div style="display:flex;flex-direction:column;padding-top:4px;font-size:15px">' + rows + '</div></details>';
  }

  // “依据”：这次新闻是怎么筛出来的（搜到多少、留下多少、去掉了哪些）。
  function newsBasisChipHTML(d, cc) {
    const text = cc ? HEAD_SOURCE[cc.source] : '';
    const meta = d.meta || {}, c = meta.counts || {}, drop = meta.dropped || [];
    const counts = [['搜到', c.found, '条'], ['近 ' + (meta.window_days || 3) + ' 天有效', c.in_window != null ? c.in_window : c.kept, '条'], ['归并成事件', c.events, '个']].filter((r) => num(r[1]) != null);
    if (!counts.length && !drop.length) return text ? '<span style="display:inline-flex;padding:2px 8px;border-radius:999px;background:#F4F5F7;color:#5B6372;font-size:14px;line-height:20px;white-space:nowrap">' + text + '</span>' : '';
    return '<details class="facts"><summary title="点开看新闻筛选依据" aria-label="新闻筛选依据">依据<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg></summary>' +
      '<div class="facts-pop"><div style="display:flex;flex-direction:column;gap:10px"><span style="font-weight:600;color:#14171F">' + (text ? text + ' · ' : '') + '新闻筛选依据</span>' +
      (counts.length ? rvEvidence(counts.map((r) => ({ label: r[0], text: r[1] + ' ' + r[2] }))) : '') +
      (drop.length ? '<div style="display:flex;flex-direction:column;gap:3px"><span style="font-weight:600;color:#3A4250">去掉的 ' + drop.length + ' 条</span>' +
        '<div style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px">' + drop.slice(0, 20).map((x) =>
          '<span style="color:#5B6372;line-height:1.5">' + esc(x.title) + '</span><span style="color:#8A919E;white-space:nowrap">' + esc(NEWS_DROP[x.reason] || x.reason || '') + '</span>').join('') + '</div></div>' : '') +
      '</div></div></details>';
  }

  // "由事件 1 带动": draw the 1 as the same numbered dot the key-events list below
  // uses (same size, white digit, colour by the event's direction).
  function todayTextHTML(today, d) {
    const text = String(today.text || '');
    const m = /^(.*?事件\s*)(\d+)(.*)$/.exec(text);
    if (!m) return esc(text);
    const evs = d.key_events || [];
    const ev = evs.find((e) => e.event_id === today.event_id) || evs.find((e) => String(e.rank) === m[2]);
    const badge = '<span title="' + esc(ev ? ev.title : '') + '" style="display:inline-flex;flex:none;margin:0 4px;width:18px;height:18px;border-radius:50%;background:' +
      (ev ? impactOf(ev.impact).dot : FLAT) + ';color:#FFFFFF;font-size:10px;font-weight:600;align-items:center;justify-content:center">' + esc(ev ? ev.rank : m[2]) + '</span>';
    return esc(m[1].trim()) + badge + esc(m[3].trim());
  }

  function resultHTML(d) {
    const meta = d.meta || {}, re = d.reaction || {};
    const status = '<span style="font-size:14px;color:#8A919E;margin-bottom:-12px">' + esc(meta.status_text || '') + '</span>';
    if (meta.state === 'computing') {
      return status + '<span style="font-size:15px;color:#5B6372;line-height:1.7">' + (d._stalled ? '新闻整理得比较慢，过一会儿再点“更新”看看。' : '正在整理新闻，完成后自动更新。') + '</span>';
    }
    const cc = conclusionOf(d);
    const priced = PRICED[re.priced_in];
    const pre = num(re.pre_excess_5d), today = re.today || {}, chg = num(today.chg), heat = d.heat || {};

    const left = '<div style="display:flex;flex-direction:column;gap:2px"><span style="font-size:14px;color:#8A919E">方向</span>' +
      '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span style="font-size:26px;font-weight:700;line-height:1.2;color:' + (cc ? HEAD_TONE[cc.status] || '#5B6372' : '#A1A7B2') + '">' + esc(cc ? cc.label : '暂无结论') + '</span>' + (cc && !cc.pending ? newsBasisChipHTML(d, cc) : '') + '</div></div>';
    const chgLabel = String(today.text || '').indexOf('昨日') === 0 ? '昨日涨跌' : '今日涨跌';
    const right = chg == null ? '' : '<div style="display:flex;flex-direction:column;gap:2px;min-width:0"><span style="font-size:14px;color:#8A919E">' + chgLabel + '</span>' +
      '<span style="' + MONO + ';font-size:26px;font-weight:700;line-height:1.2;color:' + signColor(chg) + '">' + (pct(chg, 2) || '0.00%') + '</span></div>';
    const head = '<div style="position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start">' + left + right + '</div>';
    const sentence = cc && !cc.pending && cc.text ? '<p style="margin:0;font-size:16px;font-weight:600;line-height:1.7;color:#14171F">' + esc(cc.text) + '</p>' : '';
    const newsNote = cc && cc.pending ? '<span style="font-size:14px;color:#8A919E;line-height:1.7">新闻分析师正在分析，完成后自动给出结论。</span>'
      : (d.analyst_failed || d._analystFailed) && cc && cc.source === 'rule' ? '<span style="font-size:14px;color:#8A919E;line-height:1.7">新闻分析师没有给出结论，以下为规则摘要。</span>' : '';

    const row = (label, valueHTML, detail, tone) => '<div style="display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:start;padding:10px 0;border-top:1px solid #F1F2F4">' +
      '<span style="font-size:14px;color:#5B6372;padding-top:1px">' + label + '</span><div style="display:flex;flex-direction:column;gap:2px;min-width:0">' +
      '<span style="display:flex;align-items:center;gap:6px;font-weight:600;color:' + (tone === 'warn' ? '#7A4A00' : '#14171F') + '"><span aria-hidden="true" style="flex:none;width:8px;height:8px;border-radius:50%;background:' + TONE_DOT[tone || 'neutral'] + '"></span>' + valueHTML + '</span>' +
      (detail ? '<span style="font-size:14px;color:#5B6372;line-height:1.5">' + detail + '</span>' : '') + '</div></div>';
    const rows = [];
    if (priced) rows.push(row('已反应？', esc(priced.label), pre != null ? '消息前 5 天已' + (pre >= 0 ? '跑赢' : '跑输') + '板块 ' + esc(pct(Math.abs(pre), 1).replace(/^[+−]/, '')) : '', priced.tone));
    if (today.text) rows.push(row('今天走势', todayTextHTML(today, d), '', 'neutral'));
    if (heat.risk_hit) rows.push(row('新闻热度', '偏热，留意炒作', '近期报道很多，但没有官方公告或数据来源', 'warn'));
    else if (num(heat.news_count_pctile_60d) != null) rows.push(row('新闻热度', '近 60 天第 ' + Math.round(heat.news_count_pctile_60d * 100) + ' 分位', '', 'neutral'));
    const table = rows.length ? '<div style="display:flex;flex-direction:column;margin-top:-6px">' + rows.join('') + '</div>' : '';

    const glance = '<div style="display:flex;flex-direction:column;gap:18px">' + head + sentence + newsNote + table + '</div>';
    return status + glance + chartHTML(d) + keyEventsHTML(d) + otherNewsHTML(d) +
