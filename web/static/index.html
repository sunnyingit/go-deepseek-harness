      '<span style="margin-top:auto;font-size:13px;color:#A1A7B2;line-height:1.6">' + esc(noDisclaimer(d.disclaimer_text)) + '</span>';
  }

  // ===== 资金流维度 =====
  // GET {stock-api-base}/api/v1/stocks/{ts_code}/dimensions/volume_flow/detail?window=5
  const FLOW_TREND = {
    accelerating_in: '流入在加快', slowing_in: '流入在放缓', turning_in: '刚转为流入',
    accelerating_out: '流出在加快', slowing_out: '流出在放缓', turning_out: '刚转为流出', steady_in: '流入保持平稳',
  };
  const PV_PATTERN = {
    none: { label: '无明显形态', style: 'background:#F4F5F7;color:#5B6372' },
    up_vol_up: { label: '价涨量增', style: 'background:#FDECEA;color:#B42318' },
    up_vol_down: { label: '价涨量缩', style: 'background:#FFF4E0;color:#7A4A00' },
    down_vol_up: { label: '价跌量增', style: 'background:#E8F5EE;color:#1E6B44' },
    down_vol_down: { label: '价跌量缩', style: 'background:#E8F5EE;color:#1E6B44' },
  };
  // 金额单位随量级走：个股资金流常常只有几千万，固定成“亿”会全部显示成 0.0x。
  function fmtFlow(v, signedOut) {
    if (num(v) == null) return '—';
    const a = Math.abs(v);
    const t = a >= 1e8 ? (a / 1e8).toFixed(2) + ' 亿' : a >= 1e4 ? (a / 1e4).toFixed(a >= 1e6 ? 0 : 1) + ' 万' : String(Math.round(a));
    return (signedOut ? '' : v > 0 ? '+' : v < 0 ? '−' : '') + t;
  }
  const signColor = (v) => (v > 0 ? UP_TXT : v < 0 ? DOWN_TXT : '#5B6372');
  const mdSlash = (iso) => Number(iso.slice(5, 7)) + '/' + Number(iso.slice(8, 10));
  function fmtVol(v) {
    return v >= 1e8 ? (v / 1e8).toFixed(2) + ' 亿股' : v >= 1e4 ? (v / 1e4).toFixed(1) + ' 万股' : v + ' 股';
  }
  const secTitle = (title, right) =>
    '<div style="display:flex;align-items:baseline;gap:8px"><span style="font-weight:600">' + title + '</span>' +
    '<span style="margin-left:auto;font-size:13px;color:#8A919E">' + (right || '') + '</span></div>';
  const colBox = (gap) => '<div style="display:flex;flex-direction:column;gap:' + gap + 'px">';

  function volChartHTML(d) {
    const pv = d.price_volume || {};
    // 量价图优先用近 20 日 chart；没有时退回主窗口 bars
    const src = (pv.chart && (pv.chart.bars || []).length >= 2) ? pv.chart : pv;
    const bars = (src.bars || []).filter((b) => num(b.close) != null && num(b.volume) != null);
    if (bars.length < 2) return '';
    const n = bars.length, step = 364.8 / (n - 1), x = (i) => 9.6 + i * step;
    const closes = bars.map((b) => b.close);
    const lo = Math.min.apply(null, closes), hi = Math.max.apply(null, closes);
    const py = (c) => (hi === lo ? 60 : 98 - ((c - lo) / (hi - lo)) * 76);
    const base = num(src.vol_base != null ? src.vol_base : pv.vol_base);
    const maxV = Math.max.apply(null, bars.map((b) => b.volume).concat([base || 0]));
    const FLOOR = 168, VH = 52;
    const vh = (v) => Math.max(1, (v / maxV) * VH);
    // 红涨绿跌：bars 只带 chg（当日涨跌幅），缺失时用相邻收盘价比。
    const barColor = (b, i) => {
      const chg = num(b.chg) != null ? b.chg : i > 0 ? b.close - bars[i - 1].close : null;
      return chg == null || chg === 0 ? FLAT : chg > 0 ? UP : DOWN;
    };
    const idx = {};
    bars.forEach((b, i) => { idx[b.date] = i; });

    let svg = '<polyline points="' + bars.map((b, i) => x(i).toFixed(1) + ',' + py(b.close).toFixed(1)).join(' ') +
      '" fill="none" stroke="#14171F" stroke-width="1.6" stroke-linejoin="round"></polyline>' +
      '<circle cx="' + x(n - 1).toFixed(1) + '" cy="' + py(closes[n - 1]).toFixed(1) + '" r="2.6" fill="#14171F"></circle>';
    const priceLabel = (i, above) => {
      const cx = x(i), anchor = cx < 40 ? 'start' : cx > 344 ? 'end' : 'middle';
      return '<text x="' + cx.toFixed(1) + '" y="' + (py(closes[i]) + (above ? -7 : 14)).toFixed(1) + '" text-anchor="' + anchor +
        '" font-size="10" fill="#5B6372" stroke="#FFFFFF" stroke-width="3" paint-order="stroke" pointer-events="none" style="font-family:\'IBM Plex Mono\',ui-monospace,Menlo,monospace">' + closes[i].toFixed(2) + '</text>';
    };
    if (hi !== lo) svg += priceLabel(closes.indexOf(hi), true) + priceLabel(closes.indexOf(lo), false);

    const w = step * 0.64;
    bars.forEach((b, i) => {
      const h = vh(b.volume);
      svg += '<rect x="' + (x(i) - w / 2).toFixed(1) + '" y="' + (FLOOR - h).toFixed(1) + '" width="' + w.toFixed(1) + '" height="' + h.toFixed(1) +
        '" rx="1" fill="' + barColor(b, i) + '" opacity="' + (i >= n - 3 ? '0.9' : '0.55') + '"></rect>';
    });
    if (base > 0) {
      const by = FLOOR - vh(base);
      svg += '<line x1="0" y1="' + by.toFixed(1) + '" x2="384" y2="' + by.toFixed(1) + '" stroke="#8A919E" stroke-width="1" stroke-dasharray="3 3"></line>' +
        '<text x="2" y="' + (by - 4).toFixed(1) + '" font-size="10" fill="#8A919E">60 日均量</text>';
    }
    svg += '<line x1="0" y1="' + FLOOR + '" x2="384" y2="' + FLOOR + '" stroke="#C9CED6" stroke-width="1"></line>';

    // Hover columns (same readout as the news chart, plus volume), under the labels.
    bars.forEach((b, i) => {
      const bx = Math.max(0, x(i) - step / 2), bw = Math.min(384, x(i) + step / 2) - bx;
      svg += '<rect class="bh" data-i="' + i + '" data-x="' + x(i).toFixed(1) + '" data-y="' + py(b.close).toFixed(1) + '" x="' + bx.toFixed(1) + '" y="0" width="' + bw.toFixed(1) + '" height="' + FLOOR + '" fill="transparent"></rect>';
    });

    const placed = [];
    (pv.annotations || []).forEach((a) => {
      const i = idx[a.date];
      if (i == null) return;
      const cx = x(i);
      let lift = 0;
      placed.forEach((p) => { if (Math.abs(p.cx - cx) < 64 && p.lift >= lift) lift = p.lift + 12; });
      placed.push({ cx: cx, lift: lift });
      const anchor = cx < 40 ? 'start' : cx > 344 ? 'end' : 'middle';
      svg += '<text x="' + cx.toFixed(1) + '" y="' + (FLOOR - vh(bars[i].volume) - 4 - lift).toFixed(1) + '" text-anchor="' + anchor + '" font-size="10" fill="' +
        (/down/.test(a.kind || '') ? DOWN_TXT : UP_TXT) + '" pointer-events="none">' + esc(a.text) + '</text>';
    });
    svg += '<text x="0" y="184" font-size="10" fill="#8A919E">' + n + ' 天前</text>' +
      '<text x="384" y="184" text-anchor="end" font-size="10" fill="#8A919E">' + esc(mmdd(bars[n - 1].date)) + '</text>' +
      '<line class="xh-line" x1="0" y1="8" x2="0" y2="' + FLOOR + '" stroke="#14171F" stroke-width="1" opacity="0.35" pointer-events="none" style="display:none"></line>' +
      '<circle class="xh-dot" cx="0" cy="0" r="3.5" fill="#14171F" stroke="#FFFFFF" stroke-width="1.5" pointer-events="none" style="display:none"></circle>';

    const data = bars.map((b) => [b.date, b.close, null, false, b.volume]);
    return '<div class="chart-wrap" style="position:relative" data-xh-bottom="' + FLOOR + '" data-bars="' + esc(JSON.stringify(data)) + '">' +
      '<svg viewBox="0 0 384 186" role="img" aria-label="' + esc(pv.chart_alt_text || '') + '" style="width:100%;height:auto;display:block">' + svg + '</svg>' +
      '<div class="chart-tip" role="tooltip" hidden></div></div>';
  }

  // ---- 一眼看懂：大资金进出多少、和价格同不同向、能不能持续、要小心什么 ----
  const TONE_DOT = { ok: '#2457D6', warn: '#B87400', neutral: '#A1A7B2' };

  function flowParts(v) {
    const a = Math.abs(v);
    return a >= 1e8 ? { n: (a / 1e8).toFixed(2), unit: '亿' } : a >= 1e4 ? { n: (a / 1e4).toFixed(a >= 1e6 ? 0 : 1), unit: '万' } : { n: String(Math.round(a)), unit: '元' };
  }

  // 五维页头：只显示分析师 headline；没有结果 →「分析中」；分析失败才回退规则 verdict。
  const HEAD_TONE = { support: UP_TXT, warn: DOWN_TXT, neutral: '#5B6372' };
  const HEAD_SOURCE = { model: 'AI 解读', rule: '规则摘要' };
  const analystConclusionOf = (d) => {
    if (d.headline && d.headline.text) {
      const pick = d.headline;
      return { text: String(pick.text).replace(/^一句话[：:]\s*/, ''), status: pick.status, label: pick.status_text || (RV_STATUS[pick.status] || {}).text || '不明', source: pick.source === 'model' ? 'model' : 'rule' };
    }
    if (d.analyst_failed || d._analystFailed) {
      const pick = d.verdict;
      return pick && pick.text
        ? { text: String(pick.text).replace(/^一句话[：:]\s*/, ''), status: pick.status, label: pick.status_text || (RV_STATUS[pick.status] || {}).text || '不明', source: 'rule' }
        : null;
    }
    return { pending: true, label: '分析中', text: '', status: 'neutral', source: '' };
  };
  const conclusionOf = analystConclusionOf;
  const flowConclusionOf = analystConclusionOf;
  const finConclusionOf = analystConclusionOf;
  const FOLLOW_TONE = { strong: 'ok', yes: 'ok', mixed: 'neutral', weak: 'neutral', none: 'warn' };
  const FOLLOW_ITEM = { agree: TONE_DOT.ok, disagree: TONE_DOT.warn, neutral: TONE_DOT.neutral };

  function flowSignals(d, c) {
    const toneOf = (status) => status === 'warn' ? 'warn' : status === 'support' ? 'ok' : 'neutral';
    const by = {};
    ((d.review || {}).signals || []).forEach((s) => { if (s && s.key) by[s.key] = s; });
    const itemOf = { price: 'q1', internal: 'q2', sector: 'q5' };
    const items = (d.review || {}).items || [];
    // 信号原文只留了前 40 字，会断在「沪深」「-1.55」这种半句上。优先用完整回答，收成一整句。
    const wholeLine = (text) => {
      const t = String(text || '').trim();
      if (!t) return '';
      const period = t.indexOf('。');
      if (period > 0 && period <= 48) return t.slice(0, period + 1);
      let at = -1;
      for (let n = 0; n < 2; n++) {
        const next = t.indexOf('，', at + 1);
        if (next < 0) return t;
        at = next;
      }
      return t.slice(0, at) + '。';
    };
    const word = (key) => {
      const row = by[key];
      const item = items.find((it) => it.key === itemOf[key]);
      const value = wholeLine((item && item.answer) || (row && row.text));
      if (value) return { value: value, tone: toneOf((item && item.status) || (row && row.status)) };
      return { value: '暂无规则判断', tone: 'neutral' };
    };
    const out = [];
    const followItems = ((d.follow || {}).items || []).map((it) => ({
      text: it.text, color: FOLLOW_ITEM[it.status] || TONE_DOT.neutral,
    }));
    out.push({ label: '有没有人跟', ...word('follow'), detail: followItems.length ? followItems : '' });
    if (c.big != null && c.ret != null && Math.abs(c.ret) >= 0.001) {
      const inn = c.big > 0;
      out.push({ label: '资金和价格', ...word('price'), detail: '近 ' + (c.win || 5) + ' 天股价 ' + pct(c.ret, 1) + '，大资金净' + (inn ? '流入' : '流出') });
    }
    const own = d.flow_by_size || {};
    if (own.state) {
      const OWN = { in_strong: ['比自己平时明显更流入', 'ok'], in: ['比自己平时偏流入', 'ok'], normal: ['和自己平时差不多', 'neutral'], out: ['比自己平时偏流出', 'warn'], out_strong: ['比自己平时明显更流出', 'warn'] }[own.state] || ['', 'neutral'];
      const z = num(own.rate_z), r = num(own.rate), pc = num(own.rate_pctile);
      out.push({ label: '和自己平时比', value: OWN[0] + (z != null ? '（' + (z > 0 ? '+' : '') + z.toFixed(1) + ' 个标准差）' : ''), tone: OWN[1],
        detail: [r != null ? '近 ' + (c.win || 5) + ' 天大资金净流入占成交额 ' + pct(r, 1) + (pc != null ? '，在这只股票自己过去的同长度窗口里排第 ' + Math.round(pc * 100) + '% 分位' : '') : '',
          '大额净流出在 A 股本来就是常态，只有比自己平时偏离，才算有信息'].filter(Boolean).map((t) => ({ text: t, color: TONE_DOT.neutral })) });
    }
    const fd = d.flow_daily || {};
    const total = (num(fd.in_days) || 0) + (num(fd.out_days) || 0);
    if (total) {
      const t = fd.trend, ratio = fd.in_days / total;
      const tone = t === 'turning_out' || t === 'accelerating_out' ? 'warn' : t === 'accelerating_in' || t === 'steady_in' ? 'ok' : t === 'slowing_in' ? 'neutral' : ratio >= 0.7 ? 'ok' : ratio <= 0.3 ? 'warn' : 'neutral';
      out.push({ label: '能不能持续', value: fd.in_days + ' / ' + total + ' 天流入', tone: tone, detail: FLOW_TREND[t] || (ratio >= 0.7 ? '大多数天都在流入' : ratio <= 0.3 ? '大多数天都在流出' : '流入流出各半') });
    }
    if (c.elg != null && c.lg != null) {
      out.push({ label: '大资金内部', ...word('internal'), detail: '近 ' + (c.win || 5) + ' 天超大单 ' + fmtFlow(c.elg) + ' · 大单 ' + fmtFlow(c.lg) });
    }
    const rs = d.relative_strength || {};
    if (rs.sector_flow || (rs.windows || []).length) {
      const gap = c.stock && c.sector ? c.stock.ret - c.sector.ret : null;
      const bits = [];
      if (gap != null) bits.push((gap >= 0 ? '跑赢' : '跑输') + '板块 ' + (Math.abs(gap) * 100).toFixed(1) + ' 个百分点（近 ' + (c.win || 5) + ' 天）');
      (rs.windows || []).filter((w) => w.days !== (c.win || 5)).forEach((w) => {
        const bars = w.bars || [];
        const st = bars.find((b) => b.kind === 'stock'), sec = bars.find((b) => b.kind === 'sector');
        if (!st || !sec || num(st.ret) == null || num(sec.ret) == null) return;
        const g = st.ret - sec.ret;
        bits.push('近 ' + w.days + ' 天' + (g >= 0 ? '跑赢' : '跑输') + ' ' + (Math.abs(g) * 100).toFixed(1) + ' 个百分点');
      });
      out.push({ label: '所在板块', ...word('sector'), detail: bits.join('；') });
    }
    return out;
  }

  function flowGlanceHTML(d) {
    const meta = d.meta || {}, fb = d.flow_by_size || {}, fd = d.flow_daily || {}, rs = d.relative_strength || {};
    const wr = (d.windows || {}).rows || [];
    const rows = fb.rows || [];
    const pick = (k) => { const r = rows.find((x) => x.size === k); return r && num(r.net) != null ? r.net : null; };
    const elg = pick('super_large'), lg = pick('large');
    const big = elg == null && lg == null ? null : (elg || 0) + (lg || 0);
    const win = meta.window || 5;
    const w = wr.find((r) => r.days === win) || null;
    const bars = rs.bars || [];
    const stock = bars.find((b) => b.kind === 'stock') || null, sector = bars.find((b) => b.kind === 'sector') || null;
    const c = { win: win, elg: elg, lg: lg, big: big, ret: w && num(w.ret) != null ? w.ret : stock ? num(stock.ret) : null, rate: w ? num(w.net_rate) : null, stock: stock, sector: sector };
    const rv = d.review, st = d.review_state;
    const days = fd.days || [];

    // 头：大数字
    const md = pick('medium'), sm = pick('small');
    const lastNet = days.length ? num(days[days.length - 1].net) : null;
    const tv = (v, txt) => '<span style="' + MONO + ';color:' + (v == null ? '#A1A7B2' : v > 0 ? '#FF8F86' : v < 0 ? '#6FD39A' : '#FFFFFF') + '">' + (txt || fmtFlow(v)) + '</span>';
    const trow = (k, v, strong, txt) => '<div style="display:flex;justify-content:space-between;gap:12px;' + (strong ? 'font-weight:600;padding-top:3px;border-top:1px solid #3A4250;margin-top:2px' : '') + '"><span style="color:' + (strong ? '#FFFFFF' : '#A1A7B2') + '">' + k + '</span>' + tv(v, txt) + '</div>';
    const small = md == null && sm == null ? null : (md || 0) + (sm || 0);
    const tipPop = big == null ? '' : '<span class="tip-pop" role="tooltip" style="text-align:left;left:auto;right:0"><div style="font-weight:600;margin-bottom:6px">近 ' + win + ' 天资金明细</div>' +
      trow('超大单', elg) + trow('大单', lg) + trow('大资金合计', big, true) +
      '<div style="height:6px"></div>' + trow('中单', md) + trow('小单', sm) + trow('小额资金合计', small, true) +
      '<div style="height:6px"></div>' +
      (c.rate != null ? trow('净流入占成交额', c.rate, false, pct(c.rate, 1)) : '') +
      (lastNet != null ? trow('最近一天（' + mdSlash(days[days.length - 1].date) + '）', lastNet) : '') +
      (num(fd.in_days) != null ? '<div style="display:flex;justify-content:space-between;gap:12px"><span style="color:#A1A7B2">近 ' + days.length + ' 天</span><span>' + fd.in_days + ' 天流入 · ' + fd.out_days + ' 天流出</span></div>' : '') +
      '<div style="margin-top:8px;font-size:13px;color:#8A919E;line-height:1.6">大资金 = 超大单 + 大单，大单不等于机构；数据来自' + esc((meta.sources || {}).flow || '资金流接口') + '，为推算值，各软件口径不同。</div></span>';

    let hero;
    if (big == null) {
      hero = '<span style="font-size:15px;color:#8A919E">这只股票暂时没有资金流数据</span>';
    } else {
      const pt = flowParts(big);
      hero = '<span class="tip" tabindex="0" aria-label="鼠标移上来看资金明细" style="display:flex;flex-direction:column;gap:2px;min-width:0"><span style="font-size:14px;color:#8A919E">近 ' + win + ' 天大资金净' + (big >= 0 ? '流入' : '流出') + '</span>' +
        '<span style="' + MONO + ';font-size:26px;font-weight:700;line-height:1.2;color:' + signColor(big) + '">' + (big > 0 ? '+' : big < 0 ? '−' : '') + pt.n + '<span style="font-size:14px;font-weight:600;margin-left:3px">' + pt.unit + '</span></span>' + tipPop + '</span>';
    }

    // 净流入率：四个时间一排，数字变小就是在放缓。
    const rates = wr.filter((r) => num(r.net_rate) != null);
    const strip = rates.length ? '<div style="display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid #F1F2F4;border-bottom:1px solid #F1F2F4"><span style="font-size:14px;color:#8A919E">净流入率 · 占成交额</span>' +
      '<div style="display:grid;grid-template-columns:repeat(' + rates.length + ',minmax(0,1fr));gap:8px">' + rates.map((r) =>
        '<div style="display:flex;flex-direction:column;gap:1px"><span style="' + MONO + ';font-size:16px;font-weight:600;color:' + signColor(Number((r.net_rate * 100).toFixed(1))) + '">' + pct(r.net_rate, 1) + '</span>' +
        '<span style="font-size:13px;color:#8A919E">近 ' + r.days + ' 天</span></div>').join('') + '</div></div>' : '';

    // 信号：左边问题，右边一句答案，有依据的点开看。
    const sigs = flowSignals(d, c);
    const sigRows = sigs.map((x) => {
      const head = '<span style="display:flex;align-items:center;gap:6px;font-weight:600;color:' + (x.tone === 'warn' ? '#7A4A00' : '#14171F') + '"><span aria-hidden="true" style="flex:none;width:8px;height:8px;border-radius:50%;background:' + TONE_DOT[x.tone] + '"></span>' + esc(x.value) + '</span>';
      let body;
      if (typeof x.detail === 'string') {
        body = '<div style="display:flex;flex-direction:column;gap:2px;min-width:0">' + head + (x.detail ? '<span style="font-size:14px;color:#5B6372;line-height:1.5">' + esc(x.detail) + '</span>' : '') + '</div>';
      } else {
        body = '<details class="acc" style="border-top:none;min-width:0"><summary style="padding:0">' + head + '<span style="font-size:13px;color:#A1A7B2;margin-left:auto">' + x.detail.length + ' 项依据</span></summary>' +
          '<div class="acc-body" style="padding:8px 0 0;gap:4px">' + x.detail.map((it) => '<span style="display:flex;gap:6px;font-size:14px;color:#5B6372;line-height:1.5"><span aria-hidden="true" style="flex:none;width:4px;height:4px;border-radius:50%;margin-top:7px;background:' + it.color + '"></span>' + esc(it.text) + '</span>').join('') + '</div></details>';
      }
      return '<div style="display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:start;padding:10px 0;border-top:1px solid #F1F2F4"><span style="font-size:14px;color:#5B6372;padding-top:1px">' + esc(x.label) + '</span>' + body + '</div>';
    }).join('');
    const table = '<div style="display:flex;flex-direction:column;margin-top:-6px">' + strip + (sigRows ? '<div style="display:flex;flex-direction:column">' + sigRows + '</div>' : '') + '</div>';

    // 一句话 + 来源（分析师结论；失败才用规则）
    const cc = flowConclusionOf(d);
    const behind = rv && !(cc && cc.pending) && (st === 'refreshing' || (rv.as_of && meta.as_of && rv.as_of < meta.as_of));
    const note = cc && cc.pending ? '资金流分析师正在分析，完成后自动给出结论。'
      : (d.analyst_failed || d._analystFailed) && cc && cc.source === 'rule' ? '资金流分析师没有给出结论，以下为规则摘要。'
      : !rv ? (st === 'unavailable' ? (d.review_error || '这只股票暂时没法做资金面体检。') : '') : '';
    const sentHTML = cc && !cc.pending ? '<div style="display:flex;flex-direction:column;gap:6px"><p style="margin:0;font-size:16px;font-weight:600;line-height:1.7;color:#14171F">' + esc(cc.text) + '</p>' +
      (behind ? '<span style="font-size:14px;color:#7A4A00">' + (st === 'refreshing' ? '这是上一份体检，新的正在生成，完成后自动更新。' : '这份体检基于 ' + esc(mmdd(rv.as_of)) + ' 的数据。') + '</span>' : '') + '</div>' : '';

    const head = '<div style="position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start"><div style="display:flex;flex-direction:column;gap:2px"><span style="font-size:14px;color:#8A919E">方向</span>' +
      '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span style="font-size:26px;font-weight:700;line-height:1.2;color:' + (cc ? HEAD_TONE[cc.status] || '#5B6372' : '#A1A7B2') + '">' + esc(cc ? cc.label : '暂无结论') + '</span>' + (cc && !cc.pending ? sourceChipHTML(d, cc) : '') + '</div></div>' +
      (big == null ? '' : hero) + '</div>';
    return '<div style="display:flex;flex-direction:column;gap:18px">' + head + sentHTML +
      (note ? '<span style="font-size:14px;color:#8A919E;line-height:1.7">' + esc(note) + '</span>' : '') +
      (big == null ? hero : '') + table + '</div>';
  }

  function flowHTML(d) {
    const meta = d.meta || {}, pv = d.price_volume || {}, fb = d.flow_by_size || {};
    const rs = d.relative_strength || {}, win = d.windows || {};
    const out = [];
    const cc = flowConclusionOf(d);
    const ruleText = d.verdict && d.verdict.text;

    const rvm = d.review;
    const rvStamp = cc && cc.source === 'model' && rvm && rvm.generated_at ? '生成于 ' + rvm.generated_at.slice(5) : '';
    out.push('<span style="font-size:14px;color:#8A919E;margin-bottom:-12px">' + esc(meta.status_text || '') + (rvStamp ? ' · ' + esc(rvStamp) : '') +
      (meta.state && meta.state !== 'ok' && meta.state !== 'expired' ? ' · <span style="color:#9A5B00">数据状态：' + esc(meta.state) + '</span>' : '') + '</span>');

    out.push(flowGlanceHTML(d));

    // 量价：图 + 形态 + 规则摘要
    const chart = volChartHTML(d);
    const pat = PV_PATTERN[pv.pattern] || { label: pv.pattern || '—', style: 'background:#F4F5F7;color:#5B6372' };
    const ud = num(pv.up_down_vol_ratio), to = num(pv.turnover), tp = num(pv.turnover_pctile);
    const desc = [
      ud != null ? '上涨日成交量是下跌日的 ' + ud.toFixed(2) + ' 倍' : '',
      to != null ? '换手率 ' + (to * 100).toFixed(2) + '%' + (tp != null ? '，高于近一年 ' + Math.round(tp * 100) + '% 的日子' : '') : '',
    ].filter(Boolean).join(' · ');
    const legend = '<span style="display:inline-flex;gap:10px"><span style="display:inline-flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:2px;background:' + UP + '"></span>上涨日</span>' +
      '<span style="display:inline-flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:2px;background:' + DOWN + '"></span>下跌日</span></span>';
    const chartDays = ((pv.chart || {}).days) || ((pv.chart || {}).bars || []).length || (pv.bars || []).length || (meta.window || 5);
    const chartRight = chart
      ? '<span style="display:inline-flex;align-items:center;gap:10px"><span>近 ' + chartDays + ' 天</span>' + legend + '</span>'
      : '';
    out.push(colBox(8) + secTitle('量价：涨的时候有没有人跟', chartRight) + chart +
      '<span style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><span class="pill" style="' + pat.style + '">' + esc(pat.label) + '</span>' +
      '<span style="font-size:14px;color:#5B6372">' + esc(desc) + '</span></span>' +
      (ruleText && cc && cc.source === 'model' ? '<span style="font-size:14px;color:#5B6372;line-height:1.7"><b style="font-weight:600;color:#3A4250">规则摘要：</b>' + esc(ruleText) + '</span>' : '') + '</div>');

    // 相对强弱：主窗口柱状 + 3 / 5 / 20 对照表
    const rbars = rs.bars || [];
    const rwins = (rs.windows && rs.windows.length) ? rs.windows : (rbars.length ? [{ days: meta.window || 5, bars: rbars, sector_flow: rs.sector_flow, net_rate_vs_sector: rs.net_rate_vs_sector }] : []);
    if (rbars.length || rwins.length) {
      const maxR = Math.max.apply(null, rbars.map((b) => Math.abs(b.ret)).concat([0.0001]));
      const items = rbars.map((b) => {
        const self = b.kind === 'stock';
        return '<span style="color:#3A4250;' + (self ? 'font-weight:600' : '') + '">' + esc(b.name) + '</span>' +
          '<div style="height:8px;border-radius:2px;background:#F1F2F4"><div style="width:' + (Math.abs(b.ret) / maxR * 100).toFixed(1) + '%;height:8px;border-radius:2px;background:' + (self ? '#14171F' : '#A1A7B2') + '"></div></div>' +
          '<span style="' + MONO + ';text-align:right;color:' + signColor(b.ret) + ';' + (self ? 'font-weight:600' : '') + '">' + pct(b.ret, 1) + '</span>';
      }).join('');
      const nr = num(rs.net_rate_vs_sector);
      const th = (t, left) => '<th style="padding:6px 0;font-weight:400;color:#8A919E;text-align:' + (left ? 'left' : 'right') + '">' + t + '</th>';
      const td = (t, extra) => '<td style="padding:6px 0;' + MONO + ';text-align:right;' + (extra || '') + '">' + t + '</td>';
      const cmp = rwins.length > 1 ? '<table style="width:100%;border-collapse:collapse;font-size:14px;margin-top:8px"><thead><tr>' +
        th('窗口', true) + th('本股') + th('板块') + th('相对') + '</tr></thead><tbody>' +
        rwins.map((w) => {
          const bars = w.bars || [];
          const st = bars.find((b) => b.kind === 'stock'), sec = bars.find((b) => b.kind === 'sector');
          const sr = st ? num(st.ret) : null, cr = sec ? num(sec.ret) : null;
          const gap = sr != null && cr != null ? sr - cr : null;
          return '<tr style="' + ROW + '"><td style="padding:6px 0;color:#3A4250">' + esc(w.days) + ' 天</td>' +
            td(sr != null ? pct(sr, 1) : '—', sr != null ? 'color:' + signColor(sr) : '') +
            td(cr != null ? pct(cr, 1) : '—', cr != null ? 'color:' + signColor(cr) : '') +
            td(gap != null ? ((gap >= 0 ? '+' : '') + (gap * 100).toFixed(1) + ' 百分点') : '—', gap != null ? 'color:' + signColor(gap) : '') + '</tr>';
        }).join('') + '</tbody></table>' : '';
      out.push(colBox(8) + secTitle('相对强弱：是它强，还是大家都在涨', esc((meta.window || 5) + ' 天涨幅 · 3/5/20 对照')) +
        (rbars.length ? '<div style="display:grid;grid-template-columns:64px minmax(0,1fr) 56px;align-items:center;gap:8px 10px">' + items + '</div>' : '') +
        (rs.sector_flow ? '<span style="font-size:14px;color:#5B6372">近 ' + (meta.window || 5) + ' 天板块整体资金' + (rs.sector_flow === 'in' ? '流入' : '流出') +
          (nr != null ? '，个股净流入率' + (nr >= 0 ? '高于' : '低于') + '板块 ' + (Math.abs(nr) * 100).toFixed(1) + ' 个百分点' : '') + '</span>' : '') +
        cmp + '</div>');
    }

    const rvBody = reviewBodyHTML(d);
    if (rvBody) out.push(rvBody);

    // 完整数据
    const wr = win.rows || [];
    if (wr.length) {
      const th = (t, left) => '<th style="padding:6px 0;font-weight:400;color:#8A919E;text-align:' + (left ? 'left' : 'right') + '">' + t + '</th>';
      const td = (t, extra) => '<td style="padding:7px 0;' + MONO + ';text-align:right;' + (extra || '') + '">' + t + '</td>';
      out.push(colBox(4) + secTitle('完整数据', '') +
        '<table style="width:100%;border-collapse:collapse;font-size:15px"><thead><tr>' + th('窗口', true) + th('涨幅') + th('相对量能') + th('净流入率') + '</tr></thead><tbody>' +
        wr.map((r) => '<tr style="' + ROW + '"><td style="padding:7px 0;color:#3A4250">' + esc(r.days) + ' 天</td>' +
          td(pct(r.ret, 1), 'color:' + signColor(Number((r.ret * 100).toFixed(1)))) + td(esc(num(r.rel_vol) != null ? r.rel_vol.toFixed(2) : '—')) + td(num(r.net_rate) != null ? pct(r.net_rate, 1) : '—', num(r.net_rate) != null ? 'color:' + signColor(Number((r.net_rate * 100).toFixed(1))) : '') + '</tr>').join('') +
        '</tbody></table>' + (win.formula_text ? '<span style="font-size:13px;color:#8A919E">' + esc(win.formula_text) + '</span>' : '') + '</div>');
    }

    const src = meta.sources || {};
    out.push('<span style="margin-top:auto;font-size:13px;color:#A1A7B2;line-height:1.6">' +
      (src.price_volume || src.flow ? '量价来自' + esc(src.price_volume || '—') + '；资金流来自' + esc(src.flow || '—') + '，为推算值，各软件口径不同。' : '') +
      esc(noDisclaimer(d.disclaimer_text)) + '</span>');
    return out.join('');
  }

  // ---- 资金面体检（volume_flow/detail 的 review 字段）----
  // review_state: ready / refreshing（先给上一份，新的在后台生成）/ computing（还没有）/ unavailable / disabled
  const RV_STATUS = {
    support: { text: '偏正面', style: 'background:#EAF0FD;color:#1F3F8A' },
    neutral: { text: '中性', style: 'background:#F4F5F7;color:#5B6372' },
    warn: { text: '需警惕', style: 'background:#FFF4E0;color:#7A4A00' },
    missing: { text: '数据缺失', style: 'background:#F4F5F7;color:#A1A7B2' },
  };
  const RV_SOURCE = { model: 'AI 解读', template: '规则模板', mixed: 'AI + 规则' };
  const rvPill = (text, style) => '<span class="pill" style="' + style + '">' + esc(text) + '</span>';
  const rvStatus = (st, text) => { const m = RV_STATUS[st] || RV_STATUS.neutral; return rvPill(text || m.text, m.style); };

  // 一行一项：短的左右对齐；长文本（主营描述、季度序列等）标签在上、内容在下并自动换行，不撑破面板。
  function rvEvidence(list) {
    const rows = (list || []).filter((e) => e && e.label);
    if (!rows.length) return '';
    return '<div style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;font-size:14px">' +
      rows.map((e) => {
        const t = String(e.text == null ? '' : e.text);
        if (t.length > 18) return '<span style="grid-column:1/-1;color:#5B6372;line-height:1.5;margin-top:3px">' + esc(e.label) + '</span><span style="grid-column:1/-1;color:#14171F;line-height:1.6;overflow-wrap:anywhere">' + esc(t) + '</span>';
        return '<span style="color:#5B6372;line-height:1.5">' + esc(e.label) + '</span><span style="' + MONO + ';text-align:right;color:#14171F;white-space:nowrap">' + esc(t) + '</span>';
      }).join('') + '</div>';
  }

  // 折叠行：一行标题，点开才看说明。
  const accRow = (head, body) => '<details class="acc"><summary>' + head + '</summary><div class="acc-body">' + body + '</div></details>';
  // 放在图表后面：十个问题的回答，以及体检用到的全部数据。
  // “偏空”旁边：有体检数据时是“依据”按钮，点开看体检用到的全部数据（标题里写结论来源）；没有就只标结论来源。
  function sourceChipHTML(d, cc, extra) {
    const text = cc ? HEAD_SOURCE[cc.source] || '' : '';
    const rv = d.review, facts = (rv && rv.facts) || [];
    if (!text && !extra) return '';
    if (!facts.length && !extra) return '<span style="display:inline-flex;padding:2px 8px;border-radius:999px;background:#F4F5F7;color:#5B6372;font-size:14px;line-height:20px;white-space:nowrap">' + text + '</span>';
    const groups = facts.length ? (rv.fact_groups && rv.fact_groups.length ? rv.fact_groups : facts.map((f) => f.group).filter((g, i, a) => a.indexOf(g) === i)) : [];
    const miss = (rv && rv.missing) || [];
    const label = facts.length ? '体检用到的全部数据 · ' + facts.length + ' 项' : '判断依据';
    return '<details class="facts"><summary title="点开看' + label + '" aria-label="' + label + '">依据<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg></summary>' +
      '<div class="facts-pop"><div style="display:flex;flex-direction:column;gap:10px">' +
      (extra || '') +
      '<span style="font-weight:600;color:#14171F">' + (text ? text + ' · ' : '') + label + '</span>' +
      groups.map((g) => {
        const rows = facts.filter((f) => f.group === g);
        return rows.length ? '<div style="display:flex;flex-direction:column;gap:3px"><span style="font-weight:600;color:#3A4250">' + esc(g) + '</span>' + rvEvidence(rows) + '</div>' : '';
      }).join('') +
      (miss.length ? '<span style="color:#8A919E;line-height:1.7">没取到的数据：' + esc(miss.join('；')) + '</span>' : '') + '</div></div></details>';
  }

  function reviewBodyHTML(d) {
    const rv = d.review;
    if (!rv) return '';
    const out = [];
    const sumText = ((d.headline || {}).text) || (rv.summary || {}).text;
    const items = (rv.items || []).filter((it) => !(sumText && it.answer === sumText));
    if (items.length) {
      out.push('<div style="display:flex;flex-direction:column;gap:2px">' + secTitle('逐项解读', items.length + ' 个问题 · 点开看回答') + '<div class="acc-list">' + items.map((it) => accRow(
        '<span style="min-width:0">' + esc(it.title) + '</span>' + rvStatus(it.status, it.status_text),
        '<span style="font-size:14px;color:#8A919E;line-height:1.6">' + esc(it.ask || '') + '</span>' +
        '<span style="color:#3A4250;line-height:1.7">' + esc(it.answer) + '</span>' + rvEvidence(it.evidence))).join('') + '</div></div>');
    }
    return out.join('');
  }

  document.addEventListener('click', (e) => { document.querySelectorAll('details.facts[open]').forEach((el) => { if (!el.contains(e.target)) el.open = false; }); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') document.querySelectorAll('details.facts[open]').forEach((el) => { el.open = false; }); });

  // 后台还在生成的面板：详情先返回，没生成好就隔几秒悄悄再取一次，不重新显示"分析中"。
  // 五维：等分析师 headline（或失败标记）；新闻正文 computing 仍在 waitNews 里处理。
  const analystPending = {
    state: (d) => (d.headline && d.headline.text) ? 'ready' : (d.analyst_failed ? 'failed' : 'computing'),
    pending: (st) => st === 'computing',
  };
  const PENDING = {
    fund: analystPending,
    fin: analystPending,
    sector: analystPending,
    flow: analystPending,
    news: analystPending,
  };
  function bodyPending(d) {
    if (!d) return false;
    const meta = d.meta || {};
    return meta.state === 'computing' || d.review_state === 'computing';
  }
  function keepAnalystHeadline(prev, fresh) {
    if (!prev || !prev._analystHeadline) return fresh;
    const next = Object.assign({}, fresh);
    if (prev._analystHeadline.text) {
      next.headline = prev._analystHeadline;
      next.analyst_failed = false;
    }
    next._analystHeadline = prev._analystHeadline;
    return next;
  }
  function watchPending(dim, code, entry, n) {
    const P = PENDING[dim];
    const waitingHeadline = P && entry.data && P.pending(P.state(entry.data));
    if ((!P || !waitingHeadline) && !bodyPending(entry.data)) return;
    const redraw = () => { const root = document.getElementById(DIMS[dim].rootId); if (root) root.dataset.key = ''; renderDims(); renderTabs(); };
    if (n >= 30) {
      // 等了三分钟还没出来：不再等；按分析失败，回退规则 verdict。
      entry.data._stalled = true;
      entry.data.analyst_failed = true;
      if (dimCache[dim + ':' + code] === entry) redraw();
      return;
    }
    setTimeout(() => {
      const key = dim + ':' + code;
      if (dimCache[key] !== entry) return;
      fetchStockJSON(API_BASE + '/api/v1/stocks/' + encodeURIComponent(code) + '/dimensions/' + DIMS[dim].path)
        .then((fresh) => {
          if (dimCache[key] !== entry) return;
          const before = P ? P.state(entry.data) : '';
          const bodyBefore = bodyPending(entry.data);
          const hadMeta = !!(entry.data && entry.data.meta);
          entry.data = keepAnalystHeadline(entry.data, fresh);
          const after = P ? P.state(entry.data) : '';
          if (before !== after || bodyBefore !== bodyPending(entry.data) || (!hadMeta && entry.data && entry.data.meta)) redraw();
          watchPending(dim, code, entry, n + 1);
        })
        .catch(() => watchPending(dim, code, entry, n + 1));
    }, 6000);
  }

  // ===== 基本面维度 =====
  // GET {stock-api-base}/api/v1/stocks/{ts_code}/dimensions/fundamental/detail
  const CELL_LABEL = { valuation: '估值', quality: '质地', holders: '股东行为' };
  const QUALITY_LABEL = { profitability: '盈利能力', growth: '成长性', solvency: '财务稳健', cash: '现金创造', payout: '股东回报' };
  const HOLDER_IMPACT = {
    bullish: { label: '偏多', color: UP_TXT }, positive: { label: '偏多', color: UP_TXT },
    bearish: { label: '偏空', color: DOWN_TXT }, negative: { label: '偏空', color: DOWN_TXT },
  };
  const WEAK = '#7A4A00', WEAK_DOT = '#B87400', BRAND = '#2457D6';
  const fmtTable = (v, format) => {
    if (num(v) == null) return '—';
    return format === 'percent' ? (v * 100).toFixed(1) + '%' : format === 'ratio' ? v.toFixed(2) : v.toFixed(1);
  };

  function valChartHTML(series, label, kind) {
    const h = series || {};
    const n = Math.min((h.dates || []).length, (h.values || []).length);
    if (n < 2) return '';
    const vals = h.values.slice(0, n), dates = h.dates.slice(0, n);
    const finite = vals.filter((v) => v != null && v === v);
    if (finite.length < 2) return '';
    const edge = [num(h.p20), num(h.p80)].filter((x) => x != null);
    const lo = Math.min.apply(null, finite.concat(edge)), hi = Math.max.apply(null, finite.concat(edge));
    const TOP = 16, BOT = 116;
    const x = (i) => 6 + (i / (n - 1)) * 372;
    const y = (val) => BOT - ((val - lo) / (hi - lo || 1)) * (BOT - TOP);
    let svg = '';
    if (edge.length === 2) {
      svg += '<rect x="0" y="' + y(h.p80).toFixed(1) + '" width="384" height="' + (y(h.p20) - y(h.p80)).toFixed(1) + '" fill="#F1F2F4"></rect>' +
        [h.p80, h.p20].map((p) => '<line x1="0" y1="' + y(p).toFixed(1) + '" x2="384" y2="' + y(p).toFixed(1) + '" stroke="#C9CED6" stroke-dasharray="3 3"></line>').join('');
    }
    let seg = [];
    const flush = () => {
      if (seg.length < 2) { seg = []; return; }
      svg += '<polyline points="' + seg.map((p) => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ') +
        '" fill="none" stroke="#14171F" stroke-width="1.5" stroke-linejoin="round"></polyline>';
      seg = [];
    };
    vals.forEach((val, i) => { if (val == null || val !== val) flush(); else seg.push([x(i), y(val)]); });
    flush();
    let last = n - 1;
    while (last >= 0 && (vals[last] == null || vals[last] !== vals[last])) last -= 1;
    if (last >= 0) svg += '<circle cx="' + x(last).toFixed(1) + '" cy="' + y(vals[last]).toFixed(1) + '" r="3.5" fill="' + BRAND + '" stroke="#FFFFFF" stroke-width="1.5"></circle>';
    if (edge.length === 2) {
      svg += '<text x="384" y="' + (y(h.p80) - 4).toFixed(1) + '" text-anchor="end" font-size="10" fill="#8A919E">80% 分位 ' + h.p80.toFixed(2) + '</text>' +
        '<text x="384" y="' + (y(h.p20) + 12).toFixed(1) + '" text-anchor="end" font-size="10" fill="#8A919E">20% 分位 ' + h.p20.toFixed(2) + '</text>';
    }
    const step = 372 / (n - 1);
    vals.forEach((val, i) => {
      const bx = Math.max(0, x(i) - step / 2), bw = Math.min(384, x(i) + step / 2) - bx;
      const cy = val == null || val !== val ? '' : y(val).toFixed(1);
      svg += '<rect class="bh" data-i="' + i + '" data-x="' + x(i).toFixed(1) + '"' + (cy ? ' data-y="' + cy + '"' : '') + ' x="' + bx.toFixed(1) + '" y="0" width="' + bw.toFixed(2) + '" height="' + BOT + '" fill="transparent"></rect>';
    });
    svg += '<text x="0" y="136" font-size="10" fill="#8A919E">5 年前</text><text x="384" y="136" text-anchor="end" font-size="10" fill="#8A919E">今天</text>' +
      '<line class="xh-line" x1="0" y1="8" x2="0" y2="' + BOT + '" stroke="#14171F" stroke-width="1" opacity="0.35" pointer-events="none" style="display:none"></line>' +
      '<circle class="xh-dot" cx="0" cy="0" r="3.5" fill="#14171F" stroke="#FFFFFF" stroke-width="1.5" pointer-events="none" style="display:none"></circle>';
    const data = dates.map((dt, i) => [dt, vals[i], null, false]);
    return '<div class="chart-wrap" style="position:relative" data-kind="' + (kind === 'valuation' ? 'valuation' : 'fund-price') + '" data-label="' + esc(label) + '" data-xh-bottom="' + BOT + '" data-bars="' + esc(JSON.stringify(data)) + '">' +
      '<svg viewBox="0 0 384 138" role="img" aria-label="' + esc(label || '走势') + '" style="width:100%;height:auto;display:block">' + svg + '</svg>' +
      '<div class="chart-tip" role="tooltip" hidden></div></div>';
  }

  function peerStripHTML(d) {
    const v = d.valuation || {};
    const peers = (v.peers || []).filter((p) => num(p.value) != null);
    if (peers.length < 2) return '';
    const sorted = peers.map((p) => p.value).sort((a, b) => a - b);
    // Trim the extremes so one outlier can't squash everyone else into a corner.
    const lo = sorted[Math.floor(0.05 * (sorted.length - 1))], hi = sorted[Math.ceil(0.95 * (sorted.length - 1))];
    const pos = (val) => (4 + Math.min(1, Math.max(0, (val - lo) / (hi - lo || 1))) * 92).toFixed(1);
    const dots = peers.map((p) => p.is_self
      ? '<span title="' + esc(p.name + ' ' + p.value) + '" style="position:absolute;left:calc(' + pos(p.value) + '% - 6px);top:8px;width:12px;height:12px;border-radius:50%;background:' + BRAND + ';border:2px solid #FFFFFF;box-sizing:border-box"></span>'
      : '<span title="' + esc(p.name + ' ' + p.value) + '" style="position:absolute;left:calc(' + pos(p.value) + '% - 4px);top:10px;width:8px;height:8px;border-radius:50%;background:#C9CED6"></span>').join('');
    const med = num(v.peer_median);
    const metric = (v.metric_text || '').replace(/（.*$/, '');
    return '<div style="position:relative;height:28px"><div style="position:absolute;left:0;right:0;top:13px;height:2px;background:#EEF0F3"></div>' + dots +
      (med != null ? '<span style="position:absolute;left:calc(' + pos(med) + '% - 1px);top:4px;width:2px;height:20px;background:#5B6372"></span>' : '') + '</div>' +
      '<div style="display:flex;font-size:13px;color:#8A919E"><span>同行 ' + peers.filter((p) => !p.is_self).length + ' 家 · ' + esc(metric) + ' · <span style="color:' + BRAND + '">● 本公司</span></span>' +
      (med != null ? '<span style="margin-left:auto">竖线为行业中位数 ' + med.toFixed(1) + '</span>' : '') + '</div>';
  }

  // 三格小结：估值 / 质地 / 股东行为。level → 圆点颜色（偏便宜、较好、股东偏多 = 好；偏贵、偏弱、股东偏空 = 要留意）。
  const CELL_TONE = { cheap: 'ok', strong: 'ok', positive: 'ok', expensive: 'warn', weak: 'warn', negative: 'warn' };

  // 业务驱动和客户：模型整理的背景，不是实时数据。
  function profileHTML(d) {
    const p = (d.review || {}).profile;
    if (!p) return '';
    const up = (p.drivers_up || []).filter(Boolean), down = (p.drivers_down || []).filter(Boolean), pt = (p.partners || []).filter((x) => x && x.name);
    if (!up.length && !down.length && !pt.length && !p.link) return '';
    const list = (title, items, color) => items.length ? '<div style="display:flex;flex-direction:column;gap:3px"><span style="font-weight:600;color:#3A4250">' + title + '</span>' + items.map((t) =>
      '<span style="display:flex;gap:6px;font-size:14px;color:#5B6372;line-height:1.6"><span aria-hidden="true" style="flex:none;width:4px;height:4px;border-radius:50%;margin-top:8px;background:' + color + '"></span>' + esc(t) + '</span>').join('') + '</div>' : '';
    return '<div style="display:flex;flex-direction:column;gap:2px">' + secTitle('业务驱动和客户', '模型整理 · 点开看') + '<div class="acc-list">' + accRow(
      '<span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#14171F">' + esc(p.link || '行业利好、利空因素和主要客户') + '</span>',
      (p.link ? '<span style="font-size:15px;color:#3A4250;line-height:1.7">' + esc(p.link) + '</span>' : '') +
      list('利好因素', up, UP) + list('利空因素', down, DOWN) +
      (pt.length ? '<div style="display:flex;flex-direction:column;gap:3px"><span style="font-weight:600;color:#3A4250">主要客户和渠道</span>' + pt.map((x) =>
        '<span style="font-size:14px;color:#5B6372;line-height:1.6">' + esc(x.name) + (x.relation || x.note ? ' · ' + esc([x.relation, x.note].filter(Boolean).join('，')) : '') + '</span>').join('') + '</div>' : '') +
      (p.note ? '<span style="font-size:13px;color:#A1A7B2;line-height:1.6">' + esc(p.note) + '</span>' : '')) + '</div></div>';
  }

  function reviewFactText(d, id) {
    const row = (((d.review || {}).facts) || []).find((f) => f && f.id === id);
    return row && row.text ? String(row.text) : '';
  }
  const fundLine = (html) => (/^<(div|details|span style="display:flex)/.test(html) ? html : '<span style="font-size:14px;color:#5B6372;line-height:1.7">' + html + '</span>');
  function fundPeerPhrase(p) {
    if (p == null) return '没有同行对照';
    const n = Math.round(p * 100);
    if (n >= 80) return '在同行里靠前，' + n + '% 分位';
    if (n <= 20) return '在同行里偏后，' + n + '% 分位';
    return '在同行里居中，' + n + '% 分位';
  }
  function fundLeadRow(label, title, tone, lines) {
    const body = (lines || []).filter(Boolean).map(fundLine).join('');
    return '<div style="display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:start;padding:10px 0;border-top:1px solid #F1F2F4">' +
      '<span style="font-size:14px;color:#5B6372;padding-top:1px">' + esc(label) + '</span><div style="display:flex;flex-direction:column;gap:4px;min-width:0">' +
      '<span style="display:flex;align-items:center;gap:6px;font-weight:600;color:' + (tone === 'warn' ? '#7A4A00' : '#14171F') + '"><span aria-hidden="true" style="flex:none;width:8px;height:8px;border-radius:50%;background:' + TONE_DOT[tone || 'neutral'] + '"></span>' + esc(title) + '</span>' +
      body + '</div></div>';
  }
  // 基本面的四行小结：每行一句结论 + 一小块图或几个数字；长段说明收起来，要看再点开。
  const PEER_WORD = (p) => (p == null ? { t: '—', c: '#A1A7B2' } : p >= 0.8 ? { t: '靠前', c: '#1E6B44' } : p <= 0.2 ? { t: '靠后', c: '#7A4A00' } : { t: '居中', c: '#5B6372' });
  function fundSummaryHTML(d) {
    const val = d.valuation || {}, q = d.quality || {}, biz = d.business || {};
    const cells = {};
    (d.cells || []).forEach((c) => { if (c && c.key) cells[c.key] = c; });
    const rows = [];
    const small = (html) => '<span style="font-size:14px;color:#5B6372;line-height:1.6">' + html + '</span>';

    // 靠什么赚钱：产品构成画成几条横条，概念收起来
    const lines = (biz.items || []).filter((it) => it && it.item);
    const concepts = reviewFactText(d, 'fd.concepts').split(/[；;]/).map((x) => x.replace(/[，,]\s*业务占比.*$/, '').trim()).filter(Boolean);
    if (lines.length || concepts.length) {
      const top = lines[0];
      const mix = lines.slice(0, 4).map((it) => {
        const share = num(it.share);
        return '<div style="display:grid;grid-template-columns:minmax(0,1fr) 52px 84px;align-items:center;gap:8px;font-size:14px"><span title="' + esc(it.item) + '" style="color:#3A4250;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(it.item) + '</span>' +
          '<div style="height:6px;border-radius:3px;background:#F1F2F4"><div style="width:' + (share == null ? 0 : Math.min(100, share * 100)).toFixed(1) + '%;height:6px;border-radius:3px;background:#2457D6"></div></div>' +
          '<span style="' + MONO + ';text-align:right;color:#14171F;white-space:nowrap" title="' + esc([num(it.sales_yi) != null ? '营收 ' + it.sales_yi.toFixed(1) + ' 亿元' : '', num(it.gross_margin) != null ? '毛利率 ' + (it.gross_margin * 100).toFixed(1) + '%' : '', num(it.yoy) != null ? '同比 ' + (pct(it.yoy, 1) || '0.0%') : ''].filter(Boolean).join('，')) + '">' +
          (share != null ? (share * 100).toFixed(1) + '%' : '—') + (num(it.gross_margin) != null ? '<span style="color:#8A919E"> · 毛' + (it.gross_margin * 100).toFixed(0) + '</span>' : '') + '</span></div>';
      }).join('');
      const chips = concepts.length ? '<span style="display:flex;flex-wrap:wrap;gap:4px;align-items:center"><span style="font-size:13px;color:#8A919E">挂的概念</span>' + concepts.slice(0, 4).map((c) => '<span class="pill" style="background:#F4F5F7;color:#5B6372">' + esc(c) + '</span>').join('') +
        (concepts.length > 4 ? '<span title="' + esc(concepts.slice(4).join('、')) + '" style="font-size:13px;color:#8A919E">等 ' + concepts.length + ' 个</span>' : '') + '</span>' : '';
      rows.push(fundLeadRow('靠什么赚钱', top ? top.item + (num(top.share) != null ? ' · ' + (top.share * 100).toFixed(0) + '%' : '') : '主营', 'neutral',
        [mix ? '<span style="display:flex;flex-direction:column;gap:5px;width:100%">' + mix + '</span>' : '', chips]));
    }

    // 估值：一行数字，换口径的原因只留半句
    const vc = cells.valuation;
    if (vc) {
      const metric = (val.metric_text || '估值').replace(/（.*$/, '');
      const gap = num(val.value) != null && num(val.peer_median) ? val.value / val.peer_median - 1 : null;
      const facts = [num(val.value) != null ? '<b style="' + MONO + ';color:#14171F">' + esc(metric) + ' ' + esc(String(val.value)) + ' 倍</b>' : '',
        num(val.pctile_5y) != null ? '近 5 年 ' + Math.round(val.pctile_5y * 100) + '% 分位' : '',
        gap != null ? (gap >= 0 ? '高于' : '低于') + '同行 ' + (Math.abs(gap) * 100).toFixed(0) + '%' : ''].filter(Boolean);
      rows.push(fundLeadRow('估值', vc.level_text || '—', CELL_TONE[vc.level] || 'neutral',
        [facts.length ? facts.join(' · ') : (vc.note_text ? esc(vc.note_text) : ''), val.metric_reason ? '<span style="color:#7A4A00">已改用' + esc(metric) + '：' + esc(val.metric_reason) + '</span>' : '']));
    }

    // 质地：五项各占一格，只写数字和在同行里的位置
    const qc = cells.quality;
    if (qc) {
      const items = q.items || [];
      const weakKey = q.weakest && q.weakest.key;
      const grid = items.length ? '<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 14px;width:100%">' + items.map((it) => {
        const pw = PEER_WORD(num(it.peer_pctile)), weak = it.key === weakKey;
        const tip = [it.key === 'growth' ? '三年营收复合增速；历史不够三年时退回最近一期同比' : '', it.note_text || '', weak ? '这是目前最弱的一项' : ''].filter(Boolean).join('。');
        return '<span title="' + esc(tip) + '" style="display:flex;align-items:baseline;gap:6px;font-size:14px;white-space:nowrap"><span style="color:#5B6372">' + esc(QUALITY_LABEL[it.key] || it.key) + '</span>' +
          '<b style="' + MONO + ';color:' + (weak ? '#7A4A00' : '#14171F') + '">' + esc(it.value_text || '—') + '</b><span style="color:' + (weak ? '#7A4A00' : pw.c) + '">' + (weak ? '最弱' : pw.t) + '</span></span>';
      }).join('') + '</div>' : '';
      rows.push(fundLeadRow('质地', qc.level_text || '—', CELL_TONE[qc.level] || 'neutral', [grid || (qc.note_text ? esc(qc.note_text) : '')]));
    }

    // 股东行为：只说有没有，明细在下面
    const hc = cells.holders;
    if (hc) {
      const n = (d.holder_events || []).length;
      rows.push(fundLeadRow('股东行为', hc.level_text || '—', CELL_TONE[hc.level] || 'neutral', [n ? '近期 ' + n + ' 件股东动作，见下方' : '近期没有股东动作']));
    }
    return rows.join('');
  }

  function fundHTML(d) {
    const meta = d.meta || {}, val = d.valuation || {}, q = d.quality || {}, rv = d.review;
    const out = [];
    const cc = conclusionOf(d);

    const stamp = cc && cc.source === 'model' && rv && rv.generated_at ? '生成于 ' + rv.generated_at.slice(5) : '';
    out.push('<span style="font-size:14px;color:#8A919E;margin-bottom:-12px">' + esc(meta.status_text || '') + (stamp ? ' · ' + esc(stamp) : '') +
      (meta.state && meta.state !== 'ok' ? ' · <span style="color:#9A5B00">数据状态：' + esc(meta.state) + '</span>' : '') + '</span>');

    // 头：方向 + 估值（最关键的一个数）
    const unit = /市盈率|市净率|市销率/.test(val.metric_text || '') ? ' 倍' : '';
    const left = '<div style="display:flex;flex-direction:column;gap:2px"><span style="font-size:14px;color:#8A919E">方向</span>' +
      '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span style="font-size:26px;font-weight:700;line-height:1.2;color:' + (cc ? HEAD_TONE[cc.status] || '#5B6372' : '#A1A7B2') + '">' + esc(cc ? cc.label : '暂无结论') + '</span>' + (cc && !cc.pending ? sourceChipHTML(d, cc) : '') + '</div></div>';
    const right = num(val.value) == null ? '' : '<div style="display:flex;flex-direction:column;gap:2px;min-width:0"><span style="font-size:14px;color:#8A919E">' + esc((val.metric_text || '估值').replace(/（.*$/, '')) + '</span>' +
      '<span style="' + MONO + ';font-size:26px;font-weight:700;line-height:1.2">' + esc(val.value) + '<span style="font-size:14px;font-weight:600;margin-left:3px">' + unit.trim() + '</span></span></div>';
    const head = '<div style="position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start">' + left + right + '</div>';
    const sentence = cc && !cc.pending && cc.text ? '<p style="margin:0;font-size:16px;font-weight:600;line-height:1.7;color:#14171F">' + esc(cc.text) + '</p>' : '';
    const note = cc && cc.pending ? '<span style="font-size:14px;color:#8A919E;line-height:1.7">基本面分析师正在分析，完成后自动给出结论。</span>'
      : (d.analyst_failed || d._analystFailed) && cc && cc.source === 'rule' ? '<span style="font-size:14px;color:#8A919E;line-height:1.7">基本面分析师没有给出结论，以下为规则摘要。</span>'
      : !rv && d.review_state === 'unavailable' ? '<span style="font-size:14px;color:#8A919E;line-height:1.7">' + esc(d.review_error || '这只股票暂时没法做基本面体检。') + '</span>' : '';

    const rows = fundSummaryHTML(d);
    out.push('<div style="display:flex;flex-direction:column;gap:18px">' + head + sentence + note + (rows ? '<div style="display:flex;flex-direction:column;margin-top:-6px">' + rows + '</div>' : '') + '</div>');

    // 价格高不高：当前价在近 5 年收盘价里的位置
    const px = d.price || {};
    if (num(px.close) != null && (px.history || {}).dates && px.history.dates.length > 1) {
      const span = [num(px.low) != null ? '低点 ' + px.low.toFixed(2) : '', num(px.high) != null ? '高点 ' + px.high.toFixed(2) : ''].filter(Boolean).join(' · ');
      out.push(colBox(8) + secTitle('价格高不高', num(px.pctile_5y) != null ? '近 5 年 ' + Math.round(px.pctile_5y * 100) + '% 分位 · 现价 ' + px.close.toFixed(2) : '现价 ' + px.close.toFixed(2)) +
        valChartHTML(px.history, '股价', 'price') +
        (span ? '<span style="font-size:13px;color:#8A919E">' + esc(span) + '</span>' : '') + '</div>');
    }

    // 现在贵不贵：估值倍数在自己历史和同行里的位置
    if (num(val.value) != null) {
      const ind = meta.industry || {};
      const metric = (val.metric_text || '估值').replace(/（.*$/, '');
      out.push(colBox(8) + secTitle('现在贵不贵', num(val.pctile_5y) != null ? '近 5 年 ' + Math.round(val.pctile_5y * 100) + '% 分位' + (num(val.peer_median) != null ? ' · 同行中位数 ' + val.peer_median : '') : '') +
        valChartHTML(val.history, metric, 'valuation') + peerStripHTML(d) +
        (ind.name ? '<span style="font-size:13px;color:#8A919E">行业：' + esc(ind.name) + '（可比 ' + esc(ind.peer_count) + ' 家' + (ind.peers_excluded ? '，剔除 ' + esc(ind.peers_excluded) + ' 家' : '') + '）</span>' : '') + '</div>');
    }

    // 底子稳不稳
    const items = q.items || [];
    if (items.length) {
      const weakKey = q.weakest && q.weakest.key;
      const qrows = items.map((it) => {
        const weak = it.key === weakKey, p = num(it.peer_pctile);
        const dot = p == null ? '' : '<span style="position:absolute;left:calc(' + (p * 100).toFixed(0) + '% - 5px);top:2px;width:10px;height:10px;border-radius:50%;background:' + (weak ? WEAK_DOT : BRAND) + (it.counts === false ? ';opacity:.4' : '') + '"></span>';
        return '<span style="color:' + (weak ? WEAK : '#14171F') + '">' + esc(QUALITY_LABEL[it.key] || it.key) + '</span>' +
          '<div style="position:relative;height:14px"><div style="position:absolute;left:0;right:0;top:6px;height:2px;background:#EEF0F3"></div><div style="position:absolute;left:50%;top:1px;width:1px;height:12px;background:#C9CED6"></div>' + dot + '</div>' +
          '<span style="text-align:right;white-space:nowrap;font-size:14px;color:' + (weak ? WEAK : '#5B6372') + '">' + esc(it.metric_text) + ' <span style="' + MONO + ';color:' + (weak ? WEAK : '#14171F') + '">' + esc(it.value_text || '—') + '</span></span>';
      }).join('');
      const notes = items.filter((it) => it.note_text).map((it) => esc(QUALITY_LABEL[it.key] || it.key) + '：' + esc(it.note_text));
      out.push(colBox(8) + secTitle('底子稳不稳', '在同行中的位置 · 中线为行业中位数') +
        '<div style="display:grid;grid-template-columns:64px minmax(0,1fr) 112px;align-items:center;gap:10px 12px">' + qrows +
        '<span></span><div style="display:flex;justify-content:space-between;font-size:13px;color:#8A919E"><span>行业最差</span><span>中位</span><span>最好</span></div><span></span></div>' +
        (q.weakest ? '<span style="font-size:14px;color:' + WEAK + '">短板：' + esc(q.weakest.text) + '</span>' : '') +
        (notes.length ? '<span style="font-size:13px;color:#8A919E;line-height:1.6">' + notes.join('；') + '</span>' : '') + '</div>');
    }

    // 大股东和公司在做什么
    const evs = d.holder_events || [];
    const evRows = evs.map((e) => {
      const im = HOLDER_IMPACT[e.impact];
      const when = [e.date, num(e.days_left) != null ? '剩余 ' + e.days_left + ' 天' : ''].filter(Boolean).join(' · ');
      const prog = num(e.progress);
      return '<div style="display:flex;flex-direction:column;gap:5px;padding:10px 0;' + ROW + '">' +
        '<div style="display:flex;align-items:baseline;gap:8px"><span>' + link(e.source_url, e.title) + '</span>' + (im ? '<span style="font-size:13px;color:' + im.color + '">' + im.label + '</span>' : '') +
        '<span style="margin-left:auto;font-size:14px;color:#5B6372;text-align:right">' + esc([e.detail_text, when].filter(Boolean).join(' · ')) + '</span>' +
        (num(e.float_ratio) != null ? '<span style="' + MONO + ';font-size:14px">' + (e.float_ratio * 100).toFixed(1) + '%</span>' : '') + '</div>' +
        (prog != null ? '<div style="height:6px;border-radius:3px;background:#EEF0F3"><div style="width:' + Math.min(100, Math.max(0, prog * 100)).toFixed(0) + '%;height:6px;border-radius:3px;background:' + (im && im.label === '偏空' ? DOWN : UP) + '"></div></div>' : '') + '</div>';
    }).join('');
    out.push('<div style="display:flex;flex-direction:column">' + secTitle('大股东和公司在做什么', '') +
      (evRows || '<div style="padding:10px 0;color:#8A919E;' + ROW + '">近期没有股东动作</div>') + '</div>');

    const prof = profileHTML(d);
    if (prof) out.push(prof);
    const rvBody = reviewBodyHTML(d);
    if (rvBody) out.push(rvBody);

    // 完整数据
    const trs = (d.table || {}).rows || [];
    if (trs.length) {
      const th = (t, left) => '<th style="padding:6px 0;font-weight:400;color:#8A919E;text-align:' + (left ? 'left' : 'right') + '">' + t + '</th>';
      out.push(colBox(4) + secTitle('完整数据', '') +
        '<table style="width:100%;border-collapse:collapse;font-size:15px"><thead><tr>' + th('指标', true) + th('本公司') + th('行业中位') + '</tr></thead><tbody>' +
        trs.map((r) => '<tr style="' + ROW + '"><td style="padding:7px 0;color:#3A4250">' + esc(r.label) + '</td>' +
          '<td style="padding:7px 0;' + MONO + ';text-align:right">' + fmtTable(r.value, r.format) + '</td>' +
          '<td style="padding:7px 0;' + MONO + ';text-align:right;color:#8A919E">' + fmtTable(r.peer_median, r.format) + '</td></tr>').join('') +
        '</tbody></table></div>');
    }

    if (noDisclaimer(d.disclaimer_text)) out.push('<span style="margin-top:auto;font-size:13px;color:#A1A7B2;line-height:1.6">' + esc(noDisclaimer(d.disclaimer_text)) + '</span>');
    return out.join('');
  }

  // ===== 财报维度 =====
  // GET {stock-api-base}/api/v1/stocks/{ts_code}/dimensions/finance/detail
  // 只讲最近一份定期报告带来的变化：方向 + 单季营收同比 → 结论 → 小结表 → 近 8 个季度 → 逐项解读。
  const FIN_TONE = { up: 'ok', good: 'ok', beat: 'ok', down: 'warn', loss: 'warn', poor: 'warn', miss: 'warn' };
  const yi2 = (v) => (num(v) == null ? '—' : (v / 1e8).toFixed(2));
  const qLabel = (end) => String(end || '').replace(/^(\d{4})(\d{2})\d{2}$/, (m, y, mo) => y + ' Q' + ({ '03': 1, '06': 2, '09': 3, '12': 4 }[mo] || '?'));

  // 左边问题、右边一句答案的一行（和资金流、新闻、基本面同一个版式）。
  const signalRow = (label, valueHTML, detail, tone) => '<div style="display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:start;padding:10px 0;border-top:1px solid #F1F2F4">' +
    '<span style="font-size:14px;color:#5B6372;padding-top:1px">' + label + '</span><div style="display:flex;flex-direction:column;gap:2px;min-width:0">' +
    '<span style="display:flex;align-items:center;gap:6px;font-weight:600;color:' + (tone === 'warn' ? '#7A4A00' : '#14171F') + '"><span aria-hidden="true" style="flex:none;width:8px;height:8px;border-radius:50%;background:' + TONE_DOT[tone || 'neutral'] + '"></span>' + valueHTML + '</span>' +
    (detail ? '<span style="font-size:14px;color:#5B6372;line-height:1.5">' + detail + '</span>' : '') + '</div></div>';

  function finHTML(d) {
    const meta = d.meta || {}, rv = d.review;
    const out = [];
    const cc = finConclusionOf(d);
    const qs = (d.quarters || []).slice().sort((a, b) => String(b.end).localeCompare(String(a.end)));
    const cur = qs[0] || null;

    const stamp = cc && cc.source === 'model' && rv && rv.generated_at ? '生成于 ' + rv.generated_at.slice(5) : '';
    out.push('<span style="font-size:14px;color:#8A919E;margin-bottom:-12px">' + esc(meta.status_text || '') + (stamp ? ' · ' + esc(stamp) : '') +
      (meta.state && meta.state !== 'ok' ? ' · <span style="color:#9A5B00">数据状态：' + esc(meta.state) + '</span>' : '') + '</span>');

    const left = '<div style="display:flex;flex-direction:column;gap:2px"><span style="font-size:14px;color:#8A919E">方向</span>' +
      '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span style="font-size:26px;font-weight:700;line-height:1.2;color:' + (cc ? HEAD_TONE[cc.status] || '#5B6372' : '#A1A7B2') + '">' + esc(cc ? cc.label : '暂无结论') + '</span>' + (cc && !cc.pending ? sourceChipHTML(d, cc) : '') + '</div></div>';
    const yoy = cur ? num(cur.revenue_yoy) : null;
    const right = yoy == null ? '' : '<div style="display:flex;flex-direction:column;gap:2px;min-width:0"><span style="font-size:14px;color:#8A919E">' + esc(qLabel(cur.end)) + ' 单季营收同比</span>' +
      '<span style="' + MONO + ';font-size:26px;font-weight:700;line-height:1.2;color:' + signColor(yoy) + '">' + (pct(yoy, 1) || '0.0%') + '</span></div>';
    const head = '<div style="position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start">' + left + right + '</div>';
    const sentence = cc && !cc.pending && cc.text ? '<p style="margin:0;font-size:16px;font-weight:600;line-height:1.7;color:#14171F">' + esc(cc.text) + '</p>' : '';
    const note = cc && cc.pending ? '<span style="font-size:14px;color:#8A919E;line-height:1.7">财报分析师正在分析，完成后自动给出结论。</span>'
      : (d.analyst_failed || d._analystFailed) && cc && cc.source === 'rule' ? '<span style="font-size:14px;color:#8A919E;line-height:1.7">财报分析师没有给出结论，以下为规则摘要。</span>'
      : !rv && d.review_state === 'unavailable' ? '<span style="font-size:14px;color:#8A919E;line-height:1.7">' + esc(d.review_error || '这只股票暂时没法做财报体检。') + '</span>' : '';

    const rows = (d.cells || []).filter((c) => !(c.key === 'expectation' && c.level === 'na')).map((c) =>
      signalRow(esc(FIN_CELL[c.key] || c.key), esc(c.level_text), esc(c.note_text || ''), FIN_TONE[c.level]));
    const nd = meta.next_disclosure || {};
    if (nd.date) rows.push(signalRow('下次披露', esc(nd.date), esc([nd.source, num(nd.days_left) != null ? '还有 ' + nd.days_left + ' 天' : ''].filter(Boolean).join(' · ')), 'neutral'));
    out.push('<div style="display:flex;flex-direction:column;gap:18px">' + head + sentence + note + (rows.length ? '<div style="display:flex;flex-direction:column;margin-top:-6px">' + rows.join('') + '</div>' : '') + '</div>');

    // 近 8 个季度（单季）
    if (qs.length) {
      const th = (t, left) => '<th style="padding:6px 0;font-weight:400;color:#8A919E;text-align:' + (left ? 'left' : 'right') + '">' + t + '</th>';
      const td = (t, extra) => '<td style="padding:7px 0;' + MONO + ';text-align:right;' + (extra || '') + '">' + t + '</td>';
      const yc = (v) => (num(v) == null ? td('—', 'color:#A1A7B2') : td(pct(v, 1) || '0.0%', 'color:' + signColor(v)));
      out.push(colBox(4) + secTitle('近 ' + qs.length + ' 个季度（单季）', '金额：亿元') +
        '<table style="width:100%;border-collapse:collapse;font-size:15px"><thead><tr>' + th('季度', true) + th('营收') + th('同比') + th('归母净利') + th('同比') + '</tr></thead><tbody>' +
        qs.map((q, i) => '<tr style="' + ROW + (i === 0 ? ';font-weight:600' : '') + '"><td style="padding:7px 0;color:#3A4250">' + esc(qLabel(q.end)) + '</td>' +
          td(yi2(q.revenue)) + yc(q.revenue_yoy) + td(yi2(q.net_profit)) + yc(q.net_profit_yoy) + '</tr>').join('') + '</tbody></table></div>');
    }

    const rvBody = reviewBodyHTML(d);
    if (rvBody) out.push(rvBody);

    if (noDisclaimer(d.disclaimer_text)) out.push('<span style="margin-top:auto;font-size:13px;color:#A1A7B2;line-height:1.6">' + esc(noDisclaimer(d.disclaimer_text)) + '</span>');
    return out.join('');
  }
  const FIN_CELL = { growth: '增长', quality: '含金量', expectation: '预期对照' };

  // ===== 板块维度 =====
  // GET {stock-api-base}/api/v1/stocks/{ts_code}/dimensions/sector/detail
  // stage.current has only been seen as 'weak' / 'none', so the 启动→退潮 track from the
  // design is not drawn; the stage is shown as a label plus the API's own why/next text.
  const SECTOR_TYPE = { industry: '行业', concept: '概念' };
  const STAGE_LABEL = { start: '启动', main: '主升', climax: '高潮', diverge: '分歧', ebb: '退潮', weak: '弱势', none: '没有明确阶段' };
  const STAGE_TONE = { start: 'ok', main: 'ok', climax: 'warn', diverge: 'warn', ebb: 'warn', weak: 'warn' };
  const BASIS_TEXT = { business: '业务占比', linkage: '交易联动' };
  const SIGNAL_LABEL = { breadth: '站上 20 日线', up_ratio_today: '今日上涨家数', limit_up: '涨停', max_streak: '最高连板', broken_rate: '炸板率' };
  const SUSTAIN_LABEL = { catalyst: '催化', crowding: '拥挤度', duration: '持续天数', environment: '大环境' };
  const SUSTAIN_ICON = {
    ok: { i: '✓', c: '#1E6B44', t: '没有问题' }, warn: { i: '!', c: '#B87400', t: '需要留意' }, support: { i: '◆', c: BRAND, t: '支持当前判断' }, na: { i: '–', c: '#A1A7B2', t: '暂无数据' },
  };
  const ROLE_PILL = {
    leader: 'background:#FDECEA;color:#B42318', core: 'background:#EAF0FD;color:#1F3F8A',
    resilient: 'background:#E8F5EE;color:#1E6B44', follower: 'background:#F4F5F7;color:#5B6372',
  };

  function linesChartHTML(d, stockName) {
    const L = (d.strength || {}).lines || {};
    const dates = L.dates || [];
    const series = [
      { key: 'index', label: '大盘', color: '#C9CED6', text: '#8A919E', w: 1.4, v: L.index || [] },
      { key: 'sector', label: '板块', color: '#8A919E', text: '#5B6372', w: 1.6, v: L.sector || [] },
      { key: 'stock', label: '本股', color: BRAND, text: BRAND, w: 2, v: L.stock || [] },
    ];
    const n = Math.min.apply(null, [dates.length].concat(series.map((s) => s.v.length)));
    if (n < 2) return '';
    const all = [].concat.apply([], series.map((s) => s.v.slice(0, n))).concat([0]);
    const lo = Math.min.apply(null, all), hi = Math.max.apply(null, all);
    const PW = 298, TOP = 8, BOT = 130;
    const x = (i) => (i / (n - 1)) * PW;
    const y = (v) => BOT - ((v - lo) / (hi - lo || 1)) * (BOT - TOP);
    let svg = '<line x1="0" y1="' + y(0).toFixed(1) + '" x2="' + PW + '" y2="' + y(0).toFixed(1) + '" stroke="#E3E6EB"></line>';
    series.forEach((s) => {
      svg += '<polyline points="' + s.v.slice(0, n).map((v, i) => x(i).toFixed(1) + ',' + y(v).toFixed(1)).join(' ') + '" fill="none" stroke="' + s.color + '" stroke-width="' + s.w + '" stroke-linejoin="round"></polyline>';
    });
    // End labels, pushed apart so they never overlap.
    const ends = series.map((s) => ({ s: s, y: y(s.v[n - 1]) })).sort((a, b) => a.y - b.y);
    for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 12) ends[i].y = ends[i - 1].y + 12;
    ends.forEach((e) => {
      svg += '<text x="304" y="' + (e.y + 3).toFixed(1) + '" font-size="10" fill="' + e.s.text + '" style="font-family:\'IBM Plex Mono\',ui-monospace,Menlo,monospace">' + (e.s.key === 'stock' ? '本股' : e.s.label) + ' ' + pct(e.s.v[n - 1], 1) + '</text>';
    });
    const st = d.stage || {}, rs = (d.strength || {}).round_start;
    const ri = rs ? dates.indexOf(rs) : -1;
    if (ri > 0) {
      svg += '<line x1="' + x(ri).toFixed(1) + '" y1="' + TOP + '" x2="' + x(ri).toFixed(1) + '" y2="' + BOT + '" stroke="#B87400" stroke-width="1" stroke-dasharray="3 3"></line>' +
        '<text x="' + (x(ri) + 4).toFixed(1) + '" y="16" font-size="10" fill="#7A4A00">本轮开始' + (num(st.days_in_round) ? ' · 已 ' + st.days_in_round + ' 天' : '') + '</text>';
    }
    const step = PW / (n - 1);
    for (let i = 0; i < n; i++) {
      const bx = Math.max(0, x(i) - step / 2), bw = Math.min(PW, x(i) + step / 2) - bx;
      svg += '<rect class="bh" data-i="' + i + '" data-x="' + x(i).toFixed(1) + '" data-y="' + y(series[2].v[i]).toFixed(1) + '" x="' + bx.toFixed(1) + '" y="0" width="' + bw.toFixed(1) + '" height="' + BOT + '" fill="transparent"></rect>';
    }
    svg += '<text x="0" y="144" font-size="10" fill="#8A919E">' + n + ' 天前</text><text x="' + PW + '" y="144" text-anchor="end" font-size="10" fill="#8A919E">' + esc(mmdd(dates[n - 1])) + '</text>' +
      '<line class="xh-line" x1="0" y1="' + TOP + '" x2="0" y2="' + BOT + '" stroke="#14171F" stroke-width="1" opacity="0.35" pointer-events="none" style="display:none"></line>' +
      '<circle class="xh-dot" cx="0" cy="0" r="3.5" fill="#14171F" stroke="#FFFFFF" stroke-width="1.5" pointer-events="none" style="display:none"></circle>';
    const data = dates.slice(0, n).map((dt, i) => [dt, series[2].v[i], series[1].v[i], series[0].v[i]]);
    return '<div class="chart-wrap" style="position:relative" data-kind="lines" data-xh-bottom="' + BOT + '" data-bars="' + esc(JSON.stringify(data)) + '">' +
      '<svg viewBox="0 0 384 146" role="img" aria-label="' + esc((d.strength || {}).chart_alt_text || '') + '" style="width:100%;height:auto;display:block">' + svg + '</svg>' +
      '<div class="chart-tip" role="tooltip" hidden></div></div>';
  }

  // 一个板块展开后的内容：走势图、位置、阶段、角色、能持续多久。
  function sectorBodyHTML(sec) {
    const st = sec.stage || {}, sg = sec.strength || {}, rl = sec.role || {}, su = sec.sustain || {};
    const parts = [];
    const chart = linesChartHTML(sec);
    const today = ((sec.strength || {}).lines || {}).today || {};
    const todayBit = (label, value) => {
      const n = num(value);
      if (n == null) return '';
      return '<span style="font-size:14px;color:#5B6372">' + label + ' <b style="' + MONO + ';color:' + signColor(n) + '">' + pct(n, 1) + '</b></span>';
    };
    const todayRow = [todayBit('本股', today.stock), todayBit('板块', today.sector), todayBit('大盘', today.index)].filter(Boolean).join('<span style="color:#DDE1E7"> · </span>');
    if (chart) parts.push('<div style="display:flex;flex-direction:column;gap:6px">' + secTitle('是它强，还是板块强', '曲线是近 20 天累计，不是今天') +
      (todayRow ? '<div style="display:flex;flex-wrap:wrap;gap:8px 12px">今日 ' + todayRow + '</div>' : '') + chart + '</div>');

    const rk = sg.rank || {}, ts = sg.turnover_share || {}, gp = sg.gaps || {};
    const moved = num(rk.value_5d_ago) != null && num(rk.value) != null ? rk.value_5d_ago - rk.value : null;
    const facts = [];
    if (num(rk.value) != null) facts.push({ label: '板块排名（' + (rk.level_text || '') + '，共 ' + rk.total + '）', text: rk.value + (num(rk.value_5d_ago) != null ? ' · 5 日前 ' + rk.value_5d_ago + (moved > 0 ? ' ↑' : moved < 0 ? ' ↓' : '') : '') });
    if (num(gp.sector_vs_index) != null) facts.push({ label: '板块相对大盘', text: pct(gp.sector_vs_index, 1) || '0.0%' });
    if (num(gp.stock_vs_sector) != null) facts.push({ label: '本股相对板块', text: pct(gp.stock_vs_sector, 1) || '0.0%' });
    if (num(ts.value) != null) facts.push({ label: '成交占比', text: (ts.value * 100).toFixed(2) + '%' + (num(ts.pctile_1y) != null ? ' · 近一年 ' + Math.round(ts.pctile_1y * 100) + '% 分位' : '') });
    if (num(sg.flow_rate) != null) facts.push({ label: '板块资金净流入率', text: pct(sg.flow_rate, 1) });
    parts.push(rvEvidence(facts));

    if (st.current) {
      const sigs = (st.signals || []).filter((x) => !(x.value_text === '—' && (!x.level_text || x.level_text === '—')));
      const sig = (x) => '<div style="display:flex;flex-direction:column;gap:1px;min-width:0"><span style="font-size:13px;color:#8A919E">' + esc(SIGNAL_LABEL[x.key] || x.key) + '</span>' +
        '<span><span style="' + MONO + ';font-weight:600">' + esc(x.value_text || '—') + '</span> <span style="font-size:13px;color:#5B6372">' + esc(x.level_text && x.level_text !== '—' && x.level_text !== x.value_text ? x.level_text : '') + '</span></span></div>';
      parts.push('<div style="display:flex;flex-direction:column;gap:8px">' + secTitle('板块走到哪一步了', num(st.confirmed_days) ? '连续 ' + st.confirmed_days + ' 天确认' : '') +
        '<span style="font-weight:600;color:' + (STAGE_TONE[st.current] === 'warn' ? '#7A4A00' : '#14171F') + '">' + esc(STAGE_LABEL[st.current] || st.current) + '</span>' +
        (st.why_text ? '<span style="font-size:14px;color:#5B6372;line-height:1.6">' + esc(st.why_text) + '</span>' : '') +
        (st.next_text ? '<span style="font-size:14px;color:#7A4A00;line-height:1.6">' + esc(st.next_text) + '</span>' : '') +
        (sigs.length ? '<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 8px;padding:10px 0;border-top:1px solid #F1F2F4">' + sigs.map(sig).join('') + '</div>' : '') + '</div>');
    }

    const top = rl.top || [];
    if (top.length) {
      const maxAbs = Math.max.apply(null, top.map((t) => Math.abs(t.ret_20d)).concat([0.01]));
      let prev = 0;
      const rows = top.map((t) => {
        const gap = prev && t.rank - prev > 1 ? '<div style="font-size:13px;color:#A1A7B2;padding:1px 0 1px 26px">· · ·</div>' : '';
        prev = t.rank;
        return gap + '<div style="display:grid;grid-template-columns:22px 118px minmax(0,1fr) 52px;align-items:center;gap:8px;padding:5px 0">' +
          '<span style="' + MONO + ';font-size:13px;color:#8A919E">' + esc(t.rank) + '</span>' +
          '<span style="' + (t.is_self ? 'font-weight:600' : 'color:#3A4250') + ';white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(t.name) +
          ' <span class="pill" style="' + (ROLE_PILL[t.role] || ROLE_PILL.follower) + ';margin-left:2px">' + esc(t.role_text) + '</span></span>' +
          '<div style="height:6px;border-radius:3px;background:#F1F2F4"><div style="width:' + (Math.abs(t.ret_20d) / maxAbs * 100).toFixed(1) + '%;height:6px;border-radius:3px;background:' + (t.is_self ? BRAND : '#C9CED6') + '"></div></div>' +
          '<span style="' + MONO + ';font-size:14px;text-align:right;color:' + signColor(t.ret_20d) + '">' + pct(t.ret_20d, 1) + '</span></div>';
      }).join('');
      parts.push('<div style="display:flex;flex-direction:column;gap:2px">' + secTitle('它在板块里是什么角色', '近 20 天涨幅 · 共 ' + esc(rl.member_count) + ' 只') + rows +
        (rl.reason_text ? '<span style="font-size:14px;color:#5B6372;padding-top:4px">' + esc(rl.reason_text) + (rl.role_text ? ' → <b style="color:#14171F">' + esc(rl.role_text) + '</b>' : '') + '</span>' : '') + '</div>');
    }

    const items = su.items || [];
    if (items.length) {
      parts.push('<div style="display:flex;flex-direction:column">' + secTitle('还能持续多久', '✓ 没问题 · ! 留意 · ◆ 支持当前判断') + items.map((it) => {
        const ic = SUSTAIN_ICON[it.status] || SUSTAIN_ICON.na;
        return '<div style="display:grid;grid-template-columns:16px 64px minmax(0,1fr);gap:8px;padding:9px 0;' + ROW + '"><span title="' + ic.t + '" style="color:' + ic.c + ';cursor:help">' + ic.i + '</span>' +
          '<span>' + esc(SUSTAIN_LABEL[it.key] || it.key) + '</span><span style="font-size:14px;color:' + (it.status === 'warn' ? '#7A4A00' : '#5B6372') + ';line-height:1.6">' + esc(it.text) + '</span></div>';
      }).join('') + '</div>');
    }
    return parts.join('');
  }

  // “依据”里的板块归属：主营构成 + 每个候选板块为什么算（或不算）本股的板块。
  function sectorBasisHTML(sc) {
    const out = [];
    const bl = (sc.business_lines || []).filter((x) => x && x.name);
    if (bl.length) out.push('<div style="display:flex;flex-direction:column;gap:3px"><span style="font-weight:600;color:#3A4250">主营构成</span>' +
      rvEvidence(bl.map((x) => ({ label: x.name, text: (x.share * 100).toFixed(1) + '%' }))) + '</div>');
    const cands = (sc.candidates || []).filter((x) => x && x.name);
    if (cands.length) {
      const basis = (c) => BASIS_TEXT[c.basis] || c.basis || '';
      out.push('<div style="display:flex;flex-direction:column;gap:3px"><span style="font-weight:600;color:#3A4250">板块归属判断</span>' +
        '<div style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;font-size:14px">' + cands.map((c) =>
          '<span style="color:' + (c.belongs ? '#14171F' : '#8A919E') + ';line-height:1.5">' + esc(c.name) + ' <span style="color:#A1A7B2">' + esc(SECTOR_TYPE[c.type] || c.type) + '</span></span>' +
          '<span style="color:' + (c.belongs ? '#5B6372' : '#A1A7B2') + ';white-space:nowrap">' + (c.belongs ? (c.role === 'primary' ? '主板块 · ' : c.role === 'secondary' ? '次板块 · ' : '') : '不算 · ') + esc(basis(c)) + '</span>').join('') + '</div></div>');
    }
    return out.join('');
  }

  function sectorHTML(d) {
    const meta = d.meta || {}, sc = d.sectors || {}, rv = d.review;
    const stock = curStock();
    const out = [];
    const cc = conclusionOf(d);

    const stamp = cc && cc.source === 'model' && rv && rv.generated_at ? '生成于 ' + rv.generated_at.slice(5) : '';
    out.push('<span style="font-size:14px;color:#8A919E;margin-bottom:-12px">' + esc(meta.status_text || '') + (stamp ? ' · ' + esc(stamp) : '') +
      (meta.state && meta.state !== 'ok' ? ' · <span style="color:#9A5B00">数据状态：' + esc(meta.state) + '</span>' : '') +
      (meta.error ? ' · <span style="color:#9A5B00">' + esc(meta.error) + '</span>' : '') + '</span>');

    // 头：方向 + 谁在驱动本股
    const dr = sc.driver || {};
    const drvText = sc.independent ? '不跟随板块' : dr.type_text || '';
    const left = '<div style="display:flex;flex-direction:column;gap:2px"><span style="font-size:14px;color:#8A919E">方向</span>' +
      '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span style="font-size:26px;font-weight:700;line-height:1.2;color:' + (cc ? HEAD_TONE[cc.status] || '#5B6372' : '#A1A7B2') + '">' + esc(cc ? cc.label : '暂无结论') + '</span>' + (cc && !cc.pending ? sourceChipHTML(d, cc, sectorBasisHTML(sc)) : '') + '</div></div>';
    const right = !drvText ? '' : '<div style="display:flex;flex-direction:column;gap:2px;min-width:0"><span style="font-size:14px;color:#8A919E">谁在驱动本股</span>' +
      '<span style="font-size:26px;font-weight:700;line-height:1.2;color:#14171F">' + esc(drvText) + '</span></div>';
    const head = '<div style="position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start">' + left + right + '</div>';
    const sentence = cc && !cc.pending && cc.text ? '<p style="margin:0;font-size:16px;font-weight:600;line-height:1.7;color:#14171F">' + esc(cc.text) + '</p>' : '';
    const note = cc && cc.pending ? '<span style="font-size:14px;color:#8A919E;line-height:1.7">板块分析师正在分析，完成后自动给出结论。</span>'
      : (d.analyst_failed || d._analystFailed) && cc && cc.source === 'rule' ? '<span style="font-size:14px;color:#8A919E;line-height:1.7">板块分析师没有给出结论，以下为规则摘要。</span>'
      : !rv && d.review_state === 'unavailable' ? '<span style="font-size:14px;color:#8A919E;line-height:1.7">' + esc(d.review_error || '这只股票暂时没法做板块体检。') + '</span>' : '';

    // 信号表：主板块、次板块、驱动、分歧
    const rows = [];
    const merged = (sc.merged || []).filter((m) => m && m.name);
    [['primary', '主板块'], ['secondary', '次板块']].forEach((k) => {
      const sec = sc[k[0]];
      if (!sec) return;
      const stage = (sec.stage || {}).current;
      const w = num(sec.driver_weight);
      rows.push(signalRow(k[1], esc(sec.name) + (stage ? ' · ' + esc(STAGE_LABEL[stage] || stage) : ''),
        esc(sec.tag_text || '') + (w != null ? ' · 解释本股 ' + Math.round(w * 100) + '%' : '') +
        (k[0] === 'primary' && merged.length ? '<br>' + merged.map((m) => '「' + esc(m.name) + '」与它高度重合（' + Math.round(m.overlap * 100) + '%），已合并').join('；') : ''),
        STAGE_TONE[stage] || 'neutral'));
    });
    if (dr.type_text && num(dr.r2) != null) rows.push(signalRow('驱动', esc(dr.type_text), '近 ' + esc(dr.days || 60) + ' 日，板块合计解释本股 ' + Math.round(dr.r2 * 100) + '% 的走势', 'neutral'));
    const dv = sc.divergence || {};
    if (dv.active) rows.push(signalRow('板块分歧', '两个板块走势不一致', esc(dv.text || ''), 'warn'));
    out.push('<div style="display:flex;flex-direction:column;gap:18px">' + head + sentence + note + (rows.length ? '<div style="display:flex;flex-direction:column;margin-top:-6px">' + rows.join('') + '</div>' : '') +
      (sc.independent ? '<span style="font-size:14px;color:#5B6372">这只股票最近不明显跟随任何板块</span>' : '') + '</div>');

          '<div class="acc-body" style="gap:16px;padding-top:6px">' + sectorBodyHTML(sec) + '</div></details>';
      }).join('') + '</div></div>');
    }

    const rvBody = reviewBodyHTML(d);

    out.push('<div style="margin-top:auto;display:flex;flex-direction:column;gap:6px">' +
