    return out.join('');
  }

  function stopDimTimer() { if (dimTimer) { clearInterval(dimTimer); dimTimer = null; } }

  function renderDims() {
    const dim = DIMS[state.drawer];
    const root = dim && document.getElementById(dim.rootId);
    if (!root) { stopDimTimer(); return; }
    const code = curStock().code, ck = state.drawer + ':' + code;
    if (!dimCache[ck]) startDim(state.drawer, code);
    const entry = dimCache[ck];
    // Panels may also draw from another panel's data (e.g. prices): load it too and
    // redraw when it settles.
    const deps = dim.deps || [];
    deps.forEach((dp) => { if (!dimCache[dp + ':' + code]) startDim(dp, code); });
    const key = ck + ':' + entry.status + (deps.length ? ':' + deps.map((dp) => (dimCache[dp + ':' + code] || {}).status).join(',') : '');
    if (root.dataset.key !== key) {
      root.dataset.key = key;
      root.innerHTML = entry.status === 'loading' ? loadingHTML(dim.steps)
        : entry.status === 'error' ? errorHTML(entry.error, dim.label, curStock())
        : dim.render(entry.data);
    }
    if (entry.status === 'loading') {
      tickLoading(root, entry, dim.steps);
      if (!dimTimer) dimTimer = setInterval(renderDims, 250);
    } else {
      stopDimTimer();
    }
  }
  actions.retryDim = () => { delete dimCache[state.drawer + ':' + curStock().code]; };

  // ===== 综合判断（短期结论） =====
  // GET {stock-api-base}/api/v1/stocks/{ts_code}/synthesis
  // `computing: true` means the server is still (re)building the verdict, so the
  // page keeps asking until it clears. Alerts (到了提醒我) are local to this page.
  const SYNTH_TIMEOUT_MS = 120000;
  const SYNTH_POLL_MS = 5000, SYNTH_MAX_POLLS = 24;
  const synthCache = {}; // ts_code -> { status: 'loading' | 'done' | 'error', startedAt, data, error, polls }
  const alertsOn = {};   // 'ts_code:side' -> { id, price } once the alert is stored on this computer
  const alertsLoaded = {}; // ts_code -> true once its alerts were read


  function startSynth(code) {
    const prev = synthCache[code];
    const entry = (synthCache[code] = { status: 'loading', startedAt: Date.now(), data: null, error: null, polls: prev ? prev.polls : 0, polling: false });
    const url = API_BASE + '/api/v1/stocks/' + encodeURIComponent(code) + '/synthesis';
    const limit = TIMEOUT_OVERRIDE_MS || SYNTH_TIMEOUT_MS;
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), limit);
    const fail = (err) => {
      const show = () => { entry.status = 'error'; entry.error = describeError(err, url, code, limit); renderSynthAndChrome(); };
      const wait = 700 - (Date.now() - entry.startedAt);
      if (wait > 0) setTimeout(show, wait); else show();
    };
    fetchStockJSON(url, ctrl.signal)
      .then((data) => { entry.status = 'done'; entry.data = data; renderSynthAndChrome(); keepPolling(code, entry); })
      .catch(fail)
      .finally(() => clearTimeout(timer));
  }

  // While the server is still computing, ask again — but only for the stock being looked at;
  // renderChat resumes it when the reader comes back to that stock.
  function keepPolling(code, entry) {
    if (entry.polling || !(entry.data && entry.data.computing) || entry.polls >= SYNTH_MAX_POLLS || state.stock !== code) return;
    entry.polling = true;
    setTimeout(() => {
      entry.polling = false;
      if (synthCache[code] !== entry || state.stock !== code) return;
      entry.polls++;
      fetchStockJSON(API_BASE + '/api/v1/stocks/' + encodeURIComponent(code) + '/synthesis')
        .then((data) => { if (synthCache[code] === entry) { entry.data = data; renderSynthAndChrome(); } })
        .catch(() => {})
        .finally(() => keepPolling(code, entry));
    }, SYNTH_POLL_MS);
  }

  const MENTION_RE = new RegExp('@(' + [].concat.apply([], MENTIONABLE.map((k) => [ROLE[k].name, ROLE[k].short])).sort((a, b) => b.length - a.length).join('|') + ')');
  const WHO_OF = {};
  MENTIONABLE.forEach((k) => { WHO_OF[ROLE[k].name] = k; WHO_OF[ROLE[k].short] = k; });
  const STATUS_STYLE = { support: 'background:#FDF0EF;color:#B42318', warn: 'background:#EDF7F1;color:#1E6B44', neutral: 'background:#F4F5F7;color:#5B6372' };

  const chats = {}; // ts_code -> { msgs, results, revealed, holding, startedAt, debateStarted, chiefStarted, gen, restored }
  const chatLoads = {}; // ts_code -> true while the saved record is being read
  let chatSeq = 0;
  let chatEpoch = 0;
  const pad2 = (n) => (n < 10 ? '0' : '') + n;
  const clock = (d) => pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  const errText = (err) => {
    if (err && err.name === 'AbortError') return '等了太久还没有回应';
    if (err instanceof TypeError) return '连不上分析服务';
    const t = String((err && err.message) || err || '').trim();
    if (/AUTH|Authentication Fails|Unauthorized|api key.*invalid|invalid.*api.?key|incorrect api key/i.test(t)) {
      return '模型 API Key 无效或未配置，请到「设置」里填写正确的 Key 后再试';
    }
    if (/QUOTA_EXCEEDED|Insufficient Balance/i.test(t)) {
      return '模型额度不足，请充值或到「设置」更换可用的 API Key';
    }
    return t || '没有成功';
  };
  // 分析师发言和追问走本服务。抽屉详情、综合判断、主分析师详情仍走股票服务。
  const HARNESS_ORIGIN = (location.protocol === 'http:' || location.protocol === 'https:') ? location.origin : 'http://127.0.0.1:8083';
  const AGENT_OF_PATH = {
    'dimensions/volume_flow/': 'volume_flow',
    'dimensions/market/': 'market',
    'dimensions/sector/': 'sector',
    'dimensions/news/': 'news',
    'dimensions/finance/': 'finance',
    'dimensions/fundamental/': 'fundamental',
  };
  const chatUrl = (code, path) => {
    if (path === 'chief/detail') {
      return HARNESS_ORIGIN + '/api/stocks/' + encodeURIComponent(code) + '/agents/chief/detail';
    }
    const debate = /^(bull|bear|chief)\/(stream|reply)\b/.exec(path);
    if (debate) {
      return HARNESS_ORIGIN + '/api/stocks/' + encodeURIComponent(code) + '/agents/' + debate[1] + '/' + debate[2];
    }
    const keys = Object.keys(AGENT_OF_PATH);
    for (let i = 0; i < keys.length; i++) {
      if (path.indexOf(keys[i]) === 0) {
        const reply = path.indexOf('/reply') >= 0;
        return HARNESS_ORIGIN + '/api/stocks/' + encodeURIComponent(code) + '/agents/' + AGENT_OF_PATH[keys[i]] + '/' + (reply ? 'reply' : 'stream');
      }
    }
    return API_BASE + '/api/v1/stocks/' + encodeURIComponent(code) + '/' + path;
  };

  // 读一次 SSE：返回 message 事件里的发言；error 事件或没收到发言都当失败。
  async function sseOnce(url, init, onDraft) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), TIMEOUT_OVERRIDE_MS || 300000);
    const outer = init && init.signal;
    if (outer) {
      if (outer.aborted) ctrl.abort();
      else outer.addEventListener('abort', () => ctrl.abort(), { once: true });
    }
    try {
      const res = await fetch(url, Object.assign({}, init, { signal: ctrl.signal }));
      if (!res.ok) {
        let why = '';
        try { why = (await res.json()).error; } catch (e) { /* 不是 JSON */ }
        throw new Error(why || '服务返回 ' + res.status);
      }
      const reader = res.body.getReader(), dec = new TextDecoder();
      let buf = '', msg = null, failure = null;
      const take = (block) => {
        let ev = 'message';
        const data = [];
        block.split('\n').forEach((l) => {
          if (l.indexOf('event:') === 0) ev = l.slice(6).trim();
          else if (l.indexOf('data:') === 0) data.push(l.slice(5).replace(/^ /, ''));
        });
        if (!data.length) return;
        let body;
        try { body = JSON.parse(data.join('\n')); } catch (e) { return; }
        if (ev === 'draft' && onDraft) onDraft(body || {});
        else if (ev === 'message') msg = body;
        else if (ev === 'error') failure = body.error || '分析失败';
      };
      for (;;) {
        const r = await reader.read();
        if (r.done) break;
        buf += dec.decode(r.value, { stream: true }).replace(/\r\n/g, '\n');
        let i;
        while ((i = buf.indexOf('\n\n')) >= 0) { take(buf.slice(0, i)); buf = buf.slice(i + 2); }
      }
      if (buf.trim()) take(buf);
      if (failure) throw new Error(failure);
      if (!msg) throw new Error('没有收到发言');
      return msg;
    } finally {
      clearTimeout(timer);
    }
  }

  // 分析师 stream 跑完后，把方向/结论写回对应维度详情缓存，资金流页头就能同步更新。
  function patchDimCache(dim, code, patch) {
    const key = dim + ':' + code;
    let entry = dimCache[key];
    if (!entry) {
      entry = dimCache[key] = { status: 'done', startedAt: Date.now(), data: {}, error: null };
    }
    if (!entry.data) entry.data = {};
    entry.data = Object.assign({}, entry.data, patch);
    if (patch.headline && patch.headline.text) {
      entry.data._analystHeadline = patch.headline;
      entry.data.analyst_failed = false;
    } else if (patch.analyst_failed) {
      entry.data._analystHeadline = null;
      entry.data._analystFailed = true;
    }
    // 详情还在请求时不要换成另一份缓存，否则返回的量价和资金明细写不回来。
    if (entry.status !== 'loading') entry.status = 'done';
    // 大盘等无侧栏面板的维度只写入 stance 缓存，不拉 DIMS 详情、不替代市场页。
    if (DIMS[dim]) {
      const root = document.getElementById(DIMS[dim].rootId);
      if (root) root.dataset.key = '';
      if (!entry.data.meta && !entry._inflight) startDim(dim, code);
      if (bodyPending(entry.data) && dimCache[key] === entry) watchPending(dim, code, entry, 0);
    }
    renderDims();
    renderTabs();
  }

  function syncDimFromAnalyst(who, code, msg) {
    const dim = { volume_flow: 'flow', market: 'market', sector: 'sector', news: 'news', finance: 'fin', fundamental: 'fund' }[who];
    if (!dim) return;
    if (msg && msg.headline && msg.headline.text) {
      patchDimCache(dim, code, { headline: msg.headline, analyst_failed: false });
    } else {
      // stream 结束但没有分析师结论 → 详情才回退规则 verdict
      patchDimCache(dim, code, { headline: null, analyst_failed: true });
    }
  }

  let chatPaint = 0;
  function scheduleChat() {
    if (chatPaint) return;
    chatPaint = setTimeout(() => { chatPaint = 0; renderChat(); }, 40);
  }
  function liveBubble(c, who) {
    if (!c) return null;
    for (let i = c.msgs.length - 1; i >= 0; i--) {
      const m = c.msgs[i];
      if (m.who === who && (m.kind === 'typing' || m.kind === 'streaming')) return m;
    }
    return null;
  }
  function applyDraft(code, who, draft) {
    const c = chats[code];
    if (!c || !draft) return;
    c.drafts = c.drafts || {};
    c.drafts[who] = draft;
    const m = liveBubble(c, who);
    if (!m) return;
    if (draft.text) { m.kind = 'streaming'; m.text = draft.text; }
    if (draft.status) m.statusNote = draft.status;
    if (draft.tools && draft.tools.length) m.tools = draft.tools;
    scheduleChat();
  }

  function liveChat(code, gen) {
    const cur = chats[code];
    return cur && cur.gen === gen ? cur : null;
  }

  function abandonChat(code) {
    const c = chats[code];
    if (!c || c.restored) return;
    c.abandoned = true;
    (c.stops || []).forEach((stop) => { try { stop(); } catch (e) { /* 已经停了 */ } });
    if (!c.results || !c.results.chief) delete chats[code];
  }

  function loadOne(code, who) {
    const c = chats[code];
    const gen = c && c.gen;
    const ctrl = new AbortController();
    if (c) { c.stops = c.stops || []; c.stops.push(() => ctrl.abort()); }
    const dim = { volume_flow: 'flow', market: 'market', sector: 'sector', news: 'news', finance: 'fin', fundamental: 'fund' }[who];
    return sseOnce(chatUrl(code, ROLE[who].stream), { signal: ctrl.signal }, (draft) => { if (liveChat(code, gen)) applyDraft(code, who, draft); })
      .then((msg) => {
        const cur = liveChat(code, gen);
        if (!cur) return;
        cur.results[who] = { msg: msg };
        syncDimFromAnalyst(who, code, msg);
      })
      .catch((err) => {
        const cur = liveChat(code, gen);
        if (!cur) return;
        cur.results[who] = { error: errText(err) };
        if (dim) patchDimCache(dim, code, { headline: null, analyst_failed: true });
      })
      .finally(() => { if (liveChat(code, gen)) advanceRound(code); });
  }

  function newChat(code) {
    const c = { msgs: [{ id: ++chatSeq, who: 'chief', kind: 'opening', at: new Date() }], results: {}, revealed: 0, holding: false, startedAt: new Date(), debateStarted: false, chiefStarted: false, started: {}, gen: ++chatEpoch, restored: false, lastAnalysts: [] };
    chats[code] = c;
    advanceRound(code);
    return c;
  }

  function headlineOf(line) {
    if (!line || (!line.status && !line.status_text && !(line.suggested_questions && line.suggested_questions.length))) return null;
    const h = { status: line.status || 'neutral', status_text: line.status_text || '', text: line.text || '' };
    if (line.strength) h.strength = line.strength;
    const qs = line.suggested_questions || (line.headline && line.headline.suggested_questions);
    if (qs && qs.length) h.suggested_questions = qs;
    return h;
  }

  function restoreChat(code, body) {
    const lines = (body && body.lines) || [];
    const debate = (body && body.debate) || {};
    const c = { msgs: [{ id: ++chatSeq, who: 'chief', kind: 'opening', at: new Date() }], results: {}, revealed: FULL.length, holding: false, startedAt: new Date(), debateStarted: true, chiefStarted: true, gen: ++chatEpoch, restored: true, lastAnalysts: [] };
    let dividerDone = false;
    const stickyIds = ['market', 'volume_flow', 'sector', 'news', 'finance', 'fundamental'];
    lines.forEach((line) => {
      const who = line.agent;
      if (!ROLE[who]) return;
      if (line.kind === 'reply') {
        if (line.quote) c.msgs.push({ id: ++chatSeq, who: 'me', kind: 'reply', text: line.quote, at: new Date() });
        c.msgs.push({ id: ++chatSeq, who: who, kind: 'reply', text: line.text || '', quote: line.quote || '', headline: headlineOf(line), tools: line.tools || null, at: new Date() });
        if (stickyIds.indexOf(who) >= 0) c.lastAnalysts = [who];
        return;
      }
      if ((who === 'bull' || who === 'bear') && !dividerDone) {
        dividerDone = true;
        c.msgs.push({ id: ++chatSeq, who: 'chief', kind: 'divider', text: '上次研判', at: new Date() });
      }
      const m = { id: ++chatSeq, who: who, kind: 'analysis', round: true, text: line.text || '', headline: headlineOf(line), tools: line.tools || null, at: new Date() };
      if (who === 'bull' || who === 'bear') {
        m.points = debate[who] || String(line.text || '').split('；').filter(Boolean).map((text) => ({ text: text }));
        c.results[who] = { msg: { points: m.points, text: line.text || '' } };
      } else if (who === 'chief') {
        const card = Object.assign({}, debate.chief || {}, { text: line.text || '', verdict: (debate.chief && debate.chief.verdict) || line.status_text || '不明' });
        m.card = card;
        m.text = card.text;
        c.results.chief = { msg: card };
      } else {
        c.results[who] = { msg: { text: line.text || '', headline: m.headline } };
      }
      const dim = { volume_flow: 'flow', market: 'market', sector: 'sector', news: 'news', finance: 'fin', fundamental: 'fund' }[who];
      if (dim && line.kind === 'analysis' && line.text) {
        patchDimCache(dim, code, {
          headline: { text: line.text, status: line.status || 'neutral', status_text: line.status_text || '不明', source: 'model' },
          analyst_failed: false,
        });
      }
      c.msgs.push(m);
    });
    ['bull', 'bear'].forEach((who) => {
      const points = debate[who];
      if (!points || !points.length || c.msgs.some((m) => m.round && m.who === who)) return;
      if (!c.msgs.some((m) => m.kind === 'divider')) {
        const at = c.msgs.findIndex((m) => m.who === 'chief' && m.card);
        const divider = { id: ++chatSeq, who: 'chief', kind: 'divider', text: '上次研判', at: new Date() };
        if (at >= 0) c.msgs.splice(at, 0, divider);
        else c.msgs.push(divider);
      }
      const m = { id: ++chatSeq, who: who, kind: 'analysis', round: true, points: points, at: new Date() };
      c.results[who] = { msg: { points: points } };
      const at = c.msgs.findIndex((m) => m.who === 'chief' && m.card);
      if (at >= 0) c.msgs.splice(at, 0, m);
      else c.msgs.push(m);
    });
    chats[code] = c;
    return c;
  }

  // ---- 结论包：已有结论时只读；没有结论或点「重新分析」时走直播 SSE（newChat），结束后 commit 成结论包 ----
  // 后台 nightly 任务仍会写 bundle；直播中不要再 enqueue，以免抢同一把股票锁导致气泡卡住、最后才整包弹出。
  const BUNDLE_DIM = { volume_flow: 'flow', market: 'market', sector: 'sector', news: 'news', finance: 'fin', fundamental: 'fund' };
  const conclUrl = (code, tail) => HARNESS_ORIGIN + '/api/stocks/' + encodeURIComponent(code) + '/conclusion' + (tail || '');

  function startLiveDiagnosis(code) {
    abandonChat(code);
    delete chiefDetail[code];
    delete planCache[code];
    const c = newChat(code);
    c.liveDiag = true;
    c.committed = false;
    return c;
  }

  function commitLiveConclusion(code) {
    const c = chats[code];
    if (!c || !c.liveDiag || c.committed) return;
    c.committed = true;
    fetch(HARNESS_ORIGIN + '/api/stocks/' + encodeURIComponent(code) + '/conclusion/commit', { method: 'POST' })
      .then((res) => (res.ok ? res.json() : null))
      .then((body) => {
        if (!liveChat(code, c.gen) || !body) { if (c.committed && !body) c.committed = false; return; }
        return fetchStockJSON(conclUrl(code, '?enqueue=0')).then((concl) => {
          if (!liveChat(code, c.gen)) return;
          if (concl && concl.bundle) c.bundle = concl.bundle;
          c.job = (concl && concl.job) || c.job;
          c.liveDiag = false;
          c.restored = true; // 保留直播气泡，顶部改回结论条
          renderChat();
        });
      })
      .catch(() => { if (chats[code] === c) c.committed = false; });
  }

  function conclusionChat(code, concl, group) {
    const c = { msgs: [{ id: ++chatSeq, who: 'chief', kind: 'opening', at: new Date() }], results: {}, revealed: FULL.length, holding: false, startedAt: new Date(), debateStarted: true, chiefStarted: true, gen: ++chatEpoch, restored: true, bundle: null, job: concl.job || null, pending: null };
    const b = concl.bundle;
    if (!b) {
      c.pending = { state: concl.state, message: (concl.job && concl.job.message) || '' };
      c.results.chief = concl.state === 'failed' ? { error: c.pending.message || '还没有生成结论' } : null;
      if (!c.results.chief) delete c.results.chief;
      return c;
    }
    c.bundle = b;
    c.refreshing = concl.state === 'refreshing';
    const at = b.generated_at ? new Date(b.generated_at.replace(' ', 'T')) : new Date();
    ROUND.forEach((who) => {
      const row = (b.analysts || []).find((x) => x.dimension === who) || {};
      const h = row.headline;
      const dim = BUNDLE_DIM[who];
      if (h && h.text) {
        c.msgs.push({ id: ++chatSeq, who: who, kind: 'analysis', round: true, text: h.text, headline: headlineOf(h), at: at });
        c.results[who] = { msg: { text: h.text, headline: headlineOf(h) } };
        patchDimCache(dim, code, { headline: { text: h.text, status: h.status || 'neutral', status_text: h.status_text || '不明', source: 'model' }, analyst_failed: false });
      } else {
        const why = row.state === 'no_data' ? '没有取到这一块的数据' + (row.reason ? '：' + row.reason : '') : row.state === 'failed' ? '这次没能给出结论' + (row.reason ? '：' + row.reason : '') : '这次没有结论';
        c.msgs.push({ id: ++chatSeq, who: who, kind: 'nodata', round: true, text: why, at: at });
        c.results[who] = { error: why };
        patchDimCache(dim, code, { headline: null, analyst_failed: true });
      }
    });
    c.msgs.push({ id: ++chatSeq, who: 'chief', kind: 'divider', text: dimSummary(c), at: at });
    const debate = b.debate || {};
    ['bull', 'bear'].forEach((who) => {
      const pts = (debate[who] && debate[who].points) || [];
      c.msgs.push({ id: ++chatSeq, who: who, kind: 'analysis', round: true, fromBundle: true, points: pts, errors: debate[who] ? debate[who].errors : null, at: at });
      c.results[who] = { msg: { points: pts } };
    });
    const card = Object.assign({}, b.chief || {});
    c.msgs.push({ id: ++chatSeq, who: 'chief', kind: 'analysis', round: true, card: card, text: card.text || '', at: at });
    c.results.chief = { msg: card };
    // 之后的追问和回答来自群里的记录（只取结论之后的 reply）
    ((group && group.lines) || []).filter((line) => line.kind === 'reply' && ROLE[line.agent]).forEach((line) => {
      if (line.quote) c.msgs.push({ id: ++chatSeq, who: 'me', kind: 'reply', text: line.quote, at: new Date() });
      c.msgs.push({ id: ++chatSeq, who: line.agent, kind: 'reply', text: line.text || '', quote: line.quote || '', headline: headlineOf(line), tools: line.tools || null, at: new Date() });
    });
    return c;
  }

  function loadConclusion(code, keep) {
    const enc = encodeURIComponent(code);
    return Promise.all([
      fetchStockJSON(conclUrl(code, keep ? '?enqueue=0' : '')),
      fetch(HARNESS_ORIGIN + '/api/stocks/' + enc + '/agents/group').then((res) => (res.ok ? res.json() : null)).catch(() => null),
    ]).then((pair) => {
      const prev = chats[code];
      // 直播诊断进行中：只同步 job，绝不整包替换气泡
      if (prev && prev.liveDiag && !prev.restored) {
        if (pair[0] && pair[0].job) prev.job = pair[0].job;
        if (pair[0] && pair[0].bundle) prev.bundle = pair[0].bundle;
        return;
      }
      if (keep && prev && prev.bundle && pair[0].bundle && prev.bundle.id === pair[0].bundle.id && !pair[0].job.state.match(/^(queued|running|retrying)$/)) {
        prev.refreshing = false; prev.job = pair[0].job; return;
      }
      if (keep && prev && prev.bundle && pair[0].bundle && prev.bundle.id === pair[0].bundle.id) {
        prev.refreshing = true; prev.job = pair[0].job; return;
      }
      chats[code] = conclusionChat(code, pair[0], pair[1]);
    }).catch((err) => {
      if (keep && chats[code]) return;
      if (chats[code] && chats[code].liveDiag) return;
      const c = conclusionChat(code, { state: 'failed', job: { message: errText(err) } }, null);
      chats[code] = c;
    }).then(() => { pollConclusion(code); });
  }

  // 还在生成（首次打开）或正在重新分析时，每 3 秒看一次进度；出了新结论包就换上。
  function pollConclusion(code) {
    const c = chats[code];
    if (!c || !c.restored || c.pollTimer) return;
    const busy = (c.pending && c.pending.state === 'pending') || c.refreshing;
    if (!busy) return;
    c.pollTimer = setTimeout(() => {
      c.pollTimer = 0;
      if (chats[code] !== c) return;
      fetchStockJSON(conclUrl(code)).then((concl) => {
        if (chats[code] !== c) return;
        const newer = concl.bundle && (!c.bundle || concl.bundle.id !== c.bundle.id);
        const running = /^(queued|running|retrying)$/.test((concl.job && concl.job.state) || '');
        if (newer || (!running && concl.state !== 'pending')) {
          loadConclusion(code).finally(renderChat);
          return;
        }
        c.job = concl.job;
        if (concl.state === 'failed') { c.pending = { state: 'failed', message: (concl.job && concl.job.message) || '' }; c.refreshing = false; }
        renderChat();
        pollConclusion(code);
      }).catch(() => { pollConclusion(code); });
    }, 3000);
  }

  function ensureRecord(code) {
    if (chats[code] || chatLoads[code]) return;
    chatLoads[code] = true;
    fetchStockJSON(conclUrl(code, '?enqueue=0'))
      .then((concl) => {
        const running = /^(queued|running|retrying)$/.test((concl.job && concl.job.state) || '');
        if (concl.bundle && concl.state === 'ready' && !running) {
          return fetch(HARNESS_ORIGIN + '/api/stocks/' + encodeURIComponent(code) + '/agents/group')
            .then((res) => (res.ok ? res.json() : null))
            .catch(() => null)
            .then((g) => { chats[code] = conclusionChat(code, concl, g); });
        }
        // 后台任务已经占用股票锁时，继续轮询结论包；否则直播 SSE
        if (running) return loadConclusion(code);
        startLiveDiagnosis(code);
      })
      .catch(() => { startLiveDiagnosis(code); })
      .finally(() => { delete chatLoads[code]; renderChat(); });
  }

  function reanalyze(code) {
    code = code || state.stock;
    const prev = chats[code];
    if (prev && prev.pollTimer) { clearTimeout(prev.pollTimer); prev.pollTimer = 0; }
    const running = prev && prev.job && /^(queued|running|retrying)$/.test(prev.job.state || '');
    if (running) {
      toast('后台正在分析这只股票，先等它跑完');
      ensureRecord(code);
      return;
    }
    startLiveDiagnosis(code);
    renderChat();
  }

  function conclusionBarHTML(c) {
    const b = c.bundle, job = c.job || {};
    const muted = 'font-size:14px;color:#5B6372;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;padding:0 2px';
    const progress = job.total ? '正在重新分析 ' + (job.done || 0) + '/' + job.total : '正在重新分析';
    if (c.liveDiag && !c.restored) {
      const done = Math.min(FULL.length, c.revealed || 0);
      return '<div style="padding:12px;border-radius:10px;background:#F4F7FF;color:#2457D6;font-size:15px;line-height:1.6;display:flex;align-items:center;gap:10px"><span class="typing" aria-hidden="true"><i></i><i></i><i></i></span>' +
        '<span>正在直播诊断 · 分析师依次发言 ' + done + '/' + FULL.length + '</span></div>';
    }
    if (!b) {
      if (c.pending && c.pending.state === 'failed') {
        return '<div style="padding:10px 12px;border-radius:10px;background:#FFF6E5;color:#7A4A00;font-size:15px;line-height:1.6">这只股票的结论还没有生成出来' + (c.pending.message ? '：' + esc(c.pending.message) : '') +
          '<button type="button" class="mini" data-click="reanalyze" style="margin-left:8px;color:#2457D6">重新分析</button></div>';
      }
      return '<div style="padding:12px;border-radius:10px;background:#F4F7FF;color:#2457D6;font-size:15px;line-height:1.6;display:flex;align-items:center;gap:10px"><span class="typing" aria-hidden="true"><i></i><i></i><i></i></span>' +
        '<span>正在生成这只股票的结论（五位分析师在本机依次分析，约一两分钟）' + (job.total ? ' · ' + (job.done || 0) + '/' + job.total : '') + '</span></div>';
    }
    const failed = (b.analysts || []).filter((a) => a.state !== 'ok').map((a) => a.label);
    return '<div style="' + muted + '"><span>' + esc(b.trade_date) + (b.session === 'intraday' ? ' 盘中' : ' 收盘后') + ' · ' + esc(b.generated_at) + ' 生成</span>' +
      '<span>' + (b.source === 'agent' ? '主分析师：模型裁决' : '主分析师：规则版（模型这次没有出结果）') + '</span>' +
      (failed.length ? '<span style="color:#7A4A00">没有结论：' + esc(failed.join('、')) + '</span>' : '') +
      (c.refreshing ? '<span style="color:#2457D6">' + esc(progress) + '</span>' : '') + '</div>' +
      (b.stale ? '<div style="padding:8px 12px;border-radius:10px;background:#FFF6E5;color:#7A4A00;font-size:14px;line-height:1.6">' + esc(b.stale) + '。点右上角“重新分析”可以现在更新。</div>' : '');
  }

  // 发言结果落到气泡上。headline 为空（模型还没给出结论）显示成「暂时没有结论」。
  function applyResult(m, res) {
    const side = m.who === 'bull' || m.who === 'bear';
    m.at = new Date();
    m.headline = res.headline || null;
    m.quote = m.hideQuote ? '' : (res.quote || '');
    m.text = res.text || '';
    m.points = res.points || null;
    m.chartHTML = res.chart_html || '';
    m.chartHTMLs = res.chart_htmls || (res.chart_html ? [res.chart_html] : []);
    m.errors = res.errors || null;
    m.tools = res.tools || m.tools || null;
    m.card = m.who === 'chief' && res.kind !== 'reply' ? res : null;
    m.kind = res.kind === 'reply' ? (m.text ? 'reply' : 'empty') : (side || m.card) ? 'analysis' : !m.text ? 'empty' : 'analysis';
    if (m.who === 'chief' && m.card) {
      const code = state.stock;
      delete chiefDetail[code];
      delete planCache[code];
    }
  }

  // 开场一位一位说，避免同时占满连接，用户的追问才发得出去。
  function startSpeaker(code, who) {
    const c = chats[code];
    if (!c || c.restored || c.abandoned || c.results[who]) return;
    c.started = c.started || {};
    if (c.started[who]) return;
    c.started[who] = true;
    const gen = c.gen;
    const job = loadOne(code, who);
    if (who === 'chief') job.then(() => { if (liveChat(code, gen)) refreshVerdicts(code); });
  }

  function refreshVerdicts(code) {
    const c = chats[code];
    if (!c || c.verdictsRefreshed || !c.results.chief || !c.results.chief.msg) return;
    c.verdictsRefreshed = true;
    const gen = c.gen;
    // 只读 chief/detail 补采纳标记，勿再打 bull/bear stream（会重跑模型并清掉刚写好的裁决）
    fetch(chatUrl(code, 'chief/detail')).then((r) => r.ok ? r.json() : null).then((body) => {
      const cur = liveChat(code, gen);
      if (!cur || !body || !body.points) return;
      ['bull', 'bear'].forEach((side) => {
        const pack = body.points[side];
        const pts = pack && (pack.points || pack);
        if (!pts || !pts.length) return;
        const m = cur.msgs.find((x) => x.round && x.who === side);
        if (m && m.kind === 'analysis') m.points = pts;
      });
      renderChat();
    }).catch(() => {});
  }

  // 按顺序亮出来：上一位说完再请下一位；每位之间隔一小会儿。
  function advanceRound(code) {
    const c = chats[code];
    if (!c || c.holding || c.restored) return;
    for (;;) {
      const who = FULL[c.revealed];
      if (!who) break;
      if (who === 'bull' && !c.dividerDone) { c.dividerDone = true; c.msgs.push({ id: ++chatSeq, who: 'chief', kind: 'divider', text: dimSummary(c), at: new Date() }); }
      let m = c.msgs.find((x) => x.round && x.who === who);
      if (!m) { m = { id: ++chatSeq, who: who, kind: 'typing', round: true, at: new Date() }; c.msgs.push(m); }
      const res = c.results[who];
      if (!res) {
        startSpeaker(code, who);
        const d = c.drafts && c.drafts[who];
        if (d && d.text) { m.kind = 'streaming'; m.text = d.text; }
        if (d && d.status) m.statusNote = d.status;
        break;
      }
      if (res.error) { m.kind = 'error'; m.text = res.error; m.at = new Date(); } else applyResult(m, res.msg);
      c.revealed++;
      if (c.revealed < FULL.length) {
        c.holding = true;
        renderChat();
        setTimeout(() => { c.holding = false; advanceRound(code); }, 500);
        return;
      }
      // 主分析师失败时不要 commit：否则会把上一轮结论当成新结论发出去
      if (c.liveDiag && c.results.chief && !c.results.chief.error) commitLiveConclusion(code);
      else if (c.liveDiag) { c.liveDiag = false; toast('主分析师这次没有给出裁决，可点「重新分析」再试'); }
    }
    renderChat();
  }

  // 「6 位维度分析师已发言 · 5 偏多 · 1 中性」
  function dimSummary(c) {
    const n = { support: 0, warn: 0, neutral: 0 };
    ROUND.forEach((d) => { const m = c.msgs.find((x) => x.round && x.who === d); const st = m && m.headline && m.headline.status; if (st in n) n[st]++; });
    const spoke = ROUND.filter((d) => { const m = c.msgs.find((x) => x.round && x.who === d); return m && m.kind === 'analysis'; }).length;
    return spoke + ' 位维度分析师已发言' + (n.support ? ' · ' + n.support + ' 偏多' : '') + (n.warn ? ' · ' + n.warn + ' 偏空' : '') + (n.neutral ? ' · ' + n.neutral + ' 中性' : '');
  }

  function retryMsg(code, id) {
    const c = chats[code], m = c && c.msgs.find((x) => x.id === id);
    const sideEmpty = m && (m.who === 'bull' || m.who === 'bear') && m.kind === 'analysis' && !(m.points || []).length;
    if (!m || (m.kind !== 'error' && m.kind !== 'empty' && !sideEmpty)) return;
    // 安排失败：整句重发，别误打 chief/stream 开场
    if (m.retry && m.retry.plan && m.question) {
      const q = m.question;
      c.msgs = c.msgs.filter((x) => x.id !== m.id);
      const lastUser = [...c.msgs].reverse().find((x) => x.who === 'me' && x.text === q);
      if (lastUser) c.msgs = c.msgs.filter((x) => x.id !== lastUser.id);
      renderChat();
      sendChat(code, q);
      return;
    }
    m.kind = 'typing';
    m.errors = null;
    const job = m.retry
      ? sseOnce(m.retry.url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: m.retry.body }, (draft) => applyDraft(code, m.who, draft))
      : sseOnce(chatUrl(code, ROLE[m.who].stream), null, (draft) => applyDraft(code, m.who, draft));
    job.then((res) => { if (!res.text && m.retry) throw new Error('没有收到回答'); if (m.round) c.results[m.who] = { msg: res }; applyResult(m, res); })
      .catch((err) => { m.kind = 'error'; m.text = errText(err); if (m.round) c.results[m.who] = { error: m.text }; })
      .finally(renderChat);
    renderChat();
  }
  actions.retryChat = (el) => retryMsg(state.stock, Number(el.dataset.id));

  function parseMention(text) {
    const m = MENTION_RE.exec(text);
    if (!m) return { who: state.replyTo || 'chief', question: text.trim() };
    return { who: WHO_OF[m[1]], question: (text.slice(0, m.index) + ' ' + text.slice(m.index + m[0].length)).replace(/\s+/g, ' ').trim() };
  }

  function syncAskTarget() {
    const who = state.replyTo || 'chief';
    const name = ROLE[who].name;
    document.querySelectorAll('.ask-tag').forEach((tag) => { tag.textContent = name; });
    syncAskGate();
  }

  function planUrl(code) {
    return HARNESS_ORIGIN + '/api/stocks/' + encodeURIComponent(code) + '/agents/chief/plan';
  }
  function askAnalyst(code, who, question, opts) {
    const bubble = { id: ++chatSeq, who: who, kind: 'typing', at: new Date(), question: question, hideQuote: !!(opts && opts.hideQuote), quote: (opts && opts.hideQuote) || who === 'chief' ? '' : question };
    bubble.retry = { url: chatUrl(code, ROLE[who].reply), body: JSON.stringify({ question: question }) };
    chats[code].msgs.push(bubble);
    renderChat(true);
    return sseOnce(bubble.retry.url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: bubble.retry.body }, (draft) => applyDraft(code, who, draft))
      .then((res) => {
        if (!res || !res.text) throw new Error('没有收到回答');
        applyResult(bubble, res);
        return bubble;
      })
      .catch((err) => { bubble.kind = 'error'; bubble.text = errText(err); renderChat(); return null; });
  }
  function sendChat(code, text) {
    const raw = String(text || '').trim();
    const mentioned = parseMention(raw);
    if (!raw || (MENTION_RE.test(raw) && !mentioned.question)) { toast('@ 之后写上你想问的问题'); return false; }
    const c = chats[code] || newChat(code);
    const previous = (c.lastAnalysts || []).filter((id) => ROLE[id] && id !== 'chief' && id !== 'bull' && id !== 'bear');
    state.replyTo = previous[0] || 'chief';
    syncAskTarget();
    c.msgs.push({ id: ++chatSeq, who: 'me', kind: 'say', text: raw, at: new Date() });
    const host = { id: ++chatSeq, who: 'chief', kind: 'typing', at: new Date(), question: raw, statusNote: '正在安排' };
    c.msgs.push(host);
    renderChat(true);
    const finishHost = (ids) => {
      host.kind = 'route'; host.mentions = ids; host.statusNote = '';
      c.lastAnalysts = ids.slice();
      state.replyTo = ids[0] || 'chief';
      syncAskTarget();
      renderChat();
    };
    const planBody = JSON.stringify({ question: raw, previous: previous });
    host.retry = { url: planUrl(code), body: planBody, plan: true };
    fetch(planUrl(code), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: planBody })
      .then(async (res) => {
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || data.message || ('安排失败（' + res.status + '）'));
        return data;
      })
      .then((plan) => {
        const ids = (plan && plan.analysts || []).filter((id) => ROLE[id] && id !== 'chief' && id !== 'bull' && id !== 'bear');
        if (!ids.length) {
          host.kind = 'typing';
          host.statusNote = '正在回答';
          host.retry = { url: chatUrl(code, ROLE.chief.reply), body: JSON.stringify({ question: raw }) };
          c.lastAnalysts = [];
          state.replyTo = 'chief';
          syncAskTarget();
          renderChat();
          return sseOnce(host.retry.url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: host.retry.body }, (draft) => applyDraft(code, 'chief', draft))
            .then((res) => { if (!res || !res.text) throw new Error('没有收到回答'); applyResult(host, res); });
        }
        finishHost(ids);
        // 同时请多位时，各自答完即可，不再让主分析师合说总结
        const askNext = (index) => {
          if (index >= ids.length) return Promise.resolve();
          return askAnalyst(code, ids[index], raw).then(() => askNext(index + 1));
        };
        return askNext(0);
      })
      .catch((err) => { host.kind = 'error'; host.text = errText(err); })
      .finally(renderChat);
    return true;
  }

  // ---- 画气泡 ----
  const avatarHTML = (who, size) => '<span role="img" aria-label="' + esc(ROLE[who].name) + '头像" class="av" style="width:' + size + 'px;height:' + size + 'px">' + AVATARS[ROLE[who].av] + '</span>';
  const statusPill = (h) => {
    if (!h || !h.status_text) return '';
    const str = h.strength ? ' · ' + h.strength : '';
    return '<span class="pill" style="' + (STATUS_STYLE[h.status] || STATUS_STYLE.neutral) + ';font-weight:600">' + esc(h.status_text + str) + '</span>';
  };
  const divider = (label) => '<div style="display:flex;align-items:center;gap:10px;font-size:14px;color:#8A919E"><span style="flex:1;height:1px;background:#E3E6EB"></span><span>' + esc(label) + '</span><span style="flex:1;height:1px;background:#E3E6EB"></span></div>';
  const BUBBLE = 'font-size:16px;line-height:1.7;color:#14171F;display:flex;flex-direction:column;gap:12px;width:100%;min-width:0';
  const CIRCLED = '①②③④⑤⑥⑦⑧⑨';
  const quoteHTML = (q) => (q ? '<div style="padding:6px 10px;border-left:3px solid #C9CED6;border-radius:4px;background:#F3F4F6;font-size:14px;color:#5B6372;line-height:1.5"><b style="color:#3A4250">我</b>：' + esc(q) + '</div>' : '');
  const atName = (name) => '<span style="color:#2457D6;font-weight:600">@' + esc(name) + '</span>';
  const evBtn = (label, action) => '<button type="button" class="ev" data-click="' + action + '"><span>' + label + '</span><span aria-hidden="true">→</span></button>';
  const toolsHTML = (tools) => {
    const list = (tools || []).filter((t) => t && (t.label || t.name));
    if (!list.length) return '';
    return '<details class="tools"><summary>调用了 ' + list.length + ' 个工具<svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg></summary>' +
      '<div class="tools-body">' + list.map((t) => {
        const label = esc(t.label || t.name);
        const note = t.note ? ' · ' + esc(t.note) : '';
        const name = t.name && t.name !== t.label ? '<span style="color:#A1A7B2;font-family:\'IBM Plex Mono\',ui-monospace,Menlo,Consolas,monospace"> ' + esc(t.name) + '</span>' : '';
        return '<div>' + label + note + name + '</div>';
      }).join('') + '</div></details>';
  };

  // 看多 / 看空的论据：编号、一句话、依据（哪位分析师）、主分析师裁决后的采纳或未采纳。
  function pointsHTML(m) {
    const pts = m.points || [];
    if (!pts.length) {
      const why = (m.errors && m.errors[0]) ? '论据没能通过核对：' + m.errors[0] : '这一轮还没有站得住的论据。';
      return '<span style="color:#8A919E">' + esc(why) + '</span>' +
        (m.round && !m.fromBundle ? '<button type="button" class="mini" data-click="retryChat" data-id="' + m.id + '" style="align-self:flex-start;color:#2457D6">↻ 再试一次</button>' : '');
    }
    return '<span>' + (m.kind === 'reply' ? '' : atName('主分析师') + ' 我的 ' + pts.length + ' 条：') + '</span>' + pts.map((p, i) => {
      const by = p.analyst && ROLE[p.analyst.dimension];
      const v = p.verdict;
      return '<div style="display:flex;flex-direction:column;gap:4px;padding-top:4px"><div style="display:flex;gap:8px"><span style="flex:none;color:#2457D6;font-weight:600">' + (CIRCLED[i] || (i + 1)) + '</span><span style="min-width:0;overflow-wrap:anywhere">' + esc(p.text) +
        (by ? ' <span style="color:#8A919E">— 依据 <button type="button" class="ev" style="height:20px;padding:0 8px" data-click="' + by.drawer + '"><span>@' + esc(by.name) + '</span></button></span>' : '') + '</span></div>' +
        (v ? '<span style="align-self:flex-start;margin-left:24px;display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font-size:13px;' + (v.adopt ? 'background:#EAF0FD;color:#1F3F8A' : 'background:#F4F5F7;color:#5B6372') + '">' + (v.adopt ? '✓ ' : '✗ ') + esc(v.text || (v.adopt ? '采纳' : '未采纳')) + '</span>' : '') + '</div>';
    }).join('');
  }

  // 主分析师的本轮裁决：结论、采纳了谁、得分、不过、如果我错了。
  function chiefCardHTML(m, code) {
    const k = m.card;
    const row = (label, html) => html ? '<div style="display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px;font-size:15px;line-height:1.65"><span style="color:#8A919E">' + label + '</span><span style="color:#3A4250;overflow-wrap:anywhere">' + html + '</span></div>' : '';
    const wrong = k.if_wrong || {}, alert = wrong.alert;
    // 操作提醒：持有的怎么办、想买的怎么办。条件式，依据本轮裁决
    const act = k.actions || {};
    const actLine = (who, text) => text ? '<div style="display:grid;grid-template-columns:56px minmax(0,1fr);gap:8px;font-size:15px;line-height:1.65"><span style="color:#2457D6;font-weight:600">' + who + '</span><span style="color:#14171F;overflow-wrap:anywhere">' + mdInline(text) + '</span></div>' : '';
    const actHTML = (act.hold || act.buy) ? '<div style="display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:10px;background:#F1F5FE"><span style="font-size:14px;font-weight:700">操作提醒</span>' + actLine('已持有', act.hold) + actLine('想买的', act.buy) + '<span style="font-size:12px;color:#8A919E">条件式提醒，依据本轮裁决；条件变了做法就变，不是确定的买卖指令</span></div>' : '';
    return '<span style="font-size:14px;color:#8A919E">本轮裁决</span>' +
      '<span style="font-size:20px;font-weight:700;line-height:1.3;color:' + DIRECTION_COLOR(k.verdict) + '">' + esc(k.verdict || '不明') + '</span>' +
      mdBox(k.text || '', 'chief') + actHTML +
      '<div style="display:flex;flex-direction:column;gap:4px;padding-top:6px;border-top:1px solid #F1F2F4">' +
      row('采纳', esc(k.adopted || '')) + row('未采纳', esc(k.rejected || '')) + row('得分', esc((k.score && k.score.text) || '')) + row('不过', mdInline(k.however || '')) +
      row('如果我错了', mdInline(wrong.text || '') + (alert && num(alert.price) != null ? '<div style="margin-top:6px">' + synthBell(code + ':' + (alert.side || 'down'), DOWN_TXT, '#B9DCC8', alert.price, /收盘/.test(String(alert.condition || '')) ? 'close' : 'touch') + '</div>' : '')) + '</div>';
  }

  function msgHTML(m, code) {
    if (m.kind === 'divider') return divider(m.text);
    if (m.who === 'me') {
      const mm = MENTION_RE.exec(m.text);
      const shown = mm ? esc(m.text.slice(0, mm.index)) + '<span style="opacity:.85">' + esc(mm[0]) + '</span>' + esc(m.text.slice(mm.index + mm[0].length)) : esc(m.text);
      return '<div style="display:flex;gap:10px;justify-content:flex-end;align-items:flex-start"><div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;max-width:600px">' +
        '<span style="' + MONO + ';font-size:13px;color:#A1A7B2">' + clock(m.at) + '</span>' +
        '<div style="padding:9px 14px;border-radius:14px 4px 14px 14px;background:#2457D6;color:#FFFFFF;font-size:15px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere">' + shown + '</div></div>' +
        '<span aria-hidden="true" style="flex:none;width:34px;height:34px;border-radius:50%;background:#3A4250;color:#FFFFFF;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center">我</span></div>';
    }
    const r = ROLE[m.who];
    const side = m.who === 'bull' || m.who === 'bear';
    let body;
    if (m.kind === 'typing') body = '<span class="typing" aria-label="正在输入"><i></i><i></i><i></i></span>';
    else if (m.kind === 'streaming') body = quoteHTML(m.quote) + mdLive(m.text, m.who) + '<span class="typing" aria-label="正在输入" style="margin-top:4px"><i></i><i></i><i></i></span>';
    else if (m.kind === 'route') {
      const ids = ROUND.filter((id) => (m.mentions || []).includes(id)).concat((m.mentions || []).filter((id) => ROUND.indexOf(id) < 0));
      body = '<span>' + ids.map((id) => atName(ROLE[id].name)).join(' ') + (ids.length > 1 ? ' 该你们开麦了：' : ' 球给你了：') + '</span>';
    }
    else if (m.kind === 'opening') body = '<span style="overflow-wrap:anywhere">' + ROUND.map((id) => atName(ROLE[id].name)).join(' ') + ' 先说自己维度的结论，一人一条，带依据；之后请 ' + atName(ROLE.bull.name) + ' ' + atName(ROLE.bear.name) + ' 各说一轮，最后由我裁决。也可以 @ 任意一位分析师继续追问，不 @ 默认由我回答。</span>';
    else if (m.kind === 'error') body = '<span style="color:#7A4A00">' + esc(r.short) + (m.retry ? '这次没能回答：' : '这次没能发言：') + esc(m.text) + '</span>' +

  const judgeOf = (v) => {

    if (/偏多|看多|bullish|support/i.test(s)) return JUDGE.bullish;

  function synthTrendHTML(D) {
    const T = D.trend;
    const bars = ((T && T.bars) || []).filter((b) => num(b.close) != null);
    if (bars.length < 2) return '';
    const long = bars.length > 90; // 近一年：不画每日判断条
    const n = bars.length, X0 = 6, X1 = 664, XR = 668, TOP = 26, BASE = 166, step = (X1 - X0) / (n - 1);
    const x = (i) => X0 + i * step;
    const lines = [['up', (T.lines || {}).up], ['down', (T.lines || {}).down]].filter((l) => l[1] && num(l[1].price) != null);
    const maPts = (T.ma && T.ma.points) || [];
    const maVals = [].concat.apply([], maPts.map((q) => [q.ma7, q.ma20, q.ma60])).filter((v) => num(v) != null);
    const prices = bars.map((b) => b.close).concat(lines.map((l) => l[1].price), maVals);
    const hi = num(T.y_max) != null ? Math.max(T.y_max, Math.max.apply(null, prices)) : Math.max.apply(null, prices);
    const lo = num(T.y_min) != null ? Math.min(T.y_min, Math.min.apply(null, prices)) : Math.min.apply(null, prices);
    const y = (p) => (hi === lo ? (TOP + BASE) / 2 : TOP + ((hi - p) / (hi - lo)) * (BASE - TOP));
    const run = T.current_run || {};
    let svg = '';

    // the current run's stretch of the chart
    if (run.start_in_window && num(run.start_index) != null && run.start_index < n) {
      const J = judgeOf(run.lean), rx = Math.max(X0, x(run.start_index) - step / 2);
      svg += '<rect x="' + rx.toFixed(1) + '" y="8" width="' + (XR - rx).toFixed(1) + '" height="164" fill="' + J.bg + '"></rect>' +
        (rx > 120 ? '<text x="' + (rx - 6).toFixed(1) + '" y="162" font-size="11" fill="' + J.txt + '" font-weight="600" text-anchor="end">' + esc(run.text || '') + '</text>'
          : '<text x="' + (rx + 6).toFixed(1) + '" y="162" font-size="11" fill="' + J.txt + '" font-weight="600">' + esc(run.text || '') + '</text>');
    }

    // 转弱价位 / 突破价位
    let lastLabelY = -99;
    lines.sort((a, b) => y(a[1].price) - y(b[1].price)).forEach(([side, l]) => {
      const ly = y(l.price), up = side === 'up', c = up ? '#D9483F' : '#2E8B57', t = up ? UP_TXT : DOWN_TXT;
      const ty = Math.max(ly, lastLabelY + 30);
      lastLabelY = ty;
      svg += '<g><title>' + esc(l.base_name + (l.verified === false ? '（没有通过重算验证，只作参考）' : '')) + '</title>' +
        '<line x1="6" y1="' + ly.toFixed(1) + '" x2="' + XR + '" y2="' + ly.toFixed(1) + '" stroke="' + c + '" stroke-width="1" stroke-dasharray="' + (l.verified === false ? '2 3' : '4 3') + '"' + (l.verified === false ? ' opacity="0.7"' : '') + '></line>' +
        '<text x="674" y="' + (ty + 4).toFixed(1) + '" font-size="11" fill="' + t + '" font-family="IBM Plex Mono, monospace" font-weight="600">' + l.price.toFixed(2) + '</text>' +
        '<text x="674" y="' + (ty + 17).toFixed(1) + '" font-size="10" fill="#5B6372">' + esc(l.label || '') + '</text></g>';
    });

    // 均线：MA7 / MA20 / MA60
    if (maPts.length) {
      const byDate = {};
      maPts.forEach((q) => { byDate[q.date] = q; });
      MA_LINES.forEach((l) => {
        const mp = bars.map((b, i) => (byDate[b.date] && num(byDate[b.date][l[0]]) != null ? x(i).toFixed(1) + ',' + y(byDate[b.date][l[0]]).toFixed(1) : null)).filter(Boolean);
        if (mp.length > 1) svg += '<polyline points="' + mp.join(' ') + '" fill="none" stroke="' + l[2] + '" stroke-width="1" opacity="0.9"></polyline>';
      });
    }

    // price
    const pts = bars.map((b, i) => x(i).toFixed(1) + ',' + y(b.close).toFixed(1));
    svg += '<polygon points="' + X0 + ',' + BASE + ' ' + pts.join(' ') + ' ' + X1 + ',' + BASE + '" fill="#14171F" fill-opacity="0.04"></polygon>' +
      '<polyline points="' + pts.join(' ') + '" fill="none" stroke="#14171F" stroke-width="1.8" stroke-linejoin="round"></polyline>' +
      '<circle cx="' + X1 + '" cy="' + y(bars[n - 1].close).toFixed(1) + '" r="3.5" fill="#14171F"></circle>';

    // 每日判断 strip（只在短图上画）
    if (!long) {
      const sw = (X1 - X0 - 10) / (n - 1);
      svg += '<text x="674" y="191" font-size="10" fill="#5B6372">每日判断</text>';
      bars.forEach((b, i) => {
        svg += '<rect x="' + (X0 + i * sw).toFixed(1) + '" y="182" width="10.0" height="10" rx="1" fill="' + (b.judgment ? judgeOf(b.judgment).fill : '#F1F2F4') + '"></rect>';
      });
    }

    // date ticks
    const idx = {};
    bars.forEach((b, i) => { idx[b.date] = i; });
    const ticks = (T.x_ticks || []).filter((d) => idx[d] != null);
    ticks.forEach((d, k) => {
      const anchor = k === 0 ? 'start' : k === ticks.length - 1 ? 'end' : 'middle';
      svg += '<text x="' + x(idx[d]).toFixed(1) + '" y="208" font-size="10" fill="#8A919E" text-anchor="' + anchor + '" font-family="IBM Plex Mono, monospace">' + esc(mmdd(d)) + '</text>';
    });

    // hover
    bars.forEach((b, i) => {
      const bx = Math.max(0, x(i) - step / 2), bw = Math.min(XR, x(i) + step / 2) - bx;
      svg += '<rect class="bh" data-i="' + i + '" data-x="' + x(i).toFixed(1) + '" data-y="' + y(b.close).toFixed(1) + '" x="' + bx.toFixed(1) + '" y="0" width="' + bw.toFixed(1) + '" height="172" fill="transparent"></rect>';
    });
    svg += '<line class="xh-line" x1="0" y1="8" x2="0" y2="172" stroke="#14171F" stroke-width="1" opacity="0.35" pointer-events="none" style="display:none"></line>' +
      '<circle class="xh-dot" cx="0" cy="0" r="3.5" fill="#14171F" stroke="#FFFFFF" stroke-width="1.5" pointer-events="none" style="display:none"></circle>';
    const data = bars.map((b) => [b.date, b.close, null, false, null, b.judgment ? judgeOf(b.judgment).label : '']);

    // 判断记录
    const segs = T.segments || [], rec = T.record || {}, first = (rec.items || [])[0];
    let record;
    if (first && first.kind === 'first' && segs.length <= 1) {
      const J = judgeOf(first.lean);
      record = '<span class="pill" style="background:' + J.bg + ';color:' + J.txt + '">' + esc(mmdd(first.date)) + ' 首次研判 · ' + esc(first.label || J.label) + '</span>' +
        (rec.note ? '<span style="color:#5B6372">' + esc(rec.note) + '</span>' : '');
    } else {
      record = segs.map((s) => { const J = judgeOf(s.lean); return '<span class="pill" style="background:' + J.bg + ';color:' + J.txt + '">' + esc(s.text || '') + '</span>'; }).join('<span style="color:#A1A7B2">→</span>');
      const col = (v) => '<span style="' + MONO + ';color:' + signColor(v) + '">' + pct(v) + '</span>';
      const since = run.since_text ? esc(run.since_text)
        : num(run.ret) != null ? esc(run.label || '') + '以来 ' + col(run.ret) + (num(run.sector_ret) != null ? '，同期板块 ' + col(run.sector_ret) : '') : '';
      if (since) record += '<span style="color:#3A4250">' + since + '</span>';
    }
    const first0 = bars[0], last = bars[n - 1];
    const alt = '近 ' + n + ' 个交易日股价从 ' + first0.close.toFixed(2) + ' 到 ' + last.close.toFixed(2) + (run.text ? '；' + run.text : '');
    const legend = long ? '' : [['偏多', '#D9483F'], ['偏空', '#2E8B57'], ['不明', '#D5D9DF']].map((l) =>
      '<span><span style="display:inline-block;width:10px;height:8px;border-radius:1px;background:' + l[1] + ';margin-right:4px"></span>' + l[0] + '</span>').join('');
    return '<section aria-label="走势与判断" style="background:#FFFFFF;border:1px solid #E3E6EB;border-radius:14px;padding:18px 24px;display:flex;flex-direction:column;gap:12px">' +
      '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px"><h2 style="margin:0;font-size:16px;font-weight:700">' + (long ? '近一年走势' : '走势与判断') + '</h2>' +
      '<span style="font-size:14px;color:#5B6372">' + (long ? '近一年（' + (T.window || n) + ' 个交易日）' : '近 ' + (T.window || n) + ' 个交易日') + ' · ' + esc(T.unit || '日线') + '</span><span style="margin-left:auto"></span>' +
      '<span style="display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:#5B6372">' + legend + '</span></div>' +
      (T.ma && maPts.length ? '<div style="display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:#5B6372">' + MA_LINES.map((l) => '<span><span style="display:inline-block;width:12px;height:2px;background:' + l[2] + ';margin-right:5px;vertical-align:middle"></span>' + l[1] + ' <b style="' + MONO + ';color:#14171F">' + (num(T.ma[l[0]]) != null ? T.ma[l[0]].toFixed(2) : '—') + '</b></span>').join('') + '</div>' : '') +
      '<div class="chart-wrap" style="position:relative" data-kind="synth" data-xh-bottom="172" data-bars="' + esc(JSON.stringify(data)) + '">' +
      '<svg viewBox="0 0 760 214" role="img" aria-label="' + esc(alt) + '" style="width:100%;height:auto;display:block">' + svg + '</svg>' +
      '<div class="chart-tip" role="tooltip" hidden></div></div>' +
      (long ? '' : '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:15px"><span style="color:#5B6372">判断记录</span>' + record + '</div>') + '</section>';
  }



  // 结论详情：弹框，不和基本面、资金流这些挤在右侧
  function conclHTML(code) {
    const st = curStock(), e = chiefDetail[code], D = (e && e.data) || {};
    const upd = D.updated_at ? mmdd(D.updated_at) + ' ' + hhmm(D.updated_at) + ' 更新' : '';
    return '<div data-click="closeConcl" style="position:fixed;inset:0;background:rgba(20,23,31,.38);z-index:40"></div>' +
      '<div role="dialog" aria-modal="true" aria-label="结论详情" style="position:fixed;z-index:41;left:50%;top:50%;transform:translate(-50%,-50%);width:min(1000px,calc(100vw - 48px));max-height:calc(100vh - 56px);overflow-y:auto;box-sizing:border-box;padding:20px 26px 24px;background:#FFFFFF;border-radius:16px;box-shadow:0 24px 64px rgba(20,23,31,.30)">' +
      '<div style="display:flex;align-items:baseline;gap:10px;padding-bottom:14px"><span style="font-size:18px;font-weight:700">结论详情</span><span style="font-size:15px;font-weight:600">' + esc(st.name || code) + '</span><span style="' + MONO + ';font-size:13px;color:#8A919E">' + esc(code) + '</span>' +
      (upd ? '<span style="font-size:13px;color:#8A919E">主分析师 · ' + esc(upd) + '</span>' : '') +
      '<button type="button" aria-label="关闭（Esc）" data-click="closeConcl" style="margin-left:auto;width:30px;height:30px;border:none;border-radius:8px;background:transparent;color:#5B6372;font-size:20px;cursor:pointer">×</button></div>' +
      conclPanelHTML(code) + '</div>';
  }

  // ---- 右侧「结论」页：主分析师的裁决 + 六位分析师的立场 + 正反方论据 + 要盯的价 ----
  const STANCE_LINK = { market: 'openMarket', sector: 'openSector', volume_flow: 'openFlow', news: 'openNews', finance: 'openFin', fundamental: 'openFund' };
  const STANCE_DIM = [['market', '大盘', 'market'], ['sector', '板块', 'sector'], ['volume_flow', '资金流', 'flow'], ['news', '新闻', 'news'], ['finance', '财报', 'fin'], ['fundamental', '基本面', 'fund']];
  const CZ_STATUS = { support: JUDGE.bullish, warn: JUDGE.bearish, neutral: JUDGE.unclear };
  const czClean = (t) => String(t == null ? '' : t).replace(/\*\*|__|`/g, '').replace(/\s*\n+\s*/g, ' ').trim();
  const czTitle = (t, right) => '<div style="display:flex;align-items:baseline;gap:8px"><span style="font-size:15px;font-weight:700;color:#14171F">' + t + '</span>' + (right ? '<span style="margin-left:auto;font-size:13px;color:#8A919E">' + right + '</span>' : '') + '</div>';

  // 主分析师还没说完时，先把已经出来的几位分析师的结论摆在这里
  function stanceFromCache(code) {
    return STANCE_DIM.map(([dim, label, key]) => {
      const fe = dimCache[key + ':' + code];
      const cc = fe && fe.status === 'done' && fe.data ? analystConclusionOf(fe.data) : null;
      const J = cc && !cc.pending ? CZ_STATUS[cc.status] || JUDGE.unclear : null;
      return { dimension: dim, label, direction: J ? J.label : null, strength: '', certainty: '', text: cc && !cc.pending ? cc.text : '', done: !!J };
    });
  }

  function czStanceRows(rows) {
    return '<div style="display:flex;flex-direction:column">' + rows.map((r) => {
      const J = r.direction ? judgeOf(r.direction) : null;
      const act = STANCE_LINK[r.dimension];
      return '<button type="button" ' + (act ? 'data-click="' + act + '" ' : '') + 'title="打开' + esc(r.label) + '分析师" style="display:grid;grid-template-columns:8px minmax(0,1fr);gap:10px;align-items:start;padding:10px 0;border:none;border-top:1px solid #F1F2F4;background:transparent;font:inherit;text-align:left;cursor:pointer;color:#14171F">' +
        '<span aria-hidden="true" style="width:8px;height:8px;border-radius:2px;margin-top:6px;' + (J ? 'background:' + J.fill : 'box-sizing:border-box;border:1.5px solid #C9CED6') + '"></span>' +
        '<span style="display:flex;flex-direction:column;gap:3px;min-width:0"><span style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap"><b style="font-size:15px">' + esc(r.label) + '</b>' +
        (J ? '<span style="font-size:14px;font-weight:600;color:' + J.txt + '">' + esc(r.direction) + (r.strength ? ' · ' + esc(r.strength) : '') + '</span>' : '<span style="font-size:14px;color:#A1A7B2">' + (r.done === false ? '暂无结论' : '分析中…') + '</span>') +
        (r.certainty ? '<span style="font-size:13px;color:#8A919E">把握 ' + esc(r.certainty) + '</span>' : '') + '</span>' +
        (r.text ? '<span style="font-size:14px;line-height:1.65;color:#5B6372;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden">' + esc(czClean(r.text)) + '</span>' : '') + '</span></button>';
    }).join('') + '</div>';
  }

  function czPoints(label, color, bg, block) {
    const pts = (block && block.points) || [];
    if (!pts.length && !(block && block.risk)) return '<div style="display:flex;flex-direction:column;gap:6px">' + czTitle(label) + '<span style="font-size:14px;color:#8A919E;line-height:1.7">这边没有找到能改变这几个星期判断的硬论据。</span></div>';
    const rows = pts.map((p) => {
      const took = p.state === 'adopted', pending = p.state === 'pending', dots = [1, 2, 3].map((i) => '<span style="display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:2px;background:' + (i <= (p.final_weight || p.weight || 0) && took ? color : '#DDE1E7') + '"></span>').join('');
      return '<div style="display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px;padding:8px 0;border-top:1px solid #F1F2F4;' + (took || pending ? '' : 'opacity:.62') + '">' +
        '<span style="font-size:15px;color:' + color + '">' + esc(p.mark || '') + '</span>' +
        '<span style="display:flex;flex-direction:column;gap:4px;min-width:0"><span style="font-size:15px;line-height:1.65;color:#14171F">' + esc(czClean(p.claim)) + '</span>' +
        '<span style="display:flex;align-items:center;gap:8px;font-size:13px;color:#8A919E">' + (took ? '<span class="pill" style="background:' + bg + ';color:' + color + '">采信</span>' + dots : pending ? '<span class="pill" style="background:#F4F5F7;color:#5B6372">主分析师没有裁决，仅列出</span>' : '<span class="pill" style="background:#F4F5F7;color:#5B6372">不采信' + (p.reason ? ' · ' + esc(p.reason) : '') + '</span>') + '</span></span></div>';
    }).join('');
    return '<div style="display:flex;flex-direction:column;gap:0">' + czTitle(label, pts.length + ' 条') + '<div style="margin-top:4px">' + rows + '</div>' +
      (block.risk ? '<div style="margin-top:6px;padding:8px 10px;border-radius:8px;background:#F7F8FA;font-size:14px;line-height:1.65;color:#5B6372"><b style="font-weight:600;color:#3A4250">这一边最大的弱点：</b>' + esc(czClean(block.risk)) + '</div>' : '') + '</div>';
  }

  function czPrice(code, side, x) {
    if (!x || num(x.price) == null) return '';
    const up = side === 'up', c = up ? UP_TXT : DOWN_TXT, dist = num(x.dist) != null ? (up ? '上方 ' : '下方 ') + (Math.abs(x.dist) * 100).toFixed(1) + '%' : '';
    const line = (k, v) => v ? '<div style="display:grid;grid-template-columns:34px minmax(0,1fr);gap:6px;font-size:14px;line-height:1.6"><span style="color:#8A919E">' + k + '</span><span style="color:#3A4250">' + esc(v) + '</span></div>' : '';
    return '<div style="display:flex;flex-direction:column;gap:5px;border-radius:12px;padding:12px;background:' + (up ? '#FDF0EF' : '#EDF7F1') + '">' +
      '<span style="display:flex;justify-content:space-between;align-items:center"><span style="' + MONO + ';font-size:20px;font-weight:700;color:' + c + '">' + (up ? '▲ ' : '▼ ') + x.price.toFixed(2) + '</span>' + (dist ? '<span class="pill" style="background:#FFFFFF">' + dist + '</span>' : '') + '</span>' +
      line('依据', x.name) + line('条件', x.condition) + line('结果', x.consequence) + (x.why ? '<span style="font-size:14px;color:#5B6372;line-height:1.6">' + esc(x.why) + '</span>' : '') +
      synthBell(code + ':' + side, c, up ? '#F0C4C0' : '#B9DCC8', x.price, /收盘/.test(String(x.condition || '')) ? 'close' : 'touch') + '</div>';
  }

  function conclPanelHTML(code) {
    const c = chats[code], chief = c && c.results && c.results.chief, e = chiefDetail[code];
    const wrap = (inner) => '<div style="display:flex;flex-direction:column;gap:20px">' + inner + '</div>';
    const wait = (text, partial) => wrap('<div style="display:flex;align-items:center;gap:8px;font-size:15px;color:#5B6372"><span class="typing" aria-hidden="true"><i></i><i></i><i></i></span>' + text + '</div>' +
      '<div style="display:flex;flex-direction:column;gap:2px">' + czTitle('各位分析师的结论') + czStanceRows(partial) + '</div>');
    if (!chief) return wait('主分析师等各位分析师发言完，再给出整体结论…', stanceFromCache(code));
    if (!e || e.status === 'loading') return wait('正在打开上次的结论详情…', stanceFromCache(code));
    if (e.status === 'error') return wrap('<div style="display:flex;align-items:center;gap:10px;font-size:15px;color:#7A4A00">没能取到结论详情：' + esc(e.error) + '<button type="button" class="mini" data-click="retryConcl" style="color:#2457D6">↻ 重试</button></div>');
    const D = e.data || {}, dir = D.direction || {}, pos = D.position || {}, sc = D.score || {};
    // 直播气泡里的裁决优先：详情缓存若还是旧的「不明」，不要盖过本轮「偏空」
    const live = (chief && chief.msg) || {};
    const verdictText = String(live.verdict || dir.verdict || '不明');
    const bodyText = live.text || dir.text || '';
    const parts = verdictText.split(' · '), J = judgeOf(parts[0]);
    const total = (sc.bull || 0) + (sc.bear || 0);
    const bar = total ? '<div style="display:flex;flex-direction:column;gap:4px"><div style="display:flex;height:8px;border-radius:4px;overflow:hidden;background:#E3E6EB"><span style="width:' + (100 * (sc.bull || 0) / total).toFixed(1) + '%;background:#D9483F"></span><span style="width:' + (100 * (sc.bear || 0) / total).toFixed(1) + '%;background:#2E8B57"></span></div>' +
      '<div style="display:flex;justify-content:space-between;font-size:13px;color:#5B6372"><span><b style="color:' + UP_TXT + '">看多 ' + (sc.bull || 0) + '</b></span><span>采信的论据分量</span><span><b style="color:' + DOWN_TXT + '">看空 ' + (sc.bear || 0) + '</b></span></div></div>' : '';
    const hero = '<div style="display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:14px;background:' + J.bg + '">' +
      '<div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap"><span style="font-size:32px;font-weight:700;line-height:1.1;color:' + J.txt + '">' + esc(parts[0]) + '</span>' + (parts[1] ? '<span style="font-size:15px;font-weight:600;color:' + J.txt + '">' + esc(parts[1]) + '</span>' : '') +
      (pos.label ? '<span class="pill" style="background:#FFFFFF;color:#3A4250">位置 ' + esc(pos.label) + '</span>' : '') + '</div>' +
      (bodyText ? '<div style="font-size:14px;font-weight:600;line-height:1.7;color:#14171F">' + mdHTML(bodyText) + '</div>' : '') +
      (pos.text ? '<span style="font-size:14px;color:#5B6372">' + esc(czClean(pos.text)) + '</span>' : '') + bar +
      '<span style="font-size:13px;color:#8A919E">主分析师 · ' + (D.updated_at ? esc(mmdd(D.updated_at) + ' ' + hhmm(D.updated_at)) + ' 更新' : '') + (D.source_note ? ' · ' + esc(D.source_note) : '') + '</span></div>';
    const callout = (k, text, bg, fg) => text ? '<div style="display:flex;flex-direction:column;gap:3px;padding:10px 12px;border-radius:10px;background:' + bg + '"><span style="font-size:13px;font-weight:600;color:' + fg + '">' + k + '</span><div style="font-size:14px;line-height:1.7;color:#3A4250">' + mdHTML(text) + '</div></div>' : '';
    const callouts = callout('结论可能在哪里错', D.postmortem, '#FFF8E8', '#7A4A00') + callout('分歧怎么处理的', D.conflict, '#F4F5F7', '#5B6372');
    const pts = D.points || {};
    const lv = D.levels || {}, prices = czPrice(code, 'down', lv.down) + czPrice(code, 'up', lv.up);
    const notices = (D.notices || []).filter((n) => n.tag && n.text);
    const noticeRows = notices.length ? '<div style="display:flex;flex-direction:column;gap:0">' + czTitle('值得注意的事') + notices.map((n) =>
      '<button type="button" data-click="' + (DIM_DRAWER[n.dimension] || '') + '" style="display:grid;grid-template-columns:42px minmax(0,1fr);gap:8px;align-items:start;padding:9px 0;border:none;border-top:1px solid #F1F2F4;background:transparent;font:inherit;text-align:left;cursor:pointer;color:#14171F">' +
      '<span class="pill" style="' + (DETAIL_TAG[n.tag] || DETAIL_TAG['中性']) + ';justify-self:start">' + esc(n.tag) + '</span><span style="font-size:14px;line-height:1.65;color:#3A4250"><b style="font-weight:600">' + esc(n.label) + '</b>　' + esc(czClean(n.text)) + '</span></button>').join('') + '</div>' : '';
    const ops = opsHTML(chief && chief.msg && chief.msg.actions);
    const chart = chartHTML(code);
    const plan = tradePlanHTML(code);
    return wrap(hero + ops + chart + (prices ? '<div style="display:flex;flex-direction:column;gap:8px">' + czTitle('要盯的两个价', '到价提醒') + '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px">' + prices + '</div></div>' : '') + plan + callouts +
      '<div style="display:flex;flex-direction:column;gap:2px">' + czTitle('各位分析师的结论', '点开看依据') + czStanceRows(D.stance || stanceFromCache(code)) + '</div>' +
      czPoints('看多的理由', '#C8312B', '#FDECEA', pts.bull) + czPoints('看空的理由', '#1E6B44', '#E5F3EB', pts.bear) +
      noticeRows +

  const renderSynthAndChrome = () => { renderChat(); renderChrome(); };
  // 复制：优先用剪贴板接口，不行就退回临时输入框。
  function copyText(text) {

      document.body.appendChild(ta); ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      ta.remove();
      if (ok) done(); else toast('复制失败，请手动选中文字复制');

  }
  // 一条发言的纯文字：回答直接用 markdown 原文；看多看空的论据、主分析师的卡片拼成几行。

  actions.refreshSynth = () => { delete synthCache[curStock().code]; };
  // 到了提醒我：存在本机，盘中每 3 分钟、收盘后各查一次，到价进通知。再点一次撤掉。
  const alertsBusy = {};
  actions.toggleAlert = (el) => {

    if (alertsBusy[k]) return;

    const on = alertsOn[k];

    fetchStockJSON(HARNESS_ORIGIN + '/api/v1/stocks/' + encodeURIComponent(code) + '/alerts', undefined, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ side: side, price: price, confirm: el.dataset.confirm || 'touch' }) })
      .then((body) => { const a = body.alert || {}; alertsOn[k] = { id: a.id, price: a.price }; done('已设提醒：' + (side === 'down' ? '跌到 ' : '涨到 ') + price.toFixed(2) + ' 时通知你'); })
      .catch((err) => done('设提醒失败：' + err.message));

  // 打开结论面板时把这只股票已经设过的提醒读回来，按钮才显示「已设提醒」
  function loadAlerts(code) {

  // ===== 自选股：列表、当前股票、问问、标签、搜索 =====
  // GET /api/v1/watchlist  -> { items: [{ ts_code, name, price, change, change_pct, subtitle: { text, tone }, computing, ... }] }
  // POST /api/v1/watchlist {q}, DELETE /api/v1/watchlist/{ts_code}, GET /api/v1/stocks/search?q=
  // 列表只展示状态。诊断中来自这一只自己的重新诊断，或它已经在排队；打开页面不会把全部自选都拉去算。
  const WATCH_POLL_MS = 15000, WATCH_BUSY_POLL_MS = 5000;
  let watchTimer = null;
  const quoteCache = {}; // code -> { status, price, chg, pct } — only for opened stocks that are not on the list

  const fmtSigned = (v, d) => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(d);
  const moveColor = (v) => (v > 0 ? UP_TXT : v < 0 ? DOWN_TXT : '#5B6372');
  const synthInfo = (code) => { const e = synthCache[code]; return e && e.status === 'done' && e.data && e.data.headline ? e.data : null; };
  const dirMain = (D) => (D.headline && D.headline.status_text) || '不明';

  function loadWatch() {
    const url = HARNESS_ORIGIN + '/api/v1/watchlist';
    fetchStockJSON(url)
      .then((body) => {
        watchState.status = 'done';
        watchState.error = null;
        watchState.items = Array.isArray(body.items) ? body.items : [];
        settleRediag();
        // 从持仓、扫描页点「诊断 →」过来的票：不在自选里就默认加进自选
        if (urlPending) {
          urlPending = false;
          if (!watchItem(urlStock)) addWatch(urlStock);
        }
        // first visit: nothing remembered, so start on the first listed stock
        if (!keep.get('diag.stock') && !watchItem(state.stock) && watchState.items.length) openStock(watchState.items[0].ts_code);
      })
      .catch((err) => { if (watchState.status !== 'done') { watchState.status = 'error'; watchState.error = describeError(err, url, '', 15000); } })
      .finally(() => {
        render();
        clearTimeout(watchTimer);
        const busy = watchState.items.some((i) => i.computing) || Object.keys(rediag).length > 0;
        watchTimer = setTimeout(() => (document.hidden ? watchTimer = setTimeout(loadWatch, WATCH_POLL_MS) : loadWatch()), busy ? WATCH_BUSY_POLL_MS : WATCH_POLL_MS);
      });
  }
  actions.retryWatch = () => { watchState.status = 'loading'; loadWatch(); };

  function addWatch(code) {
    return fetchStockJSON(HARNESS_ORIGIN + '/api/v1/watchlist', undefined, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ q: code }) })
      .then((body) => {
        if (body.item && !watchItem(body.item.ts_code)) watchState.items.unshift(body.item);
        toast(body.added === false ? '已经在自选里了' : '已加入自选');
        loadWatch();
      })
      .catch((err) => toast('加入自选失败：' + err.message));
  }
  // ---- 自选的操作：右键菜单（打开 / 重新诊断 / 置顶 / 移出）、拖动排序 ----
  // 排序只在这个浏览器里记：「需要留意」（有提醒、判断刚变过）的股票始终在最上面，其余按你拖的顺序；置顶放到它们之后的第一位。
  const watchOrder = { list: Array.isArray(keep.get('diag.watchOrder')) ? keep.get('diag.watchOrder') : [] };
  const rediag = {}; // code -> { since, judged, seen }：正在后台重新诊断的股票
  const isAttention = (s) => { const k = (s.subtitle || {}).kind; return k === 'alert' || k === 'change'; };
  function orderedWatch() {
    const top = [], rest = [];
    watchState.items.forEach((s, i) => (isAttention(s) ? top : rest).push({ s: s, i: i }));
    const pos = (x) => { const k = watchOrder.list.indexOf(x.s.ts_code); return k < 0 ? 1e6 + x.i : k; };
    rest.sort((a, b) => pos(a) - pos(b));
    return top.concat(rest).map((x) => x.s);
  }
  const saveOrder = (codes) => { watchOrder.list = codes; keep.set('diag.watchOrder', codes); };
  const restCodes = () => orderedWatch().filter((s) => !isAttention(s)).map((s) => s.ts_code);

  function settleRediag() {
    Object.keys(rediag).forEach((code) => {
      const r = rediag[code], it = watchItem(code);
      if (!it) { delete rediag[code]; return; }
      if (it.computing) r.seen = true;
      if ((r.seen && !it.computing) || (it.judged_at && it.judged_at !== r.judged) || Date.now() - r.since > 180000) delete rediag[code];
    });
  }
  function rediagnose(code) {
    const it = watchItem(code);
    rediag[code] = { since: Date.now(), judged: it && it.judged_at, seen: false };
    if (state.stock === code) reanalyze(code);
    else {
      // 未打开该股时仍排队后台结论；打开时若在跑会走轮询，不抢锁直播
      fetchStockJSON(conclUrl(code, '/refresh'), undefined, { method: 'POST' })
        .then(() => { clearTimeout(watchTimer); setTimeout(loadWatch, 800); })
        .catch((err) => { delete rediag[code]; toast('重新诊断失败：' + err.message); render(); });
    }
    render();
  }
  function pinStock(code) {
    saveOrder([code].concat(restCodes().filter((c) => c !== code)));
    toast('已置顶');
    render();
  }
  function removeWatch(code) {
    const it = watchItem(code);
    fetchStockJSON(HARNESS_ORIGIN + '/api/v1/watchlist/' + encodeURIComponent(code), undefined, { method: 'DELETE' })
      .then(() => {
        if (it) opened[code] = { name: it.name, code: code };
        watchState.items = watchState.items.filter((i) => i.ts_code !== code);
        if (state.stock === code && watchState.items.length) openStock(orderedWatch()[0].ts_code);
        toast('已移出自选', { label: '撤销', run: () => addWatch(code) });
        render();
      })
      .catch((err) => toast('移出自选失败：' + err.message));
  }
  actions.unwatch = (el) => removeWatch(el.dataset.code);
  function watchAction(kind, code) {
    closeWlMenu();
    if (kind === 'open') { openStock(code); render(); } else if (kind === 'rediag') rediagnose(code);
    else if (kind === 'pin') pinStock(code);

  let wlMenu = null; // { code, el, sel }
  function closeWlMenu() { if (wlMenu) { wlMenu.el.remove(); wlMenu = null; } }
  function highlightWlMenu(i) {
    const its = wlMenu.el.querySelectorAll('.wlm-it');
    wlMenu.sel = (i + its.length) % its.length;
    its.forEach((b, k) => b.classList.toggle('on', k === wlMenu.sel));

  function openWlMenu(code, x, y) {
    closeWlMenu();

    const rows = [['open', '打开诊断', 'Enter'], ['rediag', '重新诊断', '⌘R']].concat(it && isAttention(it) ? [] : [['pin', '置顶', '']]);
    const btn = (r, danger) => '<button type="button" role="menuitem" class="wlm-it' + (danger ? ' danger' : '') + '" data-wlm="' + r[0] + '"><span>' + r[1] + '</span><span class="wlm-k">' + r[2] + '</span></button>';
    const el = document.createElement('div');

    document.body.appendChild(el);
    el.style.left = Math.max(8, Math.min(x, innerWidth - el.offsetWidth - 8)) + 'px';
    el.style.top = Math.max(8, Math.min(y, innerHeight - el.offsetHeight - 8)) + 'px';
    wlMenu = { code: code, el: el, sel: 0 };
    highlightWlMenu(0);
  }
  document.addEventListener('contextmenu', (e) => {
    const row = e.target.closest && e.target.closest('.wl[data-code]');
    if (!row) { closeWlMenu(); return; }
    e.preventDefault();
    openWlMenu(row.dataset.code, e.clientX, e.clientY);
  });
  document.addEventListener('mousedown', (e) => { if (wlMenu && !e.target.closest('#wlMenu')) closeWlMenu(); }, true);
  document.addEventListener('mouseover', (e) => {
    const b = wlMenu && e.target.closest && e.target.closest('.wlm-it');
    if (b) highlightWlMenu([].indexOf.call(wlMenu.el.querySelectorAll('.wlm-it'), b));
  });
  document.addEventListener('click', (e) => {
    const b = wlMenu && e.target.closest && e.target.closest('.wlm-it');
    if (b) { e.stopPropagation(); watchAction(b.dataset.wlm, wlMenu.code); }
  }, true);
  // 菜单开着：↑↓ 选，回车执行，Esc 关；焦点在某只股票上：回车打开，退格 / Delete 移出，⌘R 重新诊断。
  document.addEventListener('keydown', (e) => {
    if (wlMenu) {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); e.stopPropagation(); highlightWlMenu(wlMenu.sel + (e.key === 'ArrowDown' ? 1 : -1)); } else if (e.key === 'Enter') {
        e.preventDefault(); e.stopPropagation();
        const b = wlMenu.el.querySelectorAll('.wlm-it')[wlMenu.sel];
        if (b) watchAction(b.dataset.wlm, wlMenu.code);
      } else if (e.key === 'Escape' || e.key === 'Tab') { e.stopPropagation(); closeWlMenu(); }

    const code = row.dataset.code;
    if (e.key === 'Enter' && !e.metaKey && !e.ctrlKey) { e.preventDefault(); watchAction('open', code); } else if (e.key === 'Backspace' || e.key === 'Delete') { e.preventDefault(); removeWatch(code); } else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'r') { e.preventDefault(); rediagnose(code); }
  }, true);

  // 拖动：只能在「其余」里换位置，「需要留意」的不参与。
  let dragCode = null;
  const clearDropMarks = () => document.querySelectorAll('.drop-top,.drop-bot').forEach((el) => el.classList.remove('drop-top', 'drop-bot'));
  const dropTarget = (e) => { const r = e.target.closest && e.target.closest('.wl[data-drop]'); return r && r.dataset.code !== dragCode ? r : null; };
  document.addEventListener('dragstart', (e) => {
    const row = e.target.closest && e.target.closest('.wl[data-drop]');
    if (!row) return;
    dragCode = row.dataset.code;
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', dragCode); } catch (x) { /* ignore */ }
    row.classList.add('drag-src');
  });
  document.addEventListener('dragover', (e) => {
    if (!dragCode) return;
    clearDropMarks();
    const r = dropTarget(e);
    if (!r) return;
    e.preventDefault();
    const box = r.getBoundingClientRect();
    r.classList.add(e.clientY < box.top + box.height / 2 ? 'drop-top' : 'drop-bot');
  });
  document.addEventListener('drop', (e) => {
    if (!dragCode) return;
    const r = dropTarget(e);
    if (!r) return;
    e.preventDefault();
    const box = r.getBoundingClientRect(), before = e.clientY < box.top + box.height / 2;
    const rest = restCodes().filter((c) => c !== dragCode), i = rest.indexOf(r.dataset.code);
    rest.splice(before ? i : i + 1, 0, dragCode);
    saveOrder(rest);
    render();
  });
  document.addEventListener('dragend', () => {
    dragCode = null;
    clearDropMarks();
    document.querySelectorAll('.drag-src').forEach((el) => el.classList.remove('drag-src'));

  // A stock opened from search is not on the list, so it has no list quote: ask for its latest bars instead.
  function ensureQuote(code) {
    if (quoteCache[code]) return;
    quoteCache[code] = { status: 'loading' };
    fetchStockJSON(API_BASE + '/api/stocks/bars?q=' + encodeURIComponent(code) + '&days=2').then((body) => {
      const items = ((body.data || {}).items || []).slice().sort((a, b) => String(a.trade_date).localeCompare(String(b.trade_date)));
      const last = items[items.length - 1], prev = items[items.length - 2];
      if (!last || num(last.close) == null) throw new Error('没有行情数据');
      const pct = num(last.pct_chg);
      quoteCache[code] = { status: 'done', price: last.close, chg: prev && num(prev.close) != null ? last.close - prev.close : null, pct: pct };
    }).catch(() => { quoteCache[code] = { status: 'error' }; }).finally(renderChrome);
  }
  function quoteOf(code) {
    const it = watchItem(code);
    if (it) return num(it.price) != null ? { price: it.price, chg: num(it.change), pct: num(it.change_pct) } : null;
    const q = quoteCache[code];
    return q && q.status === 'done' ? q : null;
  }

  // ---- 自选列表 ----
  function renderWatch() {
    const root = document.getElementById('watchList');

    const key = [state.stock, watchState.status, watchState.error && watchState.error.at].concat(list.map((i) =>
      [i.ts_code, i.name, i.price, i.change_pct, (i.subtitle || {}).text, (i.subtitle || {}).tone, i.computing, rediag[i.ts_code] ? 'r' : ''].join(':'))).join('|');

      root.innerHTML = [0, 1, 2, 3].map(() => '<div class="wl"><span><div class="sk" style="width:64px;height:13px"></div></span><span class="px"><div class="sk" style="width:40px;height:13px"></div></span><span class="chg"></span><span class="sub"><div class="sk" style="width:110px;height:11px"></div></span></div>').join('');
