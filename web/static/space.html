<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PABuddy AI · 个人空间</title>
    <link rel="stylesheet" href="/static/vendor/fonts/inter.css" />
    <link rel="stylesheet" href="/static/vendor/fontawesome/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        html, body { height: 100%; overflow: hidden; }
        body {
            background: #ffffff;
            height: 100%;
        }
        .dashboard {
            width: 100%;
            height: 100%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            min-height: 44px;
            border-bottom: 1px solid #eceff3;
            background: #ffffff;
            flex-wrap: nowrap;
            gap: 12px;
            flex-shrink: 0;
            -webkit-app-region: drag;
        }
        .navbar .brand, .navbar .nav-right, .navbar button { -webkit-app-region: no-drag; }
        .nav-left { display: flex; align-items: center; gap: 16px; }
        .brand {
            display: flex; align-items: center; gap: 8px;
            font-weight: 600; font-size: 15px; color: #0b1a33; cursor: pointer;
        }
        .brand i {
            font-size: 15px; color: #f97316;
            background: none; padding: 0; border-radius: 0;
        }
        .nav-right { display: flex; align-items: center; gap: 18px; }
        .nav-right i {
            font-size: 18px; color: #4f5b6b; cursor: pointer; padding: 6px; border-radius: 50%;
        }
        .nav-right i:hover { background: #f0f2f6; color: #f97316; }
        .avatar {
            width: 38px; height: 38px;
            background: linear-gradient(135deg, #f97316, #fb923c);
            border-radius: 40px; display: flex; align-items: center; justify-content: center;
            color: white; font-weight: 600; font-size: 15px; cursor: pointer;
        }
        .main-grid {
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 24px;
            padding: 16px 24px 20px;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }
        .sidebar { display: flex; flex-direction: column; gap: 20px; min-height: 0; overflow: hidden; }
        .user-card {
            position: relative;
            display: flex; align-items: center; gap: 8px;
            margin-top: auto; padding: 10px 6px 4px;
            border-top: 1px solid rgba(0,0,0,0.06);
            flex-shrink: 0; cursor: pointer; border-radius: 12px;
        }
        .user-card:hover { background: rgba(249, 115, 22, 0.04); }
        .user-card .avatar { width: 32px; height: 32px; font-size: 13px; flex-shrink: 0; }
        .user-meta { min-width: 0; flex: 1; }
        .user-meta .name {
            font-size: 13px; font-weight: 600; color: #0b1a33; line-height: 1.2;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .user-meta .email {
            font-size: 11px; color: #8a95a8; margin-top: 2px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .user-settings {
            width: 28px; height: 28px; flex-shrink: 0; border: none; background: transparent;
            color: #4f5b6b; border-radius: 8px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .user-settings:hover { background: #eef1f6; color: #f97316; }
        .user-menu {
            position: absolute; left: 0; right: 0; bottom: calc(100% + 6px);
            background: #fff; border: 1px solid #eef1f6; border-radius: 12px;
            box-shadow: 0 12px 32px rgba(15, 30, 50, 0.12);
            padding: 6px; display: none; z-index: 20;
        }
        .user-menu.show { display: block; }
        .user-menu button {
            width: 100%; display: flex; align-items: center; gap: 8px;
            padding: 8px 10px; border: none; background: transparent; border-radius: 8px;
            font-size: 13px; color: #1c2a44; cursor: pointer; text-align: left;
        }
        .user-menu button:hover { background: #fff7ed; color: #f97316; }
        .user-menu button i { width: 14px; font-size: 12px; color: inherit; }
        .side-nav { display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
        .quick-item {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 12px; border-radius: 14px;
            color: #1c2a44; font-weight: 500; font-size: 14px; cursor: pointer;
        }
        .quick-item:hover { background: rgba(249, 115, 22, 0.06); }
        .quick-item.active { background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
        .quick-item.active i { color: #f97316; }
        .quick-item i { width: 20px; font-size: 16px; color: #4f5b6b; }
        .history-panel {
            flex: 1; min-height: 0; display: flex; flex-direction: column;
            padding-top: 8px; border-top: 1px solid rgba(0,0,0,0.05);
        }
        .history-list { display: flex; flex-direction: column; gap: 4px; overflow-y: auto; min-height: 0; }
        .history-empty { font-size: 12px; color: #9aa7b9; padding: 8px 12px; }
        .history-item {
            display: flex; align-items: center; gap: 10px;
            padding: 8px 12px; border-radius: 12px; font-size: 13px; color: #1c2a44; cursor: pointer;
        }
        .history-item:hover { background: #eef1f6; }
        .history-item i { color: #f97316; font-size: 13px; width: 16px; }
        .history-item .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
        .history-item .time { margin-left: auto; font-size: 11px; color: #8f9cae; flex-shrink: 0; }

        .content {
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }
        .files-col { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }

        .space-header {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 16px;
            margin-bottom: 22px;
        }
        .space-identity { display: flex; align-items: center; gap: 14px; min-width: 0; }
        .space-avatar {
            width: 48px; height: 48px; flex-shrink: 0;
            background: linear-gradient(135deg, #f97316, #fb923c);
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-weight: 700; font-size: 18px;
            box-shadow: 0 8px 18px rgba(249, 115, 22, 0.22);
        }
        .space-header h2 { font-size: 22px; color: #0b1a33; letter-spacing: -0.3px; }
        .space-header p { font-size: 13px; color: #8a95a8; margin-top: 4px; }
        .space-stats { display: flex; gap: 10px; flex-wrap: wrap; }
        .stat-pill {
            background: #fff;
            border: 1px solid #eef1f6;
            border-radius: 14px;
            padding: 10px 14px;
            min-width: 84px;
        }
        .stat-pill span { display: block; font-size: 11px; color: #8a95a8; }
        .stat-pill strong { font-size: 16px; color: #0b1a33; font-weight: 650; }

        .space-toolbar {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }
        .space-tabs {
            display: flex;
            gap: 4px;
            background: #f0f2f6;
            padding: 4px;
            border-radius: 40px;
            flex-shrink: 0;
        }
        .space-tab {
            border: none;
            background: transparent;
            color: #3c4a5e;
            font-size: 13px;
            font-weight: 500;
            padding: 7px 14px;
            border-radius: 30px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .space-tab i { font-size: 12px; }
        .space-tab:hover { background: rgba(255,255,255,0.55); }
        .space-tab.active {
            background: #fff;
            color: #0b1a33;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .space-search {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 8px;
            background: #fff;
            border: 1px solid #eef1f6;
            border-radius: 40px;
            padding: 0 14px;
            height: 38px;
            min-width: 180px;
            max-width: 260px;
            flex: 1;
        }
        .space-search i { color: #9aa7b9; font-size: 13px; }
        .space-search input {
            border: none; outline: none; background: transparent;
            font-size: 13px; color: #1c2a44; width: 100%;
        }
        .space-search input::placeholder { color: #9aa8bb; }

        .type-filter, .fav-check {
            display: flex; align-items: center; gap: 8px;
            height: 38px; padding: 0 14px;
            background: #fff; border: 1px solid #eef1f6; border-radius: 40px;
            font-size: 13px; color: #3c4a5e; flex-shrink: 0;
        }
        .type-filter i { color: #8a95a8; font-size: 12px; }
        .type-filter select {
            border: none; outline: none; background: transparent;
            font-size: 13px; color: #1c2a44; cursor: pointer;
        }
        .fav-check { cursor: pointer; user-select: none; }
        .fav-check input { accent-color: #f97316; }

        .files-scroll { flex: 1; min-height: 0; overflow-y: auto; padding-right: 4px; }

        .file-table {
            background: #fff;
            overflow: hidden;
        }
        .file-cols {
            display: grid;
            grid-template-columns: minmax(260px, 2fr) 88px 140px 110px 72px;
            align-items: center;
            gap: 12px;
            padding: 0 8px;
        }
        .file-thead {
            min-height: 36px;
            border-bottom: 1px solid #eceff3;
            font-size: 13px; font-weight: 500; color: #8a95a8;
        }
        .file-thead .sort {
            display: inline-flex; align-items: center; gap: 4px;
            border: none; background: none; padding: 0; cursor: pointer;
            font: inherit; color: inherit;
        }
        .file-thead .sort .carets {
            display: inline-flex; flex-direction: column; line-height: 0.6; font-size: 8px; color: #c5ced9;
        }
        .file-thead .sort.active .carets { color: #1c2a44; }
        .file-group-row, .file-task-row, .file-item-row { min-height: 40px; }
        .file-group-row {
            cursor: pointer; font-weight: 650; color: #1c2a44; font-size: 14px;
        }
        .file-group-row:hover, .file-task-row:hover, .file-item-row:hover { background: #f7f8fa; }
        .file-item-row.selected { background: #f3f4f6; }
        .tree-name { display: flex; align-items: center; gap: 8px; min-width: 0; }
        .tree-name .label {
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;
            font-size: 14px; color: #1c2a44;
        }
        .chevron {
            width: 16px; color: #8a95a8; font-size: 11px; flex-shrink: 0;
            transition: transform .15s;
        }
        .file-group.collapsed .chevron { transform: rotate(-90deg); }
        .file-group.collapsed .file-group-body { display: none; }
        .count-pill {
            font-size: 12px; font-weight: 500; color: #6b778c;
            background: #eef1f6; border-radius: 999px; padding: 1px 8px; flex-shrink: 0;
        }
        .row-check {
            width: 16px; height: 16px; flex-shrink: 0;
            border-radius: 4px; display: flex; align-items: center; justify-content: center;
            font-size: 9px; color: transparent;
        }
        .file-item-row.selected .row-check {
            background: #1c2a44; color: #fff;
        }
        .task-ico, .file-ico {
            width: 22px; height: 22px; border-radius: 6px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center; font-size: 11px;
        }
        .task-ico { background: #f3f4f6; color: #6b7280; }
        .task-ico svg { width: 14px; height: 14px; display: block; }
        .file-ico.kind-excel { background: #e8f6ee; color: #1d7a46; }
        .file-ico.kind-pdf { background: #fdeeee; color: #c0392b; }
        .file-ico.kind-word { background: #eef3fb; color: #2b579a; }
        .file-ico.kind-ppt { background: #fdeee8; color: #c43e1c; }
        .file-ico.kind-image { background: #f3efff; color: #c2410c; }
        .file-ico.kind-html { background: #e8f1ff; color: #2563eb; }
        .file-ico.kind-code { background: #e6f7f4; color: #0f766e; }
        .file-ico.kind-archive { background: #fef6e8; color: #b45309; }
        .file-ico.kind-file { background: #eef3fb; color: #3b82f6; }
        .indent-task { padding-left: 22px; }
        .indent-file { padding-left: 46px; }
        .col-meta { font-size: 13px; color: #8a95a8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .file-item-row .col-name { font-size: 14px; color: #1c2a44; }
        .file-star {
            border: none; background: none; color: #c5ced9; cursor: pointer; padding: 0;
            width: 16px; flex-shrink: 0; font-size: 12px;
        }
        .file-star.on { color: #f59e0b; }
        .file-item-row .file-actions { margin-left: auto; opacity: 0; display: flex; gap: 4px; }
        .file-item-row:hover .file-actions { opacity: 1; }
        .file-actions button {
            border: none; background: #f4f6fa; color: #6b7a8f;
            width: 26px; height: 26px; border-radius: 8px; cursor: pointer;
        }
        .file-actions button:hover { background: #fff7ed; color: #f97316; }
        .file-actions button.danger:hover { background: #fdecec; color: #d14c4c; }
        .file-empty {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; gap: 6px; padding: 48px 16px; color: #9aa7b9;
        }
        .file-empty .empty-icon {
            width: 44px; height: 44px; border-radius: 14px;
            background: #fff7ed; color: #f97316;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; margin-bottom: 4px;
        }
        .file-empty p { font-size: 14px; color: #3c4a5e; font-weight: 600; }
        .file-empty span { font-size: 12px; }
        @media (max-width: 900px) {
            .file-cols { grid-template-columns: minmax(160px, 1fr) 72px 88px; }
            .col-by, .col-size { display: none; }
        }

        .preview-modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 2000;
            background: rgba(15, 23, 42, 0.42);
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .preview-modal.show { display: flex; }
        .preview-dialog {
            width: min(920px, 100%);
            height: min(780px, calc(100vh - 48px));
            background: #fff;
            border-radius: 24px;
            box-shadow: 0 24px 60px rgba(0,0,0,0.22);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .preview-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            padding: 16px 18px 12px;
            border-bottom: 1px solid #eef1f6;
            flex-shrink: 0;
        }
        .preview-title { display: flex; align-items: center; gap: 8px; font-weight: 600; color: #0b1a33; font-size: 15px; min-width: 0; }
        .preview-title i { color: #f97316; }
        .preview-title span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .preview-close {
            border: none; background: #f0f2f6; color: #6b7a8f;
            width: 32px; height: 32px; border-radius: 50%; cursor: pointer; flex-shrink: 0;
        }
        .preview-close:hover { background: #fdecec; color: #d14c4c; }
        .preview-meta { font-size: 12px; color: #8a95a8; margin-top: 6px; display: flex; gap: 12px; flex-wrap: wrap; }
        .preview-body {
            flex: 1; min-height: 0; overflow: auto; background: #fafbfd;
            padding: 14px 16px; font-size: 13px; line-height: 1.7;
            color: #1c2a44; white-space: pre-wrap; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        }
        .preview-body.is-frame { padding: 0; white-space: normal; background: #fff; }
        .preview-body.is-frame iframe, .preview-body.is-frame img { width: 100%; height: 100%; min-height: 420px; border: 0; }
        .preview-body.is-frame img { object-fit: contain; background: repeating-conic-gradient(#f4f6fa 0 25%, #fff 0 50%) 0 0 / 16px 16px; }
        .csv-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .csv-table th, .csv-table td { padding: 6px 8px; border: 1px solid #eef1f6; text-align: left; }
        .csv-table th { background: #fff7ed; color: #f97316; position: sticky; top: 0; }
        .preview-actions { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid #eef1f6; flex-shrink: 0; }
        .preview-actions button {
            padding: 8px 14px; border-radius: 30px; font-size: 13px; border: none; cursor: pointer;
            display: flex; align-items: center; gap: 6px; font-weight: 500;
        }
        .btn-primary { background: #f97316; color: #fff; }
        .btn-primary:hover { background: #ea580c; }
        .btn-danger { background: #fdecec; color: #d14c4c; }
        .btn-danger:hover { background: #f8d4d4; }

        .toast {
            position: fixed; bottom: 30px; left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1c2a44; color: white; padding: 12px 24px; border-radius: 60px;
            font-size: 13px; box-shadow: 0 12px 40px rgba(0,0,0,0.25);
            opacity: 0; transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none; z-index: 1000; display: flex; align-items: center; gap: 12px;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        @media (max-width: 1100px) {
            .space-header { margin-bottom: 18px; gap: 14px; }
        }
        @media (max-width: 900px) {
            .main-grid { grid-template-columns: 1fr; gap: 20px; }
            .sidebar { max-height: 260px; }
            .navbar { padding: 10px 16px; }
            .main-grid { padding: 12px 16px 16px; }
            .preview-modal { padding: 12px; }
            .preview-dialog { height: min(100vh - 24px, 100%); border-radius: 18px; }
        }
    </style>
</head>
<body>
<div class="dashboard">
    <div id="toast" class="toast"><i class="fas fa-check-circle"></i><span id="toastMessage">操作成功</span></div>
    <header class="navbar">
        <div class="nav-left">
            <div class="brand" id="brandLogo"><i class="fas fa-robot"></i><span>PABuddy AI</span></div>
        </div>
        <div class="nav-right">
            <i class="fas fa-search" id="searchBtn" title="搜索"></i>
            <i class="fas fa-bell" id="notifBtn" title="通知"></i>
        </div>
    </header>
    <div class="main-grid">
        <aside class="sidebar">
            <nav class="side-nav">
                <div class="quick-item" data-nav="task"><i class="fas fa-plus"></i> 新建任务</div>
                <div class="quick-item active" data-nav="space"><i class="fas fa-user"></i> 个人空间</div>
                <div class="quick-item" data-nav="schedule"><i class="fas fa-clock"></i> 定时任务</div>
                <div class="quick-item" data-nav="history"><i class="fas fa-comments"></i> 历史对话</div>
            </nav>
            <div class="history-panel">
                <div class="history-list" id="historyList">
                    <div class="history-empty">暂无对话</div>
                </div>
            </div>
            <div class="user-card" id="userCard">
                <div class="avatar">F</div>
                <div class="user-meta">
                    <div class="name">Felice</div>
                    <div class="email">felicex@gmail.com</div>
                </div>
                <button type="button" class="user-settings" id="settingsBtn" title="设置" aria-label="设置">
                    <i class="fas fa-cog"></i>
                </button>
                <div class="user-menu" id="userMenu">
                    <button type="button" data-action="space"><i class="fas fa-folder-open"></i> 个人空间</button>
                    <button type="button" data-action="notify"><i class="fas fa-bell"></i> 通知</button>
                    <button type="button" data-action="settings"><i class="fas fa-sliders-h"></i> 设置</button>
                    <button type="button" data-action="logs"><i class="fas fa-file-alt"></i> 运行日志</button>
                </div>
            </div>
        </aside>
        <main class="content">
            <div class="files-col">
                <div class="space-header">
                    <div class="space-identity">
                        <div class="space-avatar">F</div>
                        <div>
                            <h2>个人空间</h2>
                            <p id="spaceSummary">felicex@gmail.com</p>
                        </div>
                    </div>
                    <div class="space-stats">
                        <div class="stat-pill" title="你在各会话里发出的提问次数"><span>提问</span><strong id="statQuestions">0</strong></div>
                        <div class="stat-pill" title="当前对话内容的估算用量（约 4 字/Token，非账单）"><span>Token</span><strong id="statTokens">0</strong></div>
                        <div class="stat-pill"><span>上传</span><strong id="statUpload">0</strong></div>
                        <div class="stat-pill"><span>生成</span><strong id="statGen">0</strong></div>
                        <div class="stat-pill"><span>占用</span><strong id="statSize">0</strong></div>
                    </div>
                </div>
                <div class="space-toolbar">
                    <div class="space-tabs">
                        <button type="button" class="space-tab active" data-source="all"><i class="fas fa-layer-group"></i> 全部</button>
                        <button type="button" class="space-tab" data-source="upload"><i class="fas fa-cloud-upload-alt"></i> 上传</button>
                        <button type="button" class="space-tab" data-source="generated"><i class="fas fa-magic"></i> 生成</button>
                    </div>
                    <label class="type-filter">
                        <i class="fas fa-filter"></i>
                        <select id="typeFilter">
                            <option value="all">所有类型</option>
                            <option value="doc">文档</option>
                            <option value="web">网页</option>
                            <option value="sheet">表格</option>
                            <option value="image">图片</option>
                            <option value="ppt">演示</option>
                            <option value="code">代码</option>
                            <option value="archive">压缩包</option>
                            <option value="file">其他</option>
                        </select>
                    </label>
                    <label class="space-search">
                        <i class="fas fa-search"></i>
                        <input id="fileSearch" type="search" placeholder="搜索文件、任务…" autocomplete="off" />
                    </label>
                    <label class="fav-check"><input id="favOnly" type="checkbox" /> 收藏</label>
                </div>
                <div class="files-scroll" id="filesScroll"></div>
            </div>
        </main>
    </div>
</div>

<div class="preview-modal" id="previewModal">
    <div class="preview-dialog" role="dialog" aria-modal="true" aria-labelledby="previewFileName">
        <div class="preview-head">
            <div>
                <div class="preview-title">
                    <i class="fas fa-file" id="previewIcon"></i>
                    <span id="previewFileName">文档预览</span>
                </div>
                <div class="preview-meta" id="previewMeta"></div>
            </div>
            <button type="button" class="preview-close" id="previewClose" title="关闭"><i class="fas fa-times"></i></button>
        </div>
        <div class="preview-body" id="previewBody"></div>
        <div class="preview-actions">
            <button class="btn-primary" id="previewDownloadBtn"><i class="fas fa-download"></i> 下载</button>
            <button class="btn-danger" id="previewDeleteBtn"><i class="fas fa-trash-alt"></i> 删除</button>
        </div>
    </div>
</div>
<script>
(function() {
    const toast = document.getElementById('toast');
    const toastMessage = document.getElementById('toastMessage');
    let toastTimer = null;
    function showToast(message, icon = 'fa-check-circle', duration = 2500) {
        toastMessage.textContent = message;
        toast.querySelector('i').className = `fas ${icon}`;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), duration);
    }

    async function api(path, opts) {
        const res = await fetch(path, opts);
        if (res.status === 204) return null;
        const body = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(body.error || res.statusText);
        return body;
    }

    const FILE_ICON_BY_EXT = {
        csv: 'fa-file-csv', xlsx: 'fa-file-excel', xls: 'fa-file-excel', xlsm: 'fa-file-excel',
        pdf: 'fa-file-pdf', doc: 'fa-file-word', docx: 'fa-file-word',
        ppt: 'fa-file-powerpoint', pptx: 'fa-file-powerpoint',
        png: 'fa-file-image', jpg: 'fa-file-image', jpeg: 'fa-file-image',
        gif: 'fa-file-image', svg: 'fa-file-image', webp: 'fa-file-image',
        py: 'fa-file-code', js: 'fa-file-code', ts: 'fa-file-code', json: 'fa-file-code',
        html: 'fa-globe', htm: 'fa-globe', css: 'fa-file-code', sh: 'fa-file-code', yaml: 'fa-file-code', yml: 'fa-file-code',
        md: 'fa-file-alt', txt: 'fa-file-alt', log: 'fa-file-alt',
        zip: 'fa-file-archive', tar: 'fa-file-archive', gz: 'fa-file-archive'
    };
    const KIND_BY_EXT = {
        csv: 'excel', xlsx: 'excel', xls: 'excel',
        pdf: 'pdf', doc: 'word', docx: 'word',
        ppt: 'ppt', pptx: 'ppt',
        png: 'image', jpg: 'image', jpeg: 'image', gif: 'image', svg: 'image', webp: 'image',
        md: 'file', txt: 'file',
        html: 'html', htm: 'html',
        py: 'code', js: 'code', ts: 'code', json: 'code', css: 'code', sh: 'code', yaml: 'code', yml: 'code', xml: 'code',
        zip: 'archive', tar: 'archive', gz: 'archive'
    };
    const TEXT_PREVIEW_EXT = new Set(['csv', 'json', 'log', 'md', 'py', 'js', 'ts', 'css', 'sh', 'yaml', 'yml', 'txt', 'xml']);
    const IMAGE_PREVIEW_EXT = new Set(['png', 'jpg', 'jpeg', 'gif', 'svg', 'webp']);
    const HTML_PREVIEW_EXT = new Set(['html', 'htm']);
    const MAX_TEXT_PREVIEW_BYTES = 2 * 1024 * 1024;

    function extOf(name) {
        const idx = name.lastIndexOf('.');
        return idx === -1 ? '' : name.slice(idx + 1).toLowerCase();
    }
    function fileIcon(name) { return FILE_ICON_BY_EXT[extOf(name)] || 'fa-file'; }
    function fileKind(name) { return KIND_BY_EXT[extOf(name)] || 'file'; }
    function fileKey(file) { return `${file.sessionId}:${file.path}`; }
    function formatSize(bytes) {
        if (bytes < 1024) return `${bytes} B`;
        if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
        return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
    }
    function formatTokens(n) {
        const v = Number(n);
        if (!Number.isFinite(v) || v <= 0) return '0';
        return Math.round(v).toLocaleString('zh-CN');
    }

    let spaceUsage = { questions: null, tokens: null, files: null };
    function paintSpaceSummary() {
        const parts = ['felicex@gmail.com'];
        if (spaceUsage.questions != null) parts.push(`${spaceUsage.questions} 个问题`);
        if (spaceUsage.files != null) parts.push(`${spaceUsage.files} 个文件`);
        document.getElementById('spaceSummary').textContent =
            spaceUsage.questions == null && spaceUsage.files == null
                ? 'felicex@gmail.com · 加载中…'
                : parts.join(' · ');
    }
    function timeAgo(iso) {
        const t = new Date(iso).getTime();
        if (!Number.isFinite(t)) return '';
        const mins = Math.max(0, Math.floor((Date.now() - t) / 60000));
        if (mins < 1) return '刚刚';
        if (mins < 60) return `${mins}分钟前`;
        const hrs = Math.floor(mins / 60);
        if (hrs < 24) return `${hrs}小时前`;
        const days = Math.floor(hrs / 24);
        if (days === 1) return '昨天';
        if (days < 7) return `${days}天前`;
        return new Date(t).toLocaleDateString('zh-CN');
    }
    function sessionLabel(s) {
        const title = (s.title || '').trim();
        if (title) return title;
        const id = s.id || '';
        const short = id.length > 10 ? id.slice(0, 8) : id;
        return s.parentSession ? `${short} (fork)` : short;
    }
    function formatSessionAge(createdAt) {
        const t = Number(createdAt);
        if (!Number.isFinite(t) || t <= 0) return '';
        const mins = Math.max(0, Math.floor((Date.now() - t) / 60000));
        if (mins < 1) return '刚刚';
        if (mins < 60) return `${mins}分钟前`;
        const hrs = Math.floor(mins / 60);
        if (hrs < 24) return `${hrs}小时前`;
        const days = Math.floor(hrs / 24);
        if (days < 7) return `${days}天前`;
        const d = new Date(t);
        const pad = (n) => String(n).padStart(2, '0');
        const stamp = `${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
        return d.getFullYear() === new Date().getFullYear() ? stamp : `${d.getFullYear()}-${stamp}`;
    }
    function fileUrl(file, download) {
        const encoded = file.path.split('/').map(encodeURIComponent).join('/');
        const base = `/sessions/${encodeURIComponent(file.sessionId)}/files/${encoded}`;
        return download ? `${base}?download=1` : base;
    }

    const filesScroll = document.getElementById('filesScroll');
    const previewModal = document.getElementById('previewModal');
    const previewBody = document.getElementById('previewBody');
    const FAV_KEY = 'pabuddy-space-favs';
    let currentFile = null;
    let allFiles = [];
    let allSessions = [];
    let searchQuery = '';
    let typeFilter = 'all';
    let sourceFilter = 'all';
    let favOnly = false;
    let sortNewest = true;
    let collapsedGroups = new Set();
    function loadFavs() {
        try { return new Set(JSON.parse(localStorage.getItem(FAV_KEY) || '[]')); }
        catch { return new Set(); }
    }
    function saveFavs(set) { localStorage.setItem(FAV_KEY, JSON.stringify([...set])); }
    let favs = loadFavs();

    function emptyState(icon, title, hint) {
        const wrap = document.createElement('div');
        wrap.className = 'file-empty';
        wrap.innerHTML = `<div class="empty-icon"><i class="fas ${icon}"></i></div><p></p><span></span>`;
        wrap.querySelector('p').textContent = title;
        wrap.querySelector('span').textContent = hint;
        return wrap;
    }

    function typeInfo(name) {
        const ext = extOf(name);
        if (['html', 'htm'].includes(ext)) return { key: 'web', label: '网页' };
        if (['md', 'txt', 'doc', 'docx', 'pdf', 'rtf'].includes(ext)) return { key: 'doc', label: '文档' };
        if (['xlsx', 'xls', 'xlsm', 'csv'].includes(ext)) return { key: 'sheet', label: '表格' };
        if (['png', 'jpg', 'jpeg', 'gif', 'svg', 'webp'].includes(ext)) return { key: 'image', label: '图片' };
        if (['ppt', 'pptx', 'pptm'].includes(ext)) return { key: 'ppt', label: '演示' };
        if (['py', 'js', 'ts', 'json', 'css', 'sh', 'yaml', 'yml', 'xml'].includes(ext)) return { key: 'code', label: '代码' };
        if (['zip', 'tar', 'gz'].includes(ext)) return { key: 'archive', label: '压缩包' };
        return { key: 'file', label: '文件' };
    }
    function updatedBy(file) {
        return file.source === 'upload' ? 'felicex@gmail.com' : '助手';
    }
    function sessionFor(id) {
        return allSessions.find((s) => s.id === id) || { id };
    }

    function matchesFile(file, session) {
        if (favOnly && !favs.has(fileKey(file))) return false;
        if (sourceFilter === 'upload' && file.source !== 'upload') return false;
        if (sourceFilter === 'generated' && file.source === 'upload') return false;
        if (typeFilter !== 'all' && typeInfo(file.name).key !== typeFilter) return false;
        const q = searchQuery.trim().toLowerCase();
        if (!q) return true;
        const title = sessionLabel(session).toLowerCase();
        return `${file.name} ${file.path} ${title} ${file.sessionId}`.toLowerCase().includes(q);
    }

    function renderFileRow(file) {
        const row = document.createElement('div');
        row.className = 'file-cols file-item-row' + (currentFile && fileKey(currentFile) === fileKey(file) ? ' selected' : '');
        row.dataset.key = fileKey(file);
        const info = typeInfo(file.name);
        const starOn = favs.has(fileKey(file));
        row.innerHTML = `
            <div class="tree-name indent-file col-name">
                <button type="button" class="file-star ${starOn ? 'on' : ''}" title="收藏"><i class="fas fa-star"></i></button>
                <span class="row-check" aria-hidden="true"><i class="fas fa-check"></i></span>
                <span class="file-ico kind-${fileKind(file.name)}"><i class="fas ${fileIcon(file.name)}"></i></span>
                <span class="label"></span>
                <span class="file-actions">
                    <button type="button" title="预览" data-act="preview"><i class="fas fa-eye"></i></button>
                    <button type="button" title="下载" data-act="download"><i class="fas fa-download"></i></button>
                    <button type="button" class="danger" title="删除" data-act="delete"><i class="fas fa-trash-alt"></i></button>
                </span>
            </div>
            <div class="col-meta col-type"></div>
            <div class="col-meta col-by"></div>
            <div class="col-meta col-when"></div>
            <div class="col-meta col-size"></div>`;
        row.querySelector('.label').textContent = file.name;
        row.querySelector('.col-type').textContent = info.label;
        row.querySelector('.col-by').textContent = updatedBy(file);
        row.querySelector('.col-when').textContent = timeAgo(file.modTime);
        row.querySelector('.col-when').title = file.modTime ? new Date(file.modTime).toLocaleString('zh-CN') : '';
        row.querySelector('.col-size').textContent = formatSize(file.size);
        row.querySelector('.file-star').addEventListener('click', (e) => {
            e.stopPropagation();
            const key = fileKey(file);
            if (favs.has(key)) favs.delete(key); else favs.add(key);
            saveFavs(favs);
            renderLists();
        });
        row.querySelector('[data-act="preview"]').addEventListener('click', (e) => { e.stopPropagation(); openPreview(file); });
        row.querySelector('[data-act="download"]').addEventListener('click', (e) => { e.stopPropagation(); downloadFile(file); });
        row.querySelector('[data-act="delete"]').addEventListener('click', (e) => { e.stopPropagation(); deleteFile(file); });
        row.addEventListener('click', () => openPreview(file));
        return row;
    }

    function renderLists() {
        filesScroll.replaceChildren();
        const bySession = new Map();
        allFiles.forEach((f) => {
            const id = f.sessionId || '';
            if (!bySession.has(id)) bySession.set(id, []);
            bySession.get(id).push(f);
        });
        const tasks = [...bySession.entries()].map(([id, files]) => {
            const session = sessionFor(id);
            const visible = files.filter((f) => matchesFile(f, session));
            const q = searchQuery.trim().toLowerCase();
            const titleHit = q && sessionLabel(session).toLowerCase().includes(q);
            const shown = titleHit && !favOnly && typeFilter === 'all' && sourceFilter === 'all' ? files.slice() : visible;
            shown.sort((a, b) => {
                const da = new Date(a.modTime).getTime() || 0;
                const db = new Date(b.modTime).getTime() || 0;
                return sortNewest ? db - da : da - db;
            });
            const newest = shown.reduce((m, f) => Math.max(m, new Date(f.modTime).getTime() || 0), 0);
            return { session, files: shown, newest };
        }).filter((t) => t.files.length);
        tasks.sort((a, b) => sortNewest ? b.newest - a.newest : a.newest - b.newest);

        if (!tasks.length) {
            const filtered = searchQuery || favOnly || typeFilter !== 'all' || sourceFilter !== 'all';
            const emptyHint = {
                all: '在对话里上传或生成文件后，会按任务汇总到这里',
                upload: '在对话里上传的文件会出现在这里',
                generated: '让助手产出网页、文档或表格后，会汇总到这里',
            };
            filesScroll.appendChild(emptyState(
                sourceFilter === 'upload' ? 'fa-cloud-upload-alt' : (favOnly ? 'fa-star' : 'fa-folder-open'),
                filtered ? '没有符合条件的文件' : (sourceFilter === 'upload' ? '还没有上传文件' : (sourceFilter === 'generated' ? '还没有生成文件' : '还没有任务输出')),
                emptyHint[sourceFilter] || emptyHint.all
            ));
            return;
        }

        const table = document.createElement('div');
        table.className = 'file-table';
        const head = document.createElement('div');
        head.className = 'file-cols file-thead';
        head.innerHTML = `
            <div>名称</div>
            <div>类型</div>
            <div class="col-by">更新者</div>
            <button type="button" class="sort ${sortNewest ? 'active' : ''}" id="sortUpdated">更新 <span class="carets"><i class="fas fa-caret-up"></i><i class="fas fa-caret-down"></i></span></button>
            <div class="col-size">大小</div>`;
        table.appendChild(head);

        const group = document.createElement('div');
        group.className = 'file-group' + (collapsedGroups.has('ungrouped') ? ' collapsed' : '');
        const groupRow = document.createElement('div');
        groupRow.className = 'file-cols file-group-row';
        groupRow.innerHTML = `
            <div class="tree-name">
                <i class="fas fa-chevron-down chevron"></i>
                <span class="label">未分组</span>
                <span class="count-pill"></span>
            </div>
            <div></div><div></div><div></div><div></div>`;
        groupRow.querySelector('.count-pill').textContent = `${tasks.length} 个任务`;
        groupRow.addEventListener('click', () => {
            if (collapsedGroups.has('ungrouped')) collapsedGroups.delete('ungrouped');
            else collapsedGroups.add('ungrouped');
            renderLists();
        });
        const body = document.createElement('div');
        body.className = 'file-group-body';
        tasks.forEach((task) => {
            const taskRow = document.createElement('div');
            taskRow.className = 'file-cols file-task-row';
            taskRow.innerHTML = `
                <div class="tree-name indent-task">
                    <span class="task-ico" title="对话">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path fill="currentColor" opacity=".4" d="M14.2 3.2h5.1c1.4 0 2.5 1.1 2.5 2.5v5.2c0 1.4-1.1 2.5-2.5 2.5h-1.2l-1 1.7c-.22.38-.82.24-.9-.22l-.35-1.48H14.2c-1.4 0-2.5-1.1-2.5-2.5V5.7c0-1.4 1.1-2.5 2.5-2.5z"/>
                            <path fill="currentColor" d="M2.6 6.6c0-1.6 1.3-2.9 2.9-2.9h7.4c1.6 0 2.9 1.3 2.9 2.9v5.1c0 1.6-1.3 2.9-2.9 2.9H8.2l-2.3 2.5c-.4.42-1.12.13-1.12-.48v-2.02H5.5c-1.6 0-2.9-1.3-2.9-2.9V6.6z"/>
                        </svg>
                    </span>
                    <span class="label"></span>
                </div>
                <div></div><div></div><div></div><div></div>`;
            taskRow.querySelector('.label').textContent = sessionLabel(task.session);
            taskRow.title = '打开对话';
            taskRow.style.cursor = 'pointer';
            taskRow.addEventListener('click', () => {
                window.location.href = `dialog.html?session=${encodeURIComponent(task.session.id)}`;
            });
            body.appendChild(taskRow);
            task.files.forEach((f) => body.appendChild(renderFileRow(f)));
        });
        group.appendChild(groupRow);
        group.appendChild(body);
        table.appendChild(group);
        filesScroll.appendChild(table);
        const sortBtn = document.getElementById('sortUpdated');
        if (sortBtn) {
            sortBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                sortNewest = !sortNewest;
                renderLists();
            });
        }
        markSelected();
    }

    function markSelected() {
        const key = currentFile ? fileKey(currentFile) : '';
        document.querySelectorAll('.file-item-row').forEach((el) => {
            el.classList.toggle('selected', el.dataset.key === key);
        });
    }

    async function refreshFiles() {
        allFiles = await api('/files');
        const uploads = allFiles.filter(f => f.source === 'upload');
        const generated = allFiles.filter(f => f.source !== 'upload');
        const totalBytes = allFiles.reduce((sum, f) => sum + (f.size || 0), 0);
        document.getElementById('statUpload').textContent = String(uploads.length);
        document.getElementById('statGen').textContent = String(generated.length);
        document.getElementById('statSize').textContent = formatSize(totalBytes);
        spaceUsage.files = allFiles.length;
        paintSpaceSummary();
        renderLists();
        if (currentFile && !allFiles.some(f => fileKey(f) === fileKey(currentFile))) {
            closePreview();
        }
    }

    function downloadFile(file) {
        const a = document.createElement('a');
        a.href = fileUrl(file, true);
        a.download = file.name;
        document.body.appendChild(a);
        a.click();
        a.remove();
        showToast(`正在下载 ${file.name}`, 'fa-download');
    }

    async function deleteFile(file) {
        if (!confirm(`删除文件「${file.name}」？此操作不可恢复。`)) return;
        try {
            await api(`/sessions/${encodeURIComponent(file.sessionId)}/files/${file.path.split('/').map(encodeURIComponent).join('/')}`, { method: 'DELETE' });
            showToast(`已删除 ${file.name}`, 'fa-trash-alt');
            if (currentFile && fileKey(currentFile) === fileKey(file)) closePreview();
            await refreshFiles();
        } catch (err) {
            showToast('删除失败: ' + err.message, 'fa-exclamation-circle');
        }
    }

    function closePreview() {
        currentFile = null;
        previewModal.classList.remove('show');
        previewBody.replaceChildren();
        markSelected();
    }

    async function openPreview(file) {
        currentFile = file;
        previewModal.classList.add('show');
        markSelected();
        document.getElementById('previewFileName').textContent = file.name;
        document.getElementById('previewIcon').className = `fas ${fileIcon(file.name)}`;
        document.getElementById('previewMeta').innerHTML =
            `<span>${formatSize(file.size)}</span><span>${new Date(file.modTime).toLocaleString()}</span><span>${file.path}</span>`;
        const ext = extOf(file.name);
        const url = fileUrl(file, false);
        previewBody.classList.remove('is-frame');
        previewBody.replaceChildren();
        if (HTML_PREVIEW_EXT.has(ext)) {
            previewBody.classList.add('is-frame');
            const iframe = document.createElement('iframe');
            iframe.title = file.name;
            iframe.setAttribute('sandbox', 'allow-scripts allow-forms allow-modals allow-popups');
            iframe.src = url;
            previewBody.appendChild(iframe);
        } else if (IMAGE_PREVIEW_EXT.has(ext)) {
            previewBody.classList.add('is-frame');
            const img = document.createElement('img');
            img.src = url;
            img.alt = file.name;
            previewBody.appendChild(img);
        } else if (ext === 'pdf' || ext === 'ppt' || ext === 'pptx' || ext === 'pptm' || ext === 'xls' || ext === 'xlsx' || ext === 'xlsm') {
            previewBody.classList.add('is-frame');
            const iframe = document.createElement('iframe');
            iframe.title = file.name;
            iframe.src = url;
            previewBody.appendChild(iframe);
        } else if (TEXT_PREVIEW_EXT.has(ext) && file.size <= MAX_TEXT_PREVIEW_BYTES) {
            previewBody.textContent = '加载中...';
            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error(res.statusText);
                const text = await res.text();
                if (currentFile && fileKey(currentFile) !== fileKey(file)) return;
                if (ext === 'csv') {
                    const lines = text.split('\n').filter(l => l.length > 0);
                    if (!lines.length) { previewBody.textContent = '(空文件)'; return; }
                    const table = document.createElement('table');
                    table.className = 'csv-table';
                    const thead = document.createElement('thead');
                    const hr = document.createElement('tr');
                    lines[0].split(',').forEach(h => { const th = document.createElement('th'); th.textContent = h.trim(); hr.appendChild(th); });
                    thead.appendChild(hr);
                    table.appendChild(thead);
                    const tbody = document.createElement('tbody');
                    lines.slice(1).forEach(row => {
                        const tr = document.createElement('tr');
                        row.split(',').forEach(c => { const td = document.createElement('td'); td.textContent = c.trim(); tr.appendChild(td); });
                        tbody.appendChild(tr);
                    });
                    table.appendChild(tbody);
                    previewBody.replaceChildren(table);
                } else {
                    previewBody.textContent = text;
                }
            } catch (err) {
                previewBody.textContent = '预览失败: ' + err.message;
            }
        } else {
            previewBody.textContent = '该类型无法在线预览，请下载后查看。';
        }
    }

    document.getElementById('previewDownloadBtn').addEventListener('click', () => { if (currentFile) downloadFile(currentFile); });
    document.getElementById('previewDeleteBtn').addEventListener('click', () => { if (currentFile) deleteFile(currentFile); });
    document.getElementById('previewClose').addEventListener('click', closePreview);
    previewModal.addEventListener('click', (e) => {
        if (e.target === previewModal) closePreview();
    });
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && previewModal.classList.contains('show')) closePreview();
    });

    document.querySelectorAll('.space-tab').forEach((tab) => {
        tab.addEventListener('click', function() {
            sourceFilter = this.dataset.source || 'all';
            document.querySelectorAll('.space-tab').forEach((t) => t.classList.toggle('active', t === this));
            renderLists();
        });
    });
    document.getElementById('fileSearch').addEventListener('input', function() {
        searchQuery = this.value;
        renderLists();
    });
    document.getElementById('typeFilter').addEventListener('change', function() {
        typeFilter = this.value;
        renderLists();
    });
    document.getElementById('favOnly').addEventListener('change', function() {
        favOnly = this.checked;
        renderLists();
    });

    document.querySelectorAll('.quick-item').forEach(el => {
        el.addEventListener('click', function() {
            const nav = this.dataset.nav;
            if (nav === 'task') window.location.href = '/';
            if (nav === 'schedule') { showToast('🕒 定时任务正在开发中', 'fa-clock'); return; }
            if (nav === 'history') document.getElementById('historyList').scrollIntoView({ block: 'nearest' });
        });
    });
    document.getElementById('brandLogo').addEventListener('click', () => { window.location.href = '/'; });
    document.getElementById('searchBtn').addEventListener('click', () => {
        const input = document.getElementById('fileSearch');
        input.focus();
        input.select();
    });
    document.getElementById('notifBtn').addEventListener('click', () => showToast('暂无新通知', 'fa-bell'));

    (function bindUserChrome() {
        const card = document.getElementById('userCard');
        const settingsBtn = document.getElementById('settingsBtn');
        const menu = document.getElementById('userMenu');
        card.addEventListener('click', function(e) {
            if (e.target.closest('#settingsBtn, #userMenu')) return;
            window.location.href = '/space.html';
        });
        settingsBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            window.location.href = '/settings.html';
        });
        menu.addEventListener('click', function(e) {
            e.stopPropagation();
            const action = e.target.closest('[data-action]') && e.target.closest('[data-action]').dataset.action;
            if (action === 'space') window.location.href = '/space.html';
            if (action === 'notify') {
                menu.classList.remove('show');
                showToast('暂无新通知', 'fa-bell');
            }
            if (action === 'settings') {
                menu.classList.remove('show');
                window.location.href = '/settings.html';
            }
            if (action === 'logs') {
                menu.classList.remove('show');
                window.location.href = '/settings.html#logs';
            }
        });
        document.addEventListener('click', function() { menu.classList.remove('show'); });
    })();

    function paintUsage(sessions) {
        const questions = (sessions || []).reduce((sum, s) => sum + (Number(s.questionCount) || 0), 0);
        const tokens = (sessions || []).reduce((sum, s) => sum + (Number(s.totalTokens) || 0), 0);
        document.getElementById('statQuestions').textContent = String(questions);
        document.getElementById('statTokens').textContent = formatTokens(tokens);
        spaceUsage.questions = questions;
        spaceUsage.tokens = tokens;
        paintSpaceSummary();
    }

    async function refreshHistory() {
        const list = document.getElementById('historyList');
        const sessions = await api('/sessions');
        allSessions = sessions || [];
        paintUsage(allSessions);
        list.replaceChildren();
        if (!allSessions.length) {
            const empty = document.createElement('div');
            empty.className = 'history-empty';
            empty.textContent = '暂无对话';
            list.appendChild(empty);
            renderLists();
            return;
        }
        allSessions.slice().sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)).forEach(s => {
            const item = document.createElement('div');
            item.className = 'history-item';
            const label = sessionLabel(s);
            const age = formatSessionAge(s.createdAt);
            item.title = age ? `${label} · ${new Date(s.createdAt).toLocaleString('zh-CN')}` : label;
            item.innerHTML = `<i class="fas fa-comment-dots"></i><span class="label"></span><span class="time"></span>`;
            item.querySelector('.label').textContent = label;
            item.querySelector('.time').textContent = age;
            item.addEventListener('click', () => { window.location.href = `dialog.html?session=${encodeURIComponent(s.id)}`; });
            list.appendChild(item);
        });
        renderLists();
    }

    refreshFiles().catch(err => showToast('加载文件失败: ' + err.message, 'fa-exclamation-circle'));
    refreshHistory().catch(() => {});
})();
</script>
</body>
</html>
