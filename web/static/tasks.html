<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="stock-api-base" content="http://127.0.0.1:8090">
<title>定时任务</title>
<style>
body{margin:0;background:#EEF0F3}
a{color:inherit}
button,input{font:inherit}
.seg{display:flex;border:1px solid #DDE1E7;border-radius:8px;overflow:hidden}
.seg button{height:28px;padding:0 10px;border:none;border-right:1px solid #DDE1E7;background:#FFFFFF;color:#3A4250;font-family:inherit;font-size:12px;cursor:pointer}
.seg button:last-child{border-right:none}
.seg button[aria-pressed="true"]{background:#14171F;color:#FFFFFF}
.pill{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;background:#EEF0F3;color:#4A5260;font-size:11px;white-space:nowrap}
.nav-a{width:48px;min-height:48px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#5B6372;text-decoration:none;font-size:13px}
.nav-a:hover{color:#14171F;background:#D8D8D8}
.nav-a.on{color:#2457D6;background:#EAF0FD;font-weight:500}
.empty{padding:36px 20px;text-align:center;color:#5B6372;display:flex;flex-direction:column;align-items:center;gap:12px}
.skeleton{color:#8A919E;padding:24px 0}
.toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);z-index:60;padding:9px 16px;border-radius:8px;background:#14171F;color:#FFFFFF;font-size:13px;max-width:80vw}
.toast.err{background:#B42318}
.modal{position:fixed;inset:0;z-index:30;background:rgba(20,23,31,.32);display:flex;align-items:center;justify-content:center}
.modal>div{width:560px;max-width:calc(100% - 32px);max-height:80vh;overflow:auto;background:#FFFFFF;border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;font-size:13px;line-height:1.7}
.xbtn{border:none;background:transparent;color:#8A919E;cursor:pointer;font-size:12px;padding:0 4px}
.xbtn:hover{color:#B42318}
.qmark{flex:none;width:16px;height:16px;padding:0;border:1px solid #C9CED6;border-radius:50%;background:#FFFFFF;color:#5B6372;font-size:11px;font-weight:700;line-height:14px;cursor:pointer}
.qmark:hover{border-color:#2457D6;color:#2457D6}
a.row:hover,div.row:hover{background:#F7F8FA}
</style>
</head>
<body>
<div style="height: 100vh; overflow: hidden; display: flex; flex-direction: column; background: #EEF0F3; font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; color: #14171F; font-size: 13px; line-height: 1.55">

<header style="flex: none; display: flex; align-items: center; height: 44px; background: #FFFFFF; border-bottom: 1px solid #DDE1E7">
<div style="flex:0 0 64px;border-right:1px solid #DDE1E7;height:44px;background:#FFFFFF" aria-hidden="true"></div>
<span style="padding: 0 16px; font-weight: 700; font-size: 14px">定时任务</span>
<div style="margin-left: auto; display: flex; align-items: center; gap: 14px; padding-right: 16px"><span id="session" style="display: flex; align-items: center; gap: 6px; font-size: 14px; color: #5B6372"></span><button type="button" id="bell" data-act="notif" aria-label="通知" title="通知" style="position: relative; width: 32px; height: 32px; border: none; border-radius: 8px; background: transparent; color: #3A4250; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg><span id="bellDot" hidden style="position: absolute; top: 2px; right: 1px; min-width: 16px; height: 16px; padding: 0 4px; box-sizing: border-box; border-radius: 999px; background: #D9483F; color: #FFFFFF; font-size: 10px; font-weight: 600; line-height: 16px; text-align: center"></span></button></div>
</header>

<div style="flex: 1 1 auto; display: flex; flex-wrap: nowrap; align-items: stretch; min-width: 0; min-height: 0; overflow: hidden">

<nav aria-label="主导航" style="flex: 0 0 64px; overflow: hidden; background: #E6E6E6; border-right: 1px solid #DDE1E7; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 0">
<a class="nav-a" href="/"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-4.5-4.5"></path></svg>研判</a>
<a class="nav-a" href="/market.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20h18"></path><path d="M5 16l4-5 4 3 6-7"></path></svg>市场</a>
<a class="nav-a" href="/holdings.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16v12H4z"></path><path d="M8 7V5h8v2"></path></svg>交易</a>
<a class="nav-a" href="/scan.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"></rect><path d="M8 10h8M8 14h5"></path></svg>战绩</a>
<a class="nav-a on" href="/tasks.html" aria-current="page"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M12 8v4l3 2"></path></svg>任务</a>
<a class="nav-a" href="/dialog.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg>问问</a>
<a class="nav-a" href="/settings.html" style="margin-top: auto"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>设置</a>
</nav>

<main style="flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column; overflow: hidden">
<div style="flex: none; padding: 12px 28px 0; background: #FFFFFF; border-bottom: 1px solid #DDE1E7"><div style="max-width: 1240px"><div id="head" style="display: flex; align-items: center; gap: 22px; flex-wrap: wrap"></div><div id="tabs" role="tablist" aria-label="定时任务" style="display: flex; align-items: center; gap: 24px; margin-top: 6px"></div></div></div>
<div id="scroll" style="flex: 1; min-height: 0; overflow-y: auto; padding: 16px 28px 24px; box-sizing: border-box"><div id="body" style="max-width: 1240px"><div class="skeleton">正在读取任务…</div></div></div>
</main>

<aside id="detailAside" aria-label="任务详情" hidden style="flex: 0 0 420px; width: 420px; align-self: stretch; overflow-y: auto; background: #FFFFFF; border-left: 1px solid #DDE1E7; box-sizing: border-box; font-size: 13px"></aside>
<aside id="notifAside" aria-label="通知" hidden style="flex: 0 0 400px; width: 400px; align-self: stretch; overflow-y: auto; background: #FFFFFF; border-left: 1px solid #DDE1E7; box-sizing: border-box; flex-direction: column; font-size: 13px"></aside>
</div>

<footer style="flex: none; height: 26px; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 18px; padding: 0 12px; border-top: 1px solid #DDE1E7; background: #FFFFFF; font-size: 13px; color: #5B6372; white-space: nowrap; overflow: hidden"><div style="display: flex; align-items: center; gap: 18px; min-width: 0; overflow: hidden"><span style="display: flex; align-items: center; gap: 6px"><span id="dot" style="width: 7px; height: 7px; border-radius: 50%; background: #A1A7B2"></span><span id="status">正在连接</span></span><span id="footIndexes" style="display: flex; gap: 18px"></span></div><span role="note" style="text-align: center">研究分析，不构成投资建议</span><div style="display: flex; align-items: center; justify-content: flex-end; gap: 18px; min-width: 0; overflow: hidden"><span>数据源：行情 · 资金流 · 公告</span><span>v0.1</span></div></footer>
</div>
<div id="modal"></div>
<script>
const MONO_F = "font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace";
const DEMO = new URLSearchParams(location.search).get('demo') === '1';
const API = (new URLSearchParams(location.search).get('stockApi') || (document.querySelector('meta[name="stock-api-base"]') || {}).content || 'http://127.0.0.1:8090').replace(/\/$/, '');
const SYS_TABS = [['mine', '我的'], ['scan', '研判战绩'], ['market', '行情'], ['notify', '通知'], ['watch', '盯盘']];
const S = { tab: 'mine', up: null, data: {}, sys: {}, notif: false, nData: null, nTab: 'alert', cuCount: null,
  detail: null, detailRuns: null, detailJobs: {}, openRun: null, se: null };

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (id) => document.getElementById(id);
const sign = (v) => v > 0 ? '+' : v < 0 ? '−' : '';
const pct = (v, d) => v == null || v !== v ? '—' : sign(v) + Math.abs(v * 100).toFixed(d == null ? 1 : d) + '%';
const rate = (v) => v == null || v < 0 ? '—' : (v * 100).toFixed(1) + '%';
const day5 = (d) => (d || '').slice(5);
const diagnoseHref = (code) => '/?stock=' + encodeURIComponent(code);
const num = (n) => Number(n || 0).toLocaleString('en-US');

/* ---------- 设计稿里的样式积木 ---------- */
const CARD = 'display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 14px; overflow: hidden';
const LINKBTN = 'display: inline-flex; align-items: center; height: 28px; padding: 0 10px; border: 1px solid #DDE1E7; border-radius: 8px; background: #FFFFFF; font: inherit; font-size: 12px; color: #2457D6; text-decoration: none; white-space: nowrap; cursor: pointer; box-sizing: border-box';
const pl = (bg, fg, text) => '<span style="display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 6px; background: ' + bg + '; color: ' + fg + '; font-size: 12px; font-weight: 600; white-space: nowrap">' + esc(text) + '</span>';
const dirPill = (r) => r.direction === 'bullish' ? pl('#FDF0EF', '#B42318', r.verdict || '偏多') : r.direction === 'bearish' ? pl('#EDF7F1', '#1E6B44', r.verdict || '偏空') : pl('#F1F2F4', '#5B6372', r.verdict || '不明');
const srcPill = (r, short) => r.source === 'diagnose' ? pl('#EAF0FD', '#2457D6', '你诊断') : pl('#F1F2F4', '#5B6372', short ? '扫描' : '定时扫描');
const OUT = { hit: ['#EDF7F1', '#1E6B44', '✓ 对'], miss: ['#FDF0EF', '#B42318', '✗ 错'], flat: ['#F1F2F4', '#5B6372', '＝ 持平'] };
const NOW = { hit: ['#EDF7F1', '#1E6B44', '目前算对'], miss: ['#FDF0EF', '#B42318', '目前算错'], flat: ['#F1F2F4', '#5B6372', '目前持平'] };
const box = (label, value, sub, o) => { o = o || {}; return '<div style="display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-radius: 10px; background: ' + (o.bg || '#F7F8FA') + '"><span style="font-size: 11px; color: #5B6372">' + label + '</span><b style="' + MONO_F + '; font-size: ' + (o.size || 18) + 'px; color: ' + (o.color || '#14171F') + '">' + value + '</b><span style="font-size: 11px; color: #8A919E">' + sub + '</span></div>'; };
const bigBox = (label, value, sub, color) => '<div style="display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E3E6EB"><span style="font-size: 12px; color: #5B6372">' + label + '</span><b style="' + MONO_F + '; font-size: 20px; color: ' + (color || '#14171F') + '">' + value + '</b><span style="font-size: 11px; color: #8A919E">' + sub + '</span></div>';
const segs = (items, cur, act) => '<span class="seg">' + items.map(([k, n]) => '<button type="button" style="white-space: nowrap" data-act="' + act + '" data-k="' + k + '" aria-pressed="' + (String(cur) === String(k)) + '">' + n + '</button>').join('') + '</span>';

// 本股 / 板块 两根条：以这一行里较大的那个为满格（一半），颜色深浅区分
function retBar(v, m, color) {
  const w = m > 0 ? Math.min(Math.abs(v) / m, 1) * 50 : 0, left = v >= 0 ? 50 : 50 - w;
  return '<span style="position: relative; display: block; height: 6px; border-radius: 3px; background: #F1F2F4"><span style="position: absolute; left: 50%; top: -2px; width: 1px; height: 10px; background: #C9CED6"></span><span style="position: absolute; left: ' + left.toFixed(1) + '%; width: ' + w.toFixed(1) + '%; height: 100%; border-radius: 3px; background: ' + color + '"></span></span>';
}
function versus(r, right) {
  if (!r.have && r.have !== undefined) return '<span style="font-size: 11px; color: #8A919E">等发出后的第一根日线</span>';
  const m = Math.max(Math.abs(r.stock_ret), Math.abs(r.sector_ret));
  const good = right == null ? (r.direction === 'bullish' ? r.excess > 0 : r.excess < 0) : right;
  return '<span style="display: flex; flex-direction: column; gap: 4px"><span style="display: grid; grid-template-columns: 30px 80px 52px; gap: 2px 6px; align-items: center; font-size: 11px"><span style="color: #5B6372">本股</span>' + retBar(r.stock_ret, m, '#3A4250') +
    '<b style="' + MONO_F + '; text-align: right">' + pct(r.stock_ret) + '</b><span style="color: #8A919E">板块</span>' + retBar(r.sector_ret, m, '#A1A7B2') + '<span style="' + MONO_F + '; text-align: right; color: #8A919E">' + pct(r.sector_ret) + '</span></span>' +
    '<span style="font-size: 12px; color: ' + (good ? '#14171F' : '#5B6372') + '">' + (r.excess >= 0 ? '跑赢' : '跑输') + ' <b style="' + MONO_F + '">' + Math.abs(r.excess * 100).toFixed(1) + '</b> 个点</span></span>';
}
// 设计稿里没有「你持有」这类小标签；只在 AI 偏空、而你持有或想买的时候提一句，这是要紧的冲突
function mineTags(r) {
  const m = r.mine || {};
  if (r.direction !== 'bearish' || !(m.held || m.wish)) return '';
  return '<span style="font-size: 11px; color: #7A4A00">你' + (m.held ? '持有' : '想买') + '，AI 偏空，和你的打算不一致</span>';
}

/* ---------- 请求（?demo=1 时读示例数据） ---------- */
async function api(path) {
  if (DEMO) return demoApi(path);
  const res = await fetch('/api/scan' + path);
  let json = {};
  try { json = await res.json(); } catch (e) { /* 没有正文 */ }
  if (!res.ok) throw new Error(json.error || '请求失败（' + res.status + '）');
  return json;
}
function toast(text, bad) {
  const el = document.createElement('div');
  el.className = 'toast' + (bad ? ' err' : '');
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), bad ? 4500 : 2200);
}
function setStatus(ok, text) { $('dot').style.background = ok ? '#2E8B57' : '#B42318'; $('status').textContent = text; }

/* ---------- 即将执行的定时任务（设计稿之外，按设计稿的卡片样式放在页面底部） ---------- */
const STATE_TEXT = { succeeded: '成功', partial: '部分成功', failed: '失败', skipped: '已跳过', running: '运行中', waiting: '等待中', planned: '已排队', expired: '已过期' };
const STATE_COLOR = { succeeded: ['#EDF7F1', '#1E6B44'], failed: ['#FDF0EF', '#B42318'], partial: ['#FFF1D6', '#7A4A00'] };
const busy = (t) => t.last && (t.last.state === 'running' || t.last.state === 'waiting' || t.last.state === 'planned');
function taskRow(t, scan) {
  const last = t.last ? '<span style="display: flex; flex-direction: column; gap: 3px; align-items: flex-start"><span>' + pl((STATE_COLOR[t.last.state] || ['#F1F2F4', '#5B6372'])[0], (STATE_COLOR[t.last.state] || ['#F1F2F4', '#5B6372'])[1], STATE_TEXT[t.last.state] || t.last.state) + '</span><span style="font-size: 11px; color: #8A919E">上次 ' + esc(t.last.at) + '</span></span>' : '<span style="font-size: 11px; color: #8A919E">还没跑过</span>';
  return '<div style="display: grid; grid-template-columns: 220px minmax(0, 1fr) 140px 100px; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid #F1F2F4"><span style="display: flex; flex-direction: column"><b style="' + MONO_F + '; font-size: 13px">' + (t.when_text ? esc(t.when_text) : '—') + '</b><span style="font-size: 11px; color: #8A919E">' + esc(t.trigger_text) + (t.paused ? ' · 已暂停' : '') + '</span></span>' +
    '<span style="display: flex; flex-direction: column"><b style="font-size: 13px">' + esc(t.title) + '</b>' + (t.note ? '<span style="font-size: 11px; color: #5B6372; line-height: 1.5">' + esc(t.note) + '</span>' : '') + '</span>' + last +
    (scan && !DEMO ? '<button type="button" data-act="runnow" data-k="' + esc(t.task_id) + '" ' + (busy(t) ? 'disabled style="opacity: .5; cursor: default; ' : 'style="') + 'height: 28px; padding: 0 10px; border: 1px solid #DDE1E7; border-radius: 8px; background: #FFFFFF; font-size: 12px; color: #2457D6; cursor: pointer; white-space: nowrap">' + (busy(t) ? '正在跑…' : '现在跑一次') + '</button>' : '<span></span>') + '</div>';
}
function sysBtn(act, id, text, color) {
  return '<button type="button" data-act="' + act + '" data-id="' + esc(id) + '" data-stop="1" style="height: 28px; padding: 0 10px; border: 1px solid #DDE1E7; border-radius: 8px; background: #FFFFFF; font: inherit; font-size: 12px; color: ' + (color || '#2457D6') + '; cursor: pointer; white-space: nowrap">' + text + '</button>';
}
function sysRow(t) {
  const last = t.last ? '<span style="display: flex; flex-direction: column; gap: 3px; align-items: flex-start"><span>' + pl((STATE_COLOR[t.last.state] || ['#F1F2F4', '#5B6372'])[0], (STATE_COLOR[t.last.state] || ['#F1F2F4', '#5B6372'])[1], STATE_TEXT[t.last.state] || t.last.state) + '</span><span style="font-size: 11px; color: #8A919E">上次 ' + esc(t.last.at) + '</span></span>' : '<span style="font-size: 11px; color: #8A919E">还没跑过</span>';
  const on = S.detail && S.detail.task_id === t.task_id;
  return '<div role="button" tabindex="0" data-act="sysdetail" data-id="' + esc(t.task_id) + '" style="display: grid; grid-template-columns: 200px minmax(0, 1fr) 130px auto; gap: 12px; align-items: center; padding: 12px 16px; border-top: 1px solid #F1F2F4; cursor: pointer; background: ' + (on ? '#F1F5FE' : t.paused ? '#FAFAFB' : '#FFFFFF') + '">' +
    '<span style="display: flex; flex-direction: column; gap: 3px"><b style="' + MONO_F + '; font-size: 13px">' + esc(t.trigger_text || '—') + '</b><span style="font-size: 11px; color: #8A919E">' + (t.when_text ? esc(t.when_text) : '') + (t.paused ? ' · 已停用' : '') + '</span></span>' +
    '<span style="display: flex; flex-direction: column; gap: 3px; min-width: 0"><b style="font-size: 14px">' + esc(t.title) + '</b>' + (t.note ? '<span style="font-size: 12px; color: #5B6372; line-height: 1.5">' + esc(t.note) + '</span>' : '') + '</span>' + last +
    '<span style="display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end">' +
    (t.deleted ? sysBtn('sysrestore', t.task_id, '恢复') :
      sysBtn('sysrun', t.task_id, busy(t) ? '正在跑…' : '现在跑') + sysBtn('sysedit', t.task_id, '编辑') + sysBtn('sysdel', t.task_id, '删除', '#B42318')) +
    '</span></div>';
}
function watchAlertsCard() {
  const u = S.up, w = (u && u.watch) || { alerts: [] };

    const t = S.data.custom.tasks.find((x) => x.id === el.dataset.id); if (!t) return;
    try { await cuCall('POST', '/' + encodeURIComponent(t.id) + '/toggle', { enabled: !t.enabled }); await cuReload(); toast(t.enabled ? '已停用' : '已启用'); } catch (e) { toast(e.message, true); }
  },
  cudel: async (el) => {
    if (DEMO) return;
    const t = S.data.custom.tasks.find((x) => x.id === el.dataset.id); if (!t) return;
    if (!confirm('删掉任务「' + t.title + '」？它不会再自动跑；已经发出的通知不受影响。')) return;
    try { await cuCall('DELETE', '/' + encodeURIComponent(t.id)); await cuReload(); toast('已删掉'); } catch (e) { toast(e.message, true); }
  },
  curun: async (el) => {
    if (DEMO) { toast('示例数据里不能运行'); return; }
    const t = S.data.custom.tasks.find((x) => x.id === el.dataset.id); if (!t) return;
    if (t.kind !== 'scan' && !confirm('现在给 ' + t.count + ' 只股票各跑一遍「' + t.title + '」？会调用你的模型。')) return;
    try {
      const j = await cuCall('POST', '/' + encodeURIComponent(t.id) + '/run');
      toast('已开始，共 ' + j.queued + ' 只');
      [2500, 8000, 20000, 45000].forEach((ms) => setTimeout(() => { cuReload().catch(() => {}); }, ms));
      setTimeout(() => cuReload().catch(() => {}), 1200);
    } catch (e) { toast(e.message, true); }
  },
});

function tickClock() {
  const d = new Date(), t = d.getHours() * 60 + d.getMinutes(), wk = d.getDay() > 0 && d.getDay() < 6;
  const live = wk && ((t >= 570 && t <= 690) || (t >= 780 && t <= 900));
  $('session').innerHTML = '<span style="width: 7px; height: 7px; border-radius: 50%; background: ' + (live ? '#2E8B57' : '#A1A7B2') + '"></span>' + (live ? '交易中' : wk ? '已休市' : '休市日') + ' · 行情 <span style="' + MONO_F + '">' + [d.getHours(), d.getMinutes(), d.getSeconds()].map((n) => String(n).padStart(2, '0')).join(':') + '</span>';
}
async function loadIndexes() {
  try {

    const rows = (j.indexes || []);
    const pick = want.map((w) => rows.find((r) => String(r.name).indexOf(w) >= 0)).filter(Boolean);
    $('footIndexes').innerHTML = (pick.length ? pick : rows.slice(0, 3)).map((r) => '<span>' + esc(r.name) + ' <span style="' + MONO_F + '; color: ' + (r.pct > 0 ? '#B42318' : r.pct < 0 ? '#1E6B44' : '#5B6372') + '">' + Number(r.close).toFixed(2) + ' ' + (r.pct == null ? '' : sign(r.pct) + Math.abs(r.pct).toFixed(2) + '%') + '</span></span>').join('');
  } catch (e) { /* 指数取不到不影响扫描 */ }
}
