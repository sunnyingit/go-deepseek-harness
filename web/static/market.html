<style>
body{margin:0;background:#EEF0F3}
a{color:inherit}
button{font:inherit}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
.up{color:#B42318}.dn{color:#1E6B44}
.seg{display:flex;border:1px solid #DDE1E7;border-radius:8px;overflow:hidden}
.seg button{height:28px;padding:0 10px;white-space:nowrap;border:none;border-right:1px solid #DDE1E7;background:#FFFFFF;color:#3A4250;font-size:12px;cursor:pointer}
.seg button:last-child{border-right:none}
.seg button[aria-pressed="true"]{background:#14171F;color:#FFFFFF}
.mini{height:30px;padding:0 12px;border:1px solid #C9CED6;border-radius:6px;background:#FFFFFF;color:inherit;font-size:12px;cursor:pointer;white-space:nowrap}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}

.age{display:inline-flex;align-items:center;height:16px;padding:0 5px;border-radius:4px;background:#EEF0F3;color:#4A5260;font-size:10px;font-weight:600;vertical-align:2px;white-space:nowrap}

.age.old{background:#FFF1D6;color:#7A4A00}
.t-good{background:#FDF0EF;color:#B42318}
.t-bad{background:#EDF7F1;color:#1E6B44}
.t-warn{background:#FFF1D6;color:#7A4A00}
.t-flat{background:#F1F2F4;color:#3A4250}
.t-blue{background:#EAF0FD;color:#1F3F8A}
.chip{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:6px;font-size:12px;white-space:nowrap}
.chip.good{background:#FDF0EF;color:#B42318}.chip.blue{background:#EAF0FD;color:#1F3F8A}.chip.warn{background:#FFF1D6;color:#7A4A00}.chip.bad{background:#EDF7F1;color:#1E6B44}.chip.flat{background:#F1F2F4;color:#3A4250}
.chip b{font-weight:600}.chip i{font-style:normal;font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:11px;opacity:.85}
.fchip{height:24px;padding:0 9px;border:1px solid #DDE1E7;border-radius:999px;background:#FFFFFF;color:#3A4250;font-size:12px;cursor:pointer}
.fchip[aria-pressed="true"]{background:#14171F;border-color:#14171F;color:#FFFFFF}
.srow{box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) 60px 60px 54px;gap:8px;align-items:center;padding:9px 4px;border-top:1px solid #F1F2F4;cursor:pointer;text-align:left;width:100%;border-left:none;border-right:none;border-bottom:none;background:transparent;font:inherit;color:inherit}
.srow:hover{background:#F7F8FA}
.srow[aria-expanded="true"]{background:#F7F8FA}
.srow .sn{min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.srow .sn b{font-size:13px;font-weight:650;line-height:1.2}
.srow .sm,.srow .sp,.srow .sh{min-width:0;display:flex;flex-direction:column;align-items:flex-end;gap:2px;line-height:1.2}
.srow .sm .mz,.srow .sp .mz{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:13px;font-weight:700}
.srow .sm .sub,.srow .sp .sub,.srow .sh .sub{font-size:10px;color:#8A919E;white-space:nowrap}
.srow .sh .hv{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:12px;font-weight:600;color:#3A4250}
.shead{box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) 60px 60px 54px;gap:8px;align-items:end;padding:6px 4px;color:#8A919E;font-size:10px;position:sticky;top:0;z-index:1;background:#FFFFFF;border-bottom:1px solid #EEF0F3}
.shead span{text-align:right}.shead span:first-child{text-align:left}
.sdetail{padding:8px 10px 10px;background:#F7F8FA;border-radius:8px;margin:0 0 6px;font-size:12px;line-height:1.65;color:#3A4250}
.sdetail .swhy{color:#5B6372;margin-top:2px}
.smeta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.smeta .cell{display:flex;flex-direction:column;gap:2px;min-width:0;padding:6px 8px;border-radius:6px;background:#FFFFFF;border:1px solid #EEF0F3}
.smeta .cell span{font-size:10px;color:#8A919E}
.smeta .cell b{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:12px;font-weight:650;color:#3A4250;display:flex;flex-wrap:wrap;gap:1px 5px}
.smeta .cell b span{white-space:nowrap}
.smeta .cell b em{font-style:normal;color:#C9CED6;font-weight:400}
.smeta .cell svg{margin-top:2px;margin-left:0}
.sfoot{margin-top:6px;font-size:11px;color:#5B6372;display:flex;flex-direction:column;gap:2px}
.sgroup{padding-top:14px}
.sgroup .sgh{display:flex;align-items:center;gap:8px;padding:0 4px 6px}
.ssum{display:flex;flex-direction:column;gap:8px;padding:2px 2px 4px}
.ssum .r{display:grid;grid-template-columns:88px minmax(0,1fr);gap:8px;align-items:baseline;font-size:13px;line-height:1.55}
.ssum .r i{font-style:normal;font-size:12px;font-weight:650;display:flex;align-items:center;gap:6px;white-space:nowrap}
.ssum .r i::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.ssum .r span{color:#14171F}
.dtab{flex:none;height:44px;padding:0 8px;border:none;background:transparent;color:#5B6372;font-size:13px;cursor:pointer;white-space:nowrap}
.dtab:hover{color:#14171F}
.dtab[aria-selected="true"]{color:#2457D6;font-weight:600;box-shadow:inset 0 -2px 0 #2457D6}
.nav-a{width:48px;min-height:48px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#5B6372;text-decoration:none;font-size:11px}
.nav-a.on{color:#2457D6;background:#EAF0FD;font-weight:500}
.card{display:flex;flex-direction:column;gap:10px;box-sizing:border-box;padding:16px 18px;background:#FFFFFF;border:1px solid #E3E6EB;border-radius:14px}
.pair{display:flex;align-items:flex-start;gap:14px}
.pair>section{flex:1 1 0;min-width:0}
.card-body{flex:1 1 auto;min-height:0;overflow-y:auto}
.card>.scope{margin-top:0;flex:none}
.card-foot{flex:none;padding-top:8px;font-size:11px;color:#A1A7B2}
.mzbox{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid #F1F2F4}
.mzbox:first-child{padding-top:0;border-top:none}
.mzhead{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mzhead span{font-size:13px;color:#5B6372}
.mzhead .dash{color:#A1A7B2}
.mzhead .amt{font-size:13px;font-weight:600;color:#3A4250;white-space:nowrap}
.mzhead b{font-size:14px;font-weight:700;white-space:nowrap}
.mzgrid{display:grid;gap:6px}
.mzcell{display:flex;flex-direction:column;gap:2px;min-width:0;padding:8px 6px;border-radius:8px;background:#F7F8FA}
.mzcell span{font-size:11px;color:#8A919E}
.mzcell b{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:14px;font-weight:650;line-height:1.2}
.mzcell b i{margin-left:3px;font-style:normal;font-size:10px;font-weight:600;color:#8A919E}
.mzcell.good b{color:#B42318}
.mzcell.bad b{color:#1E6B44}
.mzcell.flat b{color:#14171F}
.mzcell.warn b{color:#7A4A00}
.mzcap{display:flex;align-items:center;gap:6px;margin-top:2px;font-size:11px;color:#8A919E}
.mzfoot{display:flex;align-items:center;gap:8px;min-height:22px;font-size:13px;color:#3A4250}
.mzfoot span{min-width:0}
.mzfoot b{margin-left:auto;font-size:15px;font-weight:700;white-space:nowrap}
.mznote{font-size:12px;line-height:1.55;color:#7A4A00;padding:6px 8px;border-radius:8px;background:#FFF8EC}
.chg-more summary{cursor:pointer;color:#2457D6;font-size:12px;list-style:none}
.chg-more summary::-webkit-details-marker{display:none}
.chg-more .when-open{display:none}
.chg-more[open] .when-closed{display:none}
.chg-more[open] .when-open{display:inline}
.chg-more[open] summary{margin-bottom:4px}
.lv{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:11px;font-weight:600;color:#8A919E}
.link{border:none;background:transparent;padding:0;font-size:12px;color:#2457D6;cursor:pointer;white-space:nowrap}
.qmark{flex:none;width:16px;height:16px;padding:0;border:1px solid #C9CED6;border-radius:50%;background:#FFFFFF;color:#5B6372;font-size:11px;font-weight:700;line-height:14px;cursor:pointer}
.qmark:hover,.qmark[aria-expanded="true"]{border-color:#2457D6;color:#2457D6;background:#EAF0FD}
.qa{display:grid;grid-template-columns:10px minmax(0,1fr);gap:10px;padding:9px 0;border-top:1px solid #F1F2F4}
.qa .dot{width:10px;height:10px;margin-top:5px;border-radius:50%}
.qab{display:flex;flex-direction:column;gap:8px;padding:14px 0 4px;border-top:1px solid #EEF0F3}
.qab:first-child{border-top:none;padding-top:2px}
.qab-h{display:flex;align-items:baseline;gap:8px}
.qab-h span{font-size:12px;color:#8A919E}
.qab-h b{margin-left:auto;font-size:16px;font-weight:700;letter-spacing:-0.01em}
.qab-note{margin:0;font-size:11px;line-height:1.55;color:#8A919E}
.strip{display:grid}
.strip .meter{padding:0 10px;background:transparent;border-radius:0;border-left:1px solid #EEF0F3}
.strip .meter:first-child{padding-left:0;border-left:none}
.meter{display:flex;flex-direction:column;gap:1px;min-width:0}
.meter span{font-size:11px;color:#8A919E;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter b{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:15px;font-weight:650;line-height:1.25;white-space:nowrap}
.meter i{font-style:normal;font-size:11px;white-space:nowrap}
.meter.good b,.meter.good i{color:#B42318}
.meter.bad b,.meter.bad i{color:#1E6B44}
.meter.flat b{color:#14171F}
.meter.flat i{color:#8A919E}
.kv{display:grid;grid-template-columns:1fr 1fr;column-gap:22px}
.kv .meter{flex-direction:row;align-items:baseline;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid #F4F5F7}
.kv .meter:last-child:nth-child(odd){grid-column:1 / -1}
.kv .meter b{font-size:13px;font-weight:600}
.qx{display:grid;grid-template-columns:1fr 1fr}
.qc{min-width:0;padding:12px 0 2px}
.qc:nth-child(odd){padding-right:16px;border-right:1px solid #EEF0F3}
.qc:nth-child(even){padding-left:16px}
.qc:nth-child(-n+2){border-bottom:1px solid #EEF0F3;padding-bottom:12px}
.qh{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.qh b{font-size:13px;font-weight:700;letter-spacing:0.01em}
.qh span{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:12px;font-weight:600}
.qr{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:3px 0;font-size:13px;color:#14171F}
.qr b{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:12px;font-weight:600}
.qx.pulse{border-top:1px solid #EEF0F3;margin-top:4px}
.qx.pulse .qc{border-bottom:none;padding-top:12px}
.note{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-radius:10px;background:#F7F8FA}
.scope{margin-top:auto;display:flex;align-items:center;gap:8px;padding-top:8px;border-top:1px solid #F1F2F4;font-size:11px;color:#8A919E}
.sig{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border:1px solid #E3E6EB;border-radius:10px;background:#FFFFFF;text-align:left;cursor:pointer;min-width:0}
.stat{display:flex;flex-direction:column;gap:2px;padding:4px 2px;border-radius:6px;min-width:0}
.stat.on{background:#F1F2F4;box-shadow:inset 0 0 0 1px #C9CED6}
.stat span{font-size:10px;color:#8A919E;white-space:nowrap}
.stat b{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:12px;white-space:nowrap}
.stats{grid-column:1 / -1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;width:100%;min-width:0}
.blk>button{display:grid;grid-template-columns:minmax(0,1fr) auto 12px;align-items:start;gap:8px;width:100%;padding:12px 2px;border:none;background:transparent;color:#14171F;text-align:left;cursor:pointer}
.blk>button>.judge{grid-column:2;grid-row:1;margin-top:22px}
.blk>button>.blk-chev{grid-column:3;grid-row:1;margin-top:26px}
#drawerBody{padding:14px 18px 24px;box-sizing:border-box}
#aside{overflow-x:hidden}
.dw{flex:0 0 384px;width:384px}
@media (min-width:1400px){.dw{flex-basis:422px;width:422px}}
table.tb{width:100%;border-collapse:collapse;table-layout:fixed}
table.tb th{padding:6px 2px;font-size:11px;font-weight:500;color:#8A919E;text-align:right;white-space:nowrap}
table.tb th:first-child,table.tb th.l{text-align:left}
table.tb td{padding:8px 2px;border-top:1px solid #F1F2F4;text-align:right;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.tb td:first-child,table.tb td.l{text-align:left}
table.tb tr.grp td{background:#F7F8FA;text-align:left;padding:8px 6px;border-top:1px solid #E3E6EB}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid #F1F2F4}
.skeleton{color:#8A919E;padding:24px 0}
.chart{position:relative;cursor:crosshair}
.chart-line{position:absolute;top:0;bottom:0;width:1px;background:#2457D6;pointer-events:none}
.chart-tip{position:absolute;top:6px;z-index:3;transform:translateX(-50%);padding:3px 8px;border-radius:6px;background:#14171F;color:#FFFFFF;font-size:11px;line-height:1.4;white-space:nowrap;pointer-events:none}
</style>

<script>
const API = (new URLSearchParams(location.search).get('stockApi') || (document.querySelector('meta[name="stock-api-base"]') || {}).content || 'http://127.0.0.1:8090').replace(/\/$/, '');
const TABS = [['fund', '市场资金'], ['team', '国家队'], ['sector', '板块'], ['mood', '好不好做'], ['cal', '日历'], ['macro', '宏观']];
const state = { summary: null, tab: 'fund', fold: true, tabs: {}, loading: {}, open: {}, window: '5', hits: [], pick: 0, etf: null, etfDays: 60, etfs: {}, chg: {}, chgMode: 'today', since: null, notif: false, nData: null, nTab: 'all', settings: null, channel: '', intraday: null, history: null };

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (id) => document.getElementById(id);
const DOT = { good: '#D9483F', bad: '#2E8B57', warn: '#E0A030', flat: '#A1A7B2' };
const MONO = 'class="mono"';

function pillT(text, tone, big) { return '<span class="pill ' + (big ? '' : 's ') + 't-' + (tone || 'flat') + '">' + esc(text) + '</span>'; }
function age(text) {
  if (!text) return '';
  const cls = text === '今日' ? 'now' : /^(上月|上周|上季|暂定|近 3 年|月频)$/.test(text) ? 'old' : '';
  return '<span class="age ' + cls + '">' + esc(text) + '</span>';
}
function pct(v, d) { if (v == null || v !== v) return '—'; return (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v * 100).toFixed(d == null ? 1 : d) + '%'; }
function yi(v, signed) {
  if (v == null || v !== v) return '—';
  const a = Math.abs(v), body = a >= 10000 ? (a / 10000).toFixed(2) + ' 万亿' : a.toFixed(a >= 100 ? 0 : 1) + ' 亿';
  return signed ? (v > 0 ? '+' : v < 0 ? '−' : '') + body : body;
}
function cls(v) { return v > 0 ? 'up' : v < 0 ? 'dn' : ''; }
function num(v, d, signed) { if (v == null || v !== v) return '—'; return (signed && v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(d); }

/* ---------- 小图 ---------- */
function indexPolyline(points, W, H, pad, xAt) {
  const known = points.map((p) => p.index).filter((v) => v != null);
  if (known.length < 2) return '';
  const lo = Math.min.apply(null, known), hi = Math.max.apply(null, known), span = Math.max(hi - lo, 1e-9);
  const coords = [];
  points.forEach((p, i) => {
    if (p.index == null) return;
    const x = xAt ? xAt(i) : i * (W / points.length) + (W / points.length) / 2;
    const y = pad + (1 - (p.index - lo) / span) * (H - pad * 2);
    coords.push(x.toFixed(1) + ',' + y.toFixed(1));
  });
  if (coords.length < 2) return '';
  return '<polyline fill="none" stroke="#5B6372" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" points="' + coords.join(' ') + '"></polyline>';
}
function barsSvg(points, opts) {
  const n = points.length;
  if (!n) return '<div style="color:#8A919E;font-size:12px">没有取到序列</div>';
  const W = 356, H = 96, gap = 1.2, bw = W / n - gap;
  const vals = points.map((p) => p.value || 0);
  const signed = opts && opts.signed;
  const max = Math.max(...vals.map(Math.abs), 1e-9);
  let out = '';
  if (opts && opts.shade) opts.shade.forEach(([k, c, o]) => { const w = (W / n) * Math.min(k, n); out += '<rect x="' + (W - w).toFixed(1) + '" y="0" width="' + w.toFixed(1) + '" height="' + H + '" fill="' + c + '" opacity="' + o + '"></rect>'; });
  points.forEach((p, i) => {
    const x = i * (W / n) + gap / 2, v = p.value || 0;
    let color = p.up === undefined ? (v >= 0 ? '#D9483F' : '#2E8B57') : (p.up ? '#D9483F' : '#2E8B57');
    if (signed) {
      const h = Math.abs(v) / max * (H / 2 - 4), y = v >= 0 ? H / 2 - h : H / 2;
      out += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(h, 0.5).toFixed(1) + '" fill="' + color + '"></rect>';
    } else {
      const h = v / max * (H - 6);
      out += '<rect x="' + x.toFixed(1) + '" y="' + (H - h).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(h, 0.5).toFixed(1) + '" fill="' + color + '"></rect>';
    }
  });
  if (signed) out += '<line x1="0" x2="' + W + '" y1="' + H / 2 + '" y2="' + H / 2 + '" stroke="#C9CED6" stroke-width="0.6"></line>';
  out += indexPolyline(points, W, H, 6);
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" style="display:block;width:100%;height:96px" aria-hidden="true">' + out + '</svg>';
}
function areaSvg(points) {
  const n = points.length;
  if (n < 2) return '<div style="color:#8A919E;font-size:12px">没有取到序列</div>';
  const W = 356, H = 110, top = 76;
  const vals = points.map((p) => p.value);
  const lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || 1;
  const xy = points.map((p, i) => [i * W / (n - 1), top - 6 - (p.value - lo) / span * (top - 14)]);
  const line = xy.map((q) => q[0].toFixed(1) + ',' + q[1].toFixed(1)).join(' ');
  const dmax = Math.max(...points.map((p) => Math.abs(p.delta || 0)), 1e-9);
  let bars = '';
  points.forEach((p, i) => {
    const h = Math.abs(p.delta || 0) / dmax * 26, x = i * W / (n - 1) - 1.8;
    bars += '<rect x="' + x.toFixed(1) + '" y="' + (p.delta >= 0 ? 96 - h : 96).toFixed(1) + '" width="3.6" height="' + Math.max(h, 0.4).toFixed(1) + '" fill="' + (p.delta >= 0 ? '#D9483F' : '#2E8B57') + '"></rect>';
  });
  const idx = indexPolyline(points, W, top, 6, (i) => i * W / (n - 1));
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" style="display:block;width:100%;height:110px" aria-hidden="true">' +
    '<polygon points="0,' + top + ' ' + line + ' ' + W + ',' + top + '" fill="#EAF0FD" opacity="0.7"></polygon>' +
    '<polyline points="' + line + '" fill="none" stroke="#2457D6" stroke-width="1.6"></polyline>' + idx +
    '<line x1="0" x2="' + W + '" y1="96" y2="96" stroke="#E3E6EB" stroke-width="0.6"></line>' + bars + '</svg>';
}
function weeksSvg(points) {
  const n = points.length;
  if (!n) return '<div style="color:#8A919E;font-size:12px">没有取到序列</div>';
  const W = 356, H = 96, bw = W / n - 6;
  const max = Math.max(...points.map((p) => Math.max(p.buy, p.sell)), 1e-9);
  let out = '';
  points.forEach((p, i) => {
    const x = i * (W / n) + 3, a = p.buy / max * (H / 2 - 4), b = p.sell / max * (H / 2 - 4);
    out += '<rect x="' + x.toFixed(1) + '" y="' + (H / 2 - a).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(a, 0.5).toFixed(1) + '" fill="#D9483F"></rect>' +
      '<rect x="' + x.toFixed(1) + '" y="' + H / 2 + '" width="' + bw.toFixed(1) + '" height="' + Math.max(b, 0.5).toFixed(1) + '" fill="#2E8B57"></rect>';
  });
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" style="display:block;width:100%;height:96px" aria-hidden="true">' + out + '<line x1="0" x2="' + W + '" y1="' + H / 2 + '" y2="' + H / 2 + '" stroke="#C9CED6" stroke-width="0.6"></line></svg>';
}
function monthsSvg(points) {
  const n = points.length;
  if (!n) return '';
  const W = 356, H = 80, bw = W / n - 6, max = Math.max(...points.map((p) => p.count), 1);
  let out = '';
  points.forEach((p, i) => {
    const h = p.count / max * (H - 8);
    out += '<rect x="' + (i * (W / n) + 3).toFixed(1) + '" y="' + (H - h).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(h, 0.5).toFixed(1) + '" fill="' + (i === n - 1 ? '#2457D6' : '#9DB4EE') + '"></rect>';
  });
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" style="display:block;width:100%;height:80px" aria-hidden="true">' + out + '</svg>';
}
function teamSvg(points) {
  const n = points.length;
  if (!n) return '';
  const W = 356, H = 96, pad = 6, bw = W / n - 1.2, max = Math.max(...points.map((p) => Math.abs(p.delta)), 1e-9);
  let out = '<line x1="0" x2="' + W + '" y1="' + H / 2 + '" y2="' + H / 2 + '" stroke="#C9CED6" stroke-width="0.6"></line>';
  points.forEach((p, i) => {
    const h = Math.abs(p.delta) / max * (H / 2 - 8), x = i * (W / n) + 0.6, y = p.delta >= 0 ? H / 2 - h : H / 2;
    const fill = p.delta >= 0 ? '#D9483F' : '#2E8B57';
    const hh = Math.max(h, 0.5);
    out += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + hh.toFixed(1) + '" fill="' + fill + '"' + (p.action ? ' stroke="#2457D6" stroke-width="1.4"' : '') + '></rect>';
    if (p.action) {
      const cx = x + bw / 2, cy = p.delta >= 0 ? y - 3 : y + hh + 3;
      out += '<circle cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="2.2" fill="#2457D6"></circle>';
    }
  });
  // 没有收盘价时，用涨跌幅从 100 起累加，也能画出走势。
  let level = 100;
  const idxPoints = points.map((p) => {
    if (p.index != null) return p;
    if (p.index_pct == null) return p;
    level *= 1 + p.index_pct / 100;
    return Object.assign({}, p, { index: level });
  });
  out += indexPolyline(idxPoints, W, H, pad);
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" style="display:block;width:100%;height:96px" aria-hidden="true">' + out + '</svg>';
}
function stagesChart(c) {
  const pts = c.points;
  if (!pts.length) return '';
  return '<div style="display:flex;flex-direction:column;gap:6px"><span style="font-size:11px;color:#8A919E">近 ' + pts.length + ' 个交易日每天所处阶段</span>' +
    '<div style="display:flex;gap:2px">' + pts.map((p) => '<span title="' + esc(p.date + ' ' + p.stage + ' 涨停' + p.up + ' 跌停' + p.down) + '" style="flex:1;height:22px;border-radius:3px;background:' + STAGE_COLOR[p.stage] + '"></span>').join('') + '</div>' + axis(pts) +
    '<div style="display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:#5B6372">' + ['冰点', '修复', '发酵', '高潮', '退潮'].map((n) => '<span style="display:inline-flex;align-items:center;gap:4px"><span style="width:10px;height:10px;background:' + STAGE_COLOR[n] + '"></span>' + n + '</span>').join('') + '</div></div>';
}
function listing(l) {
  if (!l || !l.rows || !l.rows.length) return '';
  return '<div style="display:flex;flex-direction:column"><span style="font-size:11px;color:#8A919E;padding-bottom:2px">' + esc(l.title) + '</span>' + l.rows.map((r) => '<div class="row" style="padding:5px 0;align-items:baseline"><span style="min-width:0;font-size:12px">' + (r.url ? '<a href="' + esc(r.url) + '" target="_blank" rel="noopener" style="text-decoration:none">' + esc(r.left) + '</a>' : esc(r.left)) + '</span><span style="flex:none;display:flex;gap:8px;align-items:baseline">' + (r.code ? etfLink(r.code, r.mid) : '<span ' + MONO + ' style="font-size:11px;color:#8A919E">' + esc(r.mid || '') + '</span>') + (r.right ? '<b ' + MONO + ' style="font-size:12px">' + esc(r.right) + '</b>' : '') + '</span></div>').join('') + '</div>';
}
function axis(points, labelKey) {
  if (!points || points.length < 2) return '';
  const pick = [0, Math.floor(points.length / 3), Math.floor(points.length * 2 / 3), points.length - 1];
  return '<div style="display:flex;justify-content:space-between;font-size:10px;color:#A1A7B2" ' + MONO + '>' + pick.map((i) => '<span>' + esc((points[i][labelKey || 'date'] || '').slice(-5)) + '</span>').join('') + '</div>';
}
let chartTips = [];
function hoverChart(svg, spec) {
  const id = chartTips.length;
  chartTips.push(spec);
  return '<div class="chart" data-chart="' + id + '">' + svg + '<span class="chart-line" hidden></span><span class="chart-tip" hidden></span></div>';
}
function chartText(c) {
  const unit = c.unit || '';
  const day = (d) => (d || '').slice(5);
  const qty = (v) => v == null ? '—' : unit === '亿元' ? yi(v) : (Math.abs(v) >= 100 ? v.toFixed(0) : v.toFixed(1)) + (unit ? ' ' + unit : '');
  if (c.kind === 'bars') return c.points.map((p) => day(p.date) + '  ' + (c.signed ? num(p.value, 1, true) + (unit ? ' ' + unit : '') : yi(p.value)) + (p.up === undefined ? '' : (p.up ? '  上涨日' : '  下跌日')) + (p.index != null ? '  上证 ' + Math.round(p.index) : ''));
  if (c.kind === 'area') return c.points.map((p) => day(p.date) + '  ' + qty(p.value) + (p.delta == null ? '' : '  当天 ' + num(p.delta, 1, true)) + (p.index != null ? '  上证 ' + Math.round(p.index) : ''));
  if (c.kind === 'weeks') return c.points.map((p) => (p.label || '') + '  增持 ' + yi(p.buy) + '  减持 ' + yi(p.sell));
  if (c.kind === 'months') return c.points.map((p) => (p.month || '') + '  ' + p.count + ' 只');
  if (c.kind === 'team') return c.points.map((p) => {
    const flow = (p.delta || 0) >= 0 ? '净申购 ' : '净赎回 ';
    const idx = p.index != null ? '  上证 ' + Math.round(p.index) : (p.index_pct == null ? '' : '  上证 ' + num(p.index_pct, 2, true) + '%');
    const move = p.index != null && p.index_pct != null ? '（' + num(p.index_pct, 2, true) + '%）' : '';
    return day(p.date) + '  ' + flow + num(Math.abs(p.delta), 1, false) + ' ' + (c.unit || '亿元') + idx + move + (p.action ? '  托市或异动' : '');
  });
  return [];
}
function legend(items) {
  const colors = ['#D9483F', '#2E8B57', '#2457D6'];
  return '<div style="display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:#5B6372">' + items.map((t, i) => {
    const label = typeof t === 'string' ? t : (t.t || '');
    const color = typeof t === 'string' ? colors[i % 3] : (t.c || colors[i % 3]);
    return '<span style="display:inline-flex;align-items:center;gap:4px"><span style="width:10px;height:10px;background:' + color + '"></span>' + esc(label) + '</span>';
  }).join('') + '</div>';
}
function pctileBar(p) {
  if (!p) return '';

function pinCard(card) {
  if (card.querySelector(':scope > .card-body')) return;
  const kids = [...card.children];

  const tail = kids[kids.length - 1];
  const pinTail = tail.classList.contains('scope') || tail.classList.contains('card-foot');
  const body = document.createElement('div');
  body.className = 'card-body';
  const end = pinTail ? kids.length - 1 : kids.length;
  for (let i = 1; i < end; i++) body.appendChild(kids[i]);

function fitCards() {

  if (!hero) return;
  const cards = [...document.querySelectorAll('#mainBody section.card')];
  cards.forEach((card) => {
    if (card === hero) return;
    card.style.height = 'auto';
    card.style.overflow = '';
  });
  hero.style.height = '';
  hero.style.minHeight = '';
  const h = hero.offsetHeight;
  const shown = new Set(['钱有没有进来']);
  cards.forEach((card) => {
    if (card === hero) return;
    if (card.getAttribute('aria-label') === '国家队') {
      card.style.height = '';
      card.style.overflow = '';
      card.style.minHeight = '';
      return;
    }
    if (shown.has(card.getAttribute('aria-label'))) {
      card.style.height = '';
      card.style.overflow = '';
      card.style.minHeight = h + 'px';
      return;

    pinCard(card);

function tipAt(spec, ratio) {

    (spec.points || []).forEach((p) => { const d = Math.abs(minuteIdx(p.t) - target); if (d < dist) { best = p; dist = d; } });
    return best ? best.t + '  今天 ' + yi(best.today) + '  昨天 ' + yi(best.yesterday) + '  前几日平均 ' + yi(best.avg) : '';
  }
  const tips = spec.tips || [];
  if (!tips.length) return '';
  const i = Math.min(tips.length - 1, Math.max(0, Math.floor(Math.max(0, Math.min(0.999, ratio)) * tips.length)));
  return tips[i];
}

  });
  if (!host) return;

function ruleLines(text) {
  return (Array.isArray(text) ? text : [text]).map((line) => '<span style="font-size:12px;line-height:1.7;color:#3A4250">' + esc(line) + '</span>').join('');
}
function ruleHtml(id) {
  const r = RULES[id];
  if (!r) return '';
  return '<div style="display:flex;align-items:center;gap:8px"><b style="font-size:15px">计算规则</b><span style="font-size:13px;color:#5B6372">' + esc(r.title) + '</span><button type="button" data-closerule="1" aria-label="关闭" style="margin-left:auto;width:28px;height:28px;border:none;border-radius:6px;background:transparent;color:#5B6372;font-size:18px;cursor:pointer">×</button></div>' +
    r.items.map((item) => '<div style="display:flex;flex-direction:column;gap:4px"><b style="font-size:13px">' + esc(item[0]) + '</b>' + ruleLines(item[1]) + '</div>').join('');
}
function placeRule(btn) {
  const pop = $('rulePop');
  const r = btn.getBoundingClientRect();
  const box = pop.getBoundingClientRect();
  let left = r.left, top = r.bottom + 8;
  if (left + box.width > window.innerWidth - 12) left = window.innerWidth - 12 - box.width;
  if (top + box.height > window.innerHeight - 12) top = Math.max(12, r.top - 8 - box.height);
  pop.style.left = Math.max(12, left) + 'px';
  pop.style.top = top + 'px';
}
function closeRule() {
  const pop = $('rulePop');
  if (!pop || pop.hidden) return;
  pop.hidden = true;
  pop.style.display = 'none';
  document.querySelectorAll('.qmark[aria-expanded="true"]').forEach((el) => el.setAttribute('aria-expanded', 'false'));
}
function openRule(btn) {
  document.querySelectorAll('.qmark').forEach((el) => el.setAttribute('aria-expanded', el === btn ? 'true' : 'false'));
  const pop = $('rulePop');
  pop.innerHTML = ruleHtml(btn.dataset.rule);
  pop.hidden = false;
  pop.style.display = 'flex';
  placeRule(btn);
}
function toggleRule(btn) {
  if (btn.getAttribute('aria-expanded') === 'true') closeRule();
  else openRule(btn);
}
document.body.addEventListener('click', (e) => {
  const ruleBtn = e.target.closest('[data-rule]');
  if (ruleBtn) { toggleRule(ruleBtn); return; }
  if (e.target.closest('#rulePop')) { if (e.target.closest('[data-closerule]')) closeRule(); return; }
  closeRule();
  const chg = e.target.closest('[data-chg]');
  if (chg) { loadChanges(chg.dataset.chg); return; }
  if (e.target.closest('[data-history]')) { toggleHistory(); return; }
  if (e.target.closest('[data-closehistory]')) { $('history').hidden = true; $('history').style.display = 'none'; return; }
  if (e.target.closest('#notifyBtn')) { toggleNotify(); return; }
  if (e.target.closest('[data-closenotify]')) { $('notify').hidden = true; $('notify').style.display = 'none'; return; }
  if (e.target.closest('[data-opennotify]')) { toggleNotify(); return; }
  if (e.target.closest('#foldBtn')) { state.fold = true; state.notif = false; updateBell(); applyFold(); return; }
  if (e.target.closest('#unfoldBtn')) { openTab(state.tab); return; }
  if (e.target.closest('#bell')) { if (state.notif && !state.fold) closeNotif(); else { state.fold = false; state.notif = true; state.etf = null; updateBell(); renderNotif(); loadNotif(); } return; }
  if (e.target.closest('[data-nclose]')) { closeNotif(); return; }
  if (e.target.closest('[data-nread]')) { markRead(null); return; }
  const nt = e.target.closest('[data-ntabbtn]');
  if (nt) { state.nTab = nt.dataset.ntabbtn; renderNotif(); return; }
  const ni = e.target.closest('[data-ntab]');
  if (ni) { if (ni.dataset.nid) markRead([ni.dataset.nid.startsWith('inbox:') ? ni.dataset.nid : Number(ni.dataset.nid)]); const t = ni.dataset.ntab; state.notif = false; updateBell(); if (t) openTab(t); else renderDrawer(); return; }
  const etf = e.target.closest('[data-etf]');
  if (etf) { openEtf(etf.dataset.etf); return; }
  if (e.target.closest('[data-back]')) { state.etf = null; renderDrawer(); return; }
  const etfDays = e.target.closest('[data-etfdays]');
  if (etfDays) { openEtf(state.etf, Number(etfDays.dataset.etfdays)); return; }
  if (e.target.closest('.chg-more')) return;
  const tab = e.target.closest('[data-tab]');
  if (tab) { state.etf = null; state.notif = false; updateBell(); openTab(tab.dataset.tab); return; }
  const blk = e.target.closest('[data-block]');
  if (blk) { const k = blk.dataset.block, b = findBlock(k); state.open[k] = !(state.open[k] != null ? state.open[k] : !!(b && b.open)); renderDrawer(); return; }
  const win = e.target.closest('[data-win]');
  if (win) { state.window = win.dataset.win; renderDrawer(); return; }
  const secRow = e.target.closest('[data-sec]');
  if (secRow) { state.secOpen = state.secOpen || {}; const n = secRow.dataset.sec; state.secOpen[n] = !state.secOpen[n]; renderDrawer(); return; }
  const secGroup = e.target.closest('[data-secgroup]');
  if (secGroup) { state.secGroup = secGroup.dataset.secgroup; renderDrawer(); return; }
  const hit = e.target.closest('[data-hit]');
  if (hit) { state.pick = Number(hit.dataset.hit); addPick(); return; }
  if (e.target.id === 'srchMask') showSearch(false);
  if (e.target.closest('#dictBtn')) { $('notify').hidden = true; $('notify').style.display = 'none'; const d = $('dict'); d.hidden = !d.hidden; d.style.display = d.hidden ? 'none' : 'flex'; return; }
  if (e.target.closest('#openSearch')) showSearch(true);

function findBlock(key) { const t = state.tabs[state.tab]; for (const s of (t && t.sections) || []) for (const b of s.blocks) if (b.key === key) return b; return null; }
document.body.addEventListener('change', (e) => {
  const sw = e.target.closest('[data-set]');
  if (sw) { putSetting(sw.dataset.set, sw.checked); return; }
  const num = e.target.closest('[data-setnum]');
  if (num) putSetting(num.dataset.setnum, Number(num.value));
});
$('srchInput').addEventListener('input', (e) => { clearTimeout(searchTimer); searchTimer = setTimeout(() => runSearch(e.target.value), 220); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && $('srch').hidden) { if (!$('rulePop').hidden) { closeRule(); return; } if (!$('notify').hidden) { $('notify').hidden = true; $('notify').style.display = 'none'; return; } if (state.notif) { closeNotif(); return; } if (state.etf) { state.etf = null; renderDrawer(); return; } }
  if ((e.metaKey || e.ctrlKey) && e.key === '\\') { e.preventDefault(); if (state.fold) openTab(state.tab); else { state.fold = true; state.notif = false; updateBell(); applyFold(); } return; }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); showSearch($('srch').hidden); return; }
  if ($('srch').hidden) return;
  if (e.key === 'Escape') showSearch(false);
  else if (e.key === 'ArrowDown') { state.pick = Math.min(state.pick + 1, state.hits.length - 1); renderHits(''); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { state.pick = Math.max(state.pick - 1, 0); renderHits(''); e.preventDefault(); }
  else if (e.key === 'Enter') { addPick(); e.preventDefault(); }
});
$('dict').style.display = 'none'; $('notify').style.display = 'none'; $('history').style.display = 'none'; $('rulePop').style.display = 'none';
$('scroll').addEventListener('scroll', () => {
  const open = document.querySelector('.qmark[aria-expanded="true"]');
  if (open) placeRule(open);
}, { passive: true });

function tickClock() {
  const d = new Date(), t = d.getHours() * 60 + d.getMinutes(), wk = d.getDay() > 0 && d.getDay() < 6;
  const live = wk && ((t >= 570 && t <= 690) || (t >= 780 && t <= 900));
  $('session').innerHTML = '<span style="width:7px;height:7px;border-radius:50%;background:' + (live ? '#2E8B57' : '#A1A7B2') + '"></span>' + (live ? '交易中' : wk ? '已休市' : '休市日') + ' · <span ' + MONO + '>' + [d.getHours(), d.getMinutes(), d.getSeconds()].map((n) => String(n).padStart(2, '0')).join(':') + '</span>';
}
setInterval(tickClock, 1000); tickClock();

/* ---------- 通知 ---------- */
function updateBell() {
  const n = state.nData ? state.nData.unread : 0;
  $('bellDot').hidden = !n;
  $('bell').style.background = state.notif ? '#EAF0FD' : 'transparent';
}
// 本机收件箱（定时任务回执、简报、出错）：来自本机的 Go 服务，和市场页自己的事件并进同一个抽屉。
async function goInboxItems(wanted) {
  try {
    const res = await fetch('/notify/inbox?limit=80');
    if (!res.ok) return [];
    const body = await res.json();
    const p2 = (n) => String(n).padStart(2, '0');
    const today = new Date(); today.setHours(0, 0, 0, 0);
    return (body.items || []).filter((it) => wanted.includes(it.group)).map((it) => {
      const d = new Date(it.created_at);
      const day = new Date(d); day.setHours(0, 0, 0, 0);
      const days = Math.round((today - day) / 86400000);
      const group = days <= 0 ? '今天' : days === 1 ? '昨天' : '更早';
      const hm = p2(d.getHours()) + ':' + p2(d.getMinutes());
      return { group, item: { id: 'go:' + it.notif_id, kind: it.group === 'system' ? '系统' : '简报', title: it.title, text: String(it.body || '').split('\n')[0],
        tab: (it.link && it.link.tab) || '', tone: it.tone, time: group === '今天' ? hm : p2(d.getMonth() + 1) + '-' + p2(d.getDate()) + ' ' + hm, unread: !it.read_at, at: it.created_at } };
    });
  } catch (err) { return []; }
}
async function loadNotif() {
  let body = { groups: [], upcoming: [], unread: 0, channel: '页面内通知' };
  try {
    const res = await fetch(API + '/api/v1/market/notifications');
    const got = await res.json();
    if (res.ok && !got.error) body = got;
  } catch (err) { /* 市场服务暂时连不上，仍然显示本机收件箱 */ }
  const mine = await goInboxItems(['market', 'system']);
  body.groups = body.groups || [];
  mine.forEach(({ group, item }) => {
    let g = body.groups.find((x) => x.title === group);
    if (!g) { g = { title: group, items: [] }; body.groups.push(g); }
    g.items.push(item);
    if (item.unread) body.unread = (body.unread || 0) + 1;
  });
  const order = ['今天', '昨天', '更早'];
  body.groups.sort((a, b) => order.indexOf(a.title) - order.indexOf(b.title));
  body.groups.forEach((g) => g.items.sort((a, b) => (b.at || 0) - (a.at || 0)));
  body.upcoming = body.upcoming || [];
  state.nData = body; state.channel = body.channel;
  updateBell();
  if (state.notif) renderNotif();
}
function nItem(i) {
  const bg = i.kind === '提醒' || i.kind === '简报' ? '#F1F2F4' : i.kind === '系统' ? '#FDECEA' : '#FFF4E0';
  return '<button type="button" data-nid="' + (i.id || '') + '" data-ntab="' + esc(i.tab || '') + '" style="display:grid;grid-template-columns:6px 28px minmax(0,1fr) auto;align-items:start;gap:10px;width:100%;padding:10px 16px;border:none;background:transparent;text-align:left;font:inherit;color:#14171F;cursor:pointer">' +
    '<span style="width:6px;height:6px;border-radius:50%;margin-top:7px;background:' + (i.unread ? '#D9483F' : 'transparent') + '"></span>' +
    '<span style="width:28px;height:28px;border-radius:8px;background:' + bg + ';display:flex;align-items:center;justify-content:center;font-size:13px">' + (i.kind === '提醒' ? '📅' : i.kind === '系统' ? '⚙' : i.kind === '简报' ? '📰' : '⇄') + '</span>' +
    '<span style="display:flex;flex-direction:column;gap:2px;min-width:0"><span style="font-size:11px;color:#8A919E">' + esc(i.kind) + '</span><span style="font-weight:600">' + esc(i.title) + '</span><span style="font-size:12px;color:#5B6372">' + esc(i.text || '') + '</span></span>' +
    '<span style="font-size:11px;color:#8A919E;white-space:nowrap">' + esc(i.time || '') + '</span></button>';
}
function renderNotif() {
  const aside = $('aside'); aside.style.flex = ''; aside.style.width = '';
  const d = state.nData, tab = state.nTab;
  const tabs = [['all', '全部'], ['remind', '提醒'], ['change', '判断变化']];
  $('drawerTabs').innerHTML = '<div style="flex:1;display:flex;flex-direction:column"><div style="display:flex;align-items:center;gap:12px;padding:14px 0 0 8px"><span style="font-size:16px;font-weight:700">通知</span><button type="button" class="link" data-nread="1" style="margin-left:auto">全部已读</button><button type="button" data-nclose="1" aria-label="关闭" style="width:28px;height:28px;border:none;border-radius:6px;background:transparent;color:#5B6372;font-size:18px;cursor:pointer">×</button></div>' +
    '<div style="display:flex;padding:0 0">' + tabs.map(([k, n]) => '<button type="button" class="dtab" aria-selected="' + (tab === k) + '" data-ntabbtn="' + k + '">' + n + '</button>').join('') + '</div></div>';
  if (!d) { $('drawerBody').innerHTML = '<div class="skeleton">正在取通知…</div>'; return; }
  const label = (t) => '<span style="display:block;padding:10px 16px 2px 32px;font-size:11px;font-weight:600;color:#8A919E">' + t + '</span>';
  let html = '';
  if (tab !== 'remind') d.groups.forEach((g) => { html += label(g.title) + g.items.map(nItem).join(''); });
  if (tab !== 'change' && d.upcoming.length) html += label('即将发生') + d.upcoming.map((u) => nItem({ kind: '提醒', title: u.title, text: u.when + ' ' + u.weekday, tab: u.tab, time: '', unread: false })).join('');
  if (!html) html = '<div class="skeleton" style="padding:24px 16px">' + (tab === 'remind' ? '近两周没有涉及自选的事件。' : '还没有通知。结论、闸门、资金或自选所在板块变化时，这里会出现。') + '</div>';
  $('drawerBody').style.padding = '0 0 12px';
  $('drawerBody').innerHTML = html + '<div style="display:flex;align-items:center;gap:12px;margin-top:12px;padding:12px 20px;border-top:1px solid #EEF0F3;background:#F7F8FA;font-size:12px;color:#5B6372"><span>' + esc(d.channel) + '</span><button type="button" class="link" data-opennotify="1" style="margin-left:auto">通知设置</button></div>';
  applyFold();
}
function closeNotif() { state.notif = false; $('drawerBody').style.padding = ''; updateBell(); renderDrawer(); }
async function markRead(ids) {
  try {
    const mineIds = ids ? ids.filter((x) => String(x).startsWith('go:')).map((x) => String(x).slice(3)) : null;
    const pageIds = ids ? ids.filter((x) => !String(x).startsWith('go:')) : null;
    const post = (url, payload) => fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) }).then((r) => r.json()).catch(() => ({}));
    if (!ids || pageIds.length) await post(API + '/api/v1/market/notifications/read', ids ? { ids: pageIds } : {});
    if (!ids || mineIds.length) await post('/notify/inbox/read', ids ? { ids: mineIds } : { all: true });
    if (state.nData) {
      state.nData.groups.forEach((g) => g.items.forEach((i) => { if (!ids || ids.includes(i.id)) i.unread = false; }));
      state.nData.unread = state.nData.groups.reduce((n, g) => n + g.items.filter((i) => i.unread).length, 0);
    }
  } catch (err) { /* 已读标记失败不影响看通知 */ }
  updateBell();
}

/* ---------- 通知我 ---------- */
const SET_ROWS = [
  ['结论', [['level', '档位变化', '中性 → 顺风 / 逆风，或三个信号变档'], ['gate', '闸门变化', '不过 → 通过，或反过来']]],
  ['资金与国家队', [['etf_streak', '宽基 ETF 连续 N 日净增 / 净减', ''], ['margin_turn', '两融止跌回升', ''], ['team', '国家队出手，或可能在卖', '']]],
  ['板块与自选', [['watch_sector', '我的自选所在板块结论变化', '如 只热不增 → 三层同向']]],
  ['简报', [['brief_pre', '每个交易日 08:30 盘前简报', ''], ['brief_close', '收盘后 15:35 复盘', '']]],
];
function renderNotify() {
  const st = state.settings;
  const box = $('notify');
  if (!st) { box.innerHTML = '<div class="skeleton">正在取设置…</div>'; return; }
  const sw = (key) => '<input type="checkbox" data-set="' + key + '"' + (st[key] ? ' checked' : '') + ' style="width:16px;height:16px;accent-color:#2457D6;cursor:pointer">';
  const rows = SET_ROWS.map(([title, items]) => '<div style="display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:1px solid #F1F2F4"><span style="font-size:12px;font-weight:700;color:#5B6372">' + title + '</span>' +
    items.map(([k, n, hint]) => '<label style="display:flex;align-items:center;gap:10px;font-size:13px;cursor:pointer"><span style="flex:1;display:flex;flex-direction:column"><span>' + n + (k === 'etf_streak' ? ' <select data-setnum="etf_n" style="font:inherit;font-size:12px;margin-left:4px">' + [3, 4, 5, 6, 7, 8, 9, 10].map((x) => '<option' + (x === st.etf_n ? ' selected' : '') + '>' + x + '</option>').join('') + '</select> 日' : '') + '</span>' + (hint ? '<span style="font-size:11px;color:#8A919E">' + hint + '</span>' : '') + '</span>' + sw(k) + '</label>').join('') + '</div>').join('');
  const level = state.summary ? state.summary.conclusion.level + (state.summary.conclusion.tilt || '') : '中性';
  box.innerHTML = '<div style="display:flex;align-items:center"><b style="font-size:14px">通知我 · 市场</b><button type="button" data-closenotify="1" style="margin-left:auto;border:none;background:transparent;font-size:18px;color:#5B6372;cursor:pointer">×</button></div>' +
    '<span style="font-size:12px;color:#5B6372">只推状态变化，数字小幅波动不推</span>' +
    '<label style="display:flex;align-items:center;gap:10px;font-size:13px;cursor:pointer"><span style="flex:1"><b>推送到外部渠道</b><br><span style="font-size:11px;color:#8A919E">' + esc(state.channel) + '</span></span>' + sw('push') + '</label>' + rows +
    '<div style="display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:1px solid #F1F2F4"><span style="font-size:12px;font-weight:700;color:#5B6372">推送预览</span><div style="display:flex;gap:10px;padding:10px 12px;border-radius:12px;background:#F3F4F6"><span style="flex:none;width:28px;height:28px;border-radius:8px;background:#2457D6;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px">市</span><span style="display:flex;flex-direction:column;gap:2px;font-size:12px;color:#3A4250"><b style="font-size:13px;color:#14171F">市场 · 宽基 ETF 连续 ' + st.etf_n + ' 日净流出</b><span>第 ' + st.etf_n + ' 天。档位目前是' + esc(level) + '，点开看影响了哪些板块。</span></span></div></div>' +
    '<div style="font-size:11px;color:#8A919E;line-height:1.6">同一件事同一天只推一次。「有效期到期提醒」「新热点」这一期没做，所以不在这里。</div>';
}
async function toggleNotify() {
  const box = $('notify');
  if (!box.hidden) { box.hidden = true; box.style.display = 'none'; return; }
  $('dict').hidden = true; $('dict').style.display = 'none';
  box.hidden = false; box.style.display = 'flex';
  if (!state.settings) {
    renderNotify();
    try { const body = await (await fetch(API + '/api/v1/market/settings')).json(); state.settings = body.settings; state.channel = body.channel; } catch (err) { box.innerHTML = '<div class="skeleton">设置没有取到。</div>'; return; }
  }
  renderNotify();
}
async function putSetting(key, value) {
  state.settings = Object.assign({}, state.settings, { [key]: value });
  try {
    const res = await fetch(API + '/api/v1/market/settings', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ [key]: value }) });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || res.status);
    state.settings = body.settings;
  } catch (err) { /* 保存失败时界面保持用户刚选的，刷新后以服务端为准 */ }
  renderNotify();
}

}

/* ---------- 盘中 ---------- */
async function loadIntraday() {
  try {
    const body = await (await fetch(API + '/api/v1/market/intraday')).json();
    state.intraday = body;
  } catch (err) { return; }
  if (state.summary) { const top = $('scroll').scrollTop; renderMain(); $('scroll').scrollTop = top; }
  if (!state.notif && !state.etf) renderDrawer();
}
setInterval(() => { const d = new Date(), t = d.getHours() * 60 + d.getMinutes(); if (d.getDay() > 0 && d.getDay() < 6 && ((t >= 570 && t <= 690) || (t >= 780 && t <= 900))) loadIntraday(); }, 60000);

async function load(keepScroll) {
  try {
    const res = await fetch(API + '/api/v1/market/summary');
    const body = await res.json();
    if (!res.ok || body.error) throw new Error(body.error || res.status);
    const top = $('scroll').scrollTop;
    state.summary = body; state.tabs = {}; state.chg = {};
    renderMain();
    if (keepScroll) $('scroll').scrollTop = top;
    if (state.fold) applyFold(); else openTab(state.tab);
    loadChanges(state.chgMode); loadNotif(); loadIntraday();
    try { localStorage.setItem('market.lastSeen', String(Date.now())); } catch (err) { /* 隐私模式下没法记，忽略 */ }
  } catch (err) {
    $('mainBody').innerHTML = '<div style="color:#9E2A22">市场页没有取到：' + esc(err.message) + '</div>';
    $('status').textContent = '没有连上行情服务'; $('dot').style.background = '#D9483F';
  }
}
try { const seen = localStorage.getItem('market.lastSeen'); if (seen) { state.since = seen; state.chgMode = 'last'; } } catch (err) { /* 读不到就当第一次来 */ }
load(false);
