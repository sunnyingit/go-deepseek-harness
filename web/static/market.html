<style>
body{margin:0;background:#EEF0F3}
a{color:inherit}

.age.now{background:#EAF0FD;color:#1F3F8A}
.age.old{background:#FFF1D6;color:#7A4A00}
.t-good{background:#FDF0EF;color:#B42318}
.t-bad{background:#EDF7F1;color:#1E6B44}
.t-warn{background:#FFF1D6;color:#7A4A00}
.t-flat{background:#F1F2F4;color:#3A4250}

.nav-a.on{color:#2457D6;background:#EAF0FD;font-weight:500}

.lv{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:11px;font-weight:600;color:#8A919E}
.link{border:none;background:transparent;padding:0;font-size:12px;color:#2457D6;cursor:pointer;white-space:nowrap}
.qa{display:grid;grid-template-columns:10px minmax(0,1fr);gap:10px;padding:9px 0;border-top:1px solid #F1F2F4}
.qa .dot{width:10px;height:10px;margin-top:5px;border-radius:50%}

<script>
const API = (new URLSearchParams(location.search).get('stockApi') || (document.querySelector('meta[name="stock-api-base"]') || {}).content || 'http://127.0.0.1:8090').replace(/\/$/, '');
const TABS = [['fund', '资金'], ['team', '国家队'], ['sector', '板块'], ['mood', '好不好做'], ['cal', '日历'], ['macro', '宏观']];
const state = { summary: null, tab: 'fund', tabs: {}, loading: {}, open: {}, window: '10', hits: [], pick: 0, etf: null, etfDays: 60, etfs: {}, chg: {}, chgMode: 'today', since: null, notif: false, nData: null, nTab: 'all', settings: null, channel: '', intraday: null, history: null };

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (id) => document.getElementById(id);
const DOT = { good: '#D9483F', bad: '#2E8B57', warn: '#E0A030', flat: '#A1A7B2' };
const MONO = 'class="mono"';

function pillT(text, tone, big) { return '<span class="pill ' + (big ? '' : 's ') + 't-' + (tone || 'flat') + '">' + esc(text) + '</span>'; }
function age(text) {
  if (!text) return '';
  const cls = text === '今日' ? 'now' : /^(上月|上周|上季|暂定|近 3 年|月频)$/.test(text) ? 'old' : '';
  return '<span class="age ' + cls + '">' + esc(text) + '</span>';
}
function pct(v, d) { if (v == null || v !== v) return '—'; return (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v * 100).toFixed(d == null ? 1 : d) + '%'; }
function yi(v, signed) {
  if (v == null || v !== v) return '—';
  const a = Math.abs(v), body = a >= 10000 ? (a / 10000).toFixed(2) + ' 万亿' : a.toFixed(a >= 100 ? 0 : 1) + ' 亿';
  return signed ? (v > 0 ? '+' : v < 0 ? '−' : '') + body : body;
}
function cls(v) { return v > 0 ? 'up' : v < 0 ? 'dn' : ''; }
function num(v, d, signed) { if (v == null || v !== v) return '—'; return (signed && v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(d); }

/* ---------- 小图 ---------- */
function barsSvg(points, opts) {
  const n = points.length;
  if (!n) return '<div style="color:#8A919E;font-size:12px">没有取到序列</div>';
  const W = 356, H = 96, gap = 1.2, bw = W / n - gap;
  const vals = points.map((p) => p.value || 0);
  const signed = opts && opts.signed;
  const max = Math.max(...vals.map(Math.abs), 1e-9);
  let out = '';
  if (opts && opts.shade) opts.shade.forEach(([k, c, o]) => { const w = (W / n) * Math.min(k, n); out += '<rect x="' + (W - w).toFixed(1) + '" y="0" width="' + w.toFixed(1) + '" height="' + H + '" fill="' + c + '" opacity="' + o + '"></rect>'; });
  points.forEach((p, i) => {
    const x = i * (W / n) + gap / 2, v = p.value || 0;
    let color = p.up === undefined ? (v >= 0 ? '#D9483F' : '#2E8B57') : (p.up ? '#D9483F' : '#2E8B57');
    if (signed) {
      const h = Math.abs(v) / max * (H / 2 - 4), y = v >= 0 ? H / 2 - h : H / 2;
      out += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(h, 0.5).toFixed(1) + '" fill="' + color + '"></rect>';
    } else {
      const h = v / max * (H - 6);
      out += '<rect x="' + x.toFixed(1) + '" y="' + (H - h).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(h, 0.5).toFixed(1) + '" fill="' + color + '"></rect>';
    }
  });
  if (signed) out += '<line x1="0" x2="' + W + '" y1="' + H / 2 + '" y2="' + H / 2 + '" stroke="#C9CED6" stroke-width="0.6"></line>';
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" style="display:block;width:100%;height:96px" aria-hidden="true">' + out + '</svg>';
}
function areaSvg(points) {
  const n = points.length;
  if (n < 2) return '<div style="color:#8A919E;font-size:12px">没有取到序列</div>';
  const W = 356, H = 110, top = 76;
  const vals = points.map((p) => p.value);
  const lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || 1;
  const xy = points.map((p, i) => [i * W / (n - 1), top - 6 - (p.value - lo) / span * (top - 14)]);
  const line = xy.map((q) => q[0].toFixed(1) + ',' + q[1].toFixed(1)).join(' ');
  const dmax = Math.max(...points.map((p) => Math.abs(p.delta || 0)), 1e-9);
  let bars = '';
  points.forEach((p, i) => {
    const h = Math.abs(p.delta || 0) / dmax * 26, x = i * W / (n - 1) - 1.8;
    bars += '<rect x="' + x.toFixed(1) + '" y="' + (p.delta >= 0 ? 96 - h : 96).toFixed(1) + '" width="3.6" height="' + Math.max(h, 0.4).toFixed(1) + '" fill="' + (p.delta >= 0 ? '#D9483F' : '#2E8B57') + '"></rect>';
  });
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" style="display:block;width:100%;height:110px" aria-hidden="true">' +
    '<polygon points="0,' + top + ' ' + line + ' ' + W + ',' + top + '" fill="#EAF0FD" opacity="0.7"></polygon>' +
    '<polyline points="' + line + '" fill="none" stroke="#2457D6" stroke-width="1.6"></polyline>' +
    '<line x1="0" x2="' + W + '" y1="96" y2="96" stroke="#E3E6EB" stroke-width="0.6"></line>' + bars + '</svg>';
}
function weeksSvg(points) {
  const n = points.length;
  if (!n) return '<div style="color:#8A919E;font-size:12px">没有取到序列</div>';
  const W = 356, H = 96, bw = W / n - 6;
  const max = Math.max(...points.map((p) => Math.max(p.buy, p.sell)), 1e-9);
  let out = '';
  points.forEach((p, i) => {
    const x = i * (W / n) + 3, a = p.buy / max * (H / 2 - 4), b = p.sell / max * (H / 2 - 4);
    out += '<rect x="' + x.toFixed(1) + '" y="' + (H / 2 - a).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(a, 0.5).toFixed(1) + '" fill="#D9483F"></rect>' +
      '<rect x="' + x.toFixed(1) + '" y="' + H / 2 + '" width="' + bw.toFixed(1) + '" height="' + Math.max(b, 0.5).toFixed(1) + '" fill="#2E8B57"></rect>';
  });
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" style="display:block;width:100%;height:96px" aria-hidden="true">' + out + '<line x1="0" x2="' + W + '" y1="' + H / 2 + '" y2="' + H / 2 + '" stroke="#C9CED6" stroke-width="0.6"></line></svg>';
}

function etfSvg(points) {

  const lo = Math.min(...closes), hi = Math.max(...closes), span = hi - lo || 1;

  points.forEach((p, i) => {

  });

async function openEtf(code, days) {

  try {

    const body = await res.json();

  const nt = e.target.closest('[data-ntabbtn]');
  if (nt) { state.nTab = nt.dataset.ntabbtn; renderNotif(); return; }

  if (ni) { if (ni.dataset.nid) markRead([Number(ni.dataset.nid)]); const t = ni.dataset.ntab; state.notif = false; updateBell(); if (t) openTab(t); else renderDrawer(); return; }

    '<div style="display:flex;padding:0 0">' + tabs.map(([k, n]) => '<button type="button" class="dtab" aria-selected="' + (tab === k) + '" data-ntabbtn="' + k + '">' + n + '</button>').join('') + '</div></div>';
  if (!d) { $('drawerBody').innerHTML = '<div class="skeleton">正在取通知…</div>'; return; }
  const label = (t) => '<span style="display:block;padding:10px 16px 2px 32px;font-size:11px;font-weight:600;color:#8A919E">' + t + '</span>';
  let html = '';
  if (tab !== 'remind') d.groups.forEach((g) => { html += label(g.title) + g.items.map(nItem).join(''); });
  if (tab !== 'change' && d.upcoming.length) html += label('即将发生') + d.upcoming.map((u) => nItem({ kind: '提醒', title: u.title, text: u.when + ' ' + u.weekday, tab: u.tab, time: '', unread: false })).join('');
  if (!html) html = '<div class="skeleton" style="padding:24px 16px">' + (tab === 'remind' ? '近两周没有涉及自选的事件。' : '还没有通知。结论、闸门、资金或自选所在板块变化时，这里会出现。') + '</div>';
  $('drawerBody').style.padding = '0 0 12px';
  $('drawerBody').innerHTML = html + '<div style="display:flex;align-items:center;gap:12px;margin-top:12px;padding:12px 20px;border-top:1px solid #EEF0F3;background:#F7F8FA;font-size:12px;color:#5B6372"><span>' + esc(d.channel) + '</span><button type="button" class="link" data-opennotify="1" style="margin-left:auto">通知设置</button></div>';
}
function closeNotif() { state.notif = false; $('drawerBody').style.padding = ''; updateBell(); renderDrawer(); }
async function markRead(ids) {
  try {
    const res = await fetch(API + '/api/v1/market/notifications/read', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(ids ? { ids } : {}) });
    const body = await res.json();
    if (state.nData) { state.nData.unread = body.unread; state.nData.groups.forEach((g) => g.items.forEach((i) => { if (!ids || ids.includes(i.id)) i.unread = false; })); }
  } catch (err) { /* 已读标记失败不影响看通知 */ }
  updateBell();
}

/* ---------- 通知我 ---------- */
const SET_ROWS = [
  ['结论', [['level', '档位变化', '中性 → 顺风 / 逆风，或三个信号变档'], ['gate', '闸门变化', '不过 → 通过，或反过来']]],
  ['资金与国家队', [['etf_streak', '宽基 ETF 连续 N 日净增 / 净减', ''], ['margin_turn', '两融止跌回升', ''], ['team', '国家队出手，或可能在卖', '']]],
  ['板块与自选', [['watch_sector', '我的自选所在板块结论变化', '如 只热不增 → 三层同向']]],
  ['简报', [['brief_pre', '每个交易日 08:30 盘前简报', ''], ['brief_close', '收盘后 15:35 复盘', '']]],
];
function renderNotify() {
  const st = state.settings;
  const box = $('notify');
  if (!st) { box.innerHTML = '<div class="skeleton">正在取设置…</div>'; return; }
  const sw = (key) => '<input type="checkbox" data-set="' + key + '"' + (st[key] ? ' checked' : '') + ' style="width:16px;height:16px;accent-color:#2457D6;cursor:pointer">';
  const rows = SET_ROWS.map(([title, items]) => '<div style="display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:1px solid #F1F2F4"><span style="font-size:12px;font-weight:700;color:#5B6372">' + title + '</span>' +
    items.map(([k, n, hint]) => '<label style="display:flex;align-items:center;gap:10px;font-size:13px;cursor:pointer"><span style="flex:1;display:flex;flex-direction:column"><span>' + n + (k === 'etf_streak' ? ' <select data-setnum="etf_n" style="font:inherit;font-size:12px;margin-left:4px">' + [3, 4, 5, 6, 7, 8, 9, 10].map((x) => '<option' + (x === st.etf_n ? ' selected' : '') + '>' + x + '</option>').join('') + '</select> 日' : '') + '</span>' + (hint ? '<span style="font-size:11px;color:#8A919E">' + hint + '</span>' : '') + '</span>' + sw(k) + '</label>').join('') + '</div>').join('');
  const level = state.summary ? state.summary.conclusion.level + (state.summary.conclusion.tilt || '') : '中性';
  box.innerHTML = '<div style="display:flex;align-items:center"><b style="font-size:14px">通知我 · 市场</b><button type="button" data-closenotify="1" style="margin-left:auto;border:none;background:transparent;font-size:18px;color:#5B6372;cursor:pointer">×</button></div>' +
    '<span style="font-size:12px;color:#5B6372">只推状态变化，数字小幅波动不推</span>' +
    '<label style="display:flex;align-items:center;gap:10px;font-size:13px;cursor:pointer"><span style="flex:1"><b>推送到外部渠道</b><br><span style="font-size:11px;color:#8A919E">' + esc(state.channel) + '</span></span>' + sw('push') + '</label>' + rows +
    '<div style="display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:1px solid #F1F2F4"><span style="font-size:12px;font-weight:700;color:#5B6372">推送预览</span><div style="display:flex;gap:10px;padding:10px 12px;border-radius:12px;background:#F3F4F6"><span style="flex:none;width:28px;height:28px;border-radius:8px;background:#2457D6;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px">市</span><span style="display:flex;flex-direction:column;gap:2px;font-size:12px;color:#3A4250"><b style="font-size:13px;color:#14171F">市场 · 宽基 ETF 连续 ' + st.etf_n + ' 日净流出</b><span>第 ' + st.etf_n + ' 天。档位目前是' + esc(level) + '，点开看影响了哪些板块。</span></span></div></div>' +
    '<div style="font-size:11px;color:#8A919E;line-height:1.6">同一件事同一天只推一次。「有效期到期提醒」「新热点」这一期没做，所以不在这里。</div>';
}
async function toggleNotify() {
  const box = $('notify');
  if (!box.hidden) { box.hidden = true; box.style.display = 'none'; return; }
  $('dict').hidden = true; $('dict').style.display = 'none';
  box.hidden = false; box.style.display = 'flex';
  if (!state.settings) {
    renderNotify();
    try { const body = await (await fetch(API + '/api/v1/market/settings')).json(); state.settings = body.settings; state.channel = body.channel; } catch (err) { box.innerHTML = '<div class="skeleton">设置没有取到。</div>'; return; }
  }
  renderNotify();
}
async function putSetting(key, value) {
  state.settings = Object.assign({}, state.settings, { [key]: value });
  try {
    const res = await fetch(API + '/api/v1/market/settings', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ [key]: value }) });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || res.status);
    state.settings = body.settings;
  } catch (err) { /* 保存失败时界面保持用户刚选的，刷新后以服务端为准 */ }
  renderNotify();
}

/* ---------- 历次结论 ---------- */
async function toggleHistory() {
  const box = $('history');
  if (!box.hidden) { box.hidden = true; box.style.display = 'none'; return; }
  $('notify').hidden = true; $('notify').style.display = 'none'; $('dict').hidden = true; $('dict').style.display = 'none';
  box.hidden = false; box.style.display = 'flex';
  box.innerHTML = '<div class="skeleton">正在取历次结论…</div>';
  try { state.history = (await (await fetch(API + '/api/v1/market/history')).json()).rows; } catch (err) { box.innerHTML = '<div class="skeleton">没有取到。</div>'; return; }
  const tone = { 顺风: 't-good', 逆风: 't-bad' };
  box.innerHTML = '<div style="display:flex;align-items:center"><b style="font-size:14px">历次结论</b><button type="button" data-closehistory="1" style="margin-left:auto;border:none;background:transparent;font-size:18px;color:#5B6372;cursor:pointer">×</button></div>' +
    '<span style="font-size:12px;color:#8A919E">连续相同的档位合成一行。快照从第一次打开这一页起才有。</span>' +
    state.history.map((r) => '<div style="display:flex;flex-direction:column;gap:3px;padding:10px 0;border-top:1px solid #F1F2F4"><div style="display:flex;align-items:center;gap:8px"><span class="pill ' + (tone[r.level] || 't-warn') + '">' + esc(r.text) + '</span><span ' + MONO + ' style="font-size:12px;color:#5B6372">' + esc(r.since.slice(5)) + (r.until !== r.since ? ' → ' + esc(r.until.slice(5)) : '') + ' · ' + r.days + ' 个交易日</span></div><span style="font-size:12px;color:#5B6372">' + esc(r.headline) + '</span></div>').join('');
}

/* ---------- 盘中 ---------- */
async function loadIntraday() {
  try {
    const body = await (await fetch(API + '/api/v1/market/intraday')).json();
    state.intraday = body;
  } catch (err) { return; }
  if (state.summary) { const top = $('scroll').scrollTop; renderMain(); $('scroll').scrollTop = top; }
  if (!state.notif && !state.etf) renderDrawer();
}
setInterval(() => { const d = new Date(), t = d.getHours() * 60 + d.getMinutes(); if (d.getDay() > 0 && d.getDay() < 6 && ((t >= 570 && t <= 690) || (t >= 780 && t <= 900))) loadIntraday(); }, 60000);

async function load(keepScroll) {
  try {
    const res = await fetch(API + '/api/v1/market/summary');
    const body = await res.json();
    if (!res.ok || body.error) throw new Error(body.error || res.status);
    const top = $('scroll').scrollTop;
    state.summary = body; state.tabs = {}; state.chg = {};
    renderMain();
    if (keepScroll) $('scroll').scrollTop = top;
    openTab(state.tab);
    loadChanges(state.chgMode); loadNotif(); loadIntraday();
    try { localStorage.setItem('market.lastSeen', String(Date.now())); } catch (err) { /* 隐私模式下没法记，忽略 */ }
  } catch (err) {
    $('mainBody').innerHTML = '<div style="color:#9E2A22">市场页没有取到：' + esc(err.message) + '</div>';
    $('status').textContent = '没有连上行情服务'; $('dot').style.background = '#D9483F';
  }
}
try { const seen = localStorage.getItem('market.lastSeen'); if (seen) { state.since = seen; state.chgMode = 'last'; } } catch (err) { /* 读不到就当第一次来 */ }
load(false);
</script>
</body>
</html>
