<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="stock-api-base" content="http://127.0.0.1:8090">
<title>A 股市场</title>
<style>
body{margin:0;background:#EEF0F3}
a{color:inherit}
button{font:inherit}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
.up{color:#B42318}.dn{color:#1E6B44}
.seg{display:flex;border:1px solid #DDE1E7;border-radius:8px;overflow:hidden}
.seg button{height:28px;padding:0 10px;white-space:nowrap;border:none;border-right:1px solid #DDE1E7;background:#FFFFFF;color:#3A4250;font-size:12px;cursor:pointer}
.seg button:last-child{border-right:none}
.seg button[aria-pressed="true"]{background:#14171F;color:#FFFFFF}
.mini{height:30px;padding:0 12px;border:1px solid #C9CED6;border-radius:6px;background:#FFFFFF;color:inherit;font-size:12px;cursor:pointer;white-space:nowrap}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.s{height:18px;padding:0 6px;font-size:10px;font-weight:600}
.age{display:inline-flex;align-items:center;height:16px;padding:0 5px;border-radius:4px;background:#EEF0F3;color:#4A5260;font-size:10px;font-weight:600;vertical-align:2px;white-space:nowrap}
.age.now{background:#EAF0FD;color:#1F3F8A}
.age.old{background:#FFF1D6;color:#7A4A00}
.t-good{background:#FDF0EF;color:#B42318}
.t-bad{background:#EDF7F1;color:#1E6B44}
.t-warn{background:#FFF1D6;color:#7A4A00}
.t-flat{background:#F1F2F4;color:#3A4250}
.t-blue{background:#EAF0FD;color:#1F3F8A}
.chip{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:6px;font-size:12px;white-space:nowrap}
.chip.good{background:#FDF0EF;color:#B42318}.chip.blue{background:#EAF0FD;color:#1F3F8A}.chip.warn{background:#FFF1D6;color:#7A4A00}.chip.bad{background:#EDF7F1;color:#1E6B44}.chip.flat{background:#F1F2F4;color:#3A4250}
.chip b{font-weight:600}.chip i{font-style:normal;font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:11px;opacity:.85}
.fchip{height:24px;padding:0 9px;border:1px solid #DDE1E7;border-radius:999px;background:#FFFFFF;color:#3A4250;font-size:12px;cursor:pointer}
.fchip[aria-pressed="true"]{background:#14171F;border-color:#14171F;color:#FFFFFF}
.srow{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,.9fr) minmax(0,.9fr) minmax(0,.7fr);gap:8px;align-items:center;padding:7px 2px;border-top:1px solid #F1F2F4;cursor:pointer;text-align:left;width:100%;border-left:none;border-right:none;border-bottom:none;background:transparent;font-size:12px;color:#14171F}
.srow:hover{background:#F7F8FA}
.sdetail{padding:6px 8px 10px;background:#F7F8FA;border-radius:8px;margin:2px 0 6px;font-size:12px;line-height:1.7;color:#3A4250}
.dtab{flex:none;height:44px;padding:0 8px;border:none;background:transparent;color:#5B6372;font-size:13px;cursor:pointer;white-space:nowrap}
.dtab:hover{color:#14171F}
.dtab[aria-selected="true"]{color:#2457D6;font-weight:600;box-shadow:inset 0 -2px 0 #2457D6}
.nav-a{width:48px;min-height:48px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#5B6372;text-decoration:none;font-size:11px}
.nav-a.on{color:#2457D6;background:#EAF0FD;font-weight:500}
.card{display:flex;flex-direction:column;gap:10px;padding:16px 18px;background:#FFFFFF;border:1px solid #E3E6EB;border-radius:14px}
.lv{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:11px;font-weight:600;color:#8A919E}
.link{border:none;background:transparent;padding:0;font-size:12px;color:#2457D6;cursor:pointer;white-space:nowrap}
.qa{display:grid;grid-template-columns:10px minmax(0,1fr);gap:10px;padding:9px 0;border-top:1px solid #F1F2F4}
.qa .dot{width:10px;height:10px;margin-top:5px;border-radius:50%}
.qab{display:flex;flex-direction:column;gap:8px;padding:14px 0 4px;border-top:1px solid #EEF0F3}
.qab:first-child{border-top:none;padding-top:2px}
.qab-h{display:flex;align-items:baseline;gap:8px}
.qab-h span{font-size:12px;color:#8A919E}
.qab-h b{margin-left:auto;font-size:16px;font-weight:700;letter-spacing:-0.01em}
.qab-note{margin:0;font-size:11px;line-height:1.55;color:#8A919E}
.strip{display:grid}
.strip .meter{padding:0 10px;background:transparent;border-radius:0;border-left:1px solid #EEF0F3}
.strip .meter:first-child{padding-left:0;border-left:none}
.meter{display:flex;flex-direction:column;gap:1px;min-width:0}
.meter span{font-size:11px;color:#8A919E;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter b{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:15px;font-weight:650;line-height:1.25;white-space:nowrap}
.meter i{font-style:normal;font-size:11px;white-space:nowrap}
.meter.good b,.meter.good i{color:#B42318}
.meter.bad b,.meter.bad i{color:#1E6B44}
.meter.flat b{color:#14171F}
.meter.flat i{color:#8A919E}
.kv{display:grid;grid-template-columns:1fr 1fr;column-gap:22px}
.kv .meter{flex-direction:row;align-items:baseline;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid #F4F5F7}
.kv .meter:last-child:nth-child(odd){grid-column:1 / -1}
.kv .meter b{font-size:13px;font-weight:600}
.qx{display:grid;grid-template-columns:1fr 1fr}
.qc{min-width:0;padding:12px 0 2px}
.qc:nth-child(odd){padding-right:16px;border-right:1px solid #EEF0F3}
.qc:nth-child(even){padding-left:16px}
.qc:nth-child(-n+2){border-bottom:1px solid #EEF0F3;padding-bottom:12px}
.qh{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.qh b{font-size:13px;font-weight:700;letter-spacing:0.01em}
.qh span{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:12px;font-weight:600}
.qr{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:3px 0;font-size:13px;color:#14171F}
.qr b{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:12px;font-weight:600}
.qx.pulse{border-top:1px solid #EEF0F3;margin-top:4px}
.qx.pulse .qc{border-bottom:none;padding-top:12px}
.note{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-radius:10px;background:#F7F8FA}
.scope{margin-top:auto;display:flex;align-items:center;gap:8px;padding-top:8px;border-top:1px solid #F1F2F4;font-size:11px;color:#8A919E}
.sig{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border:1px solid #E3E6EB;border-radius:10px;background:#FFFFFF;text-align:left;cursor:pointer;min-width:0}
.stat{display:flex;flex-direction:column;gap:2px;padding:4px 2px;border-radius:6px;min-width:0}
.stat.on{background:#F1F2F4;box-shadow:inset 0 0 0 1px #C9CED6}
.stat span{font-size:10px;color:#8A919E;white-space:nowrap}
.stat b{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:12px;white-space:nowrap}
.stats{grid-column:1 / -1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;width:100%;min-width:0}
.blk>button{display:grid;grid-template-columns:minmax(0,1fr) auto 12px;align-items:start;gap:8px;width:100%;padding:12px 2px;border:none;background:transparent;color:#14171F;text-align:left;cursor:pointer}
.blk>button>.judge{grid-column:2;grid-row:1;margin-top:22px}
.blk>button>.blk-chev{grid-column:3;grid-row:1;margin-top:26px}
#drawerBody{padding:14px 18px 24px;box-sizing:border-box}
#aside{overflow-x:hidden}
.dw{flex:0 0 384px;width:384px}
@media (min-width:1400px){.dw{flex-basis:422px;width:422px}}
table.tb{width:100%;border-collapse:collapse;table-layout:fixed}
table.tb th{padding:6px 2px;font-size:11px;font-weight:500;color:#8A919E;text-align:right;white-space:nowrap}
table.tb th:first-child,table.tb th.l{text-align:left}
table.tb td{padding:8px 2px;border-top:1px solid #F1F2F4;text-align:right;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.tb td:first-child,table.tb td.l{text-align:left}
table.tb tr.grp td{background:#F7F8FA;text-align:left;padding:8px 6px;border-top:1px solid #E3E6EB}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid #F1F2F4}
.skeleton{color:#8A919E;padding:24px 0}
.chart{position:relative;cursor:crosshair}
.chart-line{position:absolute;top:0;bottom:0;width:1px;background:#2457D6;pointer-events:none}
.chart-tip{position:absolute;top:6px;z-index:3;transform:translateX(-50%);padding:3px 8px;border-radius:6px;background:#14171F;color:#FFFFFF;font-size:11px;line-height:1.4;white-space:nowrap;pointer-events:none}
</style>
</head>
<body>
<div style="height:100vh;overflow:hidden;display:flex;flex-direction:column;background:#EEF0F3;font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif;color:#14171F;font-size:13px;line-height:1.55">

</div>
</div>

<div style="flex:1 1 auto;display:flex;flex-wrap:nowrap;align-items:stretch;min-width:0;min-height:0;overflow:hidden">
<nav aria-label="主导航" style="flex:0 0 64px;overflow:hidden;background:#FFFFFF;border-right:1px solid #DDE1E7;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 0">
<a class="nav-a on" href="/market.html" aria-current="page"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20h18"></path><path d="M5 16l4-5 4 3 6-7"></path></svg>市场</a>
<a class="nav-a" href="#"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"></rect><path d="M8 10h8M8 14h5"></path></svg>扫描</a>
<a class="nav-a" href="/"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-4.5-4.5"></path></svg>诊断</a>
<a class="nav-a" href="#"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"></path></svg>战绩</a>

<main style="flex:999 1 640px;min-width:0;display:flex;flex-direction:column;overflow:hidden;position:relative">
<div aria-label="市场" style="position:relative;z-index:5;flex:none;padding:10px 28px;background:#FFFFFF;border-bottom:1px solid #DDE1E7">
<div style="max-width:1240px">
<div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;min-height:34px;white-space:nowrap">
<h1 style="flex:none;margin:0;font-size:20px;font-weight:700">A 股市场</h1>
<span id="headIndexes" style="flex:none;font-size:12px;color:#5B6372">正在取指数…</span>
<span style="width:1px;height:20px;background:#DDE1E7"></span>
<span style="display:flex;align-items:center;gap:10px;font-size:12px;color:#5B6372"><span style="color:#8A919E">时间基准</span><span id="headTime"></span></span>
<span style="flex:1"></span>
<button type="button" class="mini" id="dictBtn">状态说明</button>
<button type="button" class="mini" id="notifyBtn" style="color:#2457D6;border-color:#2457D6">🔔 通知我</button>
</div>
</div>
<div id="dict" role="dialog" aria-label="状态说明" hidden style="position:absolute;right:28px;top:calc(100% - 4px);z-index:30;width:420px;padding:14px 16px;background:#FFFFFF;border:1px solid #C9CED6;border-radius:12px;box-shadow:0 12px 32px rgba(20,23,31,0.16);flex-direction:column;gap:10px;white-space:normal">
<b style="font-size:14px">状态说明 · 全页统一</b>
<div style="display:flex;flex-direction:column;gap:6px;font-size:13px"><span style="font-size:12px;color:#8A919E">信号三档（①②③ 和总档位）</span>
<span><span class="pill s t-good">顺</span> 利于做多　<span class="pill s t-flat">平</span> 看不出方向　<span class="pill s t-bad">逆</span> 不利</span></div>
<div style="display:flex;flex-direction:column;gap:6px;font-size:13px"><span style="font-size:12px;color:#8A919E">板块四类</span>
<span><span class="pill s t-good">三层同向</span> 钱、热度、杠杆同向</span>
<span><span class="pill s t-good">有钱没热度</span> 钱在进，热度或杠杆没跟上</span>
<span><span class="pill s t-warn">只热不增</span> 情绪驱动，可交易不可持有</span>
<span><span class="pill s t-bad">在流出</span> 增量为负</span></div>
<div style="display:flex;flex-direction:column;gap:6px;font-size:13px"><span style="font-size:12px;color:#8A919E">数据龄</span>
<span><span class="age now">今日</span> 当日　<span class="age">昨日</span> T+1　<span class="age old">上月</span> 月频　涨红跌绿</span></div>
</div>
</div>
<div id="notify" role="dialog" aria-label="通知我" hidden style="position:absolute;right:28px;top:56px;z-index:30;width:440px;max-height:calc(100% - 70px);overflow-y:auto;padding:14px 16px;background:#FFFFFF;border:1px solid #C9CED6;border-radius:12px;box-shadow:0 12px 32px rgba(20,23,31,0.16);flex-direction:column;gap:10px;white-space:normal"></div>
<div id="history" role="dialog" aria-label="历次结论" hidden style="position:absolute;left:28px;top:90px;z-index:30;width:520px;max-height:calc(100% - 110px);overflow-y:auto;padding:14px 16px;background:#FFFFFF;border:1px solid #C9CED6;border-radius:12px;box-shadow:0 12px 32px rgba(20,23,31,0.16);flex-direction:column;gap:6px;white-space:normal"></div>

</div>

<span style="display:flex;align-items:center;gap:6px"><span id="dot" style="width:7px;height:7px;border-radius:50%;background:#A1A7B2"></span><span id="status">正在连接</span></span>

<div id="srchList" style="padding:6px;max-height:360px;overflow-y:auto"></div>
<div style="display:flex;gap:16px;padding:9px 16px;border-top:1px solid #EEF0F3;background:#F7F8FA;font-size:12px;color:#5B6372"><span>↑↓ 选择</span><span>Enter 加入自选</span><span style="margin-left:auto">Esc 关闭</span></div>
</div>
<script>
const API = (new URLSearchParams(location.search).get('stockApi') || (document.querySelector('meta[name="stock-api-base"]') || {}).content || 'http://127.0.0.1:8090').replace(/\/$/, '');
const TABS = [['fund', '市场资金'], ['team', '国家队'], ['sector', '板块'], ['mood', '好不好做'], ['cal', '日历'], ['macro', '宏观']];
const state = { summary: null, tab: 'fund', tabs: {}, loading: {}, open: {}, window: '5', hits: [], pick: 0, etf: null, etfDays: 60, etfs: {}, chg: {}, chgMode: 'today', since: null, notif: false, nData: null, nTab: 'all', settings: null, channel: '', intraday: null, history: null };

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (id) => document.getElementById(id);
const DOT = { good: '#D9483F', bad: '#2E8B57', warn: '#E0A030', flat: '#A1A7B2' };
const MONO = 'class="mono"';

function pillT(text, tone, big) { return '<span class="pill ' + (big ? '' : 's ') + 't-' + (tone || 'flat') + '">' + esc(text) + '</span>'; }
function age(text) {
  if (!text) return '';
  const cls = text === '今日' ? 'now' : /^(上月|上周|上季|暂定|近 3 年|月频)$/.test(text) ? 'old' : '';
  return '<span class="age ' + cls + '">' + esc(text) + '</span>';
}
function pct(v, d) { if (v == null || v !== v) return '—'; return (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v * 100).toFixed(d == null ? 1 : d) + '%'; }
function yi(v, signed) {
  if (v == null || v !== v) return '—';

function barsSvg(points, opts) {

    if (signed) {
      const h = Math.abs(v) / max * (H / 2 - 4), y = v >= 0 ? H / 2 - h : H / 2;
      out += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(h, 0.5).toFixed(1) + '" fill="' + color + '"></rect>';
    } else {
      const h = v / max * (H - 6);

function weeksSvg(points) {

function etfSvg(points) {

function tipAt(spec, ratio) {

    return best ? best.t + '  今天 ' + yi(best.today) + '  昨天 ' + yi(best.yesterday) + '  前几日平均 ' + yi(best.avg) : '';
  }
  const tips = spec.tips || [];
  if (!tips.length) return '';
  const i = Math.min(tips.length - 1, Math.max(0, Math.floor(Math.max(0, Math.min(0.999, ratio)) * tips.length)));

    if (line) line.hidden = true;
  });
  if (!host) return;
  const spec = chartTips[Number(host.dataset.chart)];
  const rect = host.getBoundingClientRect();
  const ratio = rect.width ? (e.clientX - rect.left) / rect.width : 0;
  const text = tipAt(spec, ratio);
  const tip = host.querySelector('.chart-tip'), line = host.querySelector('.chart-line');
  if (!text || !tip) return;
  tip.hidden = false;
  tip.textContent = text;
  const width = tip.offsetWidth;
  const x = Math.max(width / 2 + 4, Math.min(rect.width - width / 2 - 4, e.clientX - rect.left));

  if (line) { line.hidden = false; line.style.left = (e.clientX - rect.left) + 'px'; }

}
function renderNotif() {
  const aside = $('aside'); aside.style.flex = ''; aside.style.width = '';
  const d = state.nData, tab = state.nTab;
  const tabs = [['all', '全部'], ['remind', '提醒'], ['change', '判断变化']];
  $('drawerTabs').innerHTML = '<div style="flex:1;display:flex;flex-direction:column"><div style="display:flex;align-items:center;gap:12px;padding:14px 0 0 8px"><span style="font-size:16px;font-weight:700">通知</span><button type="button" class="link" data-nread="1" style="margin-left:auto">全部已读</button><button type="button" data-nclose="1" aria-label="关闭" style="width:28px;height:28px;border:none;border-radius:6px;background:transparent;color:#5B6372;font-size:18px;cursor:pointer">×</button></div>' +
    '<div style="display:flex;padding:0 0">' + tabs.map(([k, n]) => '<button type="button" class="dtab" aria-selected="' + (tab === k) + '" data-ntabbtn="' + k + '">' + n + '</button>').join('') + '</div></div>';
  if (!d) { $('drawerBody').innerHTML = '<div class="skeleton">正在取通知…</div>'; return; }
  const label = (t) => '<span style="display:block;padding:10px 16px 2px 32px;font-size:11px;font-weight:600;color:#8A919E">' + t + '</span>';
  let html = '';
  if (tab !== 'remind') d.groups.forEach((g) => { html += label(g.title) + g.items.map(nItem).join(''); });
  if (tab !== 'change' && d.upcoming.length) html += label('即将发生') + d.upcoming.map((u) => nItem({ kind: '提醒', title: u.title, text: u.when + ' ' + u.weekday, tab: u.tab, time: '', unread: false })).join('');
  if (!html) html = '<div class="skeleton" style="padding:24px 16px">' + (tab === 'remind' ? '近两周没有涉及自选的事件。' : '还没有通知。结论、闸门、资金或自选所在板块变化时，这里会出现。') + '</div>';
  $('drawerBody').style.padding = '0 0 12px';
  $('drawerBody').innerHTML = html + '<div style="display:flex;align-items:center;gap:12px;margin-top:12px;padding:12px 20px;border-top:1px solid #EEF0F3;background:#F7F8FA;font-size:12px;color:#5B6372"><span>' + esc(d.channel) + '</span><button type="button" class="link" data-opennotify="1" style="margin-left:auto">通知设置</button></div>';
}
function closeNotif() { state.notif = false; $('drawerBody').style.padding = ''; updateBell(); renderDrawer(); }
async function markRead(ids) {
  try {
    const res = await fetch(API + '/api/v1/market/notifications/read', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(ids ? { ids } : {}) });
    const body = await res.json();
    if (state.nData) { state.nData.unread = body.unread; state.nData.groups.forEach((g) => g.items.forEach((i) => { if (!ids || ids.includes(i.id)) i.unread = false; })); }
  } catch (err) { /* 已读标记失败不影响看通知 */ }
  updateBell();
}

/* ---------- 通知我 ---------- */
const SET_ROWS = [
  ['结论', [['level', '档位变化', '中性 → 顺风 / 逆风，或三个信号变档'], ['gate', '闸门变化', '不过 → 通过，或反过来']]],
  ['资金与国家队', [['etf_streak', '宽基 ETF 连续 N 日净增 / 净减', ''], ['margin_turn', '两融止跌回升', ''], ['team', '国家队出手，或可能在卖', '']]],
  ['板块与自选', [['watch_sector', '我的自选所在板块结论变化', '如 只热不增 → 三层同向']]],
  ['简报', [['brief_pre', '每个交易日 08:30 盘前简报', ''], ['brief_close', '收盘后 15:35 复盘', '']]],
];
function renderNotify() {
  const st = state.settings;
  const box = $('notify');
  if (!st) { box.innerHTML = '<div class="skeleton">正在取设置…</div>'; return; }
  const sw = (key) => '<input type="checkbox" data-set="' + key + '"' + (st[key] ? ' checked' : '') + ' style="width:16px;height:16px;accent-color:#2457D6;cursor:pointer">';
  const rows = SET_ROWS.map(([title, items]) => '<div style="display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:1px solid #F1F2F4"><span style="font-size:12px;font-weight:700;color:#5B6372">' + title + '</span>' +
    items.map(([k, n, hint]) => '<label style="display:flex;align-items:center;gap:10px;font-size:13px;cursor:pointer"><span style="flex:1;display:flex;flex-direction:column"><span>' + n + (k === 'etf_streak' ? ' <select data-setnum="etf_n" style="font:inherit;font-size:12px;margin-left:4px">' + [3, 4, 5, 6, 7, 8, 9, 10].map((x) => '<option' + (x === st.etf_n ? ' selected' : '') + '>' + x + '</option>').join('') + '</select> 日' : '') + '</span>' + (hint ? '<span style="font-size:11px;color:#8A919E">' + hint + '</span>' : '') + '</span>' + sw(k) + '</label>').join('') + '</div>').join('');
  const level = state.summary ? state.summary.conclusion.level + (state.summary.conclusion.tilt || '') : '中性';
  box.innerHTML = '<div style="display:flex;align-items:center"><b style="font-size:14px">通知我 · 市场</b><button type="button" data-closenotify="1" style="margin-left:auto;border:none;background:transparent;font-size:18px;color:#5B6372;cursor:pointer">×</button></div>' +
    '<span style="font-size:12px;color:#5B6372">只推状态变化，数字小幅波动不推</span>' +
    '<label style="display:flex;align-items:center;gap:10px;font-size:13px;cursor:pointer"><span style="flex:1"><b>推送到外部渠道</b><br><span style="font-size:11px;color:#8A919E">' + esc(state.channel) + '</span></span>' + sw('push') + '</label>' + rows +
    '<div style="display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:1px solid #F1F2F4"><span style="font-size:12px;font-weight:700;color:#5B6372">推送预览</span><div style="display:flex;gap:10px;padding:10px 12px;border-radius:12px;background:#F3F4F6"><span style="flex:none;width:28px;height:28px;border-radius:8px;background:#2457D6;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px">市</span><span style="display:flex;flex-direction:column;gap:2px;font-size:12px;color:#3A4250"><b style="font-size:13px;color:#14171F">市场 · 宽基 ETF 连续 ' + st.etf_n + ' 日净流出</b><span>第 ' + st.etf_n + ' 天。档位目前是' + esc(level) + '，点开看影响了哪些板块。</span></span></div></div>' +
    '<div style="font-size:11px;color:#8A919E;line-height:1.6">同一件事同一天只推一次。「有效期到期提醒」「新热点」这一期没做，所以不在这里。</div>';
}
async function toggleNotify() {
  const box = $('notify');
  if (!box.hidden) { box.hidden = true; box.style.display = 'none'; return; }
  $('dict').hidden = true; $('dict').style.display = 'none';
  box.hidden = false; box.style.display = 'flex';
  if (!state.settings) {
    renderNotify();
    try { const body = await (await fetch(API + '/api/v1/market/settings')).json(); state.settings = body.settings; state.channel = body.channel; } catch (err) { box.innerHTML = '<div class="skeleton">设置没有取到。</div>'; return; }
  }
  renderNotify();
}
async function putSetting(key, value) {
  state.settings = Object.assign({}, state.settings, { [key]: value });
  try {
    const res = await fetch(API + '/api/v1/market/settings', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ [key]: value }) });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || res.status);
    state.settings = body.settings;
  } catch (err) { /* 保存失败时界面保持用户刚选的，刷新后以服务端为准 */ }
  renderNotify();
}

/* ---------- 历次结论 ---------- */
async function toggleHistory() {
  const box = $('history');
  if (!box.hidden) { box.hidden = true; box.style.display = 'none'; return; }
  $('notify').hidden = true; $('notify').style.display = 'none'; $('dict').hidden = true; $('dict').style.display = 'none';
  box.hidden = false; box.style.display = 'flex';
  box.innerHTML = '<div class="skeleton">正在取历次结论…</div>';
  try { state.history = (await (await fetch(API + '/api/v1/market/history')).json()).rows; } catch (err) { box.innerHTML = '<div class="skeleton">没有取到。</div>'; return; }
  const tone = { 顺风: 't-good', 逆风: 't-bad' };
  box.innerHTML = '<div style="display:flex;align-items:center"><b style="font-size:14px">历次结论</b><button type="button" data-closehistory="1" style="margin-left:auto;border:none;background:transparent;font-size:18px;color:#5B6372;cursor:pointer">×</button></div>' +
    '<span style="font-size:12px;color:#8A919E">连续相同的档位合成一行。快照从第一次打开这一页起才有。</span>' +
    state.history.map((r) => '<div style="display:flex;flex-direction:column;gap:3px;padding:10px 0;border-top:1px solid #F1F2F4"><div style="display:flex;align-items:center;gap:8px"><span class="pill ' + (tone[r.level] || 't-warn') + '">' + esc(r.text) + '</span><span ' + MONO + ' style="font-size:12px;color:#5B6372">' + esc(r.since.slice(5)) + (r.until !== r.since ? ' → ' + esc(r.until.slice(5)) : '') + ' · ' + r.days + ' 个交易日</span></div><span style="font-size:12px;color:#5B6372">' + esc(r.headline) + '</span></div>').join('');
}

/* ---------- 盘中 ---------- */
async function loadIntraday() {
  try {
    const body = await (await fetch(API + '/api/v1/market/intraday')).json();
    state.intraday = body;
  } catch (err) { return; }
  if (state.summary) { const top = $('scroll').scrollTop; renderMain(); $('scroll').scrollTop = top; }
  if (!state.notif && !state.etf) renderDrawer();
}
setInterval(() => { const d = new Date(), t = d.getHours() * 60 + d.getMinutes(); if (d.getDay() > 0 && d.getDay() < 6 && ((t >= 570 && t <= 690) || (t >= 780 && t <= 900))) loadIntraday(); }, 60000);

async function load(keepScroll) {
  try {
    const res = await fetch(API + '/api/v1/market/summary');
    const body = await res.json();
    if (!res.ok || body.error) throw new Error(body.error || res.status);
    const top = $('scroll').scrollTop;
    state.summary = body; state.tabs = {}; state.chg = {};
    renderMain();
    if (keepScroll) $('scroll').scrollTop = top;
    openTab(state.tab);
    loadChanges(state.chgMode); loadNotif(); loadIntraday();
    try { localStorage.setItem('market.lastSeen', String(Date.now())); } catch (err) { /* 隐私模式下没法记，忽略 */ }
  } catch (err) {
    $('mainBody').innerHTML = '<div style="color:#9E2A22">市场页没有取到：' + esc(err.message) + '</div>';
    $('status').textContent = '没有连上行情服务'; $('dot').style.background = '#D9483F';
  }
}
try { const seen = localStorage.getItem('market.lastSeen'); if (seen) { state.since = seen; state.chgMode = 'last'; } } catch (err) { /* 读不到就当第一次来 */ }
load(false);
</script>
</body>
