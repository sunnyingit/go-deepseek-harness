                    if (e.key === 'Enter') { e.preventDefault(); submitOther(); }
                });
                otherSend.addEventListener('click', submitOther);
                other.appendChild(otherIcon);
                other.appendChild(otherInput);
                other.appendChild(otherSend);
                optionsWrap.appendChild(other);
                card.appendChild(optionsWrap);

                const footer = document.createElement('div');
                footer.className = 'elicit-footer';
                const skipBtn = document.createElement('button');
                skipBtn.type = 'button';
                skipBtn.className = 'elicit-skip';
                skipBtn.textContent = '跳过';
                skipBtn.addEventListener('click', () => resolveElicitCard(card, callId, '', null, true));
                footer.appendChild(skipBtn);
                card.appendChild(footer);

                const summary = document.createElement('div');
                summary.className = 'elicit-resolved-summary';
                card.appendChild(summary);

                textEl.appendChild(card);
                if (callId) activeElicitCards.set(callId, { card, options });
                this.maybeScroll();
            }

            updateMetadata(data) {
                const msgEl = this.currentMessageEl;
                if (msgEl) {
                    const metaEl = msgEl.querySelector('.msg-meta');
                    if (metaEl) {
                        const model = data.model ? ` · ${data.model}` : '';
                        metaEl.textContent = `PABuddy AI${model} · 生成中...`;
                    }
                }
            }

            finishStream(data) {
                data = data || {};
                this.hideWaiting();
                this.flushStream(true);
                this.isStreaming = false;
                this.paintMarkdown(false);
                setComposerMode('idle');
                const elapsed = streamStartedAt ? (Date.now() - streamStartedAt) : 0;
                const durationMs = Number(data.durationMs || data.duration) || elapsed;
                const msgEl = this.currentMessageEl;
                if (msgEl) {
                    msgEl.querySelectorAll('.tool-block.is-running').forEach((block) => {
                        const text = data.failed ? '失败' : (data.stopped ? (data.stillRunning ? '后台继续中' : '已停止') : '完成');
                        settleToolBlock(block, text);
                    });
                    const metaEl = msgEl.querySelector('.msg-meta');
                    if (metaEl) {
                        // stillRunning：8 秒内没等到服务端真正确认停止，独占型工具
                        // 调用中途是不会被打断的（见 shell/toolbash），所以老实说明
                        // 可能还在后台继续，而不是显示一个可能是假的"已停止"——回到
                        // 这个会话时会自动把结果接上。failed：turn
                        // 真的以出错收尾（模型请求重试耗尽、工具调用出错等），不是
                        // 连接层面的问题——连接层面的断线由 startRealStream 自己的
                        // 重连逻辑处理，不会走到这里。
                        metaEl.textContent = data.failed
                            ? 'PABuddy AI · 生成失败'
                            : (data.stopped
                                ? (data.stillRunning ? 'PABuddy AI · 已停止观察，可能仍在后台继续' : 'PABuddy AI · 已停止生成')
                                : 'PABuddy AI · 已完成');
                    }
                    if (data.failed) {
                        const textEl = msgEl.querySelector('.msg-text');
                        if (textEl) {
                            textEl.appendChild(buildTurnFailureCard(data));
                        }
                    }
                    paintMessageUsage(msgEl, data.usage, durationMs);
                    if (!data.usage) {
                        fetchSessionUsage().then((usage) => {
                            if (usage) paintMessageUsage(msgEl, usage, durationMs);
                        });
                    }
                    refreshChatUsage(data.usage);
                    const thinking = msgEl.querySelector('.thinking-process.stream');
                    if (thinking) {
                        thinking.open = false;
                        const summary = thinking.querySelector('summary');
                        if (summary) summary.textContent = '💭 思考完成';
                    }
                    const bubble = msgEl.querySelector('.msg-bubble');
                    const textEl = bubble ? bubble.querySelector('.msg-text') : null;
                    const actions = {
                        getCopyText: () => textEl ? textEl.textContent : '',
                    };
                    // 输出被截断、或历史里已经有未回复的 tool_calls 时，重试只会
                    // 再发同一段非法前缀，不会修好。引导开新会话，不要再给重试。
                    if (!needsNewSession(data)) {
                        actions.getRetryText = () => precedingUserText(msgEl);
                        actions.retryLabel = '重新生成';
                    }
                    addMessageActions(bubble, actions);
                }
                this.currentMessageEl = null;
                this.streamEl = null;
                this.toolEls = new Map();
            }

            handleError(data) {
                this.hideWaiting();
                this.flushStream(true);
                this.isStreaming = false;
                this.paintMarkdown(false);
                setComposerMode('idle');
                const msgEl = this.getOrCreateMessage();
                const textEl = msgEl.querySelector('.msg-text');

                const wrap = document.createElement('div');
                wrap.style.cssText = 'background:#fef0ee;border-radius:8px;padding:10px 14px;border-left:3px solid #e8684a;margin:4px 0;';
                const title = document.createElement('div');
                title.style.cssText = 'font-weight:600;color:#e8684a;';
                title.textContent = '❌ ' + (data.message || '发生错误');
                wrap.appendChild(title);
                if (data.details) {
                    const details = document.createElement('div');
                    details.style.cssText = 'font-size:13px;color:#6b7a8f;margin-top:4px;';
                    details.textContent = data.details;
                    wrap.appendChild(details);
                }
                if (data.suggestion) {
                    const hint = document.createElement('div');
                    hint.style.cssText = 'font-size:13px;color:#f97316;margin-top:4px;';
                    hint.textContent = '💡 ' + data.suggestion;
                    wrap.appendChild(hint);
                }
                textEl.appendChild(wrap);
                this.maybeScroll();
            }

            reset() {
                this.flushStream(true);
                this.isStreaming = false;
                this.paintMarkdown(false);
                this.currentMessageEl = null;
                this.buffer = '';
                this.textQueue = '';
                this.streamEl = null;
                this.toolEls = new Map();
                this.stickToBottom = true;
            }
        }

        // ============================================================
        // 4. 全局变量和UI控制
        // ============================================================
        const container = document.getElementById('messagesContainer');
        const protocolHandler = new StreamProtocolHandler();
        container.addEventListener('scroll', () => {
            const gap = container.scrollHeight - container.scrollTop - container.clientHeight;
            protocolHandler.stickToBottom = gap < 72;
        });

        // Toast
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');
        let toastTimer = null;
        window.showToast = function(msg, icon = 'fa-check-circle', duration = 2500) {
            toastMsg.textContent = msg;
            toast.querySelector('i').className = `fas ${icon}`;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), duration);
        };

        // 预览控制
        const mainGrid = document.getElementById('mainGrid');
        const rightPanel = document.getElementById('rightPanel');
        const emptyState = document.getElementById('emptyState');
        const previewCard = document.getElementById('previewCard');
        const previewFileName = document.getElementById('previewFileName');
        const previewIcon = document.getElementById('previewIcon');
        const previewMeta = document.getElementById('previewMeta');
        const previewBody = document.getElementById('previewBody');
        const previewClose = document.getElementById('previewClose');

        function openPanel() {
            mainGrid.classList.add('panel-open');
        }

        function closePanel() {
            mainGrid.classList.remove('panel-open');
            emptyState.style.display = 'flex';
            previewCard.classList.remove('active');
        }

        previewClose.addEventListener('click', closePanel);

        // ============================================================
        // 工作区文件：真实数据源 GET /sessions/{id}/files（列表）+
        // GET /sessions/{id}/files/{path...}（下载 ?download=1 / 内联预览），
        // 以及 GET /sessions/{id}/stream 的 "file" SSE 事件（模型这一轮在工作区
        // 新建/修改了哪些文件，由后端对比工作区快照算出，见 emitFileEvents）。
        // ============================================================
        const FILE_ICON_BY_EXT = {
        csv: 'fa-file-csv', xlsx: 'fa-file-excel', xls: 'fa-file-excel', xlsm: 'fa-file-excel',
            pdf: 'fa-file-pdf', doc: 'fa-file-word', docx: 'fa-file-word',
            ppt: 'fa-file-powerpoint', pptx: 'fa-file-powerpoint',
            png: 'fa-file-image', jpg: 'fa-file-image', jpeg: 'fa-file-image',
            gif: 'fa-file-image', svg: 'fa-file-image', webp: 'fa-file-image',
            py: 'fa-file-code', js: 'fa-file-code', ts: 'fa-file-code', json: 'fa-file-code',
            html: 'fa-globe', htm: 'fa-globe', css: 'fa-file-code', sh: 'fa-file-code', yaml: 'fa-file-code', yml: 'fa-file-code',
            md: 'fa-file-alt', txt: 'fa-file-alt', log: 'fa-file-alt',
            zip: 'fa-file-archive', tar: 'fa-file-archive', gz: 'fa-file-archive'
        };
        const TEXT_PREVIEW_EXT = new Set(['csv', 'json', 'log', 'md', 'py', 'js', 'ts', 'css', 'sh', 'yaml', 'yml', 'txt', 'xml']);
        const IMAGE_PREVIEW_EXT = new Set(['png', 'jpg', 'jpeg', 'gif', 'svg', 'webp']);
        const HTML_PREVIEW_EXT = new Set(['html', 'htm']);
        const MAX_TEXT_PREVIEW_BYTES = 2 * 1024 * 1024;

        function extOf(name) {
            const idx = name.lastIndexOf('.');
            return idx === -1 ? '' : name.slice(idx + 1).toLowerCase();
        }

        function fileIcon(name) {
            return FILE_ICON_BY_EXT[extOf(name)] || 'fa-file';
        }

        const CHAT_FILE_EXT = new Set([
            'xlsx', 'xls', 'xlsm', 'csv', 'pptx', 'ppt', 'pptm', 'pdf', 'doc', 'docx',
            'html', 'htm', 'png', 'jpg', 'jpeg', 'gif', 'webp', 'svg', 'md', 'txt'
        ]);

        function isChatFile(file) {
            if (!file) return false;
            if (file.source === 'upload') return true;
            return CHAT_FILE_EXT.has(extOf(file.name || file.path || ''));
        }

        function sortFilesForList(files) {
            const rank = (f) => {
                if (isChatFile(f)) return 0;
                return 1;
            };
            return (files || []).slice().sort((a, b) => {
                const d = rank(a) - rank(b);
                if (d) return d;
                return String(b.modTime || '').localeCompare(String(a.modTime || ''));
            });
        }

        function fileCardAlreadyShown(path) {
            if (!path) return false;
            return [...document.querySelectorAll('.file-link')].some((el) => el.title === path);
        }

        // SSE "file" events are not stored in the message log, so reopening a
        // session used to replay text only. Re-attach workspace files into the
        // transcript (and the right-hand list already comes from GET .../files).
        function restoreFileCards(files) {
            const pending = sortFilesForList(files).filter((f) => isChatFile(f) && !fileCardAlreadyShown(f.path));
            pending.slice(0, 24).forEach((f) => {
                protocolHandler.dispatch({ type: 'file', content: f });
            });
        }

        function formatSize(bytes) {
            if (!bytes) return '0 B';
            if (bytes < 1024) return `${bytes} B`;
            if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
            return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
        }

        function timeAgo(iso) {
            const mins = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
            if (mins < 1) return '刚刚';
            if (mins < 60) return `${mins}min`;
            const hrs = Math.floor(mins / 60);
            if (hrs < 24) return `${hrs}h`;
            return `${Math.floor(hrs / 24)}d`;
        }

        function fileUrl(path, download) {
            const encoded = path.split('/').map(encodeURIComponent).join('/');
            const base = `/sessions/${encodeURIComponent(currentSessionId)}/files/${encoded}`;
            return download ? `${base}?download=1` : base;
        }

        async function fetchWorkspaceFiles() {
            if (!currentSessionId) return [];
            try {
                const res = await fetch(`/sessions/${encodeURIComponent(currentSessionId)}/files`);
                if (!res.ok) return [];
                return await res.json() || [];
            } catch (e) {
                return [];
            }
        }

        // GET /sessions/{id}/files — 会话工作区里当前所有文件（模型通过
        // write/edit/bash/run_python 生成的，不只是用户上传的）。
        async function refreshFileList() {
            renderFileList(await fetchWorkspaceFiles());
        }

        function renderFileList(files) {
            const list = document.getElementById('recentFilesList');
            if (!list) return;
            list.innerHTML = '';
            const shown = sortFilesForList(files || []);
            if (!shown.length) {
                list.innerHTML = '<div style="font-size:12px;color:#9aa7b9;padding:4px 10px;">暂无生成的文件</div>';
                return;
            }
            shown.forEach(f => {
                const item = document.createElement('div');
                item.className = 'recent-item';
                item.title = f.path;
                item.innerHTML = `<i class="fas ${fileIcon(f.name)}"></i> ${f.name} <span class="time">${timeAgo(f.modTime)}</span>`;
                item.addEventListener('click', () => openFilePreview(f));
                list.appendChild(item);
            });
        }

        // 下载：走真实的 GET .../files/{path}?download=1，用一次性 <a download>
        // 触发浏览器原生下载，不经过 fetch/blob。
        function downloadWorkspaceFile(file) {
            const a = document.createElement('a');
            a.href = fileUrl(file.path, true);
            a.download = file.name;
            document.body.appendChild(a);
            a.click();
            a.remove();
            showToast(`📥 正在下载 ${file.name}...`, 'fa-download');
        }

        // 预览：HTML 用沙箱 iframe 真正渲染页面（不再当源码展示），图片
        // 直接 <img>，PDF 用 <iframe>，文本类读取内容渲染（CSV 复用已有的
        // csv-table 样式），其余类型只提示下载。
        async function openFilePreview(file) {
            openPanel();
            emptyState.style.display = 'none';
            previewCard.classList.add('active');

            previewFileName.textContent = file.name;
            previewIcon.className = `fas ${fileIcon(file.name)}`;
            previewMeta.innerHTML = `
                <span><i class="fas fa-weight"></i> ${formatSize(file.size)}</span>
                <span><i class="fas fa-calendar"></i> ${new Date(file.modTime).toLocaleString()}</span>
            `;

            const ext = extOf(file.name);
            const url = fileUrl(file.path, false);
            let textContent = null;
            previewBody.classList.remove('is-frame');
            previewBody.replaceChildren();

            if (HTML_PREVIEW_EXT.has(ext)) {
                previewBody.classList.add('is-frame');
                const iframe = document.createElement('iframe');
                iframe.title = file.name;
                iframe.setAttribute('sandbox', 'allow-scripts allow-forms allow-modals allow-popups');
                iframe.src = url;
                previewBody.appendChild(iframe);
                try {
                    const res = await fetch(url);
                    if (res.ok) textContent = await res.text();
                } catch (e) { /* copy 不可用时按钮会提示 */ }
            } else if (IMAGE_PREVIEW_EXT.has(ext)) {
                previewBody.classList.add('is-frame');
                const img = document.createElement('img');
                img.src = url;
                img.alt = file.name;
                previewBody.appendChild(img);
            } else if (ext === 'pdf' || ext === 'ppt' || ext === 'pptx' || ext === 'pptm' || ext === 'xls' || ext === 'xlsx' || ext === 'xlsm') {
                previewBody.classList.add('is-frame');
                const iframe = document.createElement('iframe');
                iframe.title = file.name;
                iframe.src = url;
                previewBody.appendChild(iframe);
            } else if (TEXT_PREVIEW_EXT.has(ext) && file.size <= MAX_TEXT_PREVIEW_BYTES) {
                previewBody.textContent = '加载中...';
                try {
                    const res = await fetch(url);
                    if (!res.ok) throw new Error(res.statusText);
                    textContent = await res.text();
                    if (ext === 'csv') {
                        const lines = textContent.split('\n').filter(l => l.length > 0);
                        if (lines.length) {
                            const headers = lines[0].split(',');
                            const rows = lines.slice(1);
                            const table = document.createElement('table');
                            table.className = 'csv-table';
                            const thead = document.createElement('thead');
                            const hr = document.createElement('tr');
                            headers.forEach((h) => { const th = document.createElement('th'); th.textContent = h.trim(); hr.appendChild(th); });
                            thead.appendChild(hr);
                            table.appendChild(thead);
                            const tbody = document.createElement('tbody');
                            rows.forEach((row) => {
                                const tr = document.createElement('tr');
                                row.split(',').forEach((c) => { const td = document.createElement('td'); td.textContent = c.trim(); tr.appendChild(td); });
                                tbody.appendChild(tr);
                            });
                            table.appendChild(tbody);
                            previewBody.replaceChildren(table);
                            const n = document.createElement('div');
                            n.style.cssText = 'margin-top:6px;font-size:11px;color:#8a95a8;';
                            n.textContent = `共 ${rows.length} 行数据`;
                            previewBody.appendChild(n);
                        } else {
                            previewBody.textContent = '(空文件)';
                        }
                    } else {
                        previewBody.textContent = textContent;
                    }
                } catch (e) {
                    previewBody.textContent = '预览加载失败，请点击下方按钮下载查看。';
                }
            } else {
                const empty = document.createElement('div');
                empty.style.cssText = 'text-align:center;color:#9aa8bb;padding:24px 0;';
                empty.innerHTML = `<i class="fas ${fileIcon(file.name)}" style="font-size:36px;"></i>`;
                const hint = document.createElement('div');
                hint.style.marginTop = '10px';
                hint.textContent = '此文件类型暂不支持在线预览，请点击下方按钮下载查看';
                empty.appendChild(hint);
                previewBody.appendChild(empty);
            }

            document.getElementById('previewDownloadBtn').onclick = () => downloadWorkspaceFile(file);
            document.getElementById('previewCopyBtn').onclick = () => {
                if (textContent === null) {
                    showToast('⚠️ 该文件类型不支持复制文本', 'fa-exclamation-circle');
                    return;
                }
                navigator.clipboard?.writeText(textContent).then(() => {
                    showToast('📋 已复制到剪贴板', 'fa-copy');
                }).catch(() => {
                    showToast('📋 复制失败，请手动选择', 'fa-times-circle');
                });
            };
        }

        // ============================================================
        // 消息操作：复制 / 重试。两者都是通用的——复制拿气泡当前渲染出的纯文本，
        // 重试就是把这段文字当一条新消息重新发一遍（后端每次 Followup 都是新的
        //一轮，没有"就地重新生成、替换上一条"的概念，所以老老实实建一条新消息
        // 更诚实，不假装能做到原地替换）。
        // ============================================================
        // max-tokens 是「这一次模型回复」的输出上限，不是整段对话的上下文。
        // 截断时若已写出 tool_calls 却没执行，后续请求会被 DeepSeek 直接拒掉；
        // 那种错误文案里带 tool_call_id / insufficient tool messages。
        function needsNewSession(data) {
            data = data || {};
            const msg = String(data.errorMessage || data.message || data.details || '');
            return /insufficient tool messages|tool_call_id|must be followed by tool/i.test(msg);
        }

        function startNewSessionFromChat() {
            window.location.href = '/?new=' + Date.now();
        }

        function buildTurnFailureCard(data) {
            data = data || {};
            const stuck = needsNewSession(data);
            const wrap = document.createElement('div');
            wrap.style.cssText = 'background:#fef0ee;border-radius:8px;padding:10px 14px;border-left:3px solid #e8684a;margin:4px 0;';
            const title = document.createElement('div');
            title.style.cssText = 'font-weight:600;color:#e8684a;';
            title.textContent = data.reason === 'max-tokens'
                ? '❌ 本轮输出被截断'
                : '❌ 本轮生成失败';
            wrap.appendChild(title);
            const details = document.createElement('div');
            details.style.cssText = 'font-size:13px;color:#6b7a8f;margin-top:4px;word-break:break-word;';
            if (data.reason === 'max-tokens') {
                details.textContent = '单次模型回复写到输出上限就停了（不是整段对话爆了）。可以继续说，或把页面写短一点再试。';
            } else if (stuck) {
                details.textContent = '上一次回复留下了未完成的工具调用，当前会话无法继续。重试不会成功。';
            } else if (data.errorMessage) {
                details.textContent = data.errorMessage;
            }
            if (details.textContent) wrap.appendChild(details);
            if (stuck) {
                const hint = document.createElement('div');
                hint.style.cssText = 'font-size:13px;color:#f97316;margin-top:8px;';
                hint.textContent = '请开启一个新会话再试。';
                wrap.appendChild(hint);
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = '开启新会话';
                btn.style.cssText = 'margin-top:10px;padding:6px 12px;border:0;border-radius:8px;background:#e8684a;color:#fff;font-size:13px;cursor:pointer;';
                btn.addEventListener('click', startNewSessionFromChat);
                wrap.appendChild(btn);
            }
            return wrap;
        }

        function retryFromText(text) {
            if (!currentSessionId) {
                showToast('❌ 缺少会话信息', 'fa-exclamation-circle');
                return;
            }
            if (protocolHandler.isStreaming) {
                showToast('⏳ 请等当前回复完成后再重试', 'fa-hourglass-half');
                return;
            }
            addUserMessage(text);
            startRealStream(currentSessionId, wrapSkillForAgent(text, selectedSkill));
        }

        // 从一条助手消息往前找最近的用户消息文本——用来给"重新生成"按钮定位它
        // 是在回答哪一条问题，不依赖任何额外的隐藏状态，页面刷新后从历史消息里
        // 渲染出来的气泡一样能用。
        function precedingUserText(assistantMsgEl) {
            let el = assistantMsgEl && assistantMsgEl.previousElementSibling;
            while (el) {
                if (el.classList.contains('message') && el.classList.contains('user')) {
                    const textEl = el.querySelector('.msg-text');
                    return textEl ? textEl.textContent : '';
                }
                el = el.previousElementSibling;
            }
            return '';
        }

        function addMessageActions(bubbleEl, opts) {
            if (!bubbleEl || bubbleEl.querySelector('.msg-actions')) return;
            const msgEl = bubbleEl.closest('.message');
            if (msgEl && msgEl.classList.contains('user')) return;
            const actions = document.createElement('div');
            actions.className = 'msg-actions';

            const copyBtn = document.createElement('button');
            copyBtn.type = 'button';
            copyBtn.className = 'msg-action-btn';
            copyBtn.title = '复制';
            copyBtn.innerHTML = '<i class="fas fa-copy"></i><span>复制</span>';
            copyBtn.addEventListener('click', () => {
                const text = opts.getCopyText ? opts.getCopyText() : '';
                if (!text) {
                    showToast('⚠️ 没有可复制的内容', 'fa-exclamation-circle');
                    return;
                }
                navigator.clipboard?.writeText(text).then(() => {
                    showToast('📋 已复制', 'fa-copy');
                }).catch(() => {
                    showToast('📋 复制失败，请手动选择', 'fa-times-circle');
                });
            });
            actions.appendChild(copyBtn);

            if (opts.getRetryText) {
                const retryBtn = document.createElement('button');
                retryBtn.type = 'button';
                retryBtn.className = 'msg-action-btn';
                retryBtn.title = opts.retryLabel || '重试';
                retryBtn.innerHTML = `<i class="fas fa-rotate-right"></i><span>${opts.retryLabel || '重试'}</span>`;
                retryBtn.addEventListener('click', () => {
                    const text = opts.getRetryText();
                    if (!text) {
                        showToast('⚠️ 没有可重试的内容', 'fa-exclamation-circle');
                        return;
                    }
                    retryFromText(text);
                });
                actions.appendChild(retryBtn);
            }

            bubbleEl.appendChild(actions);
            return actions;
        }

        // 添加用户消息
        function addUserMessage(content, attachments) {
            const div = document.createElement('div');
            div.className = 'message user';
            div.innerHTML = `
                <div class="msg-avatar">F</div>
                <div class="msg-bubble">
                    <div class="msg-meta">felicex@gmail.com · 刚刚</div>
                    <div class="msg-text"></div>
                </div>
            `;
            div.querySelector('.msg-text').textContent = content;
            if (attachments && attachments.length) {
                const row = document.createElement('div');
                row.className = 'msg-attachments';
                attachments.forEach((f) => {
                    const chip = document.createElement('button');
                    chip.type = 'button';
                    chip.className = 'msg-file-chip';
                    chip.innerHTML = '<i class="fas"></i><span></span>';
                    chip.querySelector('i').classList.add(fileIcon(f.name || f.path));
                    chip.querySelector('span').textContent = f.name || f.path;
                    chip.title = f.path || f.name || '';
                    chip.addEventListener('click', () => {
                        if (!f.path && !f.name) return;
                        openFilePreview({
                            path: f.path || f.name,
                            name: f.name || f.path,
                            size: f.bytes || f.size || 0,
                            modTime: f.modTime || new Date().toISOString(),
                        });
                    });
                    row.appendChild(chip);
                });
                div.querySelector('.msg-bubble').appendChild(row);
            }
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        // ============================================================
        // 会话状态 + 真实流式响应
        // ============================================================
        let currentSessionId = null;
        let selectedSkill = null;
        // 左侧边栏「历史对话」最多显示的会话数——见 refreshHistoryList。
        const MAX_SIDEBAR_HISTORY = 30;
        let activeEventSource = null;
        let streamClosing = false;
        let streamCancelled = false;
        let streamStartedAt = 0;
        // 断线自动重连的尝试计数——跨多次 startRealStream 调用累计，一旦某次
        // 重连真正收到了 metadata（证明连上了）就清零，见 startRealStream 里
        // 的 metadata 监听。放在函数外面是因为每次重连都是重新调一次
        // startRealStream，函数内部的局部变量活不过这一次调用。
        let streamReconnectAttempts = 0;
        const MAX_STREAM_RECONNECT_ATTEMPTS = 3;
        // 一个 (turn, step) 第一次开始时，气泡（.msg-text）里已经有几个子节点——
        // 断线重连时服务端会把还没跑完的那个 step 从它自己的 step/start 完整
        // 重放一遍（这次连接断线前已经画出来的那部分也在内），所以需要一个
        // 水位线：同一个 (turn, step) 第二次出现（=重放，不是真的推进到下一个
        // step）就把气泡截回这条线，不然重放的内容会跟断线前画好的叠在一起。
        // 记在函数外面、按 turn/step 为 key 而不是每次 startRealStream 都清空，
        // 是因为同一个还没跑完的 step 可能要经历好几轮断线重连。只在真正开始
        // 新一轮（text 非空）时清掉，避免无限增长。
        let stepCheckpoints = new Map();
        // 静默失联判定阈值——留出比服务端 8s 心跳周期更长的余量（能容忍漏掉
        // 一拍），太短容易在网络抖一下的时候就误判。
        const STREAM_STALL_TIMEOUT_MS = 20000;
        // callId -> {card, options}，只给数字键盘快捷键用——正常情况下同一
        // 时间最多一张卡片是"还没回答"的（ask_user_question 会卡住整轮对话，
        // 模型问不出第二个），resolveElicitCard 一回答就把自己从这里摘掉。
        let activeElicitCards = new Map();

        // 澄清卡片选完/输完/跳过的统一出口：本地先把卡片画成"已回答"（乐观
        // 更新，不等服务端确认），再 POST 到 /sessions/{id}/answer 把答案送
        // 回那个还卡在 Execute 里的工具调用。card 已经是 resolved 状态时直接
        // 忽略——防止双击 / 回车又点了一次选项这类重复提交。
        function resolveElicitCard(card, callId, text, rowEl, skipped) {
            if (!card || card.classList.contains('elicit-resolved')) return;
            card.classList.add('elicit-resolved');
            if (callId) activeElicitCards.delete(callId);

            const summary = card.querySelector('.elicit-resolved-summary');
            if (summary) summary.textContent = skipped ? '⏭ 已跳过' : `✓ ${text}`;
            if (rowEl) {
                card.querySelectorAll('.elicit-option').forEach((el) => el.classList.add('elicit-disabled'));
                rowEl.classList.add('elicit-picked');
            }

            if (!currentSessionId || !callId) return;
            const payload = skipped ? { callId, skipped: true } : { callId, text };
            fetch(`/sessions/${encodeURIComponent(currentSessionId)}/answer`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
            }).catch(() => {
                showToast('❌ 回答发送失败，请重试', 'fa-exclamation-circle');
            });
        }

        // 数字键 1-9 直接选对应编号的选项——只在聊天输入框/卡片自己的输入框
        // 之外的地方按数字键才生效，避免打字打出数字时被当成选了哪个选项。
        document.addEventListener('keydown', (e) => {
            if (activeElicitCards.size === 0) return;
            const active = document.activeElement;
            if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.isContentEditable)) return;
            const digit = Number(e.key);
            if (!Number.isInteger(digit) || digit < 1 || digit > 9) return;
            const last = [...activeElicitCards.entries()].pop();
            if (!last) return;
            const [callId, entry] = last;
            const opt = entry.options[digit - 1];
            if (!opt) return;
            e.preventDefault();
            const row = entry.card.querySelector(`.elicit-option[data-index="${digit}"]`);
            resolveElicitCard(entry.card, callId, opt.label || '', row, false);
        });

        function formatDuration(ms) {
            ms = Number(ms);
            if (!Number.isFinite(ms) || ms <= 0) return '';
            if (ms < 1000) return `${Math.round(ms)} 毫秒`;
            const s = ms / 1000;
            if (s < 60) return `${s < 10 ? s.toFixed(1) : Math.round(s)} 秒`;
            const m = Math.floor(s / 60);
            const rem = Math.round(s % 60);
            return rem ? `${m} 分 ${rem} 秒` : `${m} 分钟`;
        }

        function formatTokens(n) {
            const v = Number(n);
            if (!Number.isFinite(v)) return '';
            return Math.round(v).toLocaleString('zh-CN');
        }

        function paintMessageUsage(msgEl, usage, durationMs) {
            if (!msgEl) return;
            const bubble = msgEl.querySelector('.msg-bubble');
            if (!bubble) return;
            const bits = [];
            const dur = formatDuration(durationMs);
            if (dur) bits.push(`耗时 ${dur}`);
            if (usage && usage.turnTokens != null) bits.push(`本次 ${formatTokens(usage.turnTokens)} tokens`);
            if (usage && usage.totalTokens != null) bits.push(`累计 ${formatTokens(usage.totalTokens)} tokens`);
            let el = bubble.querySelector('.msg-usage');
            if (!bits.length) {
                if (el) el.remove();
                return;
            }
            if (!el) {
                el = document.createElement('div');
                el.className = 'msg-usage';
                bubble.appendChild(el);
            }
            el.textContent = bits.join(' · ');
        }

        async function fetchSessionUsage() {
            if (!currentSessionId) return null;
            try {
                const res = await fetch(`/sessions/${encodeURIComponent(currentSessionId)}/tokens`);
                if (!res.ok) return null;
                const m = await res.json();
                if (m.totalTokens == null) return null;
                return { totalTokens: m.totalTokens, turnTokens: m.turnTokens };
            } catch (e) {
                return null;
            }
        }

        async function refreshChatUsage(turnUsage) {
            const el = document.getElementById('chatUsage');
            if (!el) return;
            const usage = (turnUsage && turnUsage.totalTokens != null) ? turnUsage : await fetchSessionUsage();
            if (!usage || usage.totalTokens == null) {
                el.textContent = '';
                return;
            }
            const turn = usage.turnTokens != null ? `本次 ${formatTokens(usage.turnTokens)} · ` : '';
            el.textContent = `${turn}累计 ${formatTokens(usage.totalTokens)} tokens`;
        }

        function wrapSkillForAgent(text, skill) {
            if (!skill) return text;
            return `请先调用 load_skill 工具，参数 name 为 "${skill}"。必须先加载该技能并严格按其指令完成任务，不要跳过 load_skill。\n\n用户任务：\n${text}`;
        }

        function stripSkillWrap(text) {
            if (!text) return text;
            return text.replace(/^请先调用 load_skill 工具，参数 name 为 "[^"]+"。[\s\S]*?\n用户任务：\n/, '');
        }

        // 把 GET /sessions/{id}/messages 返回的历史消息渲染出来（用户从首页跳转
        // 过来之前，这个 session 可能已经有过对话）。会话历史里的每条 block
        // 对应 web/dto.go 的 blockDTO：kind/text/toolName/args。展示类伪工具
        // 回放成 table/chart/… 组件，合成 ack 对用户不可见。
        function renderHistoryMessages(messages) {
            protocolHandler.reset();
            const ackByCall = new Set();
            messages.forEach(m => {
                (m.content || []).forEach(b => {
                    if (b.kind === 'tool-result' && b.text === DISPLAYED_ACK && b.callId) ackByCall.add(b.callId);
                });
            });
            messages.forEach(m => {
                const blocks = m.content || [];
                const isToolResultOnly = m.role === 'user' && blocks.length > 0 && blocks.every(b => b.kind === 'tool-result');
                if (m.role === 'user' && !isToolResultOnly) {
                    protocolHandler.reset();
                    const text = blocks.filter(b => b.kind === 'text' || b.kind === 'reasoning').map(b => b.text || '').join('\n');
                    if (text) addUserMessage(stripSkillWrap(text));
                    return;
                }
                blocks.forEach(block => {
                    if (block.kind === 'tool-result') {
                        if (block.text === DISPLAYED_ACK) return;
                        protocolHandler.dispatch({ type: 'tool-result', content: { text: block.text, callId: block.callId } });
                        return;
                    }
                    if (block.kind === 'tool-call') {
                        const mapped = DISPLAY_TOOLS[block.toolName];
                        if (mapped) {
                            if (ackByCall.has(block.callId)) {
                                protocolHandler.dispatch({ type: mapped, content: block.args || {} });
                            }
                            return;
                        }
                        protocolHandler.dispatch({ type: 'tool-call', content: { toolName: block.toolName, args: block.args, callId: block.callId } });
                        return;
                    }
                    if (block.kind === 'reasoning') {
                        protocolHandler.dispatch({ type: 'thinking', content: { text: block.text || '', delta: false } });
                        return;
                    }
                    if (block.text) {
                        protocolHandler.dispatch({ type: 'text', content: block.text, delta: false });
                    }
                });
            });
            protocolHandler.reset();
        }

        function stripMessageActions(msgEl) {
            const actions = msgEl && msgEl.querySelector('.msg-actions');
            if (actions) actions.remove();
        }

        // 只给已经结束的助手气泡补复制/重试。进行中的最后一条不要挂，
        // 等 finishStream 整轮收尾再加。
        function attachAssistantMessageActions(opts) {
            const skipLast = opts && opts.skipLast;
            const items = [...container.querySelectorAll('.message.assistant')];
            items.forEach((msgEl, i) => {
                if (skipLast && i === items.length - 1) return;
                const bubble = msgEl.querySelector('.msg-bubble');
                const textEl = bubble && bubble.querySelector('.msg-text');
                addMessageActions(bubble, {
                    getCopyText: () => textEl ? textEl.textContent : '',
                    getRetryText: () => precedingUserText(msgEl),
                    retryLabel: '重新生成',
                });
            });
        }

        function setComposerMode(mode) {
            const sendBtn = document.getElementById('sendBtn');
            const cancelBtn = document.getElementById('cancelBtn');
            if (!sendBtn || !cancelBtn) return;
            const streaming = mode === 'streaming' || mode === 'cancelling';
            sendBtn.hidden = streaming;
            cancelBtn.hidden = !streaming;
            cancelBtn.disabled = mode === 'cancelling';
            cancelBtn.title = mode === 'cancelling' ? '正在停止' : '停止';
            cancelBtn.setAttribute('aria-label', cancelBtn.title);
            cancelBtn.innerHTML = mode === 'cancelling'
                ? '<i class="fas fa-spinner fa-spin"></i>'
                : '<i class="fas fa-stop"></i>';
        }

        function closeActiveStream() {
            streamClosing = true;
            if (activeEventSource) {
                activeEventSource.close();
                activeEventSource = null;
            }
        }

        // 断线/静默重连共用的调度逻辑——EventSource 原生 onerror 和下面的
        // "静默失联"探测都走这一个函数，避免两套重复且容易走偏的重试逻辑。
        // 调用前调用方必须已经关掉了失效的 EventSource（如果有的话）。
        function scheduleStreamReconnect(sessionId, toastPrefix) {
            if (streamCancelled && protocolHandler.isStreaming) {
                protocolHandler.dispatch({ type: 'done', content: { stopped: true } });
                return;
            }
            if (!protocolHandler.isStreaming) return;

            // 服务端那一轮跟这次 HTTP 连接本来就是解耦的（见
            // handleStreamSession 的说明），断线/失联不代表它被打断了——值得
            // 先试着接回去，而不是直接判定"整个对话失败了"。真正的模型/工具
            // 错误会通过 done 事件的 failed/errorMessage 字段单独上报，不走
            // 这条路径。
            if (streamReconnectAttempts < MAX_STREAM_RECONNECT_ATTEMPTS) {
                streamReconnectAttempts++;
                const delayMs = 800 * streamReconnectAttempts;
                showToast(`${toastPrefix}，${(delayMs / 1000).toFixed(1)}s 后自动重连…`, 'fa-rotate-right');
                window.setTimeout(() => {
                    // 等待期间用户可能已经手动停止、切走了别的会话，或者
                    // 干脆自己重新发了一条——这些情况都不该再帮它重连。
                    if (streamCancelled || !protocolHandler.isStreaming) return;
                    if (currentSessionId !== sessionId) return;
                    startRealStream(sessionId, '');
                }, delayMs);
                return;
            }

            protocolHandler.dispatch({ type: 'error', content: { message: '连接反复中断，请检查网络后手动刷新页面重试' } });
        }

        // 真实流式响应：触发并跟随 GET /sessions/{id}/stream（EventSource 只能
        // 发 GET，所以消息文本走 query string，不是 POST body）。
        // 关掉这条 EventSource 并不会停掉服务端那一轮（Followup 跑在 agent
        // 自己的 goroutine 里），要真正停必须 POST /sessions/{id}/cancel。
        function startRealStream(sessionId, text) {
            closeActiveStream();
            streamClosing = false;
            streamCancelled = false;
            streamStartedAt = Date.now();
            // 真正的新一轮（不是重连）——上一轮留下的水位线不再有意义。
            if (text) { stepCheckpoints = new Map(); activeElicitCards = new Map(); }
            protocolHandler.reset();
            protocolHandler.isStreaming = true;
            protocolHandler.stickToBottom = true;
            // 空 text = 只看不发（切走再回来 / 断线重连）。接到最后一条助手
            // 气泡上继续画，不要新开一条，也不要在进行中露出复制/重试。
            if (!text) {
                const lastMsg = container.lastElementChild;
                if (lastMsg && lastMsg.classList.contains('message') && lastMsg.classList.contains('assistant')) {
                    stripMessageActions(lastMsg);
                    protocolHandler.currentMessageEl = lastMsg;
                    const meta = lastMsg.querySelector('.msg-meta');
                    if (meta) meta.textContent = 'PABuddy AI · 生成中...';
                }
            }
            protocolHandler.showWaiting();
            setComposerMode('streaming');
            const es = new EventSource(`/sessions/${encodeURIComponent(sessionId)}/stream?text=${encodeURIComponent(text)}`);
            activeEventSource = es;

            // 静默失联探测：EventSource 的 onerror 并不保证在所有"连接其实已经
            // 死了"的情况下都会触发（有些代理/浏览器组合会让连接看起来还开着，
            // 但什么都收不到）。服务端每隔 streamHeartbeatInterval（8s，见
            // handlers.go）就会发一次心跳，哪怕没有新内容——这里只要连续
            // STREAM_STALL_TIMEOUT_MS 什么都没收到（包括心跳），就当作连接已经
            // 静默失联，主动关掉重连，而不是让用户对着"生成中"干等，长期长时间
            // 工具调用（比如 bash 跑一个耗时命令）中间也不会误判——因为哪怕没有
            // 新的对话内容，心跳本身也在按周期到达。
            let stallTimer = null;
            function resetStallWatchdog() {
                if (stallTimer) clearTimeout(stallTimer);
                stallTimer = window.setTimeout(() => {
                    if (!protocolHandler.isStreaming || streamClosing || streamCancelled) return;
                    if (es.readyState === EventSource.CLOSED) return; // onerror 已经/将会处理
                    es.close();
                    if (activeEventSource === es) activeEventSource = null;
                    scheduleStreamReconnect(sessionId, '⏱ 长时间未收到响应');
                }, STREAM_STALL_TIMEOUT_MS);
            }
            resetStallWatchdog();

            function onSSE(type, handler) {
                es.addEventListener(type, (e) => {
                    resetStallWatchdog();
                    handler(e);
                });
            }

            // 服务端在每个 step 一开始就发一条（payload 是 {turn, step}），见
            // handlers.go 的 writeStreamEvent。第一次见到某个 (turn, step) 只
            // 是记一下当前气泡里已经有几个子节点；第二次见到同一个 (turn,
            // step)——只可能是断线重连把这个还没跑完的 step 从头重放了一遍——
            // 就把气泡截回那条水位线，再往后收到的 chunk/tool-call 才不会跟
            // 断线前已经画好的部分叠在一起（ensureMdStream 只会去接"最后一个
            // 子节点"，判断不出那是不是本该被这次重放覆盖的旧内容）。
            onSSE('step', (e) => {
                const data = JSON.parse(e.data);
                const key = `${data.turn}:${data.step}`;
                const textEl = protocolHandler.currentMessageEl && protocolHandler.currentMessageEl.querySelector('.msg-text');
                if (stepCheckpoints.has(key)) {
                    const checkpoint = stepCheckpoints.get(key);
                    if (textEl) {
                        while (textEl.children.length > checkpoint) {
                            textEl.removeChild(textEl.lastElementChild);
                        }
                    }
                    protocolHandler.streamEl = null; // may have just been removed above
                } else {
                    stepCheckpoints.set(key, textEl ? textEl.children.length : 0);
                }
            });

            onSSE('chunk', (e) => {
                const data = JSON.parse(e.data);
                if (data.kind === 'reasoning') {
                    protocolHandler.dispatch({ type: 'thinking', content: { text: data.text, delta: true } });
                } else {
                    protocolHandler.dispatch({ type: 'text', content: data.text, delta: true });
                }
            });
            onSSE('tool-call', (e) => {
                protocolHandler.dispatch({ type: 'tool-call', content: JSON.parse(e.data) });
            });
            onSSE('tool-result', (e) => {
                protocolHandler.dispatch({ type: 'tool-result', content: JSON.parse(e.data) });
            });
            // ask_user_question：模型拿不准时的澄清问题，跟 tool-call 不一样，
            // 这个事件在工具调用一发出就到（不是等结果），因为结果本来就是
            // 在等这张卡片被回答（见 web/handlers.go 的 writeStreamEvent）。
            onSSE('elicit', (e) => {
                protocolHandler.dispatch({ type: 'elicit', content: JSON.parse(e.data) });
            });
            ['table', 'chart', 'code', 'suggestion', 'image', 'error', 'progress'].forEach((type) => {
                onSSE(type, (e) => {
                    protocolHandler.dispatch({ type, content: JSON.parse(e.data) });
                });
            });
            onSSE('metadata', (e) => {
                // metadata 是后端连上之后第一个发的事件——收到它就说明这次
                // 连接（不管是新发的还是断线重连）是真的连通了，把重连计数清零，
                // 不然一次孤立的网络抖动会一直占着"已经重试过 N 次"的额度。
                streamReconnectAttempts = 0;
                protocolHandler.dispatch({ type: 'metadata', content: JSON.parse(e.data) });
            });
            // 服务端在没有新对话内容时按 streamHeartbeatInterval 定期发的心跳，
            // 空 payload——这里只是喂给静默失联探测，不需要对用户做任何展示。
            onSSE('heartbeat', () => {});
            // 后端在这一轮结束时对比工作区快照算出的新增/变更文件（见
            // web/files.go 的 emitFileEvents）—— 一个文件一条，payload 就是
            // fileEntryDTO {path, name, size, modTime}。
            onSSE('file', (e) => {
                protocolHandler.dispatch({ type: 'file', content: JSON.parse(e.data) });
            });
            onSSE('done', (e) => {
                let data = {};
                try { data = e.data ? JSON.parse(e.data) : {}; } catch (err) { /* 忽略：没有 usage 就不显示，不阻塞收尾 */ }
                if (streamCancelled) data.stopped = true;
                streamClosing = true;
                if (stallTimer) clearTimeout(stallTimer);
                protocolHandler.dispatch({ type: 'done', content: data });
                es.close();
                if (activeEventSource === es) activeEventSource = null;
                // 这一轮可能通过 write/edit/bash/run_python 在工作区生成了新文件 —
                // 刷新「最近文件」列表，而不是等用户手动点开才发现。
                refreshFileList();
            });
            es.onerror = () => {
                if (streamClosing || es.readyState === EventSource.CLOSED) return;
                // 必须自己 close，不能指望浏览器原生的自动重连：EventSource 断线
                // 后会用同一个 URL 重连，如果这次连接带的是非空 text，原生重连会
                // 让后端再收到一次同样的 text，等于把这句话又发了一遍、开了第二
                // 轮对话。所以这里始终自己关掉，需要重连时显式用空 text 重新
                // 发起——那是「只看不发」的接法（见 handleStreamSession），不会
                // 重复触发 Followup。
                if (stallTimer) clearTimeout(stallTimer);
                es.close();
                if (activeEventSource === es) activeEventSource = null;
                scheduleStreamReconnect(sessionId, '🔄 连接中断');
            };
        }

        // 发送消息
        function handleSend() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            if (protocolHandler.isStreaming) {
                showToast('⏳ 请先停止当前生成，再发送下一条', 'fa-hourglass-half');
                return;
            }
            if (!message) {
                showToast('💡 请输入消息', 'fa-exclamation-circle');
                return;
            }
            if (!currentSessionId) {
                showToast('❌ 缺少会话信息，请从首页重新发送', 'fa-exclamation-circle');
                return;
            }

            addUserMessage(message);
            input.value = '';
            startRealStream(currentSessionId, wrapSkillForAgent(message, selectedSkill));
        }

        async function handleCancel() {
            if (!currentSessionId || !protocolHandler.isStreaming) return;
            streamCancelled = true;
            setComposerMode('cancelling');
            try {
                const res = await fetch(`/sessions/${encodeURIComponent(currentSessionId)}/cancel`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ reason: 'user stopped' }),
                });
                if (!res.ok && res.status !== 404) {
                    showToast('❌ 停止失败，请重试', 'fa-exclamation-circle');
                    setComposerMode('streaming');
                    streamCancelled = false;
                    return;
                }
            } catch (err) {
                showToast('❌ 停止失败，请重试', 'fa-exclamation-circle');
                setComposerMode('streaming');
                streamCancelled = false;
                return;
            }
            showToast('⏹ 正在停止生成…', 'fa-stop');
            window.setTimeout(async () => {
                if (!protocolHandler.isStreaming) return;
                closeActiveStream();
                // 8 秒内没等到服务端真正的 done——已经派发出去的独占型工具调用
                // 中途是不会被打断的（见 shell/toolbash 的说明），服务端这时候
                // 可能还没真正停下来。问一下真实状态，而不是想当然地告诉用户
                // "已经停了"：真跑完了就正常收尾，还在跑就老实说明，不显示一个
                // 可能是假的"已停止"（回到这个会话时会自动接上）。
                let stillRunning = false;
                try {
                    const res = await fetch(`/sessions/${encodeURIComponent(currentSessionId)}`);
                    if (res.ok) {
                        const info = await res.json();
                        stillRunning = info.status === 'running';
                    }
                } catch (err) {
                    // 查不到状态就还是按"已停止"处理，不阻塞收尾
                }
                if (!protocolHandler.isStreaming) return; // 等状态查询的空档里可能已经自然收尾了
                protocolHandler.dispatch({ type: 'done', content: { stopped: true, stillRunning } });
            }, 8000);
        }

        // ============================================================
        // 5. 事件绑定
        // ============================================================
        document.getElementById('sendBtn').addEventListener('click', handleSend);
        document.getElementById('cancelBtn').addEventListener('click', handleCancel);
        document.getElementById('chatInput').addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && protocolHandler.isStreaming) {
                e.preventDefault();
                handleCancel();
                return;
            }
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && protocolHandler.isStreaming && document.activeElement !== document.getElementById('chatInput')) {
                handleCancel();
            }
        });

        document.getElementById('attachBtn').addEventListener('click', function() {
            if (!currentSessionId) {
                showToast('❌ 缺少会话信息，请从首页重新发送', 'fa-exclamation-circle');
                return;
            }
            document.getElementById('chatFileInput').click();
        });

        const uploadedFiles = [];
        const composerAttachments = document.getElementById('composerAttachments');

        function filesFromQuery(params) {
            const raw = params.get('files');
            if (!raw) return [];
            const toEntry = (path) => ({
                name: String(path).split('/').pop(),
                path: String(path),
            });
            try {
                const parsed = JSON.parse(raw);
                if (Array.isArray(parsed)) return parsed.filter(Boolean).map(toEntry);
            } catch (e) {
                /* fall through to pipe-separated */
            }
            return raw.split('|').filter(Boolean).map(toEntry);
        }
        const chatFileInput = document.getElementById('chatFileInput');
        const inputArea = document.getElementById('inputArea');

        function renderAttachments() {
            composerAttachments.innerHTML = '';
            if (!uploadedFiles.length) {
                composerAttachments.classList.remove('show');
                return;
            }
            composerAttachments.classList.add('show');
            uploadedFiles.forEach((f, i) => {
                const chip = document.createElement('div');
                chip.className = 'attach-chip' + (f.error ? ' is-error' : '');
                chip.innerHTML = '<i class="fas kind"></i><span class="meta"><span class="name"></span><span class="size"></span></span><button type="button" class="attach-remove" aria-label="移除"><i class="fas fa-times"></i></button>';
                chip.querySelector('i.kind').classList.add(fileIcon(f.name));
                chip.querySelector('.name').textContent = f.name;
                chip.querySelector('.size').textContent = f.error ? f.error : (f.uploading ? '上传中…' : formatSize(f.bytes || f.size));
                chip.addEventListener('click', () => {
                    if (f.error || f.uploading || !(f.path || f.name)) return;
                    openFilePreview({
                        path: f.path || f.name,
                        name: f.name,
                        size: f.bytes || f.size || 0,
                        modTime: f.modTime || new Date().toISOString(),
                    });
                });
                chip.querySelector('.attach-remove').addEventListener('click', (e) => {
                    e.stopPropagation();
                    uploadedFiles.splice(i, 1);
                    chatFileInput.value = '';
                    renderAttachments();
                });
                composerAttachments.appendChild(chip);
            });
        }

        async function uploadFiles(files) {
            const list = Array.from(files).filter(Boolean);
            if (!list.length) return;
            if (!currentSessionId) {
                showToast('❌ 缺少会话信息，无法上传', 'fa-exclamation-circle');
                return;
            }
            for (const file of list) {
                const entry = { name: file.name, size: file.size, bytes: file.size, uploading: true };
                uploadedFiles.push(entry);
                renderAttachments();
                try {
                    const form = new FormData();
                    form.append('file', file);
                    const res = await fetch(`/sessions/${encodeURIComponent(currentSessionId)}/files`, {
                        method: 'POST',
                        body: form,
                    });
                    const body = await res.json().catch(() => ({}));
                    if (!res.ok) {
                        throw new Error(body.error || body.message || ('HTTP ' + res.status));
                    }
                    entry.uploading = false;
                    entry.path = body.path;
                    entry.bytes = body.bytes || file.size;
                    showToast(`已上传 ${body.path || file.name}`, 'fa-paperclip');
                } catch (err) {
                    entry.uploading = false;
                    entry.error = err.message || '上传失败';
                    showToast('上传失败: ' + entry.error, 'fa-exclamation-circle');
                }
                renderAttachments();
            }
            chatFileInput.value = '';
            refreshFileList();
        }

        function collectClipboardFiles(dt) {
            const files = [];
            const seen = new Set();
            const push = (f) => {
                if (!f) return;
                const key = `${f.name}|${f.size}|${f.lastModified}`;
                if (seen.has(key)) return;
                seen.add(key);
                files.push(f);
            };
            if (dt.files) Array.from(dt.files).forEach(push);
            for (const item of dt.items || []) {
                if (item.kind === 'file') push(item.getAsFile());
            }
            return files;
        }

        chatFileInput.addEventListener('change', function(e) {
            uploadFiles(e.target.files);
        });

        inputArea.addEventListener('paste', function(e) {
            const dt = e.clipboardData;
            if (!dt) return;
            const files = collectClipboardFiles(dt);
            if (!files.length) return;
            e.preventDefault();
            uploadFiles(files);
        });

        ['dragenter', 'dragover'].forEach((type) => {
            inputArea.addEventListener(type, (e) => {
                e.preventDefault();
                inputArea.classList.add('drag-over');
            });
        });
        ['dragleave', 'drop'].forEach((type) => {
            inputArea.addEventListener(type, (e) => {
                e.preventDefault();
                if (type === 'dragleave' && inputArea.contains(e.relatedTarget)) return;
                inputArea.classList.remove('drag-over');
            });
        });
        inputArea.addEventListener('drop', (e) => {
            const files = e.dataTransfer && e.dataTransfer.files;
            if (files && files.length) uploadFiles(files);
        });

        document.getElementById('clearChatBtn').addEventListener('click', function() {
            const msgs = container.querySelectorAll('.message');
            if (msgs.length > 2) {
                if (confirm('确定要清空所有对话吗？')) {
                    msgs.forEach(m => m.remove());
                    const div = document.createElement('div');
                    div.className = 'message assistant';
                    div.innerHTML = `
                        <div class="msg-avatar">AI</div>
                        <div class="msg-bubble">
                            <div class="msg-meta">PABuddy AI · 刚刚</div>
                            <div class="msg-text">对话已清空。有什么我可以帮你的吗？</div>
                        </div>
                    `;
                    container.appendChild(div);
                    closePanel();
                    showToast('🗑️ 对话已清空', 'fa-trash-alt');
                }
            } else {
                showToast('💬 对话已经是空的', 'fa-info-circle');
            }
        });

        document.getElementById('exportChatBtn').addEventListener('click', function() {
            const msgs = container.querySelectorAll('.message');
            let text = 'PABuddy AI 对话导出\n' + '='.repeat(50) + '\n';
            msgs.forEach(m => {
                const role = m.className.includes('user') ? '用户' : m.className.includes('assistant') ? 'AI' : '系统';
                const textEl = m.querySelector('.msg-text');
                if (textEl) text += `[${role}]\n${textEl.textContent}\n\n`;
            });
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `chat_export_${new Date().toISOString().slice(0,10)}.txt`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('📥 对话已导出', 'fa-download');
        });

        // 导航
        document.getElementById('backBtn').addEventListener('click', () => { window.location.href = '/?new=' + Date.now(); });
        document.getElementById('brandBtn').addEventListener('click', () => { window.location.href = '/?new=' + Date.now(); });
        document.getElementById('searchIcon').addEventListener('click', () => { document.getElementById('chatInput').focus(); showToast('🔍 输入关键词搜索', 'fa-search'); });
        document.getElementById('bellIcon').addEventListener('click', () => showToast('🔔 暂无新通知', 'fa-bell'));

        (function bindUserChrome() {
            const card = document.getElementById('userCard');
            const settingsBtn = document.getElementById('settingsBtn');
            const menu = document.getElementById('userMenu');
            card.addEventListener('click', function(e) {
                if (e.target.closest('#settingsBtn, #userMenu')) return;
                window.location.href = '/space.html';
            });
            settingsBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                window.location.href = '/settings.html';
            });
            menu.addEventListener('click', function(e) {
                e.stopPropagation();
                const action = e.target.closest('[data-action]') && e.target.closest('[data-action]').dataset.action;
                if (action === 'space') window.location.href = '/space.html';
                if (action === 'notify') {
                    menu.classList.remove('show');
                    showToast('🔔 暂无新通知', 'fa-bell');
                }
                    if (action === 'settings') {
                    menu.classList.remove('show');
                    window.location.href = '/settings.html';
                }
                if (action === 'logs') {
                    menu.classList.remove('show');
                    window.location.href = '/settings.html#logs';
                }
            });
            document.addEventListener('click', function() { menu.classList.remove('show'); });
        })();

        document.querySelectorAll('.quick-item').forEach(el => {
            el.addEventListener('click', function() {
                if (this.classList.contains('soon')) {
                    showToast('该功能正在开发中', 'fa-hourglass-half');
                    return;
                }
                const nav = this.dataset.nav;
                if (nav === 'task') {
                    window.location.href = '/?new=' + Date.now();
                    return;
                }
                if (nav === 'space') {
                    window.location.href = '/space.html';
                    return;
                }
                document.querySelectorAll('.quick-item').forEach(i => i.classList.remove('active'));
                this.classList.add('active');
            });
        });

        function sessionLabel(s) {
            const title = (s.title || '').trim();
            if (title) return title;
            const id = s.id || '';
            const short = id.length > 10 ? id.slice(0, 8) : id;
            return s.parentSession ? `${short} (fork)` : short;
        }

        function formatSessionAge(createdAt) {
            const t = Number(createdAt);
            if (!Number.isFinite(t) || t <= 0) return '';
            const mins = Math.max(0, Math.floor((Date.now() - t) / 60000));
            if (mins < 1) return '刚刚';
            if (mins < 60) return `${mins}分钟前`;
            const hrs = Math.floor(mins / 60);
            if (hrs < 24) return `${hrs}小时前`;
            const days = Math.floor(hrs / 24);
            if (days < 7) return `${days}天前`;
            const d = new Date(t);
            const pad = (n) => String(n).padStart(2, '0');
            const stamp = `${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
            return d.getFullYear() === new Date().getFullYear() ? stamp : `${d.getFullYear()}-${stamp}`;
        }

        async function refreshHistoryList() {
            const list = document.getElementById('historyList');
            if (!list) return;
            try {
                const res = await fetch('/sessions');
                if (!res.ok) return;
                const sessions = await res.json();
                list.innerHTML = '';
                if (!sessions.length) {
                    list.innerHTML = '<div class="history-empty">暂无对话</div>';
                    return;
                }
                sessions
                    .slice()
                    .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0))
                    // 侧边栏只是快速导航，不是完整归档——最近 30 条足够覆盖日常
                    // 切换场景，列表不会随会话数增长无限变长。完整历史在「个人
                    // 工作区」页（space.html）看，那边不做这个裁剪。
                    .slice(0, MAX_SIDEBAR_HISTORY)
                    .forEach(s => {
                        const item = document.createElement('div');
                        item.className = 'history-item' + (s.id === currentSessionId ? ' active' : '');
                        const label = sessionLabel(s);
                        const age = formatSessionAge(s.createdAt);
                        item.title = age ? `${label} · ${new Date(s.createdAt).toLocaleString('zh-CN')}` : label;
                        item.innerHTML = `<i class="fas fa-comment-dots"></i><span class="label"></span>`;
                        item.querySelector('.label').textContent = label;
                        if (s.fileCount) {
                            const badge = document.createElement('span');
                            badge.className = 'file-count';
                            badge.title = `${s.fileCount} 个文件`;
                            badge.innerHTML = `<i class="fas fa-paperclip"></i>${s.fileCount}`;
                            item.appendChild(badge);
                        }
                        const time = document.createElement('span');
                        time.className = 'time';
                        time.textContent = age;
                        item.appendChild(time);
                        if (s.id === currentSessionId && label && label !== s.id) {
                            const titleEl = document.getElementById('chatTitleText');
                            if (titleEl && (titleEl.textContent === '新对话' || titleEl.textContent.startsWith('技能 ·'))) {
                                titleEl.textContent = label;
                            }
                        }
                        item.addEventListener('click', () => {
                            if (s.id === currentSessionId) return;
                            window.location.href = `dialog.html?session=${encodeURIComponent(s.id)}`;
                        });
                        list.appendChild(item);
                    });
            } catch (e) {
                // 历史列表加载失败不打断当前对话
            }
        }

        // ============================================================
        // 6. 初始化：从首页跳转过来时 URL 带 session（必须）+ text（本轮要发的话）。
        // 先渲染这个 session 已有的历史消息，再把新一轮的问题通过 /stream 发出去。
        // ============================================================
        async function init() {
            const params = new URLSearchParams(window.location.search);
            const sessionId = params.get('session');
            const text = params.get('text');
            selectedSkill = params.get('skill') || null;
            if (selectedSkill) {
                const title = document.getElementById('chatTitleText');
                if (title) title.textContent = `技能 · ${selectedSkill}`;
            }

            if (!sessionId) {
                showToast('❌ 缺少会话信息，请从首页发送', 'fa-exclamation-circle');
                document.getElementById('chatInput').focus();
                return;
            }
            currentSessionId = sessionId;
            refreshHistoryList();
            refreshChatUsage();
            const queryFiles = filesFromQuery(params);
            const listed = await fetchWorkspaceFiles();
            renderFileList(listed);
            // 本轮从首页带过来的附件只看 URL 上的 files=。配置了 workspace_dir
            // 之后 GET /sessions/{id}/files 列出的是整个个人工作区，里面混着
            // 以前任务上传/生成的文件；再把 source=upload 的全拼进 incomingFiles，
            // 新对话的第一条用户消息就会挂上旧附件。
            const incomingFiles = [];
            const seen = new Set();
            queryFiles.forEach((f) => {
                const path = f.path || f.name;
                if (!path || seen.has(path)) return;
                seen.add(path);
                incomingFiles.push({
                    name: f.name || String(path).split('/').pop(),
                    path,
                    size: f.size || f.bytes || 0,
                    bytes: f.size || f.bytes || 0,
                    modTime: f.modTime,
                });
            });

            let history = [];
            try {
                const res = await fetch(`/sessions/${encodeURIComponent(sessionId)}/messages`);
                if (res.ok) {
                    history = await res.json();
                    renderHistoryMessages(history);
                }
            } catch (e) {
                // 历史加载失败不阻塞本轮对话
            }
            // 不要把 GET /sessions/{id}/files 的结果画进气泡。共享工作区下列表
            // 曾是整个知识库；即使改成按 session 记账，重开对话也只应回放
            // messages，文件卡片由这一轮 SSE 再产生。
            if (!text && history.length && listed.length) {
                restoreFileCards(listed);
            }

            if (text) {
                const titleEl = document.getElementById('chatTitleText');
                if (titleEl) titleEl.textContent = text;
                attachAssistantMessageActions();
                addUserMessage(text, incomingFiles);
                startRealStream(sessionId, wrapSkillForAgent(text, selectedSkill));
            } else {
                // Navigating away mid-turn (back button, brand logo, opening
                // a different session from the sidebar) doesn't actually
                // interrupt the turn server-side — Followup hands off to the
                // agent's own goroutine, independent of any one HTTP
                // connection (see handleStreamSession's own doc comment) —
                // it just tears down this page's EventSource, so nobody's
                // watching anymore. Check whether this session is still
                // running before assuming the static history fetch above is
                // the whole story, and reconnect (no text = watch-only, see
                // handleStreamSession) to pick the rest of it up live rather
                // than leaving the user staring at a stale transcript with
                // no sign anything is still happening.
                const running = await sessionIsRunning(sessionId);
                attachAssistantMessageActions({ skipLast: running });
                if (running) {
                    showToast('🔄 该会话仍在生成中，正在接上进度…', 'fa-spinner');
                    startRealStream(sessionId, '');
                }
            }

            document.getElementById('chatInput').focus();
        }

        async function sessionIsRunning(sessionId) {
            try {
                const res = await fetch(`/sessions/${encodeURIComponent(sessionId)}`);
                if (!res.ok) return false;
                const info = await res.json();
                return info.status === 'running';
            } catch (e) {
                return false;
            }
        }
        init();

        console.log('🚀 PABuddy AI · 协议驱动对话已加载');
        console.log('📋 支持的消息类型:', Object.values(Protocol.MessageType).join(', '));
    })();
</script>
