<title>问问</title>
<style>
body{margin:0;background:#EEF0F3}
a{color:inherit}
button,input,textarea{font:inherit}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
.nav-a{width:48px;min-height:46px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#6B7280;text-decoration:none;font-size:12px;font-weight:500;letter-spacing:.02em;line-height:1.15;transition:color .15s ease,background .15s ease}
.nav-a:hover{color:#14171F;background:rgba(0,0,0,.06)}
.nav-a.on{color:#2457D6;background:#EEF3FC;font-weight:600}
.sess-row{flex:none;display:flex;align-items:center;gap:2px;width:100%;box-sizing:border-box;min-height:36px;border-radius:8px}
.sess-row:hover{background:#F4F5F7}
.sess-row.on{background:#EAF0FD}
.sess{flex:1;min-width:0;display:block;box-sizing:border-box;min-height:36px;padding:8px 6px 8px 10px;border:none;border-radius:8px;background:transparent;font:inherit;font-size:13px;line-height:20px;color:#14171F;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.sess-row.on .sess{color:#2457D6;font-weight:600}
.sess-del{flex:none;opacity:0;width:28px;height:28px;margin-right:4px;border:none;border-radius:6px;background:transparent;color:#8A919E;font:inherit;font-size:16px;line-height:1;cursor:pointer}
.sess-row:hover .sess-del,.sess-row.on .sess-del{opacity:1}
.sess-del:hover{background:#FCEBEB;color:#B42318}
.grp{flex:none;padding:14px 10px 4px;font-size:11px;color:#8A919E}
.msg{display:flex;gap:10px;align-items:flex-start}
.msg .cpm{opacity:0;transition:opacity .12s}
.msg:hover .cpm,.msg:focus-within .cpm{opacity:1}
.av{position:relative;flex:none;display:block;border-radius:50%;overflow:hidden}
.av svg{display:block;width:100%;height:100%}
.cp{border:none;background:transparent;color:#8A919E;font:inherit;font-size:12px;cursor:pointer;padding:2px 8px;border-radius:6px;white-space:nowrap}
.cp:hover{background:#EEF0F3;color:#3A4250}
.retryBtn{border:none;background:transparent;color:#2457D6;font:inherit;font-size:12px;cursor:pointer;padding:2px 8px;border-radius:6px;white-space:nowrap}
.retryBtn:hover{background:#EAF0FD}
.retryBtn[hidden]{display:none!important}
.sq{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:6px 12px;border:1px solid #C9D7F5;border-radius:999px;background:#F5F8FF;color:#2457D6;font:inherit;font-size:14px;line-height:1.45;text-align:left;cursor:pointer}
.sq:hover{background:#EAF0FD;border-color:#2457D6}
.typing{display:inline-flex;gap:4px;padding:4px 2px}
.typing i{width:6px;height:6px;border-radius:50%;background:#A1A7B2;animation:blink 1.2s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.18s}
.typing i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.nl{color:#2457D6;text-decoration:none}
.nl:hover{text-decoration:underline}
.mdt th,.mdt td{transition:background .1s}
.mdt tbody tr:hover td{background:#FAFBFD}
.chip{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 9px;border-radius:8px;background:#EAF0FD;font-size:12px;color:#2457D6;cursor:pointer;border:none}
.chip .x{opacity:.6}
.toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);z-index:60;padding:9px 16px;border-radius:8px;background:#14171F;color:#FFFFFF;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.ask-modal{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(20,23,31,.42);backdrop-filter:blur(2px)}
.ask-modal[hidden]{display:none}
.ask-modal-card{width:min(380px,100%);background:#FFFFFF;border:1px solid #E3E6EB;border-radius:16px;box-shadow:0 20px 52px rgba(20,23,31,.14);padding:24px 24px 18px;box-sizing:border-box}
.ask-modal-title{margin:0;font-size:17px;font-weight:700;color:#14171F;letter-spacing:.01em;line-height:1.35}
.ask-modal-body{margin:12px 0 0;font-size:14px;line-height:1.65;color:#5B6372}
.ask-modal-actions{margin-top:20px;display:flex;justify-content:flex-end;gap:10px}
.ask-modal-btn{height:36px;padding:0 16px;border-radius:10px;border:1px solid #E3E6EB;background:#FFFFFF;color:#3A4250;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.ask-modal-btn:hover{background:#F4F5F7}
.ask-modal-btn.danger{border-color:transparent;background:#D9483F;color:#FFFFFF}
.ask-modal-btn.danger:hover{background:#C13B33}
.ask-modal-btn:focus-visible{outline:2px solid #2457D6;outline-offset:2px}
.ask-box{position:relative;display:flex;flex-direction:column;gap:10px;padding:12px 12px 10px 16px;border:1px solid #C9CED6;border-radius:14px;background:#FFFFFF;box-shadow:0 4px 16px rgba(20,23,31,.06)}
.ask-box:focus-within{border-color:#2457D6;box-shadow:0 0 0 3px rgba(36,87,214,.12),0 4px 16px rgba(20,23,31,.06)}
.ask-input{width:100%;border:none;outline:none;resize:none;background:transparent;font-size:14px;line-height:1.6;color:#14171F;min-height:28px;max-height:140px}
.ask-input::placeholder{color:#8A919E}
.slash-menu{position:absolute;left:0;right:0;bottom:calc(100% + 8px);z-index:40;max-height:280px;overflow:auto;padding:6px;border:1px solid #E3E6EB;border-radius:12px;background:#FFFFFF;box-shadow:0 12px 32px rgba(20,23,31,.14);box-sizing:border-box}
.slash-menu[hidden]{display:none}
.slash-sec{padding:8px 10px 4px;font-size:11px;color:#8A919E}
.slash-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:none;border-radius:8px;background:transparent;text-align:left;font:inherit;cursor:pointer;box-sizing:border-box}
.slash-item:hover,.slash-item.on{background:#F4F5F7}
.slash-item.on{background:#EAF0FD}
.slash-item .lab{flex:1;min-width:0;font-size:13px;color:#14171F;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slash-item .tag{flex:none;font-size:11px;color:#8A919E}
.slash-item .sub{flex:none;font-size:11px;color:#8A919E;font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
.slash-empty{padding:14px 12px;font-size:12px;color:#8A919E;line-height:1.55}
.send{width:32px;height:32px;border:none;border-radius:10px;background:#C9CED6;color:#FFFFFF;display:flex;align-items:center;justify-content:center;cursor:default}
.send[hidden]{display:none!important}
.send.ready{background:#2457D6;cursor:pointer}
.send.ready:hover{background:#1D47B8}
.qchip{height:26px;padding:0 10px;border:1px solid #DDE1E7;border-radius:999px;background:#FFFFFF;color:#3A4250;font:inherit;font-size:12px;cursor:pointer;white-space:nowrap}
.qchip:hover{border-color:#C9CED6;background:#F7F8FA}
.attach-menu{position:absolute;bottom:36px;left:0;z-index:20;min-width:180px;padding:6px;border:1px solid #E3E6EB;border-radius:10px;background:#FFFFFF;box-shadow:0 8px 24px rgba(20,23,31,.12)}
.attach-menu button{display:block;width:100%;padding:8px 10px;border:none;border-radius:8px;background:transparent;text-align:left;font:inherit;font-size:13px;color:#14171F;cursor:pointer}
.attach-menu button:hover{background:#F4F5F7}
.attach-menu button.on{color:#2457D6;font-weight:600}
.drawer{flex:0 0 400px;width:400px;align-self:stretch;overflow:hidden;background:#FFFFFF;border-left:1px solid #DDE1E7;box-sizing:border-box;display:none;flex-direction:column;font-size:13px}
.drawer.open{display:flex}
.md code{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:12px;background:#F4F5F7;padding:1px 4px;border-radius:4px}
.md pre{overflow:auto;padding:10px 12px;background:#F4F5F7;border-radius:8px;font-size:12px}
.md a{color:#2457D6}
.elicit{margin-top:8px;padding:12px 14px;border:1px solid #C9D7F5;border-radius:12px;background:#F5F8FF;display:flex;flex-direction:column;gap:10px}
.elicit-q{font-size:14px;font-weight:600;color:#14171F;line-height:1.5}
.elicit-opts{display:flex;flex-direction:column;gap:6px}
.elicit-opt{display:block;width:100%;padding:9px 12px;border:1px solid #C9D7F5;border-radius:10px;background:#FFFFFF;color:#2457D6;font:inherit;font-size:13px;text-align:left;cursor:pointer;box-sizing:border-box}
.elicit-opt:hover{background:#EAF0FD;border-color:#2457D6}
.elicit-opt:disabled,.elicit-skip:disabled,.elicit-go:disabled{opacity:.55;cursor:default}
.elicit-free{display:flex;gap:6px;align-items:center}
.elicit-free input{flex:1;min-width:0;height:34px;padding:0 10px;border:1px solid #DDE1E7;border-radius:8px;background:#FFFFFF;font:inherit;font-size:13px;outline:none;box-sizing:border-box}
.elicit-free input:focus{border-color:#2457D6;box-shadow:0 0 0 3px rgba(36,87,214,.12)}
.elicit-go{flex:none;height:30px;padding:0 12px;border:1px solid #14171F;border-radius:8px;background:#14171F;color:#FFFFFF;font:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:background .15s,border-color .15s}
.elicit-go:hover{background:#2457D6;border-color:#2457D6}
.elicit-skip{align-self:flex-start;border:none;background:transparent;color:#8A919E;font:inherit;font-size:12px;cursor:pointer;padding:2px 0}
.elicit-skip:hover{color:#5B6372}
.toolrail{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.tstep{display:flex;align-items:center;gap:8px;min-height:22px;font-size:13px;color:#6B7280}
.tdot{flex:none;width:7px;height:7px;border-radius:50%;background:#C9CED6}
.tdot.run{background:#2457D6;box-shadow:0 0 0 3px rgba(36,87,214,.15)}
.tdot.ok{background:#2E8B57}
.tdot.bad{background:#D9483F}
.tlab{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tlab.bad{color:#B42318;white-space:normal}
.tevbtn{margin-left:auto;border:none;background:transparent;color:#2457D6;font:inherit;font-size:12px;cursor:pointer;padding:0 2px}
.tev{margin:0;padding:8px 10px;border-radius:8px;background:#F4F5F7;color:#3A4250;font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:11px;line-height:1.5;white-space:pre-wrap;overflow:auto;max-height:220px}
.wbox{padding:10px 12px;border:1px solid #E3E6EB;border-radius:12px;background:#FFFFFF}
.wcap{font-size:13px;font-weight:600;color:#14171F;margin-bottom:8px}
.wtab{width:100%;border-collapse:collapse;font-size:13px}
.wtab th,.wtab td{padding:6px 8px;border-bottom:1px solid #EEF0F3;text-align:left;vertical-align:top}
.wtab th{font-size:11px;color:#8A919E;font-weight:600}
.wsvg{display:block;width:100%;height:auto}
.wchart{display:flex;align-items:center;gap:12px}
.wleg{display:flex;flex-direction:column;gap:4px;font-size:12px;color:#3A4250}
.wleg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.wcode{margin:0;padding:10px 12px;border-radius:10px;background:#F4F5F7;overflow:auto;font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:12px;line-height:1.5}
.wcode .wfn{display:block;margin-bottom:6px;color:#8A919E;font-size:11px}
.werr{padding:10px 12px;border:1px solid #F0B4AF;border-radius:10px;background:#FDF6F6;color:#B42318;font-size:13px}
.werr .wdet{margin-top:4px;color:#5B6372;font-size:12px}
.tprog{display:flex;align-items:center;gap:8px;font-size:13px;color:#6B7280}
.tprogbar{flex:1;height:6px;border-radius:999px;background:#EEF0F3;overflow:hidden}
.tprogbar i{display:block;height:100%;background:#2457D6}
.scard{padding:10px 12px;border:1px solid #E3E6EB;border-radius:12px;background:#FAFBFD;display:flex;flex-direction:column;gap:8px}
.srow{display:flex;align-items:flex-start;gap:8px}
.stag{font-size:11px;font-weight:600;color:#8A919E}
.sname{font-size:13px;font-weight:600;color:#14171F}
.sexc,.swhy,.stitle{font-size:13px;color:#3A4250;line-height:1.5}
.stitle{font-weight:600}
.scmp{padding-top:8px;border-top:1px solid #EEF0F3;display:flex;flex-direction:column;gap:2px}
.spill{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:999px;background:#EAF0FD;color:#2457D6;font-size:11px;font-weight:600}
.schips{display:flex;flex-wrap:wrap;gap:6px}
.wimg{max-width:100%;border-radius:10px;display:block}
</style>
</head>

    ctx: { hold: true, market: true }, attachOpen: false, notif: false, notifTab: 'alert', notifs: [], unread: 0,
  };
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function toast(msg) { const el = $('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), 2200); }
  function askConfirm({ title, body, okText }) {
    return new Promise((resolve) => {
      const modal = $('askModal');
      $('askModalTitle').textContent = title || '确认';
      $('askModalBody').textContent = body || '';
      $('askModalOk').textContent = okText || '确定';
      modal.hidden = false;
      const finish = (ok) => {
        modal.hidden = true;
        $('askModalOk').onclick = null;
        $('askModalCancel').onclick = null;
        modal.onclick = null;
        document.removeEventListener('keydown', onKey);
        resolve(ok);
      };
      const onKey = (e) => {
        if (e.key === 'Escape') finish(false);
        if (e.key === 'Enter') finish(true);
      };
      $('askModalOk').onclick = () => finish(true);
      $('askModalCancel').onclick = () => finish(false);
      modal.onclick = (e) => { if (e.target === modal) finish(false); };
      document.addEventListener('keydown', onKey);
      $('askModalOk').focus();
    });
  }
  function hhmm(d) {
    d = d instanceof Date ? d : new Date(d || Date.now());
    return [d.getHours(), d.getMinutes()].map((n) => String(n).padStart(2, '0')).join(':');
  }
  function clock() {
    const d = new Date(), t = d.getHours() * 60 + d.getMinutes(), wk = d.getDay() > 0 && d.getDay() < 6;
    const live = wk && ((t >= 570 && t <= 690) || (t >= 780 && t <= 900));
    const c = [d.getHours(), d.getMinutes(), d.getSeconds()].map((n) => String(n).padStart(2, '0')).join(':');
    $('session').innerHTML = '<span style="width:7px;height:7px;border-radius:50%;background:' + (live ? '#2E8B57' : '#A1A7B2') + '"></span>' + (live ? '交易中' : wk ? '已休市' : '休市日') + ' · 行情 <span style="' + MONO + '">' + c + '</span>';
  }
  async function loadIndexes() {
    try {
      const j = await (await fetch(API + '/api/v1/market/summary')).json();
      const want = ['上证', '深成', '创业板'];
      const rows = j.indexes || [];
      const pick = want.map((w) => rows.find((r) => String(r.name).indexOf(w) >= 0)).filter(Boolean);
      $('footIndexes').innerHTML = (pick.length ? pick : rows.slice(0, 3)).map((r) => {
        const pct = r.pct, color = pct > 0 ? '#B42318' : pct < 0 ? '#1E6B44' : '#5B6372';
        const sign = pct > 0 ? '+' : pct < 0 ? '−' : '';
        return '<span>' + esc(r.name) + ' <span style="' + MONO + ';color:' + color + '">' + Number(r.close).toFixed(2) + ' ' + (pct == null ? '' : sign + Math.abs(pct).toFixed(2) + '%') + '</span></span>';
      }).join('');
      $('dot').style.background = '#2E8B57';
      $('status').textContent = j.generated_at ? ('数据时间 ' + j.generated_at) : '已连接';
    } catch (e) { $('dot').style.background = '#D9483F'; $('status').textContent = '没有连上行情服务'; }
  }
  setInterval(clock, 1000); clock(); loadIndexes();

    $('ctxChips').innerHTML = CTX_OPTS.filter((o) => state.ctx[o.id]).map((o) =>

    ).join('');
  }
  function activeCtxLabels() { return CTX_OPTS.filter((o) => state.ctx[o.id]).map((o) => o.label); }

  function dayLabel(ts) {
    const d = new Date(ts), now = new Date();
    const start = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
    const diff = (start(now) - start(d)) / 86400000;
    if (diff < 1) return '今天';
    if (diff < 7) return '最近 7 天';
    return '更早';
  }
  // Never surface raw session-N ids in the UI. Title comes from the first real user question.
  function realTitle(s) {
    const t = String((s && (s.title || s.question || s.lastMessage)) || '').trim();
    if (!t || /^session-\d+$/i.test(t)) return '';
    return t;
  }
  function titleOf(s) {
    return realTitle(s) || '新对话';
  }
  function hasTitle(s) {
    return !!realTitle(s);
  }
  function renderList() {
    const q = state.filter.trim().toLowerCase();
    // Untitled sessions stay off the list until a title exists — except the one currently open.
    const items = state.sessions.filter((s) => {
      if (!hasTitle(s) && s.id !== state.id) return false;
      if (!q) return true;
      return titleOf(s).toLowerCase().includes(q);
    });
    const when = (s) => Number(s.updatedAt || s.createdAt || 0);
    items.sort((a, b) => when(b) - when(a) || String(b.id).localeCompare(String(a.id)));
    if (!items.length) {
      $('sessList').innerHTML = '<div style="padding:24px 10px;color:#8A919E;font-size:12px;text-align:center">' + (q ? '没有匹配的对话' : '暂无对话') + '</div>';
      return;
    }
    const groups = {};
    items.forEach((s) => {
      const g = dayLabel(s.updatedAt || s.createdAt || Date.now());
      (groups[g] = groups[g] || []).push(s);
    });
    const order = ['今天', '最近 7 天', '更早'];
    $('sessList').innerHTML = order.filter((g) => groups[g]).map((g) =>

          '<button type="button" class="sess-del" data-del="' + esc(s.id) + '" title="删除对话" aria-label="删除对话">×</button>' +
        '</div>';
      }).join('')

  }

  async function api(path, init) {
    const res = await fetch(path, init);
    if (res.status === 204) return null;
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || res.statusText || ('HTTP ' + res.status));
    return data;
  }
  async function deleteSession(id) {
    if (!id) return;
    const s = state.sessions.find((x) => x.id === id) || { id };
    const named = realTitle(s);
    const ok = await askConfirm({
      title: '删除对话',
      body: named

        : '确定删除这条对话吗？删除后无法恢复。',
      okText: '删除',
    });
    if (!ok) return;
    try {
      if (state.es) { try { state.es.close(); } catch (_) {} state.es = null; }
      if (state.abort) { try { state.abort.abort(); } catch (_) {} state.abort = null; }
      state.streaming = false;
      await api('/sessions/' + encodeURIComponent(id), { method: 'DELETE' });
      state.sessions = state.sessions.filter((s) => s.id !== id);
      if (state.id === id) {
        state.id = '';

        url.searchParams.delete('session');

        if (state.sessions[0]) await openSession(state.sessions[0].id);

      toast('删除失败：' + e.message);

  const BUBBLE = 'font-size:16px;line-height:1.7;color:#14171F;display:flex;flex-direction:column;gap:12px;width:100%;min-width:0';

  const mdInline = (src) => String(src == null ? '' : src).split(/(`[^`\n]+`)/).map((seg, i) => {

  // 表格：整体一个圆角框，只留横线；短列、数字列不换行，数字右对齐用等宽字，长文字列留出宽度；右下角能复制成表格数据。
  const isNumCell = (c) => /^[+\-−–]?\s*\d[\d,]*(\.\d+)?\s*(%|亿元|万元|亿|万|元|倍|个点|股|天|日)?$/.test(String(c).replace(/\*\*|`/g, '').trim());
  const mdTable = (rows) => {

  const MD_PREAMBLE = /^(?:[*_]{1,2})?\s*(?:数据截至|东财金额分档|分析日期|时间窗口|口径)/;

  const cleanSug = (s) => String(s || '').replace(/\*\*|`/g, '').replace(/^[「『"']|[」』"']$/g, '').trim();
  const sugList = (qs) => (qs || []).map((q) => typeof q === 'string' ? q : (q && (q.question || q.text || q.q || q.focus)) || '').map(cleanSug).filter(Boolean);
  const splitSuggestions = (text) => {

      const hm = SUGG_HEAD.exec(lines[i]);

  function plainFromParts(parts) {
    if (typeof parts === 'string') return parts;
    if (!Array.isArray(parts)) return '';
    return parts.map((p) => {
      if (typeof p === 'string') return p;
      if (!p || typeof p !== 'object') return '';
      const kind = p.kind || p.type || '';
      if (kind === 'tool-call' || kind === 'tool_call' || kind === 'tool-result' || kind === 'tool_result' || kind === 'reasoning') return '';
      if (typeof p.text === 'string') return p.text;
      if (typeof p.content === 'string') return p.content;
      if (p.content && typeof p.content.text === 'string') return p.content.text;
      return '';
    }).filter(Boolean).join('\n').trim();
  }
  function messageText(m) {
    if (!m || typeof m !== 'object') return typeof m === 'string' ? m : '';
    if (typeof m.text === 'string' && m.text) return m.text;

  function stripCtxPrefix(text) {

  // 历史/跳转里可能带着「请调用 ask_analyst：…」编排指令；气泡只给人话问题。
  function prettyUserText(text) {

  function parseMention(text) {
    const m = MENTION_RE.exec(text);
    if (!m) return { who: '', question: text.trim(), forced: false };
    return {
      who: WHO_OF[m[1]] || '',
      question: (text.slice(0, m.index) + ' ' + text.slice(m.index + m[0].length)).replace(/\s+/g, ' ').trim(),
      forced: true,

  }
  function hintDomains(text) {
    const t = String(text || '').toLowerCase();
    const scored = DOMAIN.map((id) => {
      let score = 0;
      (DOMAIN_HINTS[id] || []).forEach((h) => { if (t.indexOf(h.toLowerCase()) >= 0) score += h.length; });
      return { id: id, score: score };
    }).filter((x) => x.score > 0).sort((a, b) => b.score - a.score);
    return scored.map((x) => x.id);
  }
  function extractCodes(text) {
    const out = [], seen = {};
    const re = /\b(\d{6})(?:\.(SH|SZ|BJ))?\b/gi;
    let m;
    while ((m = re.exec(text))) {
      const six = m[1];
      let suf = (m[2] || '').toUpperCase();
      if (!suf) {
        if (six[0] === '6' || six[0] === '9') suf = 'SH';
        else if (six[0] === '0' || six[0] === '3') suf = 'SZ';
        else if (six[0] === '4' || six[0] === '8') suf = 'BJ';
        else suf = 'SH';
      }
      const code = six + '.' + suf;
      if (!seen[code]) { seen[code] = 1; out.push(code); }
    }
    return out;
  }
  function nameCandidates(text) {
    let q = String(text || '').replace(MENTION_RE, '');
    q = q.replace(/[？?。！!，,、\s]+/g, ' ').trim();
    // 去掉常见动词，避免「分析下三花智控」整句搜不到
    const stripped = q.replace(/^(请|帮我|帮忙|给我|麻烦|想|要)?(分析|研判|诊断|看看|讲讲|介绍|解读|聊聊|说说|评价|复盘)(一下|下|一波|一)?/g, '').trim();
    const cands = [];
    const push = (s) => {
      s = String(s || '').trim();
      if (s.length >= 2 && s.length <= 12 && cands.indexOf(s) < 0) cands.push(s);
    };
    push(stripped);
    push(q);
    (stripped.match(/[\u4e00-\u9fff]{2,8}/g) || []).forEach(push);
    (q.match(/[\u4e00-\u9fff]{2,8}/g) || []).forEach(push);

      return code + '.' + ((s === '6' || s === '9') ? 'SH' : (s === '4' || s === '8') ? 'BJ' : 'SZ');
    }
    return String(code).toUpperCase();
  }
  async function searchStockHit(q) {
    if (!q) return null;
    try {
      const j = await (await fetch(API + '/api/v1/stocks/search?q=' + encodeURIComponent(q))).json();
      const items = j.items || j.results || [];
      const a = items.find((it) => /\.(SH|SZ|BJ)$/i.test(it.ts_code || '')) || items[0];
      if (!a) return null;
      const code = normalizeTsCode(a.ts_code || a.code);
      if (!code) return null;
      return { code: code, name: String(a.name || a.stock_name || '').trim() };
    } catch (e) { return null; }
  }
  async function searchTsCode(q) {

  async function resolveStock(text) {
    const codes = extractCodes(text);
    if (codes.length) return codes[0];
    const cands = nameCandidates(text);
    for (let i = 0; i < cands.length; i++) {
      const hit = await searchStockHit(cands[i]);
      if (hit && hit.code) {
        if (hit.name) state.lastName = hit.name;
        return hit.code;
      }
    }
    return '';
  }
  // 问问路由：用服务端意图识别，不在前端堆关键词规则。
  // 1.2s 超时直接放弃，避免发送前白等；超时/失败当 null，按原问题进会话流。
  async function classifyAsk(question) {

  async function planAnalysts(code, question) {
    const previous = (state.lastAnalysts || []).filter((id) => DOMAIN.indexOf(id) >= 0);
    try {
      const res = await fetch('/api/stocks/' + encodeURIComponent(code) + '/agents/chief/plan', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: question, previous: previous }),

      if (!res.ok) throw new Error('安排失败');
      const plan = await res.json();

      if (ids.length) return ids;

  async function sseOnce(url, init, onDraft) {
    const ctrl = state.abort = new AbortController();
    const res = await fetch(url, Object.assign({}, init, { signal: ctrl.signal }));

      throw new Error(why || ('服务返回 ' + res.status));

      draftTimer = 0;
      if (!pendingDraft || !onDraft) return;
      const d = pendingDraft; pendingDraft = null;
      onDraft(d);
    };
    const take = (block) => {
      let ev = 'message';
      const data = [];
      block.split('\n').forEach((l) => {
        if (l.indexOf('event:') === 0) ev = l.slice(6).trim();
        else if (l.indexOf('data:') === 0) data.push(l.slice(5).replace(/^ /, ''));
      });
      if (!data.length) return;
      let body;
      try { body = JSON.parse(data.join('\n')); } catch (e) { return; }

        pendingDraft = body || {};

      } else if (ev === 'message') {
        if (draftTimer) { clearTimeout(draftTimer); flushDraft(); }
        msg = body;
      } else if (ev === 'error') failure = body.error || '分析失败';
    };
    for (;;) {
      const r = await reader.read();
      if (r.done) break;
      buf += dec.decode(r.value, { stream: true }).replace(/\r\n/g, '\n');
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) { take(buf.slice(0, i)); buf = buf.slice(i + 2); }
    }
    if (buf.trim()) take(buf);
    if (draftTimer) { clearTimeout(draftTimer); flushDraft(); }
    if (failure) throw new Error(failure);
    if (!msg) {
      if (lastDraft) return { text: lastDraft };

          const data = JSON.parse(e.data);
          const rail = ensureRail(card);
          if (!rail) return;
          sealText(card);
          addStep(rail, data.callId, toolTag(data.toolName, data.args));
          const status = card.querySelector('.status');
          if (status) { status.textContent = toolTag(data.toolName, data.args) + '…'; status.style.color = '#A1A7B2'; }
        } catch {}
      });
      on('tool-result', (e) => {
        try {
          const data = JSON.parse(e.data);
          const rail = ensureRail(card);
          if (!rail) return;
          finishStep(rail, data.callId, data.text, !!carded[data.callId]);
        } catch {}
      });
      on('stock-card', (e) => {
        try {
          const data = JSON.parse(e.data);
          if (data.callId) carded[data.callId] = true;
          const rail = ensureRail(card);
          if (!rail) return;
          const hit = findStep(rail, data.callId);
          if (hit) { hit.row.remove(); if (hit.pre) hit.pre.remove(); }
          mountStockCard(rail, data);
        } catch {}
      });
      on('table', (e) => { try { const rail = ensureRail(card); if (rail) mountTable(rail, JSON.parse(e.data)); } catch {} });
      on('chart', (e) => { try { const rail = ensureRail(card); if (rail) mountChart(rail, JSON.parse(e.data)); } catch {} });
      on('suggestion', (e) => { try { const rail = ensureRail(card); if (rail) mountSuggestion(rail, JSON.parse(e.data)); } catch {} });
      on('code', (e) => { try { const rail = ensureRail(card); if (rail) mountCode(rail, JSON.parse(e.data)); } catch {} });
      on('progress', (e) => { try { const rail = ensureRail(card); if (rail) mountProgress(rail, JSON.parse(e.data)); } catch {} });
      on('image', (e) => { try { const rail = ensureRail(card); if (rail) mountImage(rail, JSON.parse(e.data)); } catch {} });
      on('done', (e) => {
        let data = null;
        try { data = e && e.data ? JSON.parse(e.data) : null; } catch {}
        if (data && data.failed) {
          const msg = friendlyModelError(data.errorMessage || data.message || '本轮失败');
          finish(buf ? (buf + '\n\n' + msg) : msg, true);
          return;
        }
        const empty = !String(buf || '').trim();
        // 接流晚了一拍、回合已 idle：服务端发空 done，不要画成「失败 / 没有正文」。
        if (empty && !text) {
          finished = true;
          clearElicit();
          if (es) { try { es.close(); } catch (_) {} }
          state.es = null;
          state.streaming = false;
          if (state.streamCard === card) state.streamCard = null;
          try { card.remove(); } catch (_) {}
          syncSend();
          return;
        }
        finish(buf || '（没有正文）', empty);
      });
      on('error', (e) => {
        let data = null;
        try { data = JSON.parse(e.data); } catch {}
        // show_error 的展示事件也叫 error，不能当成回合失败把流关掉
        if (data && data.message && data.error == null && !data.failed && !data.errorMessage) {
          const rail = ensureRail(card);
          if (rail) mountError(rail, data);
          return;
        }
        try {
          const raw = (data && (data.errorMessage || data.message || data.error)) || '出错了';
          buf += (buf ? '\n' : '') + friendlyModelError(raw);
        } catch {}
        finish(buf || '出错了', true);
      });
      source.onerror = () => {
        if (finished) return;
        // 等用户点选时：关掉带 text= 的源，改挂只看不发的流，避免自动重连再 Followup
        if (card && card.querySelector('.elicit')) {
          try { source.close(); } catch (_) {}
          if (state.es === source) state.es = null;
          openWatch();
          return;
        }
        if (buf) {
          finish(buf);
          return;
        }
        setTimeout(() => {
          if (finished) return;
          if (card && card.querySelector('.elicit')) {
            try { source.close(); } catch (_) {}
            if (state.es === source) state.es = null;
            openWatch();
            return;
          }
          finish(buf || '连接中断，请再试一次', true);
        }, 80);
      };
    };
    const openWatch = () => {
      if (finished) return;
      if (state.es) return;
      // 服务端会从本步 step/start 重放；清掉已收内容，避免正文叠两遍。
      buf = '';
      card._buf = '';
      card._seal = 0;
      Object.keys(carded).forEach((k) => { delete carded[k]; });
      const body = card.querySelector('.body');
      if (body) { body.innerHTML = ''; body.classList.add('live'); }
      const rail = card.querySelector('.rail');
      if (rail) rail.innerHTML = '';
      es = new EventSource('/sessions/' + encodeURIComponent(state.id) + '/stream');
      state.es = es;
      bind(es);
    };
    const q = text ? ('?text=' + encodeURIComponent(text)) : '';
    es = new EventSource('/sessions/' + encodeURIComponent(state.id) + '/stream' + q);
    state.es = es;
    bind(es);
  }

  async function sendRouted(text) {
    // 会话主理人编排：分析师/对比/想买都是 session tools，默认走会话流。
    const mentioned = parseMention(text);
    const question = mentioned.question || text;
    const host = addAI('assistant');
    host._retryUser = text;
    host._retryAsk = text;
    host.querySelector('.status').textContent = '正在安排…';
    setAIWho(host, 'assistant');
    const whoLabel = host.querySelector('.whoName');
    if (whoLabel) whoLabel.textContent = '主理人';

    try {
      // @ 点名已定路由，跳过意图识别，少一次阻塞模型调用。
      const intent = (mentioned.forced && mentioned.who && ROLE[mentioned.who])
        ? null
        : await classifyAsk(question);
      let ask = (intent && intent.ask) || question;
      let tipText = (intent && intent.note) || '';
      let code = '';

      // 只有意图明确点了标的 / 明确 reuse 时才带代码；禁止把上一只个股默认塞给分析师。
      const freeAnalyst = (who) => who === 'news' || who === 'market';
      if (intent && intent.reuse_last && state.lastCode) {
        code = state.lastCode;
        if (!/\d{6}/.test(ask)) {
          ask = '【上下文：上一只股票 ' + (state.lastName ? state.lastName + ' ' : '') + state.lastCode + '】\n' + ask;
        }
      } else if (intent && intent.stock_query) {
        try { code = await resolveStock(intent.stock_query); } catch (e) {}
      } else if (intent && (intent.intent === 'stock_new' || intent.intent === 'stock_followup')) {
        try { code = await resolveStock(question); } catch (e) {}
      }
      if (code) {
        state.lastCode = code;
        if (!state.lastName) {
          try {
            const hit = await searchStockHit(code);
            if (hit && hit.name) state.lastName = hit.name;
          } catch (e) {}
        }
      }

      // @点名或侧栏指定：写成明确指令，让主理人用 ask_analyst 召唤。
      // 大盘/新闻可不带代码；其他维度仅在本句已解析出代码时才带，绝不回落上一只个股。
      if (mentioned.forced && mentioned.who && ROLE[mentioned.who]) {
        const need = code || '';
        if (freeAnalyst(mentioned.who) && !need) {
          ask = '请调用 ask_analyst：analyst=' + mentioned.who + '，question=' + question;
        } else {
          ask = '请调用 ask_analyst：analyst=' + mentioned.who +
            (need ? '，ts_code=' + need : '（若还没有代码先 search_stock，禁止沿用上一只个股）') +
            '，question=' + question;
        }
        tipText = tipText || ('点名 ' + ROLE[mentioned.who].name);
      } else if (state.pickedWho && state.pickedWho !== 'auto' && ROLE[state.pickedWho]) {
        const need = code || '';
        if (freeAnalyst(state.pickedWho) && !need) {
          ask = '请优先调用 ask_analyst：analyst=' + state.pickedWho + '，回答：' + ask;
        } else {
          ask = '请优先调用 ask_analyst：analyst=' + state.pickedWho +
            (need ? '，ts_code=' + need : '') +
            '，回答：' + ask;
        }
      }

      const ctxLabels = activeCtxLabels();
      if (ctxLabels.length) {
        ask = '【带上：' + ctxLabels.join('、') + '】\n' + ask;
      }
      if (tipText) {
        const tip = document.createElement('div');
        tip.style.cssText = 'font-size:13px;color:#8A919E;padding:0 0 4px 44px';
        tip.textContent = tipText;
        host.before(tip);
      }
      host._retryAsk = ask;
      host.querySelector('.status').textContent = '正在回答…';
      sendSession(ask, host);
    } catch (err) {
      failCard(host, friendlyModelError((err && err.message) || '发送失败'));
    }
  }

  function send(text) {
    text = (text || '').trim();
    if (!text || state.streaming) return;
    const routed = parseAskAnalystRoute(text);
    if (routed) {
      state.pickedWho = routed;
      syncPicker();
      const who = routed === 'auto' ? 'chief' : routed;
      $('pickerAv').innerHTML = avatarHTML(who, 18);
    }
    const shown = prettyUserText(text);
    if (!state.id) { newChat(shown); return; }
    if (!$('msgs').querySelector('.msg')) $('msgs').innerHTML = '';
    addUser(shown);
    state.streaming = true; syncSend();
    sendRouted(shown);
  }

        '<span style="display:flex;align-items:center;gap:8px"><span class="mono" style="font-size:11px;color:#8A919E">' + esc(n.time || hhmm(n.created_at || n.ts)) + '</span>' +

  async function loadNotif() {
    try {
      const data = await api('/notify/inbox').catch(() => api('/api/v1/notify/inbox').catch(() => null));
      if (!data) { state.notifs = []; state.unread = 0; renderNotif(); updateBell(); return; }
      state.notifs = data.items || data.notifications || data || [];

  function hideSlash() {
    state.slash = { open: false, kind: '', start: 0, query: '', items: [], idx: 0 };
    $('slashMenu').hidden = true;
    $('slashMenu').innerHTML = '';
  }
  function detectSlash(el) {
    const caret = el.selectionStart == null ? el.value.length : el.selectionStart;
    const before = el.value.slice(0, caret);
    const m = before.match(/(^|[\s，,。！!？?；;：:\n])([@#])([^\s@#]*)$/);
    if (!m) return null;
    return { kind: m[2], start: before.length - m[2].length - m[3].length, query: m[3], end: caret };
  }
  async function loadSlashStocks(force) {
    if (!force && state.slashStocks) return state.slashStocks;
    const out = [];
    const seen = {};
    const push = (kind, r) => {
      const code = String((r && (r.ts_code || r.code)) || '').trim();
      const name = String((r && r.name) || '').trim();
      if (!code || !name || seen[code]) return;
      seen[code] = true;
      out.push({ kind: kind, name: name, ts_code: code });
    };
    try {
      const sum = await api('/api/v1/holdings/summary');
      (sum.rows || []).forEach((r) => push('hold', r));
    } catch (_) {}
    try {
      const buy = await api('/api/v1/holdings/tab/buy');
      (buy.items || []).forEach((r) => push('buy', r));
    } catch (_) {}
    state.slashStocks = out;
    return out;
  }
  function renderSlashMenu() {
    const menu = $('slashMenu');
    const s = state.slash;
    if (!s.open) { menu.hidden = true; return; }
    if (!s.items.length) {
      menu.innerHTML = '<div class="slash-empty">' + (s.kind === '#'
        ? '还没有持仓或想买的股票。可先到持仓页添加。'
        : '没有匹配的分析师') + '</div>';
      menu.hidden = false;
      return;
    }
    let html = '';
    let lastGroup = '';
    s.items.forEach((it, i) => {
      const g = it.group || '';
      if (g && g !== lastGroup) {
        html += '<div class="slash-sec">' + esc(g) + '</div>';
        lastGroup = g;
      }
      html += '<button type="button" class="slash-item' + (i === s.idx ? ' on' : '') + '" data-slash="' + i + '" role="option" aria-selected="' + (i === s.idx) + '">' +
        (it.avatar || '') +
        '<span class="lab">' + esc(it.label) + '</span>' +
        (it.tag ? '<span class="tag">' + esc(it.tag) + '</span>' : '') +
        (it.sub ? '<span class="sub">' + esc(it.sub) + '</span>' : '') +
        '</button>';
    });
    menu.innerHTML = html;
    menu.hidden = false;
    const on = menu.querySelector('.slash-item.on');
    if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest' });
  }
  function moveSlash(delta) {
    const s = state.slash;
    if (!s.open || !s.items.length) return;
    s.idx = (s.idx + delta + s.items.length) % s.items.length;
    renderSlashMenu();
  }
  function insertSlash(item) {
    if (!item) return;
    const el = $('chatInput');
    const s = state.slash;
    const before = el.value.slice(0, s.start);
    const after = el.value.slice(el.selectionStart == null ? el.value.length : el.selectionStart);
    const ins = item.insert;
    el.value = before + ins + after;
    const pos = before.length + ins.length;
    el.focus();
    el.setSelectionRange(pos, pos);
    el.style.height = 'auto';
    el.style.height = Math.min(140, el.scrollHeight) + 'px';
    if (item.who) {
      state.pickedWho = item.who;
      syncPicker();
      $('pickerAv').innerHTML = avatarHTML(item.who, 18);
    }
    if (item.ts_code) {
      state.lastCode = item.ts_code;
      if (item.name) state.lastName = item.name;
    }
    hideSlash();
    syncSend();
  }
  function pickSlash() {
    const s = state.slash;
    if (!s.open || !s.items.length) return;
    insertSlash(s.items[s.idx]);
  }
  async function syncSlashMenu() {
    const el = $('chatInput');
    const hit = detectSlash(el);
    if (!hit) { hideSlash(); return; }
    const q = String(hit.query || '').toLowerCase();
    const items = [];
    if (hit.kind === '@') {
      MENTIONABLE.forEach((id) => {
        const r = ROLE[id];
        if (!r) return;
        const hay = (r.name + ' ' + r.short + ' ' + id).toLowerCase();
        if (q && hay.indexOf(q) < 0) return;
        items.push({
          group: '分析师',
          label: r.name,
          tag: r.short !== r.name ? r.short : '',
          avatar: avatarHTML(id, 22),
          insert: '@' + r.name + ' ',
          who: id,
        });
      });
    } else {
      const stocks = await loadSlashStocks(!state.slash.open || state.slash.kind !== '#');
      // caret may have moved while awaiting
      const again = detectSlash(el);
      if (!again || again.kind !== '#' || again.start !== hit.start) return;
      stocks.forEach((st) => {
        const hay = (st.name + ' ' + st.ts_code).toLowerCase();
        if (q && hay.indexOf(q) < 0) return;
        items.push({
          group: st.kind === 'buy' ? '想买' : '持仓',
          label: st.name,
          sub: st.ts_code,
          tag: st.kind === 'buy' ? '想买' : '持有',
          insert: st.name + ' ',
          name: st.name,
          ts_code: st.ts_code,
        });
      });
      // keep 持仓 before 想买
      items.sort((a, b) => (a.group === b.group ? 0 : (a.group === '持仓' ? -1 : 1)));
    }
    state.slash = { open: true, kind: hit.kind, start: hit.start, query: hit.query, items: items, idx: 0 };
    renderSlashMenu();
  }

  $('newChat').addEventListener('click', () => newChat());

  $('chatInput').addEventListener('input', () => {
    const el = $('chatInput');
    el.style.height = 'auto';
    el.style.height = Math.min(140, el.scrollHeight) + 'px';
    syncSend();
    syncSlashMenu();
  });
  $('chatInput').addEventListener('keydown', (e) => {
    if (state.slash.open) {
      if (e.key === 'ArrowDown') { e.preventDefault(); moveSlash(1); return; }
      if (e.key === 'ArrowUp') { e.preventDefault(); moveSlash(-1); return; }
      if ((e.key === 'Enter' || e.key === 'Tab') && !e.shiftKey && !e.isComposing) {
        if (state.slash.items.length) { e.preventDefault(); pickSlash(); return; }
      }
      if (e.key === 'Escape') { e.preventDefault(); hideSlash(); return; }
    }
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('sendBtn').click(); }
  });
  $('slashMenu').addEventListener('mousedown', (e) => {
    const b = e.target.closest('[data-slash]');
    if (!b) return;
    e.preventDefault();
    const i = Number(b.dataset.slash);
    if (!Number.isFinite(i)) return;
    state.slash.idx = i;
    pickSlash();
  });
  $('sendBtn').addEventListener('click', () => {
    hideSlash();
    const t = $('chatInput').value;
    $('chatInput').value = '';
    $('chatInput').style.height = 'auto';
    syncSend();
    send(t);
  });
  $('stopBtn').addEventListener('click', stop);
  $('attachBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    state.attachOpen = !state.attachOpen;
    $('attachMenu').hidden = !state.attachOpen;
  });
  $('attachMenu').addEventListener('click', (e) => {
    const b = e.target.closest('[data-tog]'); if (!b) return;
    state.ctx[b.dataset.tog] = !state.ctx[b.dataset.tog];
    renderCtx();
  });
  $('ctxChips').addEventListener('click', (e) => {
    const b = e.target.closest('[data-rm]'); if (!b) return;
    state.ctx[b.dataset.rm] = false;
    renderCtx();
  });
  document.addEventListener('click', (e) => {
    if (state.attachOpen) { state.attachOpen = false; $('attachMenu').hidden = true; }
    if (state.slash.open && !e.target.closest('.ask-box')) hideSlash();
  });
  $('bell').addEventListener('click', () => {
    state.notif = !state.notif;
    updateBell();
    if (state.notif) loadNotif();
  });
  $('notifClose').addEventListener('click', () => { state.notif = false; updateBell(); });
  $('notifTabs').addEventListener('click', (e) => {
    const b = e.target.closest('[data-ntab]'); if (!b) return;
    state.notifTab = b.dataset.ntab; renderNotif();
  });
  $('notifBody').addEventListener('click', async (e) => {
    const b = e.target.closest('[data-ndel]');
    if (!b) return;
    const id = b.dataset.ndel;
    if (!id) return;
    b.disabled = true;
    try {
      await api('/notify/inbox/delete', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ids: [id] }) });
      state.notifs = state.notifs.filter((n) => (n.notif_id || n.id) !== id);
      state.unread = state.notifs.filter((n) => !(n.read || n.is_read)).length;
      renderNotif(); updateBell();
    } catch (err) {
      b.disabled = false;
      toast((err && err.message) || '删除失败');
    }
  });
  $('notifReadAll').addEventListener('click', async () => {
    try { await api('/notify/inbox/delete', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ all: true }) }); } catch {}
    state.notifs = [];
    state.unread = 0; renderNotif(); updateBell();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && state.notif) { state.notif = false; updateBell(); }
    if (e.key === 'Escape' && state.slash.open) hideSlash();
  });


  function renderPickerMenu() {
    const items = [['auto', '自动选分析师']].concat(MENTIONABLE.map((k) => [k, ROLE[k].name]));
    $('pickerMenu').innerHTML = items.map(([id, lab]) =>
      '<button type="button" class="' + ((state.pickedWho || 'auto') === id ? 'on' : '') + '" data-pick="' + id + '">' + esc(lab) + '</button>'
    ).join('');
  }
  $('pickerBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    const open = $('pickerMenu').hidden;
    $('pickerMenu').hidden = !open;
    if (open) renderPickerMenu();
  });
  $('pickerMenu').addEventListener('click', (e) => {
    const b = e.target.closest('[data-pick]'); if (!b) return;
    state.pickedWho = b.dataset.pick;
    syncPicker();
    const who = state.pickedWho === 'auto' ? 'chief' : state.pickedWho;
    $('pickerAv').innerHTML = avatarHTML(who, 18);
    $('pickerMenu').hidden = true;
  });
  $('pickerAv').innerHTML = avatarHTML('chief', 18);
  syncPicker();

  renderCtx(); updateBell();
  (async function boot() {
    await loadSessions();
    loadNotif();
    const seedAnalyst = (params.get('analyst') || '').trim();
    if (seedAnalyst && ROLE[seedAnalyst] && MENTIONABLE.indexOf(seedAnalyst) >= 0) {
      state.pickedWho = seedAnalyst;
      syncPicker();
      $('pickerAv').innerHTML = avatarHTML(seedAnalyst, 18);
    } else if (seedAnalyst === 'bull' || seedAnalyst === 'bear') {
      toast('看多/看空请到研判页使用');
    }
    const seed = prettyUserText(params.get('text') || '');
    if (state.id) await openSession(state.id, { text: seed });
    else if (seed) await newChat(seed);
    else if (state.sessions[0]) await openSession(state.sessions[0].id);
    else emptyState();
    // 吃掉 text/analyst，避免刷新又发一遍
    if (params.get('text') || params.get('analyst')) {
      const url = new URL(location.href);
      url.searchParams.delete('text');
      url.searchParams.delete('analyst');
      const q = url.searchParams.toString();
      history.replaceState(null, '', url.pathname + (q ? '?' + q : '') + url.hash);
    }
    syncSend();
  })();
})();
</script>
</body>
</html>
