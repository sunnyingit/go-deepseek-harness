<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>太阳系 · 点一点</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpolygon fill='%239b1b1b' points='16,2 20.12,12.47 31.51,12.47 22.2,18.94 25.64,29.53 16,22.9 6.36,29.53 9.8,18.94 0.49,12.47 11.88,12.47'/%3E%3C/svg%3E" />
  <style>
    :root {
      --space: #05060f;
      --star: #cfd6ff;
      --text: #e8ecff;
      --muted: #9aa3c7;
      --panel: rgba(16, 20, 48, 0.82);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--space);
      color: var(--text);
      font-family: "Songti SC", "STSong", "SimSun", "Kaiti SC", "KaiTi", Georgia, serif;
      overflow: hidden;
    }
    /* 星空背景 */
    #stars { position: fixed; inset: 0; z-index: 0; }

    header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 5;
      padding: 18px 28px; text-align: center;
      pointer-events: none;
    }
    header h1 {
      margin: 0; font-size: 26px; letter-spacing: 6px; font-weight: 400;
      text-shadow: 0 0 18px rgba(160,180,255,.6);
    }
    header p { margin: 6px 0 0; font-size: 13px; color: var(--muted); letter-spacing: 2px; }

    /* 太阳系画布 */
    #stage { position: fixed; inset: 0; z-index: 2; display: block; }
    .orb { cursor: pointer; }
    .orb circle { transition: filter .25s; }
    .orb:hover .halo { filter: brightness(1.5); }
    .orb .lbl {
      fill: var(--text); font-size: 12px; letter-spacing: 1px;
      text-anchor: middle; opacity: .85; font-weight: 600;
      paint-order: stroke; stroke: rgba(0,0,0,.6); stroke-width: 3px;
    }

    /* 介绍面板 */
    #info {
      position: fixed; right: 26px; top: 84px; bottom: 26px; width: 320px;
      z-index: 6; background: var(--panel); border: 1px solid rgba(140,155,220,.28);
      border-radius: 14px; padding: 22px 24px; overflow-y: auto;
      backdrop-filter: blur(8px);
      transform: translateX(420px); opacity: 0;
      transition: transform .4s cubic-bezier(.2,.8,.2,1), opacity .4s;
      box-shadow: 0 10px 40px rgba(0,0,0,.5);
    }
    #info.show { transform: translateX(0); opacity: 1; }
    #info .dotline { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    #info .dotline .dot { width: 16px; height: 16px; border-radius: 50%; }
    #info h2 { margin: 0; font-size: 26px; font-weight: 400; letter-spacing: 3px; }
    #info h3 { margin: 14px 0 4px; font-size: 14px; color: var(--muted); font-weight: 400; letter-spacing: 1px; border-bottom: 1px solid rgba(140,155,220,.2); padding-bottom: 4px; }
    #info p { margin: 0 0 6px; font-size: 13.5px; line-height: 1.7; color: #dfe4ff; }
    #info .tag { display: inline-block; margin: 3px 6px 3px 0; padding: 2px 10px;
      border: 1px solid rgba(140,155,220,.35); border-radius: 999px;
      font-size: 11px; color: var(--muted); letter-spacing: 1px; }
    #info .close { position: absolute; top: 14px; right: 16px; cursor: pointer;
      color: var(--muted); font-size: 22px; background: none; border: none; }
    #info .close:hover { color: #fff; }
    #info .hint { margin-top: 16px; font-size: 12px; color: #6f78a0; text-align: center; }

    footer { position: fixed; bottom: 0; left: 0; right: 0; z-index: 4;
      padding: 10px; text-align: center; font-size: 11px; color: #4c5580; letter-spacing: 1px; pointer-events: none; }

    @media (max-width: 720px) {
      #info { width: 260px; right: 12px; bottom: 12px; top: auto; max-height: 60vh; }
      header h1 { font-size: 20px; }
    }
  </style>
</head>
<body>
  <canvas id="stars"></canvas>
  <header>
    <h1>太 阳 系</h1>
    <p>点击行星，查看它的故事</p>
  </header>
  <svg id="stage" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet"></svg>
  <footer>把星球拖出来的是引力 · 把故事点开的是你</footer>
  <aside id="info"></aside>

  <script>
    // ---- 数据 ----
    const PLANETS = [
      { name:"水星", en:"Mercury", color:"#b9b6a8", size:5,  orbit:80,  speed:0.9,
        emoji:"☿", temp:[-173,427], day:58.6,  year:88,   radius:2440,
        tags:["最靠近太阳","温差巨大","无大气层"],
        intro:"水星是离太阳最近的行星，表面布满陨石坑，像一颗没有一丝云彩的岩石铁球。它的昼夜温差极端：白昼可达 427°C，夜晚骤降至 -173°C，是八大行星中温差最大的一个。" },
      { name:"金星", en:"Venus", color:"#d8b45a", size:8,  orbit:120, speed:0.55,
        emoji:"♀", temp:464,   day:243,  year:225,  radius:6052,
        tags:["最亮","温室效应","自转最慢"],
        intro:"金星是夜空中除了月亮外最亮的星，常被称为「启明星」。它被浓厚的二氧化碳大气包裹，表面温度高达约 464°C，是太阳系中最热的行星。它自转方向与其他行星相反，且自转一圈比公转一圈还慢。" },
      { name:"地球", en:"Earth", color:"#4a9ef0", size:8.5, orbit:165, speed:0.5,
        emoji:"⊕", temp:15,    day:23.9, year:365,  radius:6371,
        tags:["我们家园","液态水","唯一生命"],
        intro:"地球是目前已知唯一存在生命的星球。约 71% 的表面被海洋覆盖，蔚蓝的颜色让它成为宇宙中的「蓝色弹珠」。适中的距离、恰到好处的大气与磁场，使它得以孕育出丰富多样的生命。" },
      { name:"火星", en:"Mars", color:"#d1654a", size:6.5, orbit:210, speed:0.45,
        emoji:"♂", temp:[-153,20], day:24.6, year:687,  radius:3390,
        tags:["红色星球","奥林匹斯山","探寻生命"],
        intro:"火星因富含氧化铁而呈现铁锈般的红色，是太阳系最高的火山——奥林匹斯山（高约 21 公里）所在地。它是人类探测最频繁的行星，“好奇号”“毅力号”等探测器至今仍在它的表面执行任务。" },
      { name:"木星", en:"Jupiter", color:"#d29a6a", size:22, orbit:285, speed:0.3,
        emoji:"♃", temp:-108,  day:9.9,  year:4333, radius:69911,
        tags:["最大","大红斑","气态巨行星"],
        intro:"木星是太阳系中体积最大的行星，直径约为地球的 11 倍，甚至可以容纳上千个地球。它表面著名的大红斑是一场持续了数百年的超级风暴。木星有多达 90 多颗已知卫星，像一个小型太阳系。" },
      { name:"土星", en:"Saturn", color:"#d8c98a", size:19, orbit:370, speed:0.24,
        emoji:"♄", temp:-139,  day:10.7, year:10759,radius:58232,
        tags:["最美光环","密度最低","气态巨行星"],
        intro:"土星以其巨大而美丽的行星环闻名，这些环主要由冰粒和岩石碎片构成。土星的平均密度比水还低，理论上能漂浮在水面上。它的卫星「泰坦」是太阳系中唯一拥有稠密大气层的卫星。" },
      { name:"天王星", en:"Uranus", color:"#8fd1d6", size:13, orbit:455, speed:0.17,
        emoji:"♅", temp:-224,  day:17.2, year:30687,radius:25362,
        tags:["侧躺着","冰巨星","蓝绿色"],
        intro:"天王星最特别的地方——它几乎是「躺着」绕太阳公转的，自转轴倾斜约 98 度，仿佛在轨道上打滚。它由冰与气体组成，因甲烷吸收红光而呈现淡淡的蓝绿色。" },
      { name:"海王星", en:"Neptune", color:"#4a6af0", size:12.5, orbit:540, speed:0.12,
        emoji:"♆", temp:-214,  day:16.1, year:60190,radius:24764,
        tags:["最遥远","风暴最强","冰巨星"],
        intro:"海王星是八大行星中离太阳最远的一颗，阳光到达这里已极为微弱。它是太阳系中狂风最猛烈的行星，风速可超过每小时 2000 公里。它也是第一颗通过数学预测而非望远镜观测被发现的行星。" },
    ];
    const SUN = { name:"太阳", en:"The Sun", color:"#ffb03a", size:30, emoji:"☉", temp:5500,
      tags:["恒星","核聚变","能量之源"],
      intro:"太阳是太阳系的中心恒星，占太阳系总质量的 99.86%。它的核心持续进行氢核聚变，释放出光与热，正是这股能量哺育了地球上的所有生命。太阳直径约 139 万公里，可以容纳约 130 万个地球。" };

    // ---- 星空 ----
    const canvas = document.getElementById('stars');
    const ctx = canvas.getContext('2d');
    let stars = [];
    function initStars(){
      canvas.width = innerWidth; canvas.height = innerHeight;
      stars = Array.from({length:160}, ()=>(
        { x:Math.random()*innerWidth, y:Math.random()*innerHeight,
          r:Math.random()*1.3+.3, a:Math.random()*.7+.3, p:Math.random()*6.28 }
      ));
    }
    function drawStars(t){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      for(const s of stars){
        const tw = .5 + .5*Math.sin(t*.001 + s.p);
        ctx.globalAlpha = s.a*tw;
        ctx.fillStyle = "#cfd6ff";
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    initStars();

    // ---- 构建 SVG ----
    const svg = document.getElementById('stage');
    const NS = "http://www.w3.org/2000/svg";
    const cx = 430, cy = 400; // 左侧中心，右侧留白给介绍面板

    // 轨道
    [SUN].concat(PLANETS).forEach((p, i)=>{
      const c = document.createElementNS(NS, "circle");
      c.setAttribute("cx", cx); c.setAttribute("cy", cy);
      c.setAttribute("r", p.orbit || 0);
      c.setAttribute("fill","none"); c.setAttribute("stroke","rgba(130,145,210,.18)");
      c.setAttribute("stroke-width","1");
      if(p.orbit) svg.appendChild(c);
    });

    // 太阳
    const sunG = document.createElementNS(NS,"g");
    sunG.classList.add("orb");
    const sunC = document.createElementNS(NS,"circle");
    sunC.setAttribute("cx",cx); sunC.setAttribute("cy",cy); sunC.setAttribute("r",SUN.size);
    sunC.setAttribute("fill","#ffb03a");
    sunC.setAttribute("filter","url(#sunGlow)");
    sunC.classList.add("halo");
    const sunL = document.createElementNS(NS,"text");
    sunL.setAttribute("x",cx); sunL.setAttribute("y",cy+4);
    sunL.setAttribute("class","lbl"); sunL.textContent = "太阳";
    sunG.appendChild(sunC); sunG.appendChild(sunL);
    sunG.addEventListener("click", ()=>openInfo(SUN, cx, cy, true));
    svg.appendChild(sunG);

    // 发光滤镜
    const defs = document.createElementNS(NS,"defs");
    defs.innerHTML = `
      <filter id="sunGlow" x="-80%" y="-80%" width="260%" height="260%">
        <feGaussianBlur stdDeviation="6"/>
      </filter>`;
    svg.prepend(defs);

    // 行星
    const orbits = PLANETS.map((p, i, arr)=>{
      const g = document.createElementNS(NS,"g");
      g.classList.add("orb");
      const c = document.createElementNS(NS,"circle");
      c.setAttribute("r", p.size);
      c.setAttribute("fill", p.color);
      c.classList.add("halo");
      g.appendChild(c);
      svg.appendChild(g);
      return { el:g, dot:c, p, phase:Math.random()*6.28, active:true };
    });

    // 旋转动画
    let t = 0;
    function frame(now){
      t = now;
      orbits.forEach(o=>{
        const ang = o.phase + now*0.00002*o.p.speed;
        const x = cx + o.p.orbit*Math.cos(ang);
        const y = cy + o.p.orbit*Math.sin(ang)*0.5; // 稍微压扁，有透视感
        o.el.setAttribute("transform", `translate(${x}, ${y})`);
        o.el.setAttribute("data-x", x); o.el.setAttribute("data-y", y);
      });
      drawStars(now);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    // 行星点击：把 label 放图标下方
    orbits.forEach(o=>{
      o.el.addEventListener("click", ()=>{
        const x = parseFloat(o.el.getAttribute("data-x"));
        const y = parseFloat(o.el.getAttribute("data-y"));
        openInfo(o.p, x, y, false);
      });
    });

    // ---- 介绍面板 ----
    const info = document.getElementById('info');
    const starsAnim = { t:0 };
    function openInfo(p, x, y, isSun){
      info.classList.add("show");
      info.innerHTML = `
        <button class="close" id="closeBtn">×</button>
        <div class="dotline">
          <span class="dot" style="background:${isSun? p.color : '#fff'};box-shadow:${isSun? '0 0 12px #ffd27a':'none'}"></span>
          <h2>${p.name} ${p.en}</h2>
        </div>
        <p style="color:#cfd6ff;">${p.emoji} · ${p.name}</p>
        <div>
          ${p.tags.map(t=>`<span class="tag">${t}</span>`).join('')}
        </div>
        <h3>简介</h3>
        <p>${p.intro}</p>
        <h3>档案</h3>
        <p>公转周期：约 ${p.year} 地球日</p>
        <p>自转周期：约 ${p.day} 地球日</p>
        <p>平均半径：约 ${p.radius ? p.radius.toLocaleString() : '—'} 公里</p>
        <p>平均温度：${Array.isArray(p.temp) ? p.temp.join('°C ~ ')+'°C' : (p.temp? p.temp+'°C':'—')}</p>
        <div class="hint">点右上角 × 或按 Esc 关闭</div>`;
      document.getElementById('closeBtn').addEventListener('click', closeInfo);
    }
    function closeInfo(){ info.classList.remove('show'); }
    document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeInfo(); });

    // 点击空白处关闭
    svg.addEventListener('click', e=>{
      if(e.target===svg || e.target.tagName==='circle' && !e.target.closest('.orb')) closeInfo();
    });

    window.addEventListener('resize', initStars);
  </script>
</body>
</html>
