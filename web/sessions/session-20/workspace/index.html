<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>巷口 · 外卖列表</title>
<style>
  :root{
    --ink:      #12181a;   /* 深夜 */
    --night:    #1b2426;   /* 墨蓝夜 */
    --night-2:  #212b2d;   /* 卡片底 */
    --paper:    #f2ead9;   /* 纸白正文 */
    --paper-dim:#b8ac93;   /* 次级文字 */
    --lamp:     #f0a63a;   /* 暖黄灯火 */
    --cinnabar: #c8512f;   /* 朱砂 */
    --moss:     #6f9868;   /* 青苔，小点缀 */
    --line:     rgba(242,234,217,.10);
  }

  *{ box-sizing:border-box; }

  html,body{ margin:0; padding:0; }

  body{
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    background:
      radial-gradient(1200px 500px at 82% -8%, rgba(240,166,58,.06), transparent 60%),
      var(--ink);
    color: var(--paper);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .shell{ width:100%; max-width:1080px; margin:0 auto; padding:0 24px 96px; }

  /* ---------- Header ---------- */
  .top{
    display:flex; align-items:flex-end; justify-content:space-between;
    padding:44px 0 22px;
  }
  .top h1{
    font-size:clamp(30px, 5vw, 44px);
    margin:0 0 6px; font-weight:700; letter-spacing:.01em;
  }
  .top h1 em{
    font-style:normal; color:var(--lamp);
  }
  .top .mood{ color:var(--paper-dim); font-size:14px; letter-spacing:.04em; }

  .fire{
    display:flex; align-items:center; gap:14px;
    margin:0 0 30px; padding:16px 18px;
    background:linear-gradient(90deg, #232f31, #1b2426);
    border:1px solid var(--line); border-left:3px solid var(--lamp);
    border-radius:10px;
  }
  .fire .dot{
    width:9px; height:9px; border-radius:50%;
    background:var(--lamp); box-shadow:0 0 12px var(--lamp);
    flex:0 0 auto;
  }
  .fire .t{ font-size:15px; font-weight:600; }
  .fire .t small{ display:block; color:var(--paper-dim); font-weight:400; font-size:13px; }

  /* ---------- Controls ---------- */
  .controls{
    display:flex; flex-wrap:wrap; gap:10px; align-items:center;
    margin-bottom:26px; position:sticky; top:0; z-index:10;
    background:linear-gradient(var(--ink), rgba(18,24,26,.92));
    backdrop-filter:blur(6px);
    padding:10px 0;
  }
  .controls .pipe{ color:var(--line); margin:0 6px; width:1px; align-self:stretch; display:block;}
  .chip{
    border:1px solid var(--line); color:var(--paper-dim);
    background:transparent; padding:7px 14px; border-radius:999px;
    font-size:13.5px; cursor:pointer; transition:.18s ease;
    font-family:inherit;
  }
  .chip:hover{ border-color:var(--lamp); color:var(--lamp); }
  .chip.on{
    background:var(--lamp); border-color:var(--lamp); color:#241a06; font-weight:600;
  }
  .controls .spacer{ flex:1; }
  .sort{
    background:var(--night-2); border:1px solid var(--line); color:var(--paper);
    padding:8px 12px; border-radius:8px; font-size:13.5px; font-family:inherit;
  }
  .sort:focus-visible{ outline:2px solid var(--lamp); outline-offset:2px; }

  /* ---------- List ---------- */
  .card{
    display:grid;
    grid-template-columns: 190px 1fr;
    gap:0;
    background:var(--night-2);
    border:1px solid var(--line);
    border-radius:14px; overflow:hidden;
    margin-bottom:18px;
    transition:transform .22s ease, box-shadow .22s ease, border-color .22s ease;
    cursor:pointer;
  }
  .card:hover{
    transform:translateY(-3px);
    border-color:rgba(240,166,58,.45);
    box-shadow:0 16px 40px -18px rgba(0,0,0,.7);
  }
  .card:focus-visible{ outline:2px solid var(--lamp); outline-offset:2px; }

  .cover{
    position:relative;
    background:
      radial-gradient(120% 140% at 20% 10%, rgba(240,166,58,.16), transparent 55%),
      linear-gradient(160deg, #223032, #141a1c);
    display:flex; align-items:flex-end; justify-content:center;
    padding:16px; min-height:150px;
    overflow:hidden;
  }
  .cover::after{
    content:""; position:absolute; inset:0;
    background:radial-gradient(80% 60% at 50% 100%, rgba(0,0,0,.4), transparent 70%);
  }
  .dishtitle{
    position:relative; z-index:2;
    font-family:"Songti SC","STSong","SimSun", serif;
    font-size:26px; line-height:1.18; font-weight:700;
    color:var(--paper); text-align:center; margin:0;
    text-shadow:0 2px 18px rgba(0,0,0,.6);
    letter-spacing:.01em;
  }
  .dishtitle b{ font-weight:400; font-size:13px; color:var(--lamp); display:block; margin-top:8px; letter-spacing:.18em; }

  .info{ padding:16px 20px 15px; display:flex; flex-direction:column; }
  .info .row1{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
  .info h2{ margin:0; font-size:19px; font-weight:700; letter-spacing:.01em; }
  .score{
    display:inline-flex; align-items:center; gap:5px;
    color:var(--lamp); font-weight:700; font-size:15px; flex:0 0 auto;
  }
  .score svg{ display:block; }

  .meta{
    display:flex; flex-wrap:wrap; gap:6px; margin:9px 0 12px;
  }
  .meta span{
    font-size:12px; color:var(--paper-dim);
    border:1px solid var(--line); padding:3px 8px; border-radius:6px;
  }
  .meta span.pop{ color:var(--lamp); border-color:rgba(240,166,58,.35); }

  .desc{ color:var(--paper-dim); font-size:13.5px; margin:0 0 14px; }

  .foot{ margin-top:auto; display:flex; align-items:center; gap:14px; }
  .price{ font-size:16px; font-weight:700; color:var(--paper); }
  .price small{ font-weight:400; color:var(--paper-dim); font-size:12.5px; }
  .time{ font-size:12.5px; color:var(--paper-dim); display:flex; align-items:center; gap:5px; }
  .time svg{ color:var(--moss); }
  .go{
    margin-left:auto; width:36px; height:36px; border-radius:50%;
    border:0; cursor:pointer;
    background:var(--lamp); color:#241a06;
    display:grid; place-items:center; transition:.18s ease; font-size:14px;
  }
  .card:hover .go{ transform:translateX(2px); }
  .go:focus-visible{ outline:2px solid var(--paper); outline-offset:2px; }

  /* ---------- Ctrl layout per cover ---------- */
  .cover .tag{
    position:absolute; top:10px; left:10px; z-index:3;
    font-size:11px; letter-spacing:.12em; padding:3px 8px; border-radius:5px;
    background:var(--cinnabar); color:#fff; font-weight:600;
  }
  .cover .pr .tag{ background:var(--moss); }

  @media (max-width:640px){
    .card{ grid-template-columns:1fr; }
    .cover{ min-height:150px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }
</style>
</head>
<body>
  <div class="shell">

    <header class="top">
      <div>
        <h1>巷口<span>·</span><em>趁热吃</em></h1>
        <div class="mood">今晚这一口，想好了没？按烟火时刻排在最前</div>
      </div>
      <div class="fire">
        <span class="dot"></span>
        <span class="t">19:40 · 晚饭点
          <small>这个点煎、烤、煲最入味</small>
        </span>
      </div>
    </header>

    <div class="controls" role="toolbar">
      <button class="chip on" data-f="all">全部</button>
      <button class="chip" data-f="饭">主食饭</button>
      <button class="chip" data-f="煲">煲·汤</button>
      <button class="chip" data-f="甜">糖水</button>
      <button class="chip" data-f="烤">烤肉</button>
      <button class="chip" data-f="快">半小时内</button>
      <span class="spacer"></span>
      <select class="sort" aria-label="排序">
        <option>按火焰时刻</option>
        <option value="score">按评分</option>
        <option value="price">按价格从低到高</option>
        <option value="time">按送达最快</option>
      </select>
    </div>

    <main id="list" role="list" aria-label="附近店铺列表"></main>

  </div>

  <script>
    const SHOPS = [
      {
        name:"老灶吊味煲仔饭", tag:"人气王", kind:"饭",
        dish:"腊味双拼煲仔饭", price:28, time:32, score:5.0, dist:"1.2",
        tags:["店庆满30减6","锅巴下单再焗"],
        desc:"沿锅边淋油，饭焦金黄酥脆，广式腊肠配润肠，趁热浇豉油拌开最香。"
      },
      {
        name:"江畔腌笃鲜小馆", kind:"煲", tag:"炖足4钟头",
        dish:"腌笃鲜砂锅", price:46, time:40, score:4.8, dist:"2.6",
        tags:["春笋当季","可加主食"],
        desc:"咸肉、鲜肉、春笋同炖，汤白味厚，配一份米粣刚好暖胃。"
      },
      {
        name:"阿婆糯 · 港式糖水", kind:"甜", tag:"下午茶优选",
        dish:"陈皮红豆沙", price:18, time:25, score:4.9, dist:"0.8",
        tags:["低糖可选","夜宵时段"],
        desc:"十年陈皮提香，红豆熬到起沙，甜得不腻，收尾来一碗正好。"
      },
      {
        name:"火候炭火烤肉", kind:"烤", tag:"下单现烤",
        dish:"黑椒牛肋条", price:68, time:35, score:4.7, dist:"3.1",
        tags:["配三种蘸料","保温盒装"],
        desc:"牛肋条炭火烤至微焦，锁住肉汁，配海盐、韩式和梅子蘸酱。"
      },
      {
        name:"蒸蒸日上鲜蒸", kind:"饭", tag:"清淡不油",
        dish:"虫草花蒸鸡", price:42, time:28, score:4.6, dist:"1.9",
        tags:["少油少盐","米饭免费"],
        desc:"蒸制保留原味，虫草花鲜甜，鸡肉嫩滑，淋上蒸出的鸡汁拌饭。"
      },
      {
        name:"巷口葱油饼", kind:"快", tag:"赶时间的救星",
        dish:"牛肉葱油饼", price:16, time:15, score:4.8, dist:"0.5",
        tags:["现做现烙","均价低"],
        desc:"酥皮一层一层，牛肉洋葱馅烫嘴吃最香，饼+豆浆不到二十块。"
      }
    ];

    const list = document.getElementById('list');
    const controls = document.querySelector('.controls');
    const sortSel = document.querySelector('.sort');
    let filter = 'all';

    const star = '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.3 6.9.7-5.1 4.6 1.4 6.8L12 17.5 5.9 20.4l1.4-6.8L2.2 9l6.9-.7z"/></svg>';
    const clock = '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M12 7v5l3.5 2" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>';

    let shops = [...SHOPS];

    function sortShops(){
      const v = sortSel.value;
      if(v==='score') shops.sort((a,b)=>b.score-a.score);
      else if(v==='price') shops.sort((a,b)=>a.price-b.price);
      else if(v==='time') shops.sort((a,b)=>a.time-b.time);
      else shops = [...SHOPS]; // 火焰时刻：保持原始排布
    }

    function render(){
      sortShops();
      const shown = shops.filter(s=> filter==='all' || s.kind===filter || s.tag.includes(filter));
      list.innerHTML = shown.map(s=>`
        <article class="card" tabindex="0" role="listitem" aria-label="${s.name}">
          <div class="cover">
            <span class="tag">${s.tag}</span>
            <h3 class="dishtitle">${s.dish}<b>${s.name}</b></h3>
          </div>
          <div class="info">
            <div class="row1">
              <h2>${s.name}</h2>
              <span class="score">${star}${s.score.toFixed(1)}</span>
            </div>
            <div class="meta">
              ${s.tags.map(t=>`<span>${t}</span>`).join('')}
              <span class="pop">${s.dist}km</span>
            </div>
            <p class="desc">${s.desc}</p>
            <div class="foot">
              <span class="price">¥${s.price}<small> 起送</small></span>
              <span class="time">${clock} ${s.time}min</span>
              <button class="go" aria-label="去 ${s.name}">→</button>
            </div>
          </div>
        </article>
      `).join('');
    }

    controls.addEventListener('click',e=>{
      if(e.target.classList.contains('chip')){
        controls.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
        e.target.classList.add('on');
        filter = e.target.dataset.f;
        render();
      }
    });
    sortSel.addEventListener('change', render);

    render();
  </script>
</body>
</html>
