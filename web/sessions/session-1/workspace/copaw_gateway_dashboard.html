<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>CoPaw Gateway 任务看板</title>
<style>
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         background: #f4f6fb; color: #1f2430; }
  header { background: #1f2430; color: #fff; padding: 22px 32px; }
  header h1 { margin: 0; font-size: 20px; letter-spacing: .5px; }
  header p { margin: 6px 0 0; color: #9aa4b8; font-size: 13px; }
  .wrap { display: flex; flex-wrap: wrap; gap: 20px; padding: 24px 32px; }
  .card { background: #fff; border-radius: 12px; box-shadow: 0 3px 14px rgba(20,30,60,.07);
          padding: 18px 20px; }
  .card h2 { margin: 0 0 8px; font-size: 15px; color: #384052; }
  .card .sub { color: #8b94a8; font-size: 12px; margin-bottom: 10px; }
  svg { display: block; }
  .tooltip { position: absolute; visibility: hidden; background: rgba(31,36,48,.94); color: #fff;
             padding: 8px 11px; border-radius: 6px; font-size: 12px; pointer-events: none;
             box-shadow: 0 3px 10px rgba(0,0,0,.2); white-space: nowrap; line-height: 1.5; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: #4a5264; }
  .legend .chip { display: inline-flex; align-items: center; gap: 6px; }
  .legend .sw { width: 12px; height: 12px; border-radius: 3px; display:inline-block; }
  @media (max-width: 900px) { .card { width: 100% !important; } }
</style>
</head>
<body>
<header>
  <h1>CoPaw Gateway 开发任务看板</h1>
  <p>Gateway Server · 快乐平安 Node · CoPaw Skill · 联调与部署 — 共 23 项任务</p>
</header>
<div class="wrap">

  <!-- 状态环形图 -->
  <div class="card" style="width:340px;">
    <h2>任务状态分布</h2>
    <div class="sub">已完成 18 / 待开发 3 / 需外部 2</div>
    <div id="donut"></div>
    <div class="legend" id="donutLegend"></div>
  </div>

  <!-- 模块进度堆叠条 -->
  <div class="card" style="flex:1; min-width:420px;">
    <h2>各模块任务进度</h2>
    <div class="sub">已完成 · 待开发 · 需外部</div>
    <div id="bars"></div>
    <div class="legend" id="barLegend"></div>
  </div>

</div>

<div class="tooltip" id="tooltip"></div>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="copaw_data.js"></script>
<script>
const DATA = COPAW_DATA;
const tooltip = d3.select("#tooltip");

function showTip(html){ tooltip.style("visibility","visible").html(html); }
function moveTip(e){ tooltip.style("top",(e.pageY-12)+"px").style("left",(e.pageX+14)+"px"); }
function hideTip(){ tooltip.style("visibility","hidden"); }

// ---------- 状态环形图 ----------
const statusColors = { "已完成":"#2e9e5b", "待开发":"#e2970c", "需外部":"#3b80e0" };
const stCount = {};
DATA.tasks.forEach(t => stCount[t.status] = (stCount[t.status]||0)+1);
const stData = Object.entries(stCount).map(([k,v])=>({status:k, value:v}));

const dw = 300, dh = 230, dr = Math.min(dw,dh)/2 - 26;
const arc = d3.arc().innerRadius(dr-34).outerRadius(dr);
const pie = d3.pie().value(d=>d.value).sort(null);

const svgDonut = d3.select("#donut").append("svg")
  .attr("viewBox",`0 0 ${dw} ${dh}`).attr("width", dw).attr("height", dh);

const gDonut = svgDonut.append("g").attr("transform",`translate(${dw/2},${dh/2})`);

gDonut.selectAll("path").data(pie(stData)).join("path")
  .attr("d", arc)
  .attr("fill", d=>statusColors[d.data.status])
  .attr("stroke","#fff").attr("stroke-width",2)
  .style("opacity",.92)
  .on("mouseover", (e,d)=>{ showTip(`<b>${d.data.status}</b>  ${d.data.value} 项`); d3.select(e.currentTarget).style("opacity",1); })
  .on("mousemove", moveTip).on("mouseout", function(){ hideTip(); d3.select(this).style("opacity",.92); });

// 中心文本
const pct = (stCount["已完成"]||0)/DATA.tasks.length*100;
gDonut.append("text").attr("text-anchor","middle").attr("y",-6)
  .attr("fill","#1f2430").style("font-size","26px").style("font-weight",700)
  .text(pct.toFixed(0)+"%");
gDonut.append("text").attr("text-anchor","middle").attr("y",16)
  .attr("fill","#8b94a8").style("font-size","12px").text("已完成");

stData.forEach(d=>{
  d3.select("#donutLegend").append("span").attr("class","chip")
    .html(`<span class="sw" style="background:${statusColors[d.status]}"></span>${d.status} ${d.value} 项`);
});

// ---------- 各模块堆叠条形图 ----------
const modules = DATA.stats;
const catCols = { "已完成":"#2e9e5b", "待开发":"#e2970c", "需外部":"#3b80e0" };
const cats = ["已完成","待开发","需外部"];

const bw = 640, bh = 300;
const bm = { top:30, right:20, bottom:50, left:60 };
const innerW = bw-bm.left-bm.right, innerH = bh-bm.top-bm.bottom;

const svgBars = d3.select("#bars").append("svg")
  .attr("viewBox",`0 0 ${bw} ${bh}`).attr("width", bw).attr("height", bh);

const xScale = d3.scaleBand().domain(modules.map(m=>m.module)).range([0,innerW]).padding(.32);
const yScale = d3.scaleLinear().domain([0,8]).nice().range([innerH,0]);

const g = svgBars.append("g").attr("transform",`translate(${bm.left},${bm.top})`);

// 堆叠
const stacked = d3.stack().keys(cats).offset(d3.stackOffsetNone)
  .value((m,key)=> m[key.toLowerCase()==="需外部"?"ext":(key==="已完成"?"done":"todo") )(modules);

function valFor(m,key){
  if(key==="已完成") return m.done;
  if(key==="待开发") return m.todo;
  return m.ext;
}
const stackData = cats.map(key=>({key, arr: modules.map(m=>({m, key, v: valFor(m,key)}))}));

// 计算每组累计高度
const groupLayers = modules.map(m=>{
  let acc=0; const segs=cats.map(key=>{ const v=valFor(m,key); const seg={m,key,v,y0:acc}; acc+=v; return seg;});
  return segs;
});
// 平铺
const bars = groupLayers.flat();

g.selectAll("rect").data(bars).join("rect")
  .attr("x", d=>xScale(d.m.module))
  .attr("y", d=>yScale(d.y0+d.v))
  .attr("width", xScale.bandwidth())
  .attr("height", d=>yScale(d.y0)-yScale(d.y0+d.v))
  .attr("fill", d=>catCols[d.key])
  .attr("rx",2)
  .style("opacity",.92)
  .on("mouseover", (e,d)=>{ showTip(`<b>${d.m.module}</b><br/>${d.key}: ${d.v} 项`); d3.select(e.currentTarget).style("opacity",1); d3.select(e.currentTarget).style("stroke","#1f2430").style("stroke-width",1); })
  .on("mousemove", moveTip)
  .on("mouseout", function(){ hideTip(); d3.select(this).style("opacity",.92).style("stroke","none"); });

g.selectAll("rect").transition().duration(600).delay((d,i)=>i*40).attr("y", d=>yScale(d.y0+d.v)).attr("height", d=>yScale(d.y0)-yScale(d.y0+d.v));

// 数值标签
g.selectAll(".lbl").data(modules).join("text").attr("class","lbl")
  .attr("x", d=>xScale(d.module)+xScale.bandwidth()/2)
  .attr("y", d=>yScale(d.total)-8)
  .attr("text-anchor","middle").attr("fill","#1f2430")
  .style("font-size","12px").style("font-weight",600)
  .text(d=>d.done+"/"+d.total);

g.append("g").attr("transform",`translate(0,${innerH})`).call(d3.axisBottom(xScale).tickSize(0))
  .selectAll("text").style("font-size","12px").attr("fill","#4a5264");

g.append("g").call(d3.axisLeft(yScale).ticks(8))
  .selectAll("text").style("font-size","11px").attr("fill","#4a5264");

cats.forEach(c=>{
  d3.select("#barLegend").append("span").attr("class","chip")
    .html(`<span class="sw" style="background:${catCols[c]}"></span>${c}`);
});

// 轴标题
g.append("text").attr("text-anchor","end").attr("x",innerW).attr("y",innerH+38)
  .attr("fill","#8b94a8").style("font-size","11px").text("模块");
</script>
</body>
</html>
