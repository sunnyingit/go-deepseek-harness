<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root{
    --bg-0:#0c0f16;
    --bg-1:#12161f;
    --bg-2:#1a1f2b;
    --paper:#ece4d0;
    --paper-2:#e3d9be;
    --paper-edge:#c9bb95;
    --ink:#2a2620;
    --ink-soft:#5a5245;
    --vermillion:#b23a2e;
    --vermillion-deep:#8e2a20;
    --gold:#c9a227;
    --gold-soft:#a9863a;
    --text-light:#e9e4d6;
    --text-dim:#948d7c;
    --line-w:min(46vw, 220px);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:transparent;}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Noto Serif SC",sans-serif;
    color:var(--text-light);
    background:
      radial-gradient(ellipse 80% 60% at 50% -10%, rgba(201,162,39,0.10), transparent 60%),
      radial-gradient(ellipse 60% 50% at 90% 100%, rgba(178,58,46,0.10), transparent 60%),
      linear-gradient(180deg, var(--bg-0), var(--bg-1) 40%, var(--bg-2));
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:28px 14px 40px;
  }
  .scroll{
    width:100%;
    max-width:520px;
  }
  .eyebrow{
    text-align:center;
    font-size:12px;
    letter-spacing:0.35em;
    color:var(--gold-soft);
    text-transform:uppercase;
    margin-bottom:6px;
  }
  h1{
    font-family:"Noto Serif SC", serif;
    font-weight:900;
    text-align:center;
    font-size:26px;
    margin:0 0 2px;
    letter-spacing:0.06em;
    color:var(--text-light);
  }
  .date-line{
    text-align:center;
    font-size:12.5px;
    color:var(--text-dim);
    margin-bottom:22px;
    letter-spacing:0.04em;
  }

  /* ---- 起卦区 ---- */
  .cast-card{
    background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0));
    border:1px solid rgba(201,162,39,0.18);
    border-radius:18px;
    padding:26px 20px 22px;
    margin-bottom:18px;
    position:relative;
    overflow:hidden;
  }
  .cast-card::before{
    content:"";
    position:absolute; inset:0;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,0.015) 0 1px, transparent 1px 64px);
    pointer-events:none;
  }
  .lines-wrap{
    display:flex;
    flex-direction:column-reverse; /* 初爻在下，上爻在上，但DOM顺序按position从1开始，用reverse让1排最下 */
    align-items:center;
    gap:14px;
    margin:4px auto 20px;
  }
  .yao{
    width:var(--line-w);
    height:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    position:relative;
    opacity:0;
    transform:scaleX(0.2);
    transform-origin:center;
  }
  .yao.show{
    animation:draw 0.55s cubic-bezier(.2,.8,.25,1) forwards;
  }
  @keyframes draw{
    0%{opacity:0; transform:scaleX(0.15);}
    60%{opacity:1;}
    100%{opacity:1; transform:scaleX(1);}
  }
  .yao .bar{
    height:100%;
    background:linear-gradient(180deg, var(--paper) 0%, var(--paper-2) 100%);
    border-radius:3px;
    box-shadow:0 1px 0 rgba(0,0,0,0.25) inset, 0 2px 6px rgba(0,0,0,0.35);
  }
  .yao.yang .bar{ width:100%; }
  .yao.yin .bar{ width:42%; }
  .yao .gap{ width:16%; }
  .yao.yin .gap{ visibility:visible; }
  .yao.yang .gap{ display:none; }
  .moving-dot{
    position:absolute;
    right:-22px;
    top:50%;
    transform:translateY(-50%);
    width:9px; height:9px;
    border-radius:50%;
    background:var(--vermillion);
    box-shadow:0 0 8px rgba(178,58,46,0.9);
    opacity:0;
  }
  .yao.moving.show .moving-dot{
    animation:dotpop 0.4s ease 0.35s forwards;
  }
  @keyframes dotpop{
    0%{opacity:0; transform:translateY(-50%) scale(0.4);}
    100%{opacity:1; transform:translateY(-50%) scale(1);}
  }

  .hexagram-reveal{
    text-align:center;
    opacity:0;
    transform:scale(1.5) rotate(-6deg);
  }
  .hexagram-reveal.show{
    animation:stamp 0.6s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  @keyframes stamp{
    0%{opacity:0; transform:scale(1.7) rotate(-10deg);}
    70%{opacity:1;}
    100%{opacity:1; transform:scale(1) rotate(0deg);}
  }
  .symbol{
    font-size:64px;
    line-height:1;
    color:var(--paper);
    text-shadow:0 0 22px rgba(201,162,39,0.35);
    display:block;
    margin-bottom:6px;
  }
  .hex-name{
    font-family:"Noto Serif SC", serif;
    font-weight:700;
    font-size:22px;
    letter-spacing:0.08em;
  }
  .level-seal{
    display:inline-block;
    margin-left:10px;
    padding:2px 10px;
    border:1.5px solid currentColor;
    border-radius:4px;
    font-family:"Ma Shan Zheng", "Noto Serif SC", serif;
    font-size:15px;
    transform:rotate(-4deg);
    vertical-align:middle;
  }
  .level-high{ color:var(--vermillion); }
  .level-mid{ color:var(--gold); }
  .level-low{ color:#7f9bb0; }

  .gist{
    margin-top:10px;
    font-size:14px;
    color:var(--text-dim);
    letter-spacing:0.02em;
  }

  .changed-toggle{
    margin-top:16px;
    text-align:center;
  }
  .changed-btn{
    background:none;
    border:1px dashed rgba(201,162,39,0.4);
    color:var(--gold-soft);
    font-size:12.5px;
    padding:6px 14px;
    border-radius:20px;
    cursor:pointer;
    font-family:inherit;
  }
  .changed-btn:hover{ border-color:var(--gold); color:var(--gold); }
  .changed-panel{
    max-height:0;
    overflow:hidden;
    transition:max-height 0.4s ease;
    text-align:center;
  }
  .changed-panel.open{ max-height:160px; margin-top:12px; }
  .changed-panel-inner{
    font-size:13.5px;
    color:var(--text-dim);
    padding-top:8px;
    border-top:1px solid rgba(201,162,39,0.15);
  }
  .changed-panel-inner b{ color:var(--text-light); font-weight:600; }

  /* ---- 四宫格 ---- */
  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:18px;
    opacity:0;
    transform:translateY(8px);
    transition:opacity 0.6s ease, transform 0.6s ease;
  }
  .grid.show{ opacity:1; transform:translateY(0); }
  .fortune-cell{
    background:rgba(236,228,208,0.05);
    border:1px solid rgba(201,162,39,0.14);
    border-radius:14px;
    padding:14px 14px 12px;
  }
  .fortune-cell .icon{ font-size:18px; }
  .fortune-cell .label{
    font-family:"Noto Serif SC", serif;
    font-weight:700;
    font-size:13.5px;
    margin:4px 0 6px;
    color:var(--gold-soft);
    letter-spacing:0.08em;
  }
  .fortune-cell .text{
    font-size:12.5px;
    line-height:1.6;
    color:var(--text-light);
    opacity:0.92;
  }

  /* ---- 底部信息条 ---- */
  .footer-bar{
    display:flex;
    gap:10px;
    margin-bottom:16px;
    opacity:0;
    transform:translateY(8px);
    transition:opacity 0.6s ease 0.1s, transform 0.6s ease 0.1s;
  }
  .footer-bar.show{ opacity:1; transform:translateY(0); }
  .info-chip{
    flex:1;
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(201,162,39,0.14);
    border-radius:12px;
    padding:10px 8px;
    text-align:center;
  }
  .info-chip .chip-label{ font-size:10.5px; color:var(--text-dim); letter-spacing:0.05em; }
  .info-chip .chip-value{ font-size:14px; font-weight:600; margin-top:4px; }
  .color-swatch{
    display:inline-block;
    width:12px; height:12px;
    border-radius:50%;
    margin-right:5px;
    vertical-align:middle;
    border:1px solid rgba(255,255,255,0.25);
  }

  .advice-line{
    text-align:center;
    font-size:13px;
    color:var(--text-light);
    background:rgba(178,58,46,0.08);
    border:1px solid rgba(178,58,46,0.22);
    border-radius:12px;
    padding:12px 16px;
    margin-bottom:18px;
    opacity:0;
    transform:translateY(8px);
    transition:opacity 0.6s ease 0.2s, transform 0.6s ease 0.2s;
  }
  .advice-line.show{ opacity:1; transform:translateY(0); }
  .advice-line b{ color:var(--vermillion); font-weight:700; }
  .advice-line[hidden]{ display:none; }

  /* ---- 再问一件事 ---- */
  .ask-more{
    display:flex;
    gap:8px;
    margin-bottom:16px;
  }
  .ask-more input{
    flex:1;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(201,162,39,0.2);
    border-radius:10px;
    padding:10px 12px;
    color:var(--text-light);
    font-size:13px;
    font-family:inherit;
  }
  .ask-more input::placeholder{ color:var(--text-dim); }
  .ask-more button{
    background:linear-gradient(180deg, var(--vermillion), var(--vermillion-deep));
    color:#f4ece0;
    border:none;
    border-radius:10px;
    padding:0 16px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    letter-spacing:0.03em;
    white-space:nowrap;
  }
  .ask-more button:active{ transform:translateY(1px); }

  .disclaimer{
    text-align:center;
    font-size:10.5px;
    color:var(--text-dim);
    opacity:0.7;
    line-height:1.6;
    padding:0 10px;
  }

  @media (prefers-reduced-motion: reduce){
    .yao, .hexagram-reveal, .grid, .footer-bar, .advice-line{ animation:none !important; transition:none !important; opacity:1 !important; transform:none !important; }
  }
</style>
</head>

/* ============ 起卦逻辑（与 scripts/divine.py 对齐） ============ */
async function sha256Hex(str){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
async function stableInt(parts, mod){
  const hex = await sha256Hex(parts.join("::"));
  return Number(BigInt("0x"+hex) % BigInt(mod));
}
async function tossLine(dateStr, salt, lineIndex){
  let sum = 0;
  for(let c=0;c<3;c++){
    const bit = await stableInt([dateStr, salt, "line", lineIndex, "coin", c], 2);
    sum += bit===1 ? 3 : 2;
  }
  return sum;
}
async function buildLines(dateStr, salt){
  const lines = [];
  for(let i=0;i<6;i++) lines.push(await tossLine(dateStr, salt, i));
  return lines;
}
function linesToBinary(lines, useChanged){
  return lines.map(v=>{
    if(useChanged){
      if(v===6) return "1";
      if(v===9) return "0";
      if(v===7) return "1";
      return "0";
    }
    return (v===7||v===9) ? "1" : "0";
  }).join("");
}
function lookupHexagram(binaryStr){
  const lower = binaryStr.slice(0,3), upper = binaryStr.slice(3,6);
  const number = GRID.grid[lower][upper];
  const info = HEXAGRAMS[String(number)];
  const symbol = String.fromCodePoint(0x4DC0 + (number-1));
  return {
    number, name: info.name, gist: info.gist, level: info.level, symbol,
    upper_trigram: GRID.trigram_meta[upper], lower_trigram: GRID.trigram_meta[lower]
  };
}
function levelBucket(level){ return level>=4 ? "high" : (level===3 ? "mid" : "low"); }
function clampCheer(n){ n = Number(n)||0; return n<0?0:(n>6?6:n); }
function boostedLevel(level, cheer){ return Math.min(5, Math.max(1, (Number(level)||1) + clampCheer(cheer))); }
function cheerBucket(level, cheer){
  cheer = clampCheer(cheer);
  if(cheer>=4) return "high";
  if(cheer>=2) return boostedLevel(level, cheer)>=3 ? "high" : "mid";
  return levelBucket(boostedLevel(level, cheer));
}
const CHEER_BLESSING = [
  "",
  "小巫女朝你眨了眨眼：今天会比昨天顺一点点。",
  "水晶球里冒出金星：贵人运开始抬头。",

];
async function buildFortune(hexagram, dateStr, salt, prefix, cheer){
  const bucket = cheerBucket(hexagram.level, cheer);
  const out = {};
  for(const cat of ["事业","财运","感情","健康"]){
    const options = PHRASE_BANK[cat][bucket];
    const idx = await stableInt([dateStr, salt, prefix, cat, clampCheer(cheer)], options.length);
    out[cat] = options[idx];
  }
  return out;
}

async function divine(dateStr, salt, cheer){
  cheer = clampCheer(cheer);
  const lines = await buildLines(dateStr, salt);
  const originalBinary = linesToBinary(lines, false);
  const original = lookupHexagram(originalBinary);
  const movingIdx = lines.map((v,i)=>({v,i})).filter(o=>o.v===6||o.v===9).map(o=>o.i);
  let changed = null;
  if(movingIdx.length){
    const changedBinary = linesToBinary(lines, true);
    if(changedBinary !== originalBinary) changed = lookupHexagram(changedBinary);
  }
  const fortune = await buildFortune(original, dateStr, salt, "orig", cheer);
  const element = original.upper_trigram.element;
  const colorIdx = await stableInt([dateStr, salt, "color"], COLOR_BY_ELEMENT[element].length);
  const [colorName, colorHex] = COLOR_BY_ELEMENT[element][colorIdx];
  const numPool = NUMBER_BY_ELEMENT[element];
  const numberIdx = await stableInt([dateStr, salt, "number"], numPool.length);
  const luckyNumber = numPool[numberIdx];
  const blessing = CHEER_BLESSING[cheer] || "";
  let advice = ADVICE_BY_TRAIT[original.upper_trigram.trait];
  if(blessing) advice = blessing + " " + advice;
  const shown = boostedLevel(original.level, cheer);

  return {
    dateStr, salt, cheer, blessing, lines, movingIdx,
    original: {...original, level: shown, level_word: LEVEL_WORD[shown]},
    changed: changed ? {...changed, level: boostedLevel(changed.level, cheer), level_word: LEVEL_WORD[boostedLevel(changed.level, cheer)]} : null,
    fortune, colorName, colorHex, luckyNumber, advice
  };
}

/* ============ 渲染 ============ */
function levelClass(level){ return level>=4 ? "level-high" : (level===3 ? "level-mid" : "level-low"); }

function renderLines(lines, movingIdx){
  const wrap = document.getElementById("linesWrap");
  wrap.innerHTML = "";
  lines.forEach((v, i)=>{
    const isYang = (v===7||v===9);
    const isMoving = movingIdx.includes(i);
    const el = document.createElement("div");
    el.className = "yao " + (isYang?"yang":"yin") + (isMoving?" moving":"");
    el.innerHTML = isYang
      ? '<div class="bar"></div><span class="moving-dot"></span>'
      : '<div class="bar"></div><div class="gap"></div><div class="bar"></div><span class="moving-dot"></span>';
    wrap.appendChild(el);
  });
  // 依次显示：初爻(index0)先出现
  const yaos = Array.from(wrap.children);
  yaos.forEach((el, i)=>{
    setTimeout(()=>{ el.classList.add("show"); }, 160*i);
  });
  return 160*yaos.length + 500; // 返回总时长，供后续动画排期
}

function colorHexFor(name){
  for(const pairs of Object.values(COLOR_BY_ELEMENT)){
    for(const [n, hex] of pairs){ if(n===name) return hex; }
  }
  return "#c9a227";
}
function presetToResult(p){
  const lines = (p.lines||[]).map(l => typeof l==="number" ? l : l.value);
  const movingIdx = (p.lines||[]).map((l,i)=> (typeof l==="object" ? l.moving : (l===6||l===9)) ? i : -1).filter(i=>i>=0);
  return {
    dateStr: p.date || p.dateStr || TODAY,
    salt: p.salt || "",
    cheer: p.cheer || 0,
    blessing: p.blessing || "",
    lines, movingIdx,
    original: p.original_hexagram || p.original,
    changed: p.changed_hexagram || p.changed || null,
    fortune: p.fortune,
    colorName: p.lucky_color || p.colorName,
    colorHex: p.colorHex || colorHexFor(p.lucky_color || p.colorName),
    luckyNumber: p.lucky_number != null ? p.lucky_number : p.luckyNumber,
    advice: p.advice
  };
}

async function run(dateStr, salt, cheer){
  const result = await divine(dateStr, salt, cheer);
  renderResult(result);
}

  run(TODAY, salt, CHEER);
});

else { run(TODAY, SALT, CHEER); }
