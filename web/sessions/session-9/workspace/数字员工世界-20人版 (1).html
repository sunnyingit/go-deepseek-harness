<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>数字员工世界 · 打工小队上线</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#CDEBFF;
    --sky-mid:#E4E9FF;
    --sky-bottom:#FBEAF7;
    --ink:#1B2340;
    --ink-soft:#5A6088;
    --gold:#FFC24B;
    --gold-dark:#E8A11E;

    --blue:#3E8EDE;      --blue-d:#2A6BB0;      --blue-l:#DCEEFF;
    --orange:#FF8A3D;    --orange-d:#DB6A22;    --orange-l:#FFE7D6;
    --green:#39AE7C;     --green-d:#268A5D;     --green-l:#DAF3E7;
    --purple:#9767D6;    --purple-d:#7548B0;    --purple-l:#EDE1FA;
    --pink:#FF6FA0;      --pink-d:#DB4F82;      --pink-l:#FFE0EC;

    --panel-dark:#171F36;
    --panel-line:#2C3653;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:"Noto Sans SC", sans-serif;
    color:var(--ink);
    background:linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 38%, var(--sky-bottom) 100%);
    min-height:100svh;
    padding-bottom:10vh;
  }
  .num{ font-family:"Fredoka","Noto Sans SC",sans-serif; }
  button{ font-family:inherit; border:none; background:none; cursor:pointer; }
  ::selection{ background:var(--gold); color:var(--ink); }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }

  /* ---------- hero ---------- */
  .hero{
    position:relative;
    padding:7vh 5vw 3vh;
    display:flex; flex-direction:column; align-items:center; text-align:center;
    overflow:hidden;
  }
  .cloud{ position:absolute; background:#fff; border-radius:100px; opacity:.85; }
  .cloud::before,.cloud::after{ content:""; position:absolute; background:#fff; border-radius:100px; }
  .cloud1{ width:110px; height:36px; top:6%; left:6%; animation:drift 40s linear infinite; }
  .cloud1::before{ width:54px; height:54px; top:-24px; left:14px; }
  .cloud1::after{ width:40px; height:40px; top:-16px; left:56px; }
  .cloud2{ width:80px; height:28px; top:10%; right:8%; animation:drift 48s linear infinite reverse; }
  .cloud2::before{ width:42px; height:42px; top:-20px; left:8px; }
  .cloud2::after{ width:32px; height:32px; top:-12px; left:40px; }
  @keyframes drift{ from{ transform:translateX(-40px);} to{ transform:translateX(calc(100vw + 40px));} }

  .eyebrow{
    font-family:"Fredoka",sans-serif; font-size:13px; letter-spacing:.28em;
    color:var(--orange-d); background:#fff; padding:6px 16px; border-radius:999px;
    box-shadow:0 3px 0 rgba(219,106,34,.18); position:relative; z-index:2;
  }
  h1.title{ margin-top:18px; font-size:clamp(28px,5vw,52px); font-weight:900; line-height:1.15; position:relative; z-index:2; }
  h1.title .hl{ color:var(--orange); text-shadow:3px 3px 0 rgba(27,35,64,.12); }
  .subtitle{ margin-top:12px; font-size:clamp(13px,1.8vw,16px); color:var(--ink-soft); max-width:520px; z-index:2; position:relative; }

  /* ---------- category filter ---------- */
  .filters{
    display:flex; flex-wrap:wrap; justify-content:center; gap:10px;
    margin-top:26px; z-index:2; position:relative;
    max-width:760px;
  }
  .filter-pill{
    font-size:13px; font-weight:700; color:var(--ink-soft);
    background:#fff; padding:9px 18px; border-radius:999px;
    border:1.5px solid transparent;
    box-shadow:0 2px 6px rgba(27,35,64,.08);
    display:flex; align-items:center; gap:7px;
    transition:transform .15s ease, border-color .15s ease, color .15s ease;
  }
  .filter-pill .dot{ width:8px; height:8px; border-radius:50%; background:var(--dot,#ccc); }
  .filter-pill:hover{ transform:translateY(-2px); }
  .filter-pill.active{ color:var(--ink); border-color:var(--dot,var(--ink)); }

  /* ---------- card grid ---------- */
  .grid{
    max-width:1320px;
    margin:5vh auto 0;
    padding:0 4vw;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(210px, 1fr));
    gap:20px;
  }
  .card-3d{
    width:100%; height:340px;
    perspective:1100px;
    opacity:0; transform:translateY(20px) scale(.98);
    animation:riseIn .55s cubic-bezier(.2,.8,.2,1) forwards;
    transition:opacity .25s ease, transform .25s ease;
  }
  .card-3d.hidden{ display:none; }
  .card-3d:nth-child(5n+1){ animation-delay:.03s; }
  .card-3d:nth-child(5n+2){ animation-delay:.1s; }
  .card-3d:nth-child(5n+3){ animation-delay:.17s; }
  .card-3d:nth-child(5n+4){ animation-delay:.24s; }
  .card-3d:nth-child(5n+5){ animation-delay:.31s; }
  @keyframes riseIn{ to{ opacity:1; transform:translateY(0) scale(1);} }

  .card-inner{
    position:relative; width:100%; height:100%;
    border-radius:22px;
    background:linear-gradient(160deg, var(--c-light) 0%, #fff 62%);
    border:1px solid rgba(0,0,0,.04);
    box-shadow:0 18px 34px -14px rgba(27,35,64,.28), 0 2px 0 rgba(255,255,255,.6) inset;
    padding:20px 20px 18px;
    display:flex; flex-direction:column; justify-content:space-between;
    cursor:pointer;
    transform-style:preserve-3d;
    transition:transform .16s ease-out, box-shadow .16s ease-out;
  }
  .card-inner:hover{ box-shadow:0 24px 42px -16px rgba(27,35,64,.34), 0 2px 0 rgba(255,255,255,.6) inset; }

  /* ---------- 数字员工大盘 banner ---------- */
  .dash-banner{
    max-width:1080px; margin:5vh auto 0; padding:0 5vw;
  }
  .dash-banner a{
    display:flex; align-items:center; gap:22px; flex-wrap:wrap;
    background:linear-gradient(160deg, var(--panel-dark, #171F36) 0%, #0F1424 120%);
    border:1px solid rgba(255,255,255,.08);
    border-radius:20px; padding:22px 26px;
    box-shadow:0 18px 40px -18px rgba(15,20,36,.55);
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .dash-banner a:hover{ transform:translateY(-3px); box-shadow:0 24px 48px -18px rgba(15,20,36,.65); }
  .dash-banner .db-icon{
    width:46px; height:46px; border-radius:14px; flex:0 0 auto;
    background:linear-gradient(160deg, var(--blue), var(--purple));
    display:flex; align-items:center; justify-content:center; font-size:20px;
  }
  .dash-banner .db-body{ flex:1; min-width:180px; }
  .dash-banner .db-title{ color:#fff; font-size:15.5px; font-weight:900; display:flex; align-items:center; gap:8px; }
  .dash-banner .db-live{ display:inline-flex; align-items:center; gap:5px; font-size:10px; font-weight:700; color:var(--green); background:rgba(57,174,124,.15); padding:2px 8px; border-radius:999px; }
  .dash-banner .db-live i{ width:5px; height:5px; border-radius:50%; background:var(--green); box-shadow:0 0 0 2px rgba(57,174,124,.3); }
  .dash-banner .db-sub{ color:rgba(255,255,255,.5); font-size:12px; margin-top:4px; }
  .dash-banner .db-stats{ display:flex; gap:22px; flex-wrap:wrap; }
  .dash-banner .db-stat{ text-align:center; }
  .dash-banner .db-stat .v{ font-family:"Fredoka",sans-serif; font-size:17px; font-weight:700; color:#fff; }
  .dash-banner .db-stat .k{ font-size:10px; color:rgba(255,255,255,.4); margin-top:2px; }
  .dash-banner .db-cta{
    flex:0 0 auto; font-size:12.5px; font-weight:700; color:#10162A;
    background:#fff; padding:11px 20px; border-radius:999px;
    display:inline-flex; align-items:center; gap:6px;
  }
  @media (max-width:640px){ .dash-banner .db-stats{ display:none; } }

  .card-topline{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .card-cat{
    font-size:10.5px; font-weight:700; color:var(--c-dark);
    background:var(--c-light); padding:4px 10px; border-radius:999px;
    white-space:nowrap;
  }
  .card-role{ font-size:10.5px; color:var(--ink-soft); }

  .stage3d{ flex:1; display:flex; align-items:center; justify-content:center; perspective:600px; }
  .pal{ position:relative; width:96px; height:120px; transition:transform .16s ease-out; }
  .pal .shadow{ position:absolute; width:54px; height:15px; left:50%; bottom:2px; margin-left:-27px; background:rgba(20,25,50,.18); border-radius:50%; filter:blur(3px); }
  .pal .body{ position:absolute; width:62px; height:78px; left:50%; margin-left:-31px; top:12px; background:var(--c-main); border-radius:44% 44% 50% 50% / 48% 48% 52% 52%; box-shadow:inset -9px -11px 0 rgba(0,0,0,.12), inset 7px 9px 0 rgba(255,255,255,.28); }
  .pal .goggle{ position:absolute; width:40px; height:26px; left:50%; margin-left:-20px; top:28px; background:#fff; border:3px solid var(--ink); border-radius:14px; display:flex; align-items:center; justify-content:center; }
  .pal .goggle svg{ width:19px; height:19px; }
  .pal .arm{ position:absolute; width:9px; height:24px; border-radius:6px; top:40px; background:var(--c-main); }
  .pal .arm.l{ left:50%; margin-left:-38px; transform-origin:top center; animation:swayL 2.6s ease-in-out infinite; }
  .pal .arm.r{ left:50%; margin-left:29px; transform-origin:top center; animation:swayR 2.6s ease-in-out infinite; }
  @keyframes swayL{ 0%,100%{ transform:rotate(6deg);} 50%{ transform:rotate(-4deg);} }
  @keyframes swayR{ 0%,100%{ transform:rotate(-6deg);} 50%{ transform:rotate(4deg);} }
  .pal-bob{ animation:bob 3s ease-in-out infinite; transform-style:preserve-3d; }
  @keyframes bob{ 0%,100%{ transform:translateZ(0) translateY(0);} 50%{ transform:translateZ(26px) translateY(-6px);} }

  .card-bottom .name{ font-size:20px; font-weight:900; color:var(--ink); }
  .card-bottom .hook{ font-size:11.5px; color:var(--c-dark); margin-top:6px; line-height:1.5; min-height:2.7em; }
  .card-bottom .cta-hint{ margin-top:10px; font-size:11px; font-weight:700; color:var(--c-dark); display:flex; align-items:center; gap:4px; }

  .c-blue{ --c-main:var(--blue); --c-dark:var(--blue-d); --c-light:var(--blue-l); --dot:var(--blue); }
  .c-orange{ --c-main:var(--orange); --c-dark:var(--orange-d); --c-light:var(--orange-l); --dot:var(--orange); }
  .c-green{ --c-main:var(--green); --c-dark:var(--green-d); --c-light:var(--green-l); --dot:var(--green); }
  .c-purple{ --c-main:var(--purple); --c-dark:var(--purple-d); --c-light:var(--purple-l); --dot:var(--purple); }
  .c-pink{ --c-main:var(--pink); --c-dark:var(--pink-d); --c-light:var(--pink-l); --dot:var(--pink); }

  @media (max-width:640px){
    .grid{ gap:16px; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); }
    .card-3d{ height:330px; }
  }

  /* ================= MODAL ================= */
  .overlay{
    position:fixed; inset:0; z-index:100;
    background:rgba(10,14,28,.6);
    backdrop-filter:blur(3px);
    display:flex; align-items:flex-end; justify-content:center;
    opacity:0; visibility:hidden;
    transition:opacity .3s ease, visibility 0s linear .3s;
  }
  .overlay.open{ opacity:1; visibility:visible; transition:opacity .3s ease; }
  @media (min-width:720px){ .overlay{ align-items:center; padding:4vh 0; } }

  .modal{
    position:relative;
    width:100%; max-width:760px; max-height:94vh;
    background:var(--panel-dark); color:#fff;
    border-radius:24px 24px 0 0; overflow:hidden;
    display:flex; flex-direction:column;
    transform:translateY(28px);
    transition:transform .35s cubic-bezier(.2,.8,.2,1);
    box-shadow:0 -10px 50px rgba(0,0,0,.4);
  }
  @media (min-width:720px){ .modal{ border-radius:24px; max-height:88vh; } }
  .overlay.open .modal{ transform:translateY(0); }

  .modal-head{
    position:relative; padding:22px 22px 18px; display:flex; align-items:center; gap:16px;
    background:linear-gradient(160deg, var(--c-main) 0%, var(--panel-dark) 130%);
    flex:0 0 auto;
  }
  .modal-close{ position:absolute; top:14px; right:14px; width:32px; height:32px; border-radius:50%; background:rgba(0,0,0,.25); color:#fff; font-size:16px; display:flex; align-items:center; justify-content:center; }
  .modal-avatar{ position:relative; width:70px; height:88px; flex:0 0 auto; }
  .modal-avatar .body{ position:absolute; width:60px; height:74px; left:5px; top:10px; background:var(--c-main); border-radius:44% 44% 50% 50%/48% 48% 52% 52%; box-shadow:inset -8px -10px 0 rgba(0,0,0,.15), inset 6px 8px 0 rgba(255,255,255,.25); }
  .modal-avatar .goggle{ position:absolute; width:38px; height:24px; left:16px; top:26px; background:#fff; border:2.5px solid #10162A; border-radius:13px; display:flex; align-items:center; justify-content:center; }
  .modal-avatar .goggle svg{ width:18px; height:18px; }
  .modal-id{ flex:1; min-width:0; }
  .modal-id .name{ font-size:22px; font-weight:900; }
  .modal-id .role{ font-size:12.5px; color:rgba(255,255,255,.85); margin-top:2px; }
  .modal-id .meta{ font-size:11px; color:rgba(255,255,255,.65); margin-top:6px; display:flex; gap:10px; flex-wrap:wrap; }
  .modal-id .cat-chip{ font-size:10.5px; font-weight:700; background:rgba(255,255,255,.18); padding:3px 9px; border-radius:999px; margin-top:6px; display:inline-block; }
  .status-dot{ display:inline-block; width:7px; height:7px; border-radius:50%; background:#4CD97B; margin-right:4px; box-shadow:0 0 0 3px rgba(76,217,123,.25); }

  .health-ring{ flex:0 0 auto; width:64px; height:64px; position:relative; }
  .health-ring svg{ width:100%; height:100%; transform:rotate(-90deg); }
  .health-ring .track{ fill:none; stroke:rgba(255,255,255,.18); stroke-width:6; }
  .health-ring .prog{ fill:none; stroke:#fff; stroke-width:6; stroke-linecap:round; transition:stroke-dashoffset 1s ease; }
  .health-ring .val{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .health-ring .val b{ font-family:"Fredoka",sans-serif; font-size:17px; }
  .health-ring .val span{ font-size:8px; color:rgba(255,255,255,.7); }

  .modal-body{ overflow-y:auto; padding:4px 22px 28px; }
  .sec{ margin-top:22px; }
  .sec-title{ font-size:12.5px; font-weight:700; letter-spacing:.04em; color:rgba(255,255,255,.55); display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .sec-title::before{ content:""; width:3px; height:13px; border-radius:2px; background:var(--c-main); }

  .scenario{ display:flex; align-items:flex-start; gap:10px; background:rgba(255,255,255,.04); border:1px solid var(--panel-line); border-radius:12px; padding:11px 13px; margin-bottom:8px; }
  .scenario .flow{ font-size:12.5px; line-height:1.55; }
  .scenario .flow .trig{ color:rgba(255,255,255,.6); }
  .scenario .flow .act{ color:#fff; font-weight:700; }
  .scenario .eff{ margin-top:5px; display:inline-block; font-size:11px; font-weight:700; color:var(--c-main); background:rgba(255,255,255,.06); padding:2px 9px; border-radius:999px; }

  .skill-row{ margin-bottom:9px; }
  .skill-row .top{ display:flex; justify-content:space-between; font-size:12px; margin-bottom:4px; }
  .skill-row .top .sname{ color:#fff; font-weight:500; }
  .skill-row .top .spct{ color:rgba(255,255,255,.55); font-family:"Fredoka",sans-serif; }
  .skill-bar{ height:6px; border-radius:4px; background:rgba(255,255,255,.08); overflow:hidden; }
  .skill-bar i{ display:block; height:100%; background:var(--c-main); border-radius:4px; }

  .tagwrap{ display:flex; flex-wrap:wrap; gap:7px; }
  .tagwrap span{ font-size:11.5px; color:rgba(255,255,255,.85); background:rgba(255,255,255,.06); border:1px solid var(--panel-line); padding:5px 11px; border-radius:999px; }
  .bound-row{ display:flex; gap:8px; font-size:12px; margin-bottom:6px; color:rgba(255,255,255,.75); }
  .bound-row b{ color:#fff; font-weight:700; min-width:64px; flex:0 0 auto; }

  .effect-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  @media (min-width:520px){ .effect-grid{ grid-template-columns:repeat(4,1fr); } }
  .effect-card{ background:linear-gradient(160deg, rgba(255,255,255,.07), rgba(255,255,255,.02)); border:1px solid var(--panel-line); border-radius:14px; padding:13px 10px; text-align:center; }
  .effect-card .v{ font-family:"Fredoka",sans-serif; font-size:17px; font-weight:700; color:var(--c-main); line-height:1.2; }
  .effect-card .k{ font-size:10.5px; color:rgba(255,255,255,.6); margin-top:4px; }

  .stat-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
  @media (min-width:520px){ .stat-grid{ grid-template-columns:repeat(4,1fr); } }
  .stat-card{ background:#10162A; border:1px solid var(--panel-line); border-radius:11px; padding:10px; }
  .stat-card .v{ font-family:"Fredoka",sans-serif; font-size:15px; font-weight:700; color:#fff; }
  .stat-card .k{ font-size:10px; color:rgba(255,255,255,.5); margin-top:2px; }

  .trend{ display:flex; align-items:flex-end; gap:4px; height:44px; margin-top:12px; }
  .trend i{ flex:1; background:var(--c-main); opacity:.35; border-radius:3px 3px 0 0; }
  .trend i:last-child{ opacity:1; }

  .health-breakdown{ display:flex; gap:14px; margin-top:12px; flex-wrap:wrap; }
  .hb-item{ flex:1; min-width:120px; }
  .hb-item .top{ display:flex; justify-content:space-between; font-size:11px; color:rgba(255,255,255,.6); margin-bottom:4px; }
  .hb-bar{ height:5px; border-radius:3px; background:rgba(255,255,255,.08); overflow:hidden; }
  .hb-bar i{ display:block; height:100%; border-radius:3px; }

  .cta-final{ margin-top:24px; width:100%; background:var(--c-main); color:#10162A; font-weight:700; font-size:14px; padding:14px 0; border-radius:999px; text-align:center; transition:filter .15s ease, transform .15s ease; }
  .cta-final:hover{ filter:brightness(1.08); transform:translateY(-2px); }

  .toast{
    position:fixed; left:50%; bottom:24px; transform:translate(-50%,20px);
    background:#10162A; color:#fff; border:1px solid rgba(255,255,255,.12);
    padding:12px 20px; border-radius:999px; font-size:13px;
    opacity:0; transition:opacity .25s ease, transform .25s ease;
    z-index:120; pointer-events:none;
  }
  .toast.show{ opacity:1; transform:translate(-50%,0); }
</style>
</head>
<body>

<header class="hero">
  <div class="cloud cloud1"></div>
  <div class="cloud cloud2"></div>
  <span class="eyebrow">CLOUD FACTORY · 云端工厂招工中</span>
  <h1 class="title">欢迎来到<span class="hl">数字员工</span>世界</h1>
  <p class="subtitle">五个圆滚滚的打工人，24 小时不打烊。按分类找到你需要的那一个。</p>
  <div class="filters" id="filters"></div>
</header>

<div class="dash-banner">
  <a href="./统计维度总览.html">
    <div class="db-icon">📊</div>
    <div class="db-body">
      <div class="db-title">数字员工大盘 <span class="db-live"><i></i>LIVE</span></div>
      <div class="db-sub">四个粒度看懂平台、部门、每个数字员工和每个人的运行数据</div>
    </div>
    <div class="db-stats">
      <div class="db-stat"><div class="v">135,480</div><div class="k">今日任务</div></div>
      <div class="db-stat"><div class="v">92.2%</div><div class="k">平均成功率</div></div>
      <div class="db-stat"><div class="v">20</div><div class="k">在线数字员工</div></div>
    </div>
    <div class="db-cta">进入大盘 →</div>
  </a>
</div>

<div class="grid" id="grid"></div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  const categories = [
    {id:'all', name:'全部员工'},
    {id:'chat', name:'会话交互类'},
    {id:'growth', name:'营销转化类'},
    {id:'data', name:'数据洞察类'},
    {id:'content', name:'内容生成类'},
    {id:'ops', name:'流程运营类'}
  ];

  const chars = [
    {
      id:'blue', cls:'c-blue', cat:'chat', name:'蓝仔', role:'智能客服',
      hook:'客户消息一进来，秒懂问题，秒配答案。',
      dept:'零售客户服务中心', onboard:'2024-03 上线',
      icon:'<path d="M4 13a8 8 0 0 1 16 0"/><path d="M4 13v5a2 2 0 0 0 2 2h1v-7H4z"/><path d="M19 13v5a2 2 0 0 1-2 2h-1v-7h3z"/>',

  function showToast(msg){
    toastEl.textContent = msg;

  }
