<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agent 平台组 · 2026 Q3 工作汇报</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpolygon fill='%23DE2910' points='16,2 20.12,12.47 31.51,12.47 22.2,18.94 25.64,29.53 16,22.9 6.36,29.53 9.8,18.94 0.49,12.47 11.88,12.47'/%3E%3C/svg%3E" />
<style>
  :root{
    --ink:#1c1712;
    --ink-soft:#5a4e3f;
    --paper:#f4ecdd;
    --paper-2:#ece0ca;
    --card:#faf5e9;
    --accent:#8f2a1f;
    --accent-dark:#5f1d14;
    --gold:#b08a3f;
    --line:rgba(28,23,18,.16);
    --ok:#2f6b3a;
    --warn:#a86a1d;
    --risk:#a12f2f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(176,138,63,.16), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(143,42,31,.10), transparent 55%),
      var(--paper);
    color:var(--ink);
    font-family:"Songti SC","STSong","SimSun","Kaiti SC","STKaiti","KaiTi",Georgia,serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .wrap{max-width:1200px;margin:0 auto;padding:56px 48px 96px}

  /* ===== 封面 ===== */
  .hero{position:relative;padding:28px 0 8px;border-bottom:2px solid var(--ink)}
  .hero::after{content:"";position:absolute;left:0;bottom:-6px;width:120px;height:2px;background:var(--accent)}
  .kicker{font-family:"Kaiti SC","STKaiti","KaiTi",serif;color:var(--ink-soft);letter-spacing:.28em;font-size:14px;text-transform:uppercase}
  .hero h1{font-family:"Songti SC","STSong","SimSun",serif;font-size:44px;font-weight:800;margin:14px 0 6px;letter-spacing:.02em}
  .hero .meta{margin-top:18px;display:flex;gap:28px;flex-wrap:wrap;color:var(--ink-soft);font-size:15px}
  .hero .meta b{color:var(--ink);font-weight:700}

  /* 一句话结论 */
  .verdict{margin:34px 0 8px;display:flex;gap:18px;align-items:flex-start}
  .verdict .mark{flex:0 0 auto;font-family:"Kaiti SC","STKaiti","KaiTi",serif;font-size:15px;color:var(--paper);background:var(--accent);padding:5px 12px;letter-spacing:.14em;border-radius:2px}
  .verdict p{margin:0;font-size:21px;line-height:1.7;font-weight:600}
  .verdict p em{font-style:normal;color:var(--accent)}

  /* ===== 板块栅格 ===== */
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px;margin-top:40px}
  @media (max-width:820px){.grid{grid-template-columns:1fr}}

  .card{
    background:var(--card);
    border:1px solid var(--line);
    box-shadow:0 1px 0 rgba(28,23,18,.05), 0 10px 28px -18px rgba(28,23,18,.35);
    border-radius:4px;
    overflow:hidden;
    cursor:pointer;
    position:relative;
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .card:hover{transform:translateY(-3px);box-shadow:0 2px 0 rgba(28,23,18,.06), 0 20px 40px -20px rgba(28,23,18,.45)}
  .card.open{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent), 0 20px 44px -20px rgba(28,23,18,.5)}

  .card .head{padding:26px 28px 22px;display:flex;align-items:center;gap:16px}
  .card .idx{flex:0 0 auto;width:46px;height:46px;display:grid;place-items:center;border:1.5px solid var(--ink);border-radius:50%;font-family:"Kaiti SC","STKaiti","KaiTi",serif;font-size:20px;color:var(--ink)}
  .card.ok .idx{border-color:var(--ok);color:var(--ok)}
  .card.warn .idx{border-color:var(--warn);color:var(--warn)}
  .card.risk .idx{border-color:var(--risk);color:var(--risk)}
  .card.next .idx{border-color:var(--accent);color:var(--accent)}
  .card .title{font-size:23px;font-weight:700;margin:0}
  .card .sub{font-size:13px;color:var(--ink-soft);margin-top:4px;letter-spacing:.04em}
  .card .stat{margin-left:auto;text-align:right;flex:0 0 auto}
  .card .stat .big{font-size:26px;font-weight:800;line-height:1}
  .card .stat .lbl{font-size:12px;color:var(--ink-soft);margin-top:4px}
  .card .chev{margin-left:4px;color:var(--ink-soft);font-size:18px;transition:transform .2s ease}
  .card.open .chev{transform:rotate(180deg)}

  /* 展开详情 */
  .detail{max-height:0;overflow:hidden;transition:max-height .34s ease}
  .detail-inner{padding:0 28px 28px;border-top:1px dashed var(--line)}
  .detail-inner .lead{font-size:15.5px;line-height:1.75;color:var(--ink-soft);margin:20px 0 16px}
  .rows{display:flex;flex-direction:column;gap:12px}
  .row{display:flex;align-items:baseline;gap:14px;padding:12px 14px;background:var(--paper-2);border-radius:3px}
  .row .k{flex:0 0 auto;font-size:13px;color:var(--ink-soft);letter-spacing:.05em}
  .row .v{font-size:15px;font-weight:600}
  .row .owner{margin-left:auto;flex:0 0 auto;font-size:13px;color:var(--ink-soft);white-space:nowrap}
  .row .owner b{color:var(--accent);font-weight:700}
  .tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:2px;letter-spacing:.04em}
  .tag.ok{background:rgba(47,107,58,.14);color:var(--ok)}
  .tag.warn{background:rgba(168,106,29,.16);color:var(--warn)}
  .tag.risk{background:rgba(161,47,47,.14);color:var(--risk)}
  .tag.next{background:rgba(143,42,31,.12);color:var(--accent)}

  .foot{margin-top:52px;padding-top:22px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;color:var(--ink-soft);font-size:13px;flex-wrap:wrap;gap:10px}
  .foot .hint{font-family:"Kaiti SC","STKaiti","KaiTi",serif;letter-spacing:.06em}
  .foot .who{font-size:14px;color:var(--ink);font-weight:700}
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <div class="kicker">QUARTERLY REVIEW · 2026 Q3</div>
    <h1>Agent 平台组 · 季度工作汇报</h1>
    <div class="meta">
      <span>汇报人 <b>李航</b></span>
      <span>周期 <b>2026 Q3</b></span>
      <span>口径 <b>结论先行 · 数据说话</b></span>
    </div>
  </header>

  <section class="verdict">
    <div class="mark">一句话</div>
    <p>灰度 <em>5%</em> 已上，编排协议未封口，<em>评测集是最大风险</em>。</p>
  </section>

  <section class="grid" id="grid">
    <!-- 卡片由 JS 渲染 -->
  </section>

  <footer class="foot">
    <span class="hint">点击任意板块展开详情 · 可直接投影演示</span>
    <span class="who">Agent 平台组 · 李航 · 2026 Q3</span>
  </footer>
</div>

<script>
/* 数据：完成 / 进行中 / 风险 / 下季 四板块 */
const DATA = [
  {
    id:"done", tone:"ok", idx:"成", title:"完成",
    sub:"已落地 · 可验证",
    statBig:"3 件", statLbl:"回归 12/12",
    lead:"本季度交付三件硬成果，均已当场验证，无遗留尾巴。",
    rows:[
      {k:"稳定性修复", v:"max-tokens 之后会话 400 报错已修", owner:"回归 12/12", tagKey:"ok", tag:"已回归"},
      {k:"性能优化", v:"历史会话打开 1.8s → 0.6s", owner:"提速 67%", tagKey:"ok", tag:"已上线"},
      {k:"现场验证", v:"客户演示环境当场跑通", owner:"3 场", tagKey:"ok", tag:"全通过"},
    ],
  },
  {
    id:"wip", tone:"warn", idx:"进", title:"进行中",
    sub:"编排协议 · 关键路径",
    statBig:"70%", statLbl:"v0 完成度",
    lead:"编排协议是下一阶段灰度的地基，目前约七成，需要在封口前锁死语义。",
    rows:[
      {k:"编排协议", v:"v0 约完成 70%", owner:"预计 10 月第二周封口", tagKey:"warn", tag:"进行中"},
    ],
  },
  {
    id:"risk", tone:"risk", idx:"险", title:"风险",
    sub:"评测集 · 最大变量",
    statBig:"52/80", statLbl:"评测覆盖缺口",
    lead:"评测集缺口可能拖慢灰度扩大，需要尽快补齐失败样本。",
    rows:[
      {k:"评测集覆盖", v:"52 / 80，缺口 28", owner:"可能拖灰度扩大", tagKey:"risk", tag:"高风险"},
      {k:"待办项", v:"补失败样本", owner:"测试 · 阿宁", tagKey:"risk", tag:"需排期"},
    ],
  },
  {
    id:"next", tone:"next", idx:"下", title:"下季",
    sub:"2026 Q4 · 规划",
    statBig:"20%", statLbl:"灰度目标",
    lead:"下季度把风险项逐个清掉，灰度稳步扩大，沉淀可复用的内部资产。",
    rows:[
      {k:"评测补齐", v:"补齐评测集缺口", owner:"测试 · 阿宁", tagKey:"next", tag:"Q4 目标"},
      {k:"灰度扩大", v:"灰度 5% → 20%", owner:"平台组", tagKey:"next", tag:"Q4 目标"},
      {k:"内部文档", v:"文档做到新人可独立上手", owner:"李航", tagKey:"next", tag:"Q4 目标"},
    ],
  },
];

const grid = document.getElementById("grid");

function renderCard(d){
  const card = document.createElement("div");
  card.className = "card " + d.tone;
  card.dataset.id = d.id;
  card.innerHTML = `
    <div class="head">
      <div class="idx">${d.idx}</div>
      <div>
        <h2 class="title">${d.title}</h2>
        <div class="sub">${d.sub}</div>
      </div>
      <div class="stat">
        <div class="big">${d.statBig}</div>
        <div class="lbl">${d.statLbl}</div>
      </div>
      <div class="chev">▾</div>
    </div>
    <div class="detail">
      <div class="detail-inner">
        <p class="lead">${d.lead}</p>
        <div class="rows">
          ${d.rows.map(r=>`
            <div class="row">
              <span class="k">${r.k}</span>
              <span class="v">${r.v} <span class="tag ${r.tagKey}">${r.tag}</span></span>
              <span class="owner"><b>${r.owner}</b></span>
            </div>
          `).join("")}
        </div>
      </div>
    </div>
  `;
  const detail = card.querySelector(".detail");
  card.addEventListener("click", ()=>{
    const open = card.classList.toggle("open");
    detail.style.maxHeight = open ? detail.scrollHeight + "px" : "0px";
  });
  return card;
}

DATA.forEach(d=>{
  grid.appendChild(renderCard(d));
});
</script>
</body>
</html>
