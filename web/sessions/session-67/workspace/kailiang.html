<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>华南新业务线 · 开城干系人关系图</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpolygon fill='%23DE2910' points='16,2 20.12,12.47 31.51,12.47 22.2,18.94 25.64,29.53 16,22.9 6.36,29.53 9.8,18.94 0.49,12.47 11.88,12.47'/%3E%3C/svg%3E" />
  <style>
    :root {
      --ink: #23201b;
      --paper: #f7f4ee;
      --board: #fbfaf6;
      --grid: #e3ded2;
      --biz: #b3471f;
      --hr: #1d6f5e;
      --fin: #7a5bb0;
      --admin: #b08a1e;
      --boss: #33302a;
      --line: #8b8474;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--paper);
      background-image:
        radial-gradient(circle, rgba(0,0,0,.05) 1px, transparent 1px);
      background-size: 26px 26px;
      color: var(--ink);
      font-family: "Songti SC", "STSong", "SimSun", "Kaiti SC", "KaiTi", Georgia, serif;
      overflow: hidden;
    }

    .board-head {
      position: absolute; top: 18px; left: 22px; z-index: 5; pointer-events: none;
    }
    .board-head .tag {
      display: inline-block; font-size: 12px; letter-spacing: 2px;
      color: #fff; background: var(--biz); padding: 3px 10px; border-radius: 3px;
    }
    .board-head h1 { margin: 8px 0 2px; font-size: 26px; font-weight: 700; letter-spacing: 1px; }
    .board-head p { margin: 0; font-size: 13px; color: #6b6455; }

    .legend {
      position: absolute; right: 20px; bottom: 20px; z-index: 5;
      background: rgba(251,250,246,.92); border: 1px solid var(--grid);
      border-radius: 6px; padding: 10px 14px; font-size: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }
    .legend .row { display: flex; align-items: center; margin: 4px 0; }
    .legend .dot { width: 12px; height: 12px; border-radius: 3px; margin-right: 8px; border: 1.5px solid rgba(0,0,0,.18); }

    #wrap { position: absolute; inset: 0; cursor: grab; overflow: hidden; }
    #wrap.dragging { cursor: grabbing; }
    svg { display: block; width: 100%; height: 100%; }
    .edge { stroke: var(--line); stroke-width: 1.6; fill: none; opacity: .55; }
    .edge-label {
      font-size: 11px; fill: #6b6455;
      paint-order: stroke; stroke: var(--paper); stroke-width: 3px;
    }
    .node { cursor: pointer; }
    .node .card { stroke-width: 2; }
    .node:hover .card { filter: brightness(.97); }
    .node text.name { font-size: 15px; font-weight: 700; fill: #1c1a15; }
    .node text.role { font-size: 11px; fill: #423d33; }
    .node.hot rect.card { filter: drop-shadow(0 2px 6px rgba(0,0,0,.25)); }

    #detail {
      position: absolute; top: 22px; right: 22px; z-index: 20;
      width: 320px; max-height: calc(100% - 44px); overflow: auto;
      background: var(--board); border: 1px solid var(--grid); border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,.18); padding: 18px 20px;
      transform: translateX(20px); opacity: 0; pointer-events: none;
      transition: transform .22s ease, opacity .22s ease;
    }
    #detail.show { transform: translateX(0); opacity: 1; pointer-events: auto; }
    #detail .close {
      position: absolute; top: 10px; right: 12px; border: 0; background: none;
      font-size: 22px; line-height: 1; color: #8b8474; cursor: pointer;
    }
    #detail .d-role { font-size: 12px; color: #7a7363; letter-spacing: 1px; margin-bottom: 6px; }
    #detail .d-name { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    #detail .d-dept { display: inline-block; font-size: 12px; padding: 2px 9px; border-radius: 3px; color: #fff; margin-bottom: 12px; }
    #detail h4 { margin: 14px 0 5px; font-size: 13px; color: #4a453b; letter-spacing: 1px; }
    #detail p { margin: 0; font-size: 14px; line-height: 1.6; color: #2b2822; }
    #detail .escalate {
      margin-top: 14px; padding: 10px 12px; background: #f3eee2; border-left: 3px solid var(--biz);
      border-radius: 4px; font-size: 13px; color: #3a352c;
    }
    #detail .escalate b { color: var(--biz); }

    .hint {
      position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%);
      z-index: 4; font-size: 13px; color: #8b8474; pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="board-head">
    <span class="tag">项目干系人</span>
    <h1>华南新业务线 · 10 月开城</h1>
    <p>招人 · 预算 · 工位 —— 点人名或部门看职责 / 诉求 / 找谁升级</p>
  </div>

  <div id="wrap">
    <svg id="board" xmlns="http://www.w3.org/2000/svg">
      <g id="scene"></g>
    </svg>
  </div>

  <div id="detail">
    <button class="close" id="close">×</button>
    <div class="d-role" id="d-role"></div>
    <div class="d-name" id="d-name"></div>
    <div class="d-dept" id="d-dept"></div>
    <h4>职责</h4><p id="d-duty"></p>
    <h4>核心诉求</h4><p id="d-want"></p>
    <div class="escalate" id="d-up"></div>
  </div>

  <div class="legend">
    <div class="row"><span class="dot" style="background:#b3471f"></span>业务线（周总 / 小陈 / 李航）</div>
    <div class="row"><span class="dot" style="background:#1d6f5e"></span>HR（小林）</div>
    <div class="row"><span class="dot" style="background:#7a5bb0"></span>财务（老白）</div>
    <div class="row"><span class="dot" style="background:#b08a1e"></span>行政（阿敏）</div>
    <div class="row"><span class="dot" style="background:#33302a"></span>老板（张总）</div>
  </div>

  <div class="hint">白板可拖拽平移 · 滚轮缩放 · 点击任意干系人查看详情</div>

  <script>
  (function () {
    const NS = "http://www.w3.org/2000/svg";
    const COLORS = { biz: "#b3471f", hr: "#1d6f5e", fin: "#7a5bb0", admin: "#b08a1e", boss: "#33302a" };
    const GROUP_LABEL = {
      biz: "业务线", hr: "HR", fin: "财务", admin: "行政", boss: "老板"
    };

    const NODES = [
      { id: "zhou", name: "周总", dept: "业务负责人", group: "biz", x: 330, y: 220,
        role: "业务总负责人",
        duty: "对华南新业务线的落地负总责，牵头要人、要预算、要工位，协调各条线资源，确保 10 月如期开城。",
        want: "要 6 个编制，10 月能正式开工，别让开城日被卡住。",
        up: "砍编制 / 砍预算的最终拍板，找 <b>张总</b>；人事推进节奏对不齐，追 <b>小林</b>。" },
      { id: "chen", name: "小陈", dept: "产品", group: "biz", x: 560, y: 260,
        role: "产品负责人",
        duty: "定新业务线的产品范围、功能优先级和上线节奏，向周总对齐 scope 与 milestones。",
        want: "范围和上线节奏要锁死，别被人手不足反复拉扯。",
        up: "范围变更要拍板，找 <b>周总</b>；人手不足拖节奏，追 <b>小林</b>。" },
      { id: "li", name: "李航", dept: "研发", group: "biz", x: 750, y: 330,
        role: "研发负责人",
        duty: "负责研发环境、技术方案和排期，看人力到位情况排开发与联调计划。",
        want: "研发环境和排期要先就位，否则开城前联调来不及。",
        up: "资源和环境优先级的冲突，找 <b>周总</b>；人力缺口影响排期，追 <b>小林</b>。" },
      { id: "lin", name: "小林", dept: "HR BP", group: "hr", x: 170, y: 360,
        role: "HR 业务伙伴",
        duty: "按编制推进招聘、入职、劳动合同与社保起缴，是「要人」的落地执行方。",
        want: "拿到明确编制和入职时间表，别让招聘计划反复。",
        up: "编制 / 人力成本合规卡点，找 <b>老白</b>；薪酬职级问题，对接 <b>HR</b> 主管。" },
      { id: "bai", name: "老白", dept: "财务", group: "fin", x: 470, y: 400,
        role: "财务对接",
        duty: "守开城总预算、人力成本、报销流程与成本中心设立，卡编制和总包，对上发薪与社保起缴。",
        want: "编制和总包守住，入职日要对齐发薪周期和社保起缴点。",
        up: "超预算 / 追加总包，找 <b>张总</b> 批；成本中心设立规则，走财务制度。" },
      { id: "min", name: "阿敏", dept: "行政", group: "admin", x: 240, y: 520,
        role: "行政对接",
        duty: "按编制配置工位和电脑等办公资源，没有编制不启动采购，是「工位」的执行方。",
        want: "编制先落定再采购，别让我为没编制的人配工位。",
        up: "确保编制生效，先看 <b>小林</b> / <b>老白</b>；采购预算，走 <b>老白</b>。" },
      { id: "zhang", name: "张总", dept: "老板", group: "boss", x: 520, y: 100,
        role: "最终决策人",
        duty: "只看总预算和开城日两个数字，超预算或开城日守不住就打回，不参与日常执行。",
        want: "总预算别超，开城日别拖。",
        up: "他就是顶层，打回后重新对齐 <b>周总</b> 再报。" }
    ];

    const EDGES = [
      { s: "zhou", t: "lin", label: "开口要人" },
      { s: "zhou", t: "zhang", label: "要预算,报开城" },
      { s: "lin", t: "bai", label: "编制/总包" },
      { s: "lin", t: "min", label: "编制走工位" },
      { s: "bai", t: "min", label: "有预算才采购" },
      { s: "chen", t: "li", label: "范围↔排期" },
      { s: "zhou", t: "chen", label: "压节奏" },
      { s: "warn_no_to", t: "none", label: "" } // placeholder removed below
    ];
    // 清理：去掉占位边
    const EDGES_FINAL = EDGES.filter(e => e.s !== "warn_no_to");

    const nodeById = {};
    NODES.forEach(n => nodeById[n.id] = n);

    const svg = document.getElementById("board");
    const scene = document.getElementById("scene");
    const wrap = document.getElementById("wrap");

    function el(name, attrs) {
      const e = document.createElementNS(NS, name);
      for (const k in attrs) e.setAttribute(k, attrs[k]);
      return e;
    }

    // 画边 + 标签
    EDGES_FINAL.forEach(edge => {
      const a = nodeById[edge.s], b = nodeById[edge.t];
      const line = el("line", { class: "edge", x1: a.x, y1: a.y, x2: b.x, y2: b.y });
      scene.appendChild(line);
      const lbl = el("text", {
        class: "edge-label", x: (a.x + b.x) / 2, y: (a.y + b.y) / 2,
        "text-anchor": "middle", "dominant-baseline": "middle"
      });
      lbl.textContent = edge.label;
      scene.appendChild(lbl);
    });

    // 画节点
    NODES.forEach(n => {
      const g = el("g", { class: "node", transform: `translate(${n.x},${n.y})` });
      g.setAttribute("data-id", n.id);
      const color = COLORS[n.group];

      const band = el("rect", { class: "card", x: -74, y: -36, width: 148, height: 72, rx: 8, fill: "#fff", stroke: color });
      const strip = el("rect", { class: "card", x: -74, y: -36, width: 148, height: 7, rx: 4, fill: color, stroke: "none" });
      const nm = el("text", { class: "name", x: 0, y: -4, "text-anchor": "middle", "dominant-baseline": "middle" });
      nm.textContent = n.name;
      const rl = el("text", { class: "role", x: 0, y: 16, "text-anchor": "middle", "dominant-baseline": "middle" });
      rl.textContent = n.dept;

      g.appendChild(band); g.appendChild(strip); g.appendChild(nm); g.appendChild(rl);
      g.addEventListener("click", () => open(n));
      scene.appendChild(g);
    });

    // 平移 + 缩放（原生实现，替代 d3.zoom）
    let tx = 60, ty = 30, scale = 1;
    let dragging = false, sx = 0, sy = 0, ox = 0, oy = 0;
    function apply() {
      scene.setAttribute("transform", `translate(${tx},${ty}) scale(${scale})`);
    }
    apply();

    wrap.addEventListener("mousedown", ev => {
      dragging = true; wrap.classList.add("dragging");
      sx = ev.clientX; sy = ev.clientY; ox = tx; oy = ty;
    });
    window.addEventListener("mousemove", ev => {
      if (!dragging) return;
      tx = ox + (ev.clientX - sx);
      ty = oy + (ev.clientY - sy);
      apply();
    });
    window.addEventListener("mouseup", () => {
      dragging = false; wrap.classList.remove("dragging");
    });
    wrap.addEventListener("wheel", ev => {
      ev.preventDefault();
      const factor = ev.deltaY < 0 ? 1.1 : 0.9;
      const ns = Math.min(2.6, Math.max(0.4, scale * factor));
      // 以鼠标为中心缩放
      const rect = wrap.getBoundingClientRect();
      const mx = ev.clientX - rect.left, my = ev.clientY - rect.top;
      tx = mx - (mx - tx) * (ns / scale);
      ty = my - (my - ty) * (ns / scale);
      scale = ns;
      apply();
    }, { passive: false });

    // 详情面板
    function open(n) {
      document.getElementById("d-role").textContent = n.role;
      document.getElementById("d-name").textContent = n.name;
      const deptEl = document.getElementById("d-dept");
      deptEl.textContent = n.dept + " · " + GROUP_LABEL[n.group];
      deptEl.style.background = COLORS[n.group];
      document.getElementById("d-duty").textContent = n.duty;
      document.getElementById("d-want").textContent = n.want;
      document.getElementById("d-up").innerHTML = n.up;
      document.getElementById("detail").classList.add("show");
      // 高亮对应节点
      document.querySelectorAll(".node").forEach(g => g.classList.remove("hot"));
      const g = document.querySelector(`.node[data-id="${n.id}"]`);
      if (g) g.classList.add("hot");
    }
    document.getElementById("close").addEventListener("click", () => {
      document.getElementById("detail").classList.remove("show");
      document.querySelectorAll(".node").forEach(g => g.classList.remove("hot"));
    });
  })();
  </script>
</body>
</html>
