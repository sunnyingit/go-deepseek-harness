<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'unsafe-inline'" />
  <title>牛宝</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    body {
      background: linear-gradient(160deg, #fff5f3 0%, #ffe8e4 45%, #ffd6cf 100%);
      color: #1a1210;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    img {
      width: 65px;
      height: 65px;
      border-radius: 14px;
      box-shadow: 0 8px 22px rgba(196, 48, 38, 0.28);
      object-fit: cover;
      background: transparent;
    }
    h1 { font-size: 20px; font-weight: 700; letter-spacing: 0.02em; color: #c43026; }
    p { font-size: 13px; color: #7a534c; line-height: 1.55; max-width: 280px; }
  </style>
</head>
<body>
  <div class="wrap">
    <img src="icon.png" alt="牛宝" width="65" height="65" />
    <h1>正在启动牛宝</h1>
    <p>正在拉起内置服务。如果是首次准备环境，可能需要一会儿。</p>
  </div>
</body>
</html>
