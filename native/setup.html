<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
  <title>设置 API Key</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    body { background: #f4f6fa; color: #0b1a33; padding: 28px 32px; }
    h1 { font-size: 18px; margin-bottom: 8px; }
    p { font-size: 13px; color: #5f6c80; line-height: 1.5; margin-bottom: 16px; }
    input {
      width: 100%;
      height: 36px;
      border: 1px solid #e4eaf3;
      border-radius: 8px;
      padding: 0 10px;
      font-size: 13px;
      outline: none;
    }
    input:focus { border-color: #f97316; }
    button {
      margin-top: 16px;
      height: 34px;
      padding: 0 16px;
      border: none;
      border-radius: 8px;
      background: #f97316;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    #err { margin-top: 12px; font-size: 12px; color: #b42318; min-height: 16px; }
  </style>
</head>
<body>
  <h1>设置 DeepSeek API Key</h1>
  <p>第一次启动需要填入密钥。保存在本机应用数据目录，不会打进安装包。</p>
  <input id="key" type="password" placeholder="sk-..." autofocus />
  <button id="save" type="button">保存并启动</button>
  <p id="err"></p>
  <script src="setup.js"></script>
</body>
</html>
