<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <g id="markPure">
      <g fill="#FFFFFF">
        <path d="M220 88 L280 88 L160 456 L100 456 Z"/>
        <path d="M220 88 L296 88 L416 456 L340 456 Z"/>
      </g>
    </g>
    <g id="markRedPure">
      <g fill="#B42318">
        <path d="M220 88 L280 88 L160 456 L100 456 Z"/>
        <path d="M220 88 L296 88 L416 456 L340 456 Z"/>
      </g>
    </g>
  </defs>

  <rect width="1200" height="800" fill="#FFFFFF"/>
  <text x="48" y="52" font-size="24" font-weight="700" fill="#14171F">A · 字标方案 · 红底白标 · 无横杠</text>
  <text x="48" y="76" font-size="13" fill="#8A919E">右笔重左笔轻 · 去掉横杠后字形收敛为「平台 + 双笔」——抽象的山峰，也是向上突破的箭头</text>

  <!-- 主标：红底纯形 -->
  <rect x="48" y="104" width="520" height="520" rx="72" fill="#B42318"/>
  <use href="#markPure" transform="translate(98 146) scale(0.82)"/>
  <text x="308" y="656" font-size="12" fill="#8A919E" text-anchor="middle">主标 · 纯形</text>

  <!-- App 图标 -->
  <rect x="600" y="104" width="260" height="260" rx="16" fill="#F7F8FA" stroke="#E3E6EB"/>
  <rect x="608" y="112" width="244" height="244" rx="52" fill="#B42318"/>
  <use href="#markPure" transform="translate(622.5 127.5) scale(0.4)"/>
  <text x="730" y="396" font-size="12" fill="#8A919E" text-anchor="middle">App 图标</text>

  <!-- 浅色底变体 -->
  <rect x="884" y="104" width="260" height="260" rx="16" fill="#FFFFFF" stroke="#E3E6EB"/>
  <use href="#markRedPure" transform="translate(954 124) scale(0.24)"/>
  <text x="1014" y="396" font-size="12" fill="#8A919E" text-anchor="middle">浅色底 · 红色字标</text>
  <text x="1152" y="760" font-size="11" fill="#A1A7B2" text-anchor="end">矢量源文件 docs/logo-a-mark.svg</text>
</svg>
